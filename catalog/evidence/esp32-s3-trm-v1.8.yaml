# Evidence record: ESP32-S3 Technical Reference Manual (read 2026-10-22).
accessed: "2026-10-22"
claims:
  - id: "esp32-s3-trm-v1.8#strap-four-pins"
    locator: "Chapter 8 Chip Boot Control, §8.1 Overview, PDF p.534"
    quote: "ESP32-S3 has four strapping pins: • GPIO0 • GPIO3 • GPIO45 • GPIO46"
    supports: "The TRM lists four strapping pins: GPIO0, GPIO3, GPIO45, GPIO46"
  - id: "esp32-s3-trm-v1.8#strap-default-config"
    locator: "Chapter 8, Table 8.1-1 Default Configuration of Strapping Pins, PDF p.534"
    quote: "GPIO0 Pull-up GPIO3 N/A GPIO45 Pull-down GPIO46 Pull-down"
    supports: "TRM default configuration: GPIO0 pull-up, GPIO3 N/A (the datasheet says floating), GPIO45 pull-down, GPIO46 pull-down"
  - id: "esp32-s3-trm-v1.8#strap-register"
    locator: "Chapter 6, Register 6.15 GPIO_STRAP_REG, PDF p.506"
    quote: "bit2: GPIO46 bit3: GPIO0 bit4: GPIO45 bit5: GPIO3"
    supports: "GPIO_STRAPPING bits: bit2 GPIO46, bit3 GPIO0, bit4 GPIO45, bit5 GPIO3 (four strapping bits)"
  - id: "esp32-s3-trm-v1.8#boot-mode-spi"
    locator: "Chapter 8, Table 8.2-1 Boot Mode Control, PDF p.535"
    quote: "SPI Boot mode 1 Ignored Ignored Ignored"
    supports: "SPI Boot mode: GPIO0 = 1; GPIO46, GPIO1, GPIO2 ignored"
  - id: "esp32-s3-trm-v1.8#boot-mode-joint-download"
    locator: "Chapter 8, Table 8.2-1 Boot Mode Control, PDF p.535"
    quote: "Joint Download Boot mode1 0 0 Ignored Ignored"
    supports: "Joint Download Boot mode: GPIO0 = 0, GPIO46 = 0; GPIO1, GPIO2 ignored"
  - id: "esp32-s3-trm-v1.8#boot-mode-spi-download"
    locator: "Chapter 8, Table 8.2-1 Boot Mode Control, PDF p.535"
    quote: "SPI Download Boot mode2 0 1 1 0"
    supports: "SPI Download Boot mode: GPIO0 = 0, GPIO46 = 1, GPIO1 = 1, GPIO2 = 0"
  - id: "esp32-s3-trm-v1.8#spi-download-gpio1-gpio2"
    locator: "Chapter 8, Table 8.2-1 footnote 2, PDF p.535"
    quote: "GPIO1 and GPIO2 are not strapping pins. But you need to reserve them when using SPI Download Boot mode."
    supports: "GPIO1 and GPIO2 are not strapping pins but must be reserved for SPI Download Boot mode (floating by default, high impedance at reset)"
  - id: "esp32-s3-trm-v1.8#vdd-spi-gpio45-low"
    locator: "Chapter 8, §8.4 VDD_SPI Voltage Control, PDF p.537"
    quote: "GPIO45 = 0, VDD_SPI pin is powered directly from VDD3P3_RTC via resistor RSP I ."
    supports: "GPIO45 = 0 at reset: VDD_SPI powered from VDD3P3_RTC (typically 3.3 V)"
  - id: "esp32-s3-trm-v1.8#vdd-spi-gpio45-high"
    locator: "Chapter 8, §8.4 VDD_SPI Voltage Control, PDF p.537"
    quote: "GPIO45 = 1, VDD_SPI pin is powered from internal 1.8 V LDO."
    supports: "GPIO45 = 1 at reset: VDD_SPI powered from the internal 1.8 V LDO"
  - id: "esp32-s3-trm-v1.8#rst-column-def"
    locator: "Chapter 6, §6.12 IO MUX Function List, Table 6.12-1 notes, PDF p.494"
    quote: "\"RST\" column shows the default configuration of each pin after reset:"
    supports: "The TRM RST column of Table 6.12-1 is the default configuration AFTER reset (the datasheet has separate At Reset and After Reset columns)"
  - id: "esp32-s3-trm-v1.8#rst-code-4"
    locator: "Chapter 6, §6.12, Reset Configurations legend, PDF p.494"
    quote: "4 - OE = 1, WPU = 1 (output enabled, pull-up resistor enabled)"
    supports: "RST code 4 means output enabled with weak pull-up enabled"
  - id: "esp32-s3-trm-v1.8#rst-code-3"
    locator: "Chapter 6, §6.12, Reset Configurations legend, PDF p.494"
    quote: "3 - IE = 1, WPU = 1 (input enabled, pull-up resistor enabled)"
    supports: "RST code 3 means input enabled with weak pull-up"
  - id: "esp32-s3-trm-v1.8#spi3-matrix-only"
    locator: "Chapter 30 SPI Controller, §30.1 Overview, PDF p.1107"
    quote: "SPI3 bus signals are routed to GPIO pins via GPIO matrix only."
    supports: "GP-SPI3 has no IO MUX pins: SPI3 signals are routed through the GPIO matrix only"
  - id: "esp32-s3-trm-v1.8#spi2-iomux-or-matrix"
    locator: "Chapter 30 SPI Controller, §30.1 Overview, PDF p.1107"
    quote: "FSPI bus signals are routed to GPIO pins via either GPIO matrix or IO MUX."
    supports: "GP-SPI2 (FSPI) can be routed via the GPIO matrix or IO MUX"
  - id: "esp32-s3-trm-v1.8#adc-input-signals"
    locator: "Chapter 39 On-Chip Sensors and Analog Signal Processing, §39.3.4, Table 39.3-1, PDF p.1468"
    quote: "GPIO1 0 SAR ADC1 GPIO2 1 GPIO3 2 SAR ADC2"
    supports: "Table 39.3-1: GPIO1-GPIO10 are ADC channels 0-9 of SAR ADC1 and GPIO11-GPIO20 are channels 0-9 of SAR ADC2 (the table's row layout is scrambled in the text layer; mapping agrees with datasheet Table 2-8)"
  - id: "esp32-s3-trm-v1.8#rst-gpio0"
    locator: "Chapter 6, §6.12, Table 6.12-1 IO MUX Pin Functions, PDF p.493-494, row GPIO0"
    quote: "0 GPIO0 GPIO0 GPIO0 - - - 2 3 R"
    supports: "GPIO0: DRV 2, RST 3 = IE = 1, WPU = 1 (input enabled, pull-up enabled) after reset (RST column = default configuration after reset)"
