# Evidence record: Bosch Sensortec BME280 Data sheet (read 2026-10-23). Cover: revision 1.24, February 2024, BST-BME280-DS001-24; page footers still print "BST-BME280-DS001-23 Revision_1.23_012022".
accessed: "2026-10-23"
claims:
  - id: "bme280-ds-1.24#iface-selection-csb"
    locator: "§6.1 Interface selection, PDF p.32"
    quote: "If CSB is connected to VDDIO, the I²C interface is active. If CSB is pulled down, the SPI interface is activated."
    supports: "CSB high (VDDIO) selects I2C; CSB low selects SPI"
  - id: "bme280-ds-1.24#iface-lockout-csb"
    locator: "§6.1 Interface selection, PDF p.32"
    quote: "After CSB has been pulled down once (regardless of whether any clock cycle occurred), the I²C interface is disabled until the next power-on-reset."
    supports: "Once CSB has gone low, I2C stays disabled until power-on reset"
  - id: "bme280-ds-1.24#i2c-modes"
    locator: "§6.2 I²C Interface, PDF p.32"
    quote: "All modes (standard, fast, high speed) are supported."
    supports: "I2C standard, fast and high-speed modes"
  - id: "bme280-ds-1.24#i2c-max-speed"
    locator: "Key features, Digital interface, PDF p.2"
    quote: "I²C (up to 3.4 MHz) and SPI (3 and 4 wire, up to 10 MHz)"
    supports: "I2C up to 3.4 MHz (high-speed mode); SPI 3- and 4-wire up to 10 MHz"
  - id: "bme280-ds-1.24#i2c-address"
    locator: "§6.2 I²C Interface, PDF p.32-33"
    quote: "Connecting SDO to GND results in slave address 1110110 (0x76); connection it to VDDIO results in slave address 1110111 (0x77)"
    supports: "I2C address 0x76 with SDO=GND, 0x77 with SDO=VDDIO"
  - id: "bme280-ds-1.24#i2c-sdo-float"
    locator: "§6.2 I²C Interface, PDF p.33"
    quote: "The SDO pin cannot be left floating; if left floating, the I²C address will be undefined."
    supports: "SDO must be tied to GND or VDDIO in I2C mode"
  - id: "bme280-ds-1.24#i2c-csb-sda"
    locator: "§6.2 I²C Interface, PDF p.33"
    quote: "SDI is bi-directional with open drain to GND: it must be externally connected to VDDIO via a pull up resistor."
    supports: "I2C needs CSB at VDDIO and an external SDA pull-up"
  - id: "bme280-ds-1.24#i2c-scl-no-stretch"
    locator: "§6.2 I²C Interface, PDF p.32"
    quote: "As the devices does not perform clock stretching, the SCL structure is a high-Z input without drain capability."
    supports: "SCL is an input only (the device never drives it)"
  - id: "bme280-ds-1.24#spi-modes"
    locator: "§6.3 SPI interface, PDF p.34"
    quote: "The SPI interface is compatible with SPI mode ‘00’ (CPOL = CPHA = ‘0’) and mode ‘11’ (CPOL = CPHA = ‘1’)."
    supports: "SPI modes 0 and 3"
  - id: "bme280-ds-1.24#spi-3wire"
    locator: "§6.3 SPI interface, PDF p.34"
    quote: "The SPI interface has two modes: 4-wire and 3-wire."
    supports: "SPI 4-wire and 3-wire (3-wire selected by register spi3w_en)"
  - id: "bme280-ds-1.24#spi-sdo-hiz-3w"
    locator: "§6.3 SPI interface, PDF p.34"
    quote: "SDO: serial data output; hi-Z in 3-wire mode"
    supports: "SDO is high-Z in 3-wire mode; SDI carries data both ways"
  - id: "bme280-ds-1.24#spi-fspi"
    locator: "§6.4.3, Table 34 SPI timings, PDF p.37"
    quote: "SPI clock input frequency F_spi 0 10 MHz"
    supports: "SPI SCK maximum 10 MHz"
  - id: "bme280-ds-1.24#supply-voltage"
    locator: "§1.1, Table 1 Electrical parameter specification, PDF p.8"
    quote: "Supply Voltage Internal Domains VDD ripple max. 50 mVpp 1.71 1.8 3.6 V Supply Voltage I/O Domain VDDIO 1.2 1.8 3.6 V"
    supports: "VDD 1.71-3.6 V; VDDIO 1.2-3.6 V"
  - id: "bme280-ds-1.24#abs-max-supply"
    locator: "§2, Table 5 Absolute maximum ratings, PDF p.13"
    quote: "Voltage at any supply pin VDD and VDDIO pin -0.3 4.25 V"
    supports: "Absolute maximum at VDD and VDDIO pins: -0.3 to 4.25 V"
  - id: "bme280-ds-1.24#abs-max-interface"
    locator: "§2, Table 5 Absolute maximum ratings, PDF p.13"
    quote: "Voltage at any interface pin -0.3 VDDIO + 0.3 V"
    supports: "Absolute maximum on any interface pin: VDDIO + 0.3 V (min -0.3 V)"
  - id: "bme280-ds-1.24#logic-levels"
    locator: "§6.4.1, Table 32 interface parameters, PDF p.35"
    quote: "Input low level Vil_si VDDIO=1.2 V to 3.6V 20 %VDDIO Input high level Vih_si VDDIO=1.2 V to 3.6 V 80 %VDDIO"
    supports: "Input low max 0.2*VDDIO; input high min 0.8*VDDIO"
  - id: "bme280-ds-1.24#output-levels"
    locator: "§6.4.1, Table 32 interface parameters, PDF p.35"
    quote: "Output high level Voh VDDIO=1.62 V, Ioh=1 mA (SDO, SDI) 80 %VDDIO"
    supports: "At VDDIO=1.62 V: VOL max 0.2*VDDIO, VOH min 0.8*VDDIO"
  - id: "bme280-ds-1.24#output-low-i2c"
    locator: "§6.4.1, Table 32 interface parameters, PDF p.35"
    quote: "Output low level I2C Vol_SDI VDDIO=1.62 V, Iol=3 mA 20 %VDDIO"
    supports: "At VDDIO=1.62 V, Iol=3 mA: SDA output low max 0.2*VDDIO"
  - id: "bme280-ds-1.24#csb-pullup"
    locator: "§6.4.1, Table 32 interface parameters, PDF p.35"
    quote: "Pull-up resistor Rpull Internal CSB pull-up resistance to VDDIO 70 120 190 kΩ"
    supports: "Internal CSB pull-up to VDDIO 70/120/190 kohm min/typ/max (an unconnected CSB defaults to I2C)"
  - id: "bme280-ds-1.24#current-consumption-1hz"
    locator: "Key features, Current consumption, PDF p.2"
    quote: "3.6 µA @ 1 Hz humidity, pressure and temperature"
    supports: "Typical average supply current 3.6 uA at 1 Hz sampling of H, P and T"
  - id: "bme280-ds-1.24#current-pressure-meas"
    locator: "§1.1, Table 1, PDF p.8"
    quote: "Current during pressure measurement IDDP Max value at -40 °C 714 µA"
    supports: "Highest tabulated measurement-phase current: 714 uA (pressure measurement, -40 C)"
  - id: "bme280-ds-1.24#current-sleep"
    locator: "§1.1, Table 1, PDF p.8"
    quote: "Sleep current IDDSL 0.1 0.3 µA"
    supports: "Sleep current typ 0.1 uA, max 0.3 uA"
  - id: "bme280-ds-1.24#pinout"
    locator: "§7.1, Table 35 Pin description, PDF p.38"
    quote: "3 SDI In/Out Serial data input SDI SDI/SDO SDA 4 SCK In Serial clock input SCK SCK SCL"
    supports: "Pin 2 CSB (tie VDDIO for I2C), pin 3 SDI (SDA in I2C), pin 4 SCK (SCL in I2C); pin 5 SDO"
  - id: "bme280-ds-1.24#i2c-connection-pullups"
    locator: "§7.2 Connection diagram I2C, Figure 17 notes, PDF p.39"
    quote: "The value for the pull-up resistors R1, R2 should be based on the interface timing and the bus load; a normal value is 4.7 kΩ"
    supports: "Datasheet gives 4.7 kohm as a normal external I2C pull-up (a recommendation, not a device rating)"
