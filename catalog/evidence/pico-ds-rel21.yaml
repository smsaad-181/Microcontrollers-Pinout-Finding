# Raspberry Pi Pico Datasheet, Release 21 (build date 03/07/2026 = 3 July 2026, build version d4e0f1799616),
# read from sources/cache/pico-ds-rel21.pdf. Locators give the printed page number (PDF page = printed + 1).
# Claims marked "(transcribed)" are read from an image (Figure 2 pinout, Figure 19 schematic): the quote
# lists the labels printed in the figure, in reading order.
accessed: "2026-10-22"
claims:
  - id: pico-ds-rel21#flash-part
    locator: "§1 About Raspberry Pi Pico, p. 4"
    quote: "flash (Winbond W25Q16JV), crystal (Abracon ABM8-272-T3), power supplies and decoupling, and USB connector"
    supports: "Pico carries a Winbond W25Q16JV QSPI flash"
  - id: pico-ds-rel21#internal-functions
    locator: "§1 About Raspberry Pi Pico, p. 4"
    quote: "Four RP2040 IO are used for internal functions - driving an LED, on-board Switched Mode Power Supply (SMPS) power control"
    supports: "Four RP2040 GPIO are used by board circuitry and are not on the header"
  - id: pico-ds-rel21#board-revision
    locator: "§1, Figure 2 caption, p. 4"
    quote: "The pinout of the Raspberry Pi Pico Rev3 board"
    supports: "Board revision documented: Pico Rev3"
  - id: pico-ds-rel21#pinout-figure
    locator: "§1 Figure 2 (pinout image, p. 4) and §2.1 Figure 4 note, p. 7 (transcribed)"
    quote: "The physical pin numbering is shown in Figure 4, for the pin allocation see Figure 2 or the full Raspberry Pi Pico schematics"
    supports: "Header map transcribed from Figure 2: 1 GP0, 2 GP1, 3 GND, 4 GP2, 5 GP3, 6 GP4, 7 GP5, 8 GND, 9 GP6, 10 GP7, 11 GP8, 12 GP9, 13 GND, 14 GP10, 15 GP11, 16 GP12, 17 GP13, 18 GND, 19 GP14, 20 GP15, 21 GP16, 22 GP17, 23 GND, 24 GP18, 25 GP19, 26 GP20, 27 GP21, 28 GND, 29 GP22, 30 RUN, 31 GP26/ADC0, 32 GP27/ADC1, 33 GND/AGND, 34 GP28/ADC2, 35 ADC_VREF, 36 3V3(OUT), 37 3V3_EN, 38 GND, 39 VSYS, 40 VBUS; GPn = RP2040 GPIOn"
  - id: pico-ds-rel21#internal-gpio29
    locator: "§2.1 Raspberry Pi Pico pinout, p. 7"
    quote: "GPIO29 IP Used in ADC mode (ADC3) to measure VSYS/3"
    supports: "GPIO29/ADC3 is wired to a VSYS/3 divider on the board (not on the header)"
  - id: pico-ds-rel21#internal-gpio25
    locator: "§2.1 Raspberry Pi Pico pinout, p. 7"
    quote: "GPIO25 OP Connected to user LED"
    supports: "GPIO25 drives the on-board user LED (not on the header)"
  - id: pico-ds-rel21#internal-gpio24
    locator: "§2.1 Raspberry Pi Pico pinout, p. 7"
    quote: "GPIO24 IP VBUS sense - high if VBUS is present, else low"
    supports: "GPIO24 is the VBUS-sense input (not on the header)"
  - id: pico-ds-rel21#internal-gpio23
    locator: "§2.1 Raspberry Pi Pico pinout, p. 7"
    quote: "GPIO23 OP Controls the on-board SMPS Power Save pin (Section 4.4. Powerchain)"
    supports: "GPIO23 drives the SMPS power-save pin (not on the header)"
  - id: pico-ds-rel21#other-pins
    locator: "§2.1 Raspberry Pi Pico pinout, p. 7"
    quote: "PIN40 VBUS PIN39 VSYS PIN37 3V3_EN PIN36 3V3 PIN35 ADC_VREF PIN33 AGND"
    supports: "Header positions 40 VBUS, 39 VSYS, 37 3V3_EN, 36 3V3, 35 ADC_VREF, 33 AGND"
  - id: pico-ds-rel21#pin30-run
    locator: "§2.1 Raspberry Pi Pico pinout, p. 8"
    quote: "PIN30 RUN"
    supports: "Header position 30 is RUN"
  - id: pico-ds-rel21#vbus-desc
    locator: "§2.1 Raspberry Pi Pico pinout, p. 8"
    quote: "VBUS is the micro-USB input voltage, connected to micro-USB port pin 1. This is nominally 5 V"
    supports: "VBUS rail nominal 5 V from micro-USB"
  - id: pico-ds-rel21#vsys-desc
    locator: "§2.1 Raspberry Pi Pico pinout, p. 8"
    quote: "VSYS is the main system input voltage, which can vary in the allowed range 1.8 V to 5.5 V"
    supports: "VSYS is an input range 1.8 V to 5.5 V, not a fixed voltage"
  - id: pico-ds-rel21#3v3-en
    locator: "§2.1 Raspberry Pi Pico pinout, p. 8"
    quote: "3V3_EN connects to the on-board SMPS enable pin, and is pulled high (to VSYS) via a 100 kΩ resistor."
    supports: "Pin 37 3V3_EN is the SMPS enable (pulling it low disables 3V3 and de-powers RP2040)"
  - id: pico-ds-rel21#3v3-desc
    locator: "§2.1 Raspberry Pi Pico pinout, p. 8"
    quote: "3V3 is the main 3.3 V supply to RP2040 and its I/O, generated by the on-board SMPS."
    supports: "3V3 rail is 3.3 V from the on-board SMPS"
  - id: pico-ds-rel21#3v3-max-load
    locator: "§2.1 Raspberry Pi Pico pinout, p. 8"
    quote: "it is recommended to keep the load on this pin less than 300 mA"
    supports: "3V3 output: recommended maximum external load 300 mA (depends on RP2040 load and VSYS)"
  - id: pico-ds-rel21#run-pin
    locator: "§2.1 Raspberry Pi Pico pinout, p. 8"
    quote: "RUN is the RP2040 enable pin, and has an internal (on-chip) pull-up resistor to 3.3 V of about ~50 kΩ."
    supports: "Pin 30 RUN is the RP2040 reset/enable input"
  - id: pico-ds-rel21#tp4-tp5
    locator: "§2.1 Raspberry Pi Pico pinout, test points, p. 8"
    quote: "TP4 GPIO23/SMPS PS pin (do not use) TP5 GPIO25/LED (not recommended to be used)"
    supports: "GPIO23 and GPIO25 reach only test points TP4/TP5, not the header"
  - id: pico-ds-rel21#tp6-bootsel
    locator: "§2.1 Raspberry Pi Pico pinout, test points, p. 8"
    quote: "TP6 can be used to drive the system into mass-storage USB programming mode (by shorting it low at power-up)."
    supports: "BOOTSEL (TP6) selects USB boot when low at power-up"
  - id: pico-ds-rel21#operating-vbus
    locator: "§2.3 Recommended operating conditions, p. 10"
    quote: "VBUS 5 V ± 10%."
    supports: "VBUS operating range 5 V ± 10 %"
  - id: pico-ds-rel21#bootsel-button
    locator: "§4.1 Programming the flash, p. 19"
    quote: "hold the BOOTSEL button down during board power-up (e.g. hold BOOTSEL down while connecting the USB)"
    supports: "On-board BOOTSEL button selects USB mass-storage boot at power-up"
  - id: pico-ds-rel21#gpio-3v3
    locator: "§4.2 General purpose I/O, p. 19"
    quote: "The Raspberry Pi Pico’s GPIO is powered from the on-board 3.3 V rail and is therefore fixed at 3.3 V."
    supports: "Pico logic voltage 3.3 V (IOVDD = 3.3 V)"
  - id: pico-ds-rel21#gpio-exposed
    locator: "§4.2 General purpose I/O, p. 19"
    quote: "The Pico exposes 26 of the 30 possible RP2040 GPIO pins by routing them straight out to Pico header pins."
    supports: "26 GPIO on the header (GPIO0-22, GPIO26-28); GPIO23, 24, 25, 29 are internal"
  - id: pico-ds-rel21#adc-diode
    locator: "§4.2 General purpose I/O, p. 19"
    quote: "GPIO26-29 have an internal reverse diode to the IOVDD (3V3) rail and so the input voltage must not exceed IOVDD plus about 300 mV"
    supports: "GPIO26-GPIO29 input voltage limit about IOVDD + 0.3 V (more restrictive than the RP2040 IOVDD + 0.5 V absolute maximum)"
  - id: pico-ds-rel21#smps-part
    locator: "§4.4 Powerchain, p. 20"
    quote: "VSYS is the main system ‘input voltage’ and feeds the RT6150 buck-boost SMPS, which generates a fixed 3.3 V output"
    supports: "3V3 rail source: RT6150 buck-boost SMPS fed from VSYS"
  - id: pico-ds-rel21#vsys-divider
    locator: "§4.4 Powerchain, p. 20"
    quote: "VSYS is R-C filtered and divided by 3 (by R5, R6 and C3 in the Pico schematic) and can be monitored on ADC channel 3."
    supports: "GPIO29/ADC3 measures VSYS/3 through R5/R6"
  - id: pico-ds-rel21#vbus-sense
    locator: "§4.4 Powerchain, p. 20"
    quote: "GPIO24 monitors the existence of VBUS, while R10 and R1 act to pull VBUS down"
    supports: "GPIO24 senses VBUS via divider R10/R1"
  - id: pico-ds-rel21#smps-ps
    locator: "§4.4 Powerchain, p. 20"
    quote: "GPIO23 controls the RT6150 PS (Power Save) pin. When PS is low (the default on Pico) the regulator is in Pulse Frequency"
    supports: "GPIO23 drives RT6150 PS; low (default) = PFM mode, high = PWM mode"
  - id: pico-ds-rel21#schematic-smps
    locator: "Appendix B, Figure 19 Pico Rev3 schematic, p. 25, power section (transcribed)"
    quote: "U2 RT6150B-33GQW PS GPIO23 TP4 R8 100K PS=0: PFM mode (default, best efficiency)"
    supports: "SMPS part RT6150B-33GQW; GPIO23 net on PS with R8 100 kΩ (to ground) giving the PFM default"
  - id: pico-ds-rel21#schematic-led
    locator: "Appendix B, Figure 19 Pico Rev3 schematic, p. 25, LED section (transcribed)"
    quote: "GPIO25 R3 470R TP5 D2 Green LED"
    supports: "User LED D2 (green) driven from GPIO25 through R3 470 Ω to ground (GPIO25 high = LED on)"
  - id: pico-ds-rel21#schematic-vsys-fet
    locator: "Appendix B, Figure 19 Pico Rev3 schematic, p. 25, VSYS sense section (transcribed)"
    quote: "ADC GPIO pins have diode to VDDIO (other GPIO do not) FET stops leakage through ADC3 pin diode into 3V3 net"
    supports: "GPIO29_ADC3 connects to the VSYS divider (R5 200K / R6 100K) through FET Q1 DMG1012T"
  - id: pico-ds-rel21#schematic-bootsel
    locator: "Appendix B, Figure 19 Pico Rev3 schematic, p. 25, BOOTSEL section (transcribed)"
    quote: "BOOTSEL SW1 TP6 R11 1K Disable Flash boot (forces USB boot)"
    supports: "BOOTSEL button SW1 pulls the flash chip-select net (QSPI_SS) low through R11 1 kΩ; it uses no GPIO0-29 pad"
  - id: pico-ds-rel21#schematic-flash
    locator: "Appendix B, Figure 19 Pico Rev3 schematic, p. 25, flash section (transcribed)"
    quote: "3V3 8 VCC U3 W25Q16JVUXIQ QSPI_SS QSPI_SCLK QSPI_SD0 QSPI_SD1 QSPI_SD2 QSPI_SD3"
    supports: "Flash W25Q16JVUXIQ supplied from 3V3 (flash voltage 3.3 V) and wired only to the QSPI pins"
  - id: pico-ds-rel21#io-voltage-note
    locator: "§1 About Raspberry Pi Pico, note (pdf p. 4)"
    quote: "Pico IO voltage is fixed at 3.3 V"
    supports: "Pico logic voltage 3.3 V (independent locator found by the auditor)"
