# Evidence record: ESP32 Series Datasheet (read 2026-10-22).
accessed: "2026-10-22"
claims:
  - id: "esp32-ds-v5.3#five-strapping-gpios"
    locator: "Features, Advanced Peripheral Interfaces, PDF p.4"
    quote: "Five strapping GPIOs"
    supports: "Datasheet counts five strapping GPIOs (GPIO4 not among them)"
  - id: "esp32-ds-v5.3#strap-default-config"
    locator: "§3 Boot Configurations, Table 3-1 Default Configuration of Strapping Pins, PDF p.22"
    quote: "Strapping Pin Default Configuration Bit Value GPIO0 Pull-up 1 GPIO2 Pull-down 0 MTDI Pull-down 0 MTDO Pull-up 1 GPIO5 Pull-up 1"
    supports: "The five datasheet strapping pins and their default pulls: GPIO0 up, GPIO2 down, GPIO12/MTDI down, GPIO15/MTDO up, GPIO5 up; no other pad is a strap"
  - id: "esp32-ds-v5.3#boot-mode-control"
    locator: "§3.1 Chip Boot Mode Control, PDF p.23"
    quote: "GPIO0 and GPIO2 control the boot mode after the reset is released."
    supports: "GPIO0 and GPIO2 strap role: boot mode"
  - id: "esp32-ds-v5.3#boot-mode-table"
    locator: "§3.1, Table 3-3 Chip Boot Mode Control, PDF p.23"
    quote: "Boot Mode GPIO0 GPIO2 SPI Boot Mode 1 Any value Joint Download Boot Mode 0 0"
    supports: "Normal (SPI) boot needs GPIO0 = 1 and GPIO2 any; download needs GPIO0 = 0 and GPIO2 = 0"
  - id: "esp32-ds-v5.3#vdd-sdio-mtdi0"
    locator: "§3.2 Internal LDO (VDD_SDIO) Voltage Control, PDF p.24"
    quote: "MTDI = 0 (by default), VDD_SDIO pin is powered directly from VDD3P3_RTC. Typically this voltage is 3.3 V."
    supports: "GPIO12/MTDI low at reset selects VDD_SDIO = VDD3P3_RTC (3.3 V flash)"
  - id: "esp32-ds-v5.3#vdd-sdio-mtdi1"
    locator: "§3.2 Internal LDO (VDD_SDIO) Voltage Control, PDF p.24"
    quote: "MTDI = 1, VDD_SDIO pin is powered from internal 1.8 V LDO."
    supports: "GPIO12/MTDI high at reset selects 1.8 V VDD_SDIO"
  - id: "esp32-ds-v5.3#u0txd-printing"
    locator: "§3.3 U0TXD Printing Control, PDF p.25"
    quote: "During booting, the strapping pin MTDO can be used to control the U0TXD Printing"
    supports: "GPIO15/MTDO strap role: boot log printing on U0TXD"
  - id: "esp32-ds-v5.3#sdio-timing"
    locator: "§3.4 Timing Control of SDIO Slave, PDF p.25"
    quote: "The strapping pin MTDO and GPIO5 can be used to control the timing of SDIO slave"
    supports: "GPIO15/MTDO and GPIO5 strap role: SDIO slave timing (any level boots)"
  - id: "esp32-ds-v5.3#input-only-note"
    locator: "Appendix A.1, Table 6-1 Notes on ESP32 Pin Lists, note 2, PDF p.61"
    quote: "GPIO pins 34-39 are input-only. These pins do not feature an output driver or internal pull-up/pull-down circuitry."
    supports: "GPIO34-GPIO39 are input-only with no internal pulls"
  - id: "esp32-ds-v5.3#pin-list-prefixes-spi"
    locator: "Appendix A.1, Table 6-1, note 6, PDF p.61"
    quote: "SPI* is for signals of the SPI01 module. HSPI* is for signals of the SPI2 module. VSPI* is for signals of the SPI3 module."
    supports: "HSPI* IO_MUX functions belong to SPI2 and VSPI* to SPI3 (fn names SPI2.* / SPI3.*)"
  - id: "esp32-ds-v5.3#pin-list-prefixes-uart"
    locator: "Appendix A.1, Table 6-1, note 6, PDF p.61"
    quote: "U0* is for signals of the UART0 module. U1* is for signals of the UART1 module. U2* is for signals of the UART2 module."
    supports: "U0*/U1*/U2* IO_MUX functions belong to UART0/UART1/UART2"
  - id: "esp32-ds-v5.3#pin-list-prefixes-jtag"
    locator: "Appendix A.1, Table 6-1, note 6, PDF p.61"
    quote: "MT* is for signals of the JTAG."
    supports: "MTDI/MTCK/MTMS/MTDO functions are JTAG signals"
  - id: "esp32-ds-v5.3#reset-output-disabled"
    locator: "Appendix A.1, Table 6-1, notes 9-10, PDF p.62"
    quote: "During reset, all pins are output-disabled."
    supports: "No pad drives an output during reset"
  - id: "esp32-ds-v5.3#dc-input-levels"
    locator: "§5.3, Table 5-3 DC Characteristics (3.3 V, 25 °C), PDF p.52"
    quote: "VIH High-level input voltage 0.75 × VDD — VDD + 0.3 V VIL Low-level input voltage –0.3 — 0.25 × VDD V"
    supports: "vih_min = 0.75 x VDD, vil_max = 0.25 x VDD, input high max = VDD + 0.3 V"
  - id: "esp32-ds-v5.3#dc-output-levels"
    locator: "§5.3, Table 5-3 DC Characteristics (3.3 V, 25 °C), PDF p.52"
    quote: "VOH High-level output voltage 0.8 × VDD — — V VOL Low-level output voltage — — 0.1 × VDD V"
    supports: "voh_min = 0.8 x VDD, vol_max = 0.1 x VDD"
  - id: "esp32-ds-v5.3#dc-vdd-definition"
    locator: "§5.3, Table 5-3 note 1, PDF p.52"
    quote: "VDD is the I/O voltage for a particular power domain of pins."
    supports: "VDD in the DC table is the pad's I/O supply (VDDIO)"
  - id: "esp32-ds-v5.3#dc-pull-resistance"
    locator: "§5.3, Table 5-3 DC Characteristics, rows RPU/RPD, PDF p.52"
    quote: "RPU Resistance of internal pull-up resistor — 45 — kΩ RPD Resistance of internal pull-down resistor — 45 — kΩ"
    supports: "Internal pull-up/pull-down typical 45 kohm"
  - id: "esp32-ds-v5.3#dc-source-sink-current"
    locator: "§5.3, Table 5-3 DC Characteristics, rows IOH/IOL, PDF p.52"
    quote: "IOH High-level source current (VDD = 3.3 V, VOH >= 2.64 V, output drive strength set to the maximum) VDD3P3_CPU power domain 40 mA"
    supports: "Only typical source/sink currents (drive strength max) are given; no per-pin maximum rating"
  - id: "esp32-ds-v5.3#abs-max-cumulative-current"
    locator: "§5.1, Table 5-1 Absolute Maximum Ratings, PDF p.51"
    quote: "Ioutput Cumulative IO output current — 1200 mA"
    supports: "cumulative_current_max = 1200 mA"
  - id: "esp32-ds-v5.3#supply-recommended-3v3"
    locator: "§2.5.3 Chip Power-up and Reset, Notes on power supply, PDF p.19"
    quote: "When using a single-power supply, the recommended voltage of the power supply is 3.3 V"
    supports: "vdd_io = 3.3 V (recommended single supply)"
  - id: "esp32-ds-v5.3#adc-range-atten0-1"
    locator: "§4.9.1, Table 4-4 ADC Calibration Results, PDF p.44"
    quote: "Atten = 0, effective measurement range of 100 ~ 950 mV Atten = 1, effective measurement range of 100 ~ 1250 mV"
    supports: "ADC1 effective range: atten 0 = 100-950 mV, atten 1 = 100-1250 mV"
  - id: "esp32-ds-v5.3#adc-range-atten2-3"
    locator: "§4.9.1, Table 4-4 ADC Calibration Results, PDF p.44"
    quote: "Atten = 2, effective measurement range of 150 ~ 1750 mV Atten = 3, effective measurement range of 150 ~ 2450 mV"
    supports: "ADC1 effective range: atten 2 = 150-1750 mV, atten 3 = 150-2450 mV"
  - id: "esp32-ds-v5.3#adc-calibration-adc1"
    locator: "§4.9.1, text above Table 4-4, PDF p.44"
    quote: "ESP-IDF provides couple of calibration methods for ADC1. Results after calibration using eFuse Vref value are shown in Table 4-4."
    supports: "Table 4-4 ranges are stated for ADC1 (eFuse Vref calibration); no ADC2 range given"
  - id: "esp32-ds-v5.3#i2c-two-interfaces"
    locator: "§4.8.4 I2C Interface, PDF p.37"
    quote: "ESP32 has two I2C bus interfaces which can serve as I2C master or slave"
    supports: "Two I2C controllers (I2C0, I2C1)"
  - id: "esp32-ds-v5.3#i2c-matrix"
    locator: "§4.8.4 I2C Interface, Pin Assignment, PDF p.37"
    quote: "For regular I2C, the pins used can be chosen from any GPIOs via the GPIO Matrix."
    supports: "I2C has no IO_MUX pins; matrix_routable true"
  - id: "esp32-ds-v5.3#uart-three-interfaces"
    locator: "§4.8.3 UART, PDF p.36"
    quote: "ESP32 has three UART interfaces"
    supports: "Three UART controllers (UART0-UART2)"
  - id: "esp32-ds-v5.3#uart-matrix"
    locator: "§4.8.3 UART, Pin Assignment, PDF p.37"
    quote: "The pins for UART can be chosen from any GPIOs via the GPIO Matrix."
    supports: "UART matrix_routable true"
  - id: "esp32-ds-v5.3#spi-bus-prefixes"
    locator: "§4.8.2 SPI, PDF p.36"
    quote: "SPI1, SPI2, and SPI3 use signal buses prefixed with SPI, HSPI, and VSPI, respectively."
    supports: "HSPI = SPI2, VSPI = SPI3"
  - id: "esp32-ds-v5.3#psram-gpio16-ce"
    locator: "§2.6, notes under Table 2-6, note 2, PDF p.21"
    quote: "If GPIO16 is used to connect to PSRAM's CE# signal, please add a pull-up resistor at the GPIO16 pin."
    supports: "GPIO16 is the PSRAM CE# line on WROVER-E (see its schematic)"
  - id: "esp32-ds-v5.3#psram-gpio17-sclk"
    locator: "§2.6, notes under Table 2-6, note 3, PDF p.21"
    quote: "Or GPIO17 pin is used to connect to the SCLK signal. This connection has passed relevant certification, see certificates for ESP32-WROVER-E."
    supports: "GPIO17 is the PSRAM SCLK line on WROVER-E"
  - id: "esp32-ds-v5.3#iomux-reset-gpio13"
    locator: "Appendix A.3, Table IO_MUX, pin 20 row, columns At Reset / After Reset, PDF p.69"
    quote: "20 MTCK oe=0, ie=0 oe=0, ie=1, wpd"
    supports: "GPIO13: during reset input disabled without pull (oe=0, ie=0); after reset oe=0, ie=1, wpd"
  - id: "esp32-ds-v5.3#iomux-reset-gpio14"
