# Evidence record: Sitronix ST7735 datasheet V2.1 (2010-02-01), read 2026-10-23.
# THIS IS THE ST7735 DOCUMENT, NOT THE ST7735S DOCUMENT. The ST7735S datasheet is blocked for automated download
# (see sources/manual/README.md request 2); facts taken from this record are interim for the ST7735S.
# Task 2a.4: the blind auditor also read a copy of the real ST7735S V1.3 (record st7735s-ds-v1.3-mirror, third-party mirror); where the two differ the fact is a conflict.
