accessed: '2026-10-23'
claims:
- id: st7735-ds-v2.1#features-supply
  locator: §2 Features, Wide Supply Voltage Range, p.1
  quote: 'I/O Voltage (VDDI to DGND): 1.65V~VDD (VDDI ≤ VDD) Analog Voltage (VDD to AGND): 2.6V~3.3V'
  supports: ST7735 I/O supply VDDI 1.65 V to VDD (VDDI <= VDD); analog supply VDD 2.6-3.3 V
- id: st7735-ds-v2.1#features-interfaces
  locator: §2 Features, p.1
  quote: 'Parallel Interface: 8-bit/9-bit/16-bit/18-bit Serial Interface: 3-line/4-line'
  supports: ST7735 supports parallel 8/9/16/18-bit and serial 3-line/4-line host interfaces
- id: st7735-ds-v2.1#pin-im2-spi4w
  locator: §6.2 Interface logic pin, p.13
  quote: IM2=’0’, Serial interface SPI4W=’0’, 3-line SPI enable. SPI4W=’1’, 4-line SPI enable.
  supports: IM2 low selects serial interface; SPI4W selects 3-line (0) or 4-line (1) SPI with D/CX
- id: st7735-ds-v2.1#pin-dcx-resx
  locator: §6.2 Interface logic pin, p.13
  quote: In 4-line SPI, this pin is used as D/CX (data/ command selection).
  supports: In 4-line SPI the WRX/D/CX pin is the data/command (DC) select; RESX is the active-low reset; CSX active-low chip select
- id: st7735-ds-v2.1#pin-serial-data
  locator: §6.2 Interface logic pin, p.13-14
  quote: D0 is the serial input/output signal in serial interface mode.
  supports: D0 is the SPI serial data pin (SDA); D/CX(SCL) is the serial clock in serial interface mode
- id: st7735-ds-v2.1#abs-max
  locator: §7.1 Absolute operation range, p.19
  quote: Logic input voltage range VIN -0.3 ~ VDDI +0.3 V
  supports: Absolute maximum logic input voltage -0.3 V to VDDI + 0.3 V; also VDD and VDDI -0.3 ~ +4.6 V
- id: st7735-ds-v2.1#dc-supply
  locator: §7.2 DC characteristic, Power & operation voltage, p.19
  quote: VDD Operating voltage 2.6 2.75 3.3 V; VDDI I/O supply voltage 1.65 1.9 3.3 V
  supports: VDD 2.6-3.3 V (typ 2.75 V); VDDI 1.65-3.3 V (typ 1.9 V)
- id: st7735-ds-v2.1#dc-logic-levels
  locator: §7.2 DC characteristic, Input / Output, p.19
  quote: Logic-high input voltage VIH 0.7VDDI VDDI V; Logic-low input voltage VIL VSS 0.3VDDI V
  supports: VIH min 0.7 x VDDI, VIL max 0.3 x VDDI (VDDI 1.65-3.3 V, VDD 2.6-3.3 V, TA -30 to 85 C)
- id: st7735-ds-v2.1#power-consumption
  locator: §7.3 Power consumption, p.21 (VDD = 2.8 V, VDDI = 1.8 V, Ta = 25 C, 60 Hz, default registers)
  quote: Normal mode One Line Note 1 0.01 0.5 0.02 0.7 (Typical IDDI IDD, Maximum IDDI IDD, mA)
  supports: 'Controller current, normal mode, all pixels black: IDD typ 0.5 / max 0.7 mA, IDDI typ 0.01 / max 0.02 mA (no backlight, no panel loads beyond the IC)'
- id: st7735-ds-v2.1#serial-write-cycle-3line
  locator: §8.2 Serial interface characteristics (3-line serial), Table 8.2.1, p.24
  quote: TSCYCW Serial clock cycle (Write) 66 ns; TSCYCR Serial clock cycle (Read) 150 ns
  supports: '3-line serial: write clock cycle min 66 ns, read clock cycle min 150 ns (VDDI 1.65-3.3 V, VDD 2.6-3.3 V, Ta 25 C)'
- id: st7735-ds-v2.1#serial-write-cycle-4line
  locator: §8.3 Serial interface characteristics (4-line serial), Table 8.3.1, p.25
  quote: TSCYCW Serial clock cycle (Write) 66 ns; TSCYCR Serial clock cycle (Read) 150 ns
  supports: '4-line serial (with D/CX): write clock cycle min 66 ns, read clock cycle min 150 ns (same conditions)'
- id: st7735-ds-v2.1#serial-write-pulse-4line
  locator: §8.3 Serial interface characteristics (4-line serial), Table 8.3.1, p.25
  quote: TSHW SCL “H” pulse width (Write) 30 ns
  supports: SCL high pulse width (write) min 30 ns (TSLW low also 30 ns); ST7735S V1.3 gives 15 ns
