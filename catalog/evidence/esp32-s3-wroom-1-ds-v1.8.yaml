# Evidence record: ESP32-S3-WROOM-1 & ESP32-S3-WROOM-1U Datasheet (read 2026-10-22).
accessed: "2026-10-22"
claims:
  - id: "esp32-s3-wroom-1-ds-v1.8#series-n8"
    locator: "§1.2, Table 1-1 ESP32-S3-WROOM-1 Series Comparison, PDF p.3"
    quote: "ESP32-S3-WROOM-1-N8 8 MB (Quad SPI) -"
    supports: "ESP32-S3-WROOM-1-N8: 8 MB Quad SPI flash, no PSRAM"
  - id: "esp32-s3-wroom-1-ds-v1.8#series-n8r8"
    locator: "§1.2, Table 1-1 ESP32-S3-WROOM-1 Series Comparison, PDF p.3"
    quote: "ESP32-S3-WROOM-1-N8R8 8 MB (Quad SPI) 8 MB (Octal SPI)"
    supports: "ESP32-S3-WROOM-1-N8R8: 8 MB Quad SPI flash and 8 MB Octal SPI PSRAM"
  - id: "esp32-s3-wroom-1-ds-v1.8#psram-in-package"
    locator: "§1.2, Table 1-1 / 1-2 notes, PDF p.4"
    quote: "The modules use PSRAM integrated in the chip's package."
    supports: "The PSRAM of the R2/R8/R16V variants is the in-package PSRAM of the SoC (ESP32-S3R8 for R8)"
  - id: "esp32-s3-wroom-1-ds-v1.8#pins-io35-37-psram"
    locator: "§3.2, Table 3-1 Pin Definitions, footnote b, PDF p.12"
    quote: "pins IO35, IO36, and IO37 are connected to the Octal SPI PSRAM and are not available for other uses."
    supports: "On modules with Octal SPI PSRAM (ESP32-S3R8/R16V) GPIO35, GPIO36, GPIO37 are connected to the PSRAM and unavailable; GPIO33 and GPIO34 have no module pin"
  - id: "esp32-s3-wroom-1-ds-v1.8#pin-definitions-count"
    locator: "§3.2 Pin Description, PDF p.11"
    quote: "The module has 41 pins."
    supports: "Module pin count 41; Table 3-1 lists GPIOs IO0-IO21, IO35-IO42, TXD0/RXD0 (GPIO43/44), IO45-IO48 (36 GPIOs; no IO22-IO34)"
  - id: "esp32-s3-wroom-1-ds-v1.8#pin-io35"
    locator: "§3.2, Table 3-1 Pin Definitions, PDF p.11"
    quote: "IO35 b 28 I/O/T SPIIO6, GPIO35, FSPID, SUBSPID"
    supports: "Module pin 28 is IO35 (GPIO35)"
  - id: "esp32-s3-wroom-1-ds-v1.8#pin-io38"
    locator: "§3.2, Table 3-1 Pin Definitions, PDF p.11"
    quote: "IO38 31 I/O/T GPIO38, FSPIWP, SUBSPIWP"
    supports: "Module pin 31 is IO38 (GPIO38), no footnote"
  - id: "esp32-s3-wroom-1-ds-v1.8#pin-io0-to-io21"
    locator: "§3.2, Table 3-1 Pin Definitions, PDF p.11"
    quote: "IO21 23 I/O/T RTC_GPIO21, GPIO21"
    supports: "Module pin 23 is IO21 (GPIO21); the table has no pins for GPIO22-GPIO34"
  - id: "esp32-s3-wroom-1-ds-v1.8#pin-txd0"
    locator: "§3.2, Table 3-1 Pin Definitions, PDF p.12"
    quote: "TXD0 37 I/O/T U0TXD, GPIO43, CLK_OUT1"
    supports: "Module pin 37 TXD0 is GPIO43 (U0TXD)"
  - id: "esp32-s3-wroom-1-ds-v1.8#pin-rxd0"
    locator: "§3.2, Table 3-1 Pin Definitions, PDF p.12"
    quote: "RXD0 36 I/O/T U0RXD, GPIO44, CLK_OUT2"
    supports: "Module pin 36 RXD0 is GPIO44 (U0RXD)"
  - id: "esp32-s3-wroom-1-ds-v1.8#block-diagram-flash-bus"
    locator: "§2, Figure 2-1 ESP32-S3-WROOM-1 Block Diagram, PDF p.9"
    quote: "SPICS0 SPICLK SPID SPIQ SPIHD SPIWP VDD_SPI QSPI Flash"
    supports: "The module's QSPI flash is wired to SPICS0, SPICLK, SPID, SPIQ, SPIHD, SPIWP (GPIO29, GPIO30, GPIO32, GPIO31, GPIO27, GPIO28) and powered from VDD_SPI; PSRAM (opt.) is drawn on the same bus"
  - id: "esp32-s3-wroom-1-ds-v1.8#sch-flash-pins"
    locator: "§8, Figure 8-1 ESP32-S3-WROOM-1 Schematics, PDF p.39"
    quote: "U2 FLASH VDD 8 GND 4 /CS 1 CLK 6 /HOLD 7 /WP 3 DO 2 DI 5"
    supports: "Schematic flash U2: /CS = SPICS0, CLK = SPICLK, /HOLD = SPIHD, DI = SPID, DO = SPIQ, /WP = SPIWP, VDD = VDD_SPI (read from the drawing)"
  - id: "esp32-s3-wroom-1-ds-v1.8#sch-modules-with-psram-vdd-spi"
    locator: "§8 Module Schematics, PDF p.39"
    quote: "For modules with PSRAM, the VDD_SPI voltage is fixed to 3.3 V or 1.8 V via eFuse"
    supports: "On PSRAM modules (R8) VDD_SPI is fixed via eFuse, so the voltage is not affected by the GPIO45 level (rest of the sentence)"
  - id: "esp32-s3-wroom-1-ds-v1.8#sch-other-modules-gpio45"
    locator: "§8 Module Schematics, PDF p.39"
    quote: "for other modules, please ensure that GPIO45 is not pulled high when the module is powered up by the external circuit."
    supports: "On modules without PSRAM (e.g. N8) GPIO45 must not be pulled high at power-up (a high GPIO45 selects 1.8 V VDD_SPI)"
  - id: "esp32-s3-wroom-1-ds-v1.8#vdd-spi-1v8-only-n16r16va"
    locator: "§1.2, Table 1-1 / 1-2 footnote 7, PDF p.4"
    quote: "Please note that the VDD_SPI voltage is 1.8 V for ESP32-S3-WROOM-1-N16R16VA"
    supports: "Footnote 7: VDD_SPI is 1.8 V for the N16R16VA variants (WROOM-1 and WROOM-1U) only; by exclusion the N8 and N8R8 variants run at the default 3.3 V (not stated explicitly as 3.3 V)"
  - id: "esp32-s3-wroom-1-ds-v1.8#flash-vcc-3v3"
    locator: "§6.5, Table 6-8 Flash Specifications, PDF p.30"
    quote: "Power supply voltage (3.3 V) 2.7 3.3 3.6 V"
    supports: "Flash specification table lists both 1.8 V and 3.3 V supply options"
  - id: "esp32-s3-wroom-1-ds-v1.8#strap-pins-count"
    locator: "§1.1 Features, PDF p.2"
    quote: "4 strapping GPIOs"
    supports: "The module has 4 strapping GPIOs"
  - id: "esp32-s3-wroom-1-ds-v1.8#abs-max-vdd33"
    locator: "§6.1, Table 6-1 Absolute Maximum Ratings, PDF p.27"
    quote: "VDD33 Power supply voltage −0.3 3.6 V"
    supports: "Module absolute maximum rating lists only the supply voltage VDD33 (-0.3 to 3.6 V)"
  - id: "esp32-s3-wroom-1-ds-v1.8#vdd-spi-control-table"
    locator: "§4.2, Table 4-4 VDD_SPI Voltage Control, PDF p.15"
    quote: "VDD3P3_RTC via RSP I 3.3 V 0 0 Ignored"
    supports: "First row of Table 4-4: EFUSE_VDD_SPI_FORCE = 0 and GPIO45 = 0 gives VDD_SPI from VDD3P3_RTC at 3.3 V; GPIO45 = 1 gives the 1.8 V flash voltage regulator (bold default marking is not in the text layer)"
  - id: "esp32-s3-wroom-1-ds-v1.8#efuse-defaults-zero"
    locator: "§4 Boot Configurations, PDF p.13"
    quote: "The default values of all the above eFuse parameters are 0, which means that they are not burnt."
    supports: "EFUSE_VDD_SPI_FORCE and EFUSE_VDD_SPI_TIEH default to 0 (not burnt), so the strap path of Table 4-4 applies by default"
  - id: "esp32-s3-wroom-1-ds-v1.8#strap-defaults-table"
    locator: "§4.1, Table 4-1 Default Configuration of Strapping Pins, PDF p.13"
    quote: "GPIO0 Weak pull-up 1 GPIO3 Floating – GPIO45 Weak pull-down 0 GPIO46 Weak pull-down 0"
    supports: "Strapping defaults: GPIO0 weak pull-up (1), GPIO3 floating, GPIO45 weak pull-down (0, so 3.3 V VDD_SPI by default), GPIO46 weak pull-down (0)"
