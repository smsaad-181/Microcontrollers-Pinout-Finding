# Evidence record: Elecfreaks "Ultrasonic Ranging Module HC - SR04" datasheet (read 2026-10-23).
# No revision is printed. The PDF metadata creation date is 2011-05-11 (not printed text). The copy was read from the
# SparkFun CDN: no reachable vendor-hosted original exists, so secondary is true. cdn.sparkfun.com was not blocked.
accessed: "2026-10-23"
claims:
  - id: "hc-sr04-elecfreaks-ds#principle"
    locator: "p.1, Product features"
    quote: "Using IO trigger for at least 10us high level signal"
    supports: "TRIG needs a high pulse of at least 10 us to start a measurement"
  - id: "hc-sr04-elecfreaks-ds#echo-pulse"
    locator: "p.1, Product features, step (3)"
    quote: "time of high output IO duration is the time from sending ultrasonic to returning"
    supports: "ECHO is an output whose high pulse width equals the sound round-trip time (proportional to distance)"
  - id: "hc-sr04-elecfreaks-ds#range"
    locator: "p.1, Product features"
    quote: "HC - SR04 provides 2cm - 400cm non-contact measurement function, the ranging accuracy can reach to 3mm"
    supports: "Measuring range 2 cm to 400 cm"
  - id: "hc-sr04-elecfreaks-ds#wiring"
    locator: "p.1, wire connecting direct as following; p.2 pin row"
    quote: "5V Supply Trigger Pulse Input Echo Pulse Output 0V Ground"
    supports: "Four pins in order Vcc (5 V supply), Trig (trigger input), Echo (echo output), GND (0 V)"
  - id: "hc-sr04-elecfreaks-ds#pin-order"
    locator: "p.2, pin row above Timing diagram"
    quote: "Vcc Trig Echo GND"
    supports: "Silkscreen/pin labels Vcc, Trig, Echo, GND"
  - id: "hc-sr04-elecfreaks-ds#working-voltage"
    locator: "p.1, Electric Parameter table"
    quote: "Working Voltage DC 5 V"
    supports: "Working voltage is DC 5 V; no tolerance or min/max is stated"
  - id: "hc-sr04-elecfreaks-ds#working-current"
    locator: "p.1, Electric Parameter table"
    quote: "Working Current 15mA"
    supports: "Working current 15 mA; the document does not say whether this is typical or maximum"
  - id: "hc-sr04-elecfreaks-ds#trigger-signal"
    locator: "p.1, Electric Parameter table"
    quote: "Trigger Input Signal 10uS TTL pulse"
    supports: "Trigger input is a 10 us TTL pulse"
  - id: "hc-sr04-elecfreaks-ds#echo-signal"
    locator: "p.1, Electric Parameter table"
    quote: "Echo Output Signal Input TTL lever signal and the range in proportion"
    supports: "Echo output is described only as a TTL level signal proportional to range; no voltage is stated"
  - id: "hc-sr04-elecfreaks-ds#measurement-cycle"
    locator: "p.2, Timing diagram text"
    quote: "we suggest to use over 60ms measurement cycle, in order to prevent trigger signal to the echo signal"
    supports: "Suggested measurement cycle is over 60 ms (a suggestion, not a rating)"
  - id: "hc-sr04-elecfreaks-ds#gnd-first"
    locator: "p.3, Attention"
    quote: "the GND terminal should be connected the module first, otherwise, it will affect the normal work of the module"
    supports: "When the module is powered live, GND must be connected first"
