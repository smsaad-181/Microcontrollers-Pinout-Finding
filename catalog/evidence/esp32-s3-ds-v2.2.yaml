    locator: "§3, Table 3-1 Default Configuration of Strapping Pins, PDF p.32"
    quote: "GPIO45 Weak pull-down 0"
    supports: "GPIO45 strapping pin default configuration weak pull-down, bit value 0"
  - id: "esp32-s3-ds-v2.2#strap-gpio46-default"
    locator: "§3, Table 3-1 Default Configuration of Strapping Pins, PDF p.32"
    quote: "GPIO46 Weak pull-down 0"
    supports: "GPIO46 strapping pin default configuration weak pull-down, bit value 0"
  - id: "esp32-s3-ds-v2.2#strap-chip-boot-mode"
    locator: "§3, introduction, PDF p.32"
    quote: "Strapping pin: GPIO0 and GPIO46"
    supports: "Strapping pins GPIO0 and GPIO46 control the chip boot mode; GPIO45 VDD_SPI voltage; GPIO46 ROM message printing; GPIO3 JTAG signal source (the datasheet lists four strapping pins)"
  - id: "esp32-s3-ds-v2.2#strap-boot-spi"
    locator: "§3.1, Table 3-3 Chip Boot Mode Control, PDF p.33"
    quote: "SPI boot mode 1 Any value"
    supports: "SPI boot mode: GPIO0 = 1, GPIO46 any value"
  - id: "esp32-s3-ds-v2.2#strap-boot-download"
    locator: "§3.1, Table 3-3 Chip Boot Mode Control, PDF p.33"
    quote: "Joint download boot mode 2 0 0"
    supports: "Joint Download Boot mode: GPIO0 = 0 and GPIO46 = 0"
  - id: "esp32-s3-ds-v2.2#strap-vdd-spi-table"
    locator: "§3.2, Table 3-4 VDD_SPI Voltage Control, PDF p.34"
    quote: "VDD3P3_RTC via RSP I 3.3 V 0 0 Ignored 1 Ignored 1 Flash Voltage Regulator 1.8 V 0 1 Ignored"
    supports: "With EFUSE_VDD_SPI_FORCE = 0: GPIO45 = 0 selects VDD_SPI 3.3 V (default), GPIO45 = 1 selects the 1.8 V flash voltage regulator"
  - id: "esp32-s3-ds-v2.2#strap-gpio3-jtag"
    locator: "§3.4 JTAG Signal Source Control, PDF p.34"
    quote: "This pin does not have any internal pull resistors and the strapping value must be controlled by the external circuit"
    supports: "GPIO3 has no internal pull resistors; when used to select the JTAG source its value must be driven externally"
  - id: "esp32-s3-ds-v2.2#strap-hold-time"
    locator: "§3, Table 3-2 Description of Timing Parameters for the Strapping Pins, PDF p.33"
    quote: "Hold time is the time reserved for the chip to read the strapping pin values after CHIP_PU is already high"
    supports: "Strapping pins are sampled at reset release; minimum hold time tH = 3 ms (Table 3-2)"
  - id: "esp32-s3-ds-v2.2#usb-default-serial-jtag"
    locator: "§2.3.4 Restrictions for GPIOs and RTC_GPIOs, PDF p.25"
    quote: "by default, connected to the USB Serial/JTAG Controller. To function as GPIOs, these pins need to be reconfigured via the IO_MUX_MCU_SEL bit"
    supports: "GPIO19 (USB_D-) and GPIO20 (USB_D+) are connected to the USB Serial/JTAG controller by default and must be reconfigured to act as GPIO"
  - id: "esp32-s3-ds-v2.2#p3-usb-jtag-uart0"
    locator: "§2.3.5 Peripheral Pin Assignment, Priority 3, PDF p.26"
    quote: "GPIO19, GPIO20 : USB Serial/JTAG interface."
    supports: "GPIO19 and GPIO20 are priority 3 (use with caution): USB Serial/JTAG interface; GPIO39-GPIO42 JTAG; GPIO43/GPIO44 UART0"
  - id: "esp32-s3-ds-v2.2#p3-octal-gpio33-37"
    locator: "§2.3.5 Peripheral Pin Assignment, Priority 3, PDF p.26"
    quote: "can be GPIO pins if the chip is not connected to flash or PSRAM in 8-line SPI mode."
    supports: "GPIO33-GPIO37 carry the higher 4 data lines and DQS of the SPI0/1 interface in 8-line SPI mode; usable as GPIO only if the chip is not connected to flash or PSRAM in 8-line SPI mode"
  - id: "esp32-s3-ds-v2.2#p4-gpio26-32"
    locator: "§2.3.5 Peripheral Pin Assignment, Priority 4, PDF p.26"
    quote: "SPI0/1 interface connected to the in-package flash and PSRAM, or recommended for the off-package flash and PSRAM."
    supports: "GPIO26-GPIO32 are priority 4: SPI0/1 interface to in-package flash/PSRAM or recommended for off-package flash/PSRAM"
  - id: "esp32-s3-ds-v2.2#pin-map-notice"
    locator: "§2.6 Pin Mapping Between Chip and Flash/PSRAM, PDF p.31"
    quote: "Do not use the pins connected to in-package flash/PSRAM for any other purposes."
    supports: "Pins allocated to the flash/PSRAM SPI bus must not be used for anything else"
  - id: "esp32-s3-ds-v2.2#pin-map-spics1"
    locator: "§2.6, Table 2-14, PDF p.31"
    quote: "28 SPICS1 2 CE# CE# CE# CE#"
    supports: "SPICS1 (GPIO26) is CE# of the in-package PSRAM (footnote 2: CS1 is for in-package PSRAM)"
  - id: "esp32-s3-ds-v2.2#pin-map-spihd"
    locator: "§2.6, Table 2-14, PDF p.31"
    quote: "30 SPIHD HOLD# SIO3 HOLD# SIO3 HOLD# SIO3 DQ3 DQ3"
    supports: "SPIHD (GPIO27) is flash HOLD# / PSRAM SIO3 (DQ3 in octal modes)"
  - id: "esp32-s3-ds-v2.2#pin-map-spiwp"
    locator: "§2.6, Table 2-14, PDF p.31"
    quote: "31 SPIWP WP# SIO2 WP# SIO2 WP# SIO2 DQ2 DQ2"
    supports: "SPIWP (GPIO28) is flash WP# / PSRAM SIO2 (DQ2 in octal modes)"
  - id: "esp32-s3-ds-v2.2#pin-map-spics0"
    locator: "§2.6, Table 2-14, PDF p.31"
    quote: "32 SPICS0 1 CS# CS# CS# CS#"
    supports: "SPICS0 (GPIO29) is CS# of the flash (footnote 1: CS0 is for in-package flash)"
  - id: "esp32-s3-ds-v2.2#pin-map-spiclk"
    locator: "§2.6, Table 2-14, PDF p.31"
    quote: "33 SPICLK CLK CLK CLK CLK CLK CLK CLK CLK"
    supports: "SPICLK (GPIO30) is CLK of flash and PSRAM in all SPI modes"
  - id: "esp32-s3-ds-v2.2#pin-map-spiq"
    locator: "§2.6, Table 2-14, PDF p.31"
    quote: "34 SPIQ DO SO/SIO1 DO SO/SIO1 DO SO/SIO1 DQ1 DQ1"
    supports: "SPIQ (GPIO31) is flash DO / PSRAM SO/SIO1 (DQ1 in octal modes)"
  - id: "esp32-s3-ds-v2.2#pin-map-spid"
    locator: "§2.6, Table 2-14, PDF p.31"
    quote: "35 SPID DI SI/SIO0 DI SI/SIO0 DI SI/SIO0 DQ0 DQ0"
    supports: "SPID (GPIO32) is flash DI / PSRAM SI/SIO0 (DQ0 in octal modes)"
  - id: "esp32-s3-ds-v2.2#pin-map-gpio33"
    locator: "§2.6, Table 2-14 (Octal SPI/OPI columns), PDF p.31"
    quote: "38 GPIO33 DQ4 DQ4"
    supports: "In Octal SPI/OPI mode GPIO33 carries DQ4 of flash and PSRAM"
  - id: "esp32-s3-ds-v2.2#pin-map-gpio34"
    locator: "§2.6, Table 2-14 (Octal SPI/OPI columns), PDF p.31"
    quote: "39 GPIO34 DQ5 DQ5"
    supports: "In Octal SPI/OPI mode GPIO34 carries DQ5 of flash and PSRAM"
  - id: "esp32-s3-ds-v2.2#pin-map-gpio35"
    locator: "§2.6, Table 2-14 (Octal SPI/OPI columns), PDF p.31"
    quote: "40 GPIO35 DQ6 DQ6"
    supports: "In Octal SPI/OPI mode GPIO35 carries DQ6 of flash and PSRAM"
  - id: "esp32-s3-ds-v2.2#pin-map-gpio36"
    locator: "§2.6, Table 2-14 (Octal SPI/OPI columns), PDF p.31"
    quote: "41 GPIO36 DQ7 DQ7"
    supports: "In Octal SPI/OPI mode GPIO36 carries DQ7 of flash and PSRAM"
  - id: "esp32-s3-ds-v2.2#pin-map-gpio37"
    locator: "§2.6, Table 2-14 (Octal SPI/OPI columns), PDF p.31"
    quote: "42 GPIO37 DQS/DM DQS/DM"
    supports: "In Octal SPI/OPI mode GPIO37 carries DQS/DM of flash and PSRAM"
  - id: "esp32-s3-ds-v2.2#adc-wifi-note"
    locator: "§4.2.2.1 SAR ADC, Note, PDF p.59"
    quote: "the ADC2_CH... analog functions (see Table 2-8 Analog Functions) cannot be used with Wi-Fi"
    supports: "ADC2 channels cannot be used while Wi-Fi is running; the note names only ADC2 (no statement about ADC1)"
  - id: "esp32-s3-ds-v2.2#adc-atten0-range"
    locator: "§5.5, Table 5-6 ADC Calibration Results, PDF p.66"
    quote: "ATTEN0, effective measurement range of 0 ~ 850"
    supports: "Effective measurement range for attenuation ATTEN0 after calibration: 0 to 850 mV"
  - id: "esp32-s3-ds-v2.2#adc-atten1-range"
    locator: "§5.5, Table 5-6 ADC Calibration Results, PDF p.66"
    quote: "ATTEN1, effective measurement range of 0 ~ 1100"
    supports: "Effective measurement range for attenuation ATTEN1 after calibration: 0 to 1100 mV"
  - id: "esp32-s3-ds-v2.2#adc-atten2-range"
    locator: "§5.5, Table 5-6 ADC Calibration Results, PDF p.66"
    quote: "ATTEN2, effective measurement range of 0 ~ 1600"
    supports: "Effective measurement range for attenuation ATTEN2 after calibration: 0 to 1600 mV"
  - id: "esp32-s3-ds-v2.2#adc-atten3-range"
    locator: "§5.5, Table 5-6 ADC Calibration Results, PDF p.66"
    quote: "ATTEN3, effective measurement range of 0 ~ 2900"
    supports: "Effective measurement range for attenuation ATTEN3 after calibration: 0 to 2900 mV"
  - id: "esp32-s3-ds-v2.2#abs-max-cumulative-current"
    locator: "§5.1, Table 5-1 Absolute Maximum Ratings, PDF p.64"
    quote: "Cumulative IO output current -- 1500 mA"
    supports: "Absolute maximum cumulative IO output current 1500 mA"
  - id: "esp32-s3-ds-v2.2#abs-max-power-pins-only"
    locator: "§5.1, Table 5-1 Absolute Maximum Ratings, PDF p.64"
    quote: "Input power pins1 Allowed input voltage 0.3 3.6 V"
    supports: "The only voltage row of Table 5-1 is for input power pins (-0.3 to 3.6 V); there is no absolute-maximum row for GPIO input voltage"
  - id: "esp32-s3-ds-v2.2#recommended-supply"
    locator: "§5.2, Table 5-2 Recommended Operating Conditions, PDF p.64"
    quote: "VDD3P3_CPU 3 Recommended input voltage 3.0 3.3 3.6 V"
    supports: "Recommended supply of the digital I/O domain (and VDDA/VDD3P3/VDD3P3_RTC): 3.0 / 3.3 / 3.6 V min/typ/max"
  - id: "esp32-s3-ds-v2.2#dc-vdd-definition"
    locator: "§5.4, Table 5-4 footnote 1, PDF p.65"
    quote: "VDD – voltage from a power pin of a respective power domain."
    supports: "VDD in Table 5-4 is the supply of the pad's power domain"
  - id: "esp32-s3-ds-v2.2#dc-vih"
    locator: "§5.4, Table 5-4 DC Characteristics (3.3 V, 25 °C), PDF p.65"
    quote: "High-level input voltage 0.75 × VDD 1 -- VDD 1 + 0.3 V"
    supports: "VIH min 0.75 x VDD at VDD 3.3 V, 25 C; the table's Max column (VDD + 0.3 V) is an operating-condition limit, not an absolute maximum rating"
  - id: "esp32-s3-ds-v2.2#dc-vil"
    locator: "§5.4, Table 5-4 DC Characteristics (3.3 V, 25 °C), PDF p.65"
    quote: "Low-level input voltage 0.3 -- 0.25 × VDD 1 V"
    supports: "VIL max 0.25 x VDD at VDD 3.3 V, 25 C"
  - id: "esp32-s3-ds-v2.2#dc-voh"
    locator: "§5.4, Table 5-4 DC Characteristics (3.3 V, 25 °C), PDF p.65"
    quote: "High-level output voltage 0.8 × VDD 1 -- -- V"
    supports: "VOH min 0.8 x VDD at VDD 3.3 V, 25 C (high-impedance load)"
  - id: "esp32-s3-ds-v2.2#dc-vol"
    locator: "§5.4, Table 5-4 DC Characteristics (3.3 V, 25 °C), PDF p.65"
    quote: "Low-level output voltage -- -- 0.1 × VDD 1 V"
    supports: "VOL max 0.1 x VDD at VDD 3.3 V, 25 C (high-impedance load)"
  - id: "esp32-s3-ds-v2.2#dc-ioh"
    locator: "§5.4, Table 5-4 DC Characteristics (3.3 V, 25 °C), PDF p.65"
    quote: "High-level source current (VDD 1 = 3.3 V, VOH >= 2.64 V, PAD_DRIVER = 3) -- 40 -- mA"
    supports: "IOH typical 40 mA at PAD_DRIVER = 3 (a typical test value, not a maximum rating)"
  - id: "esp32-s3-ds-v2.2#dc-iol"
    locator: "§5.4, Table 5-4 DC Characteristics (3.3 V, 25 °C), PDF p.65"
    quote: "Low-level sink current (VDD 1 = 3.3 V, VOL = 0.495 V, PAD_DRIVER = 3) -- 28 -- mA"
    supports: "IOL typical 28 mA at PAD_DRIVER = 3 (a typical test value, not a maximum rating)"
  - id: "esp32-s3-ds-v2.2#dc-pull-up"
    locator: "§5.4, Table 5-4 DC Characteristics (3.3 V, 25 °C), PDF p.65"
    quote: "Internal weak pull-up resistor -- 45 -- k"
    supports: "RPU typical 45 kohm, no min/max given"
  - id: "esp32-s3-ds-v2.2#dc-pull-down"
    locator: "§5.4, Table 5-4 DC Characteristics (3.3 V, 25 °C), PDF p.65"
    quote: "Internal weak pull-down resistor -- 45 -- k"
    supports: "RPD typical 45 kohm, no min/max given"
  - id: "esp32-s3-ds-v2.2#drive-strength-default"
    locator: "§2.2, Table 2-1 footnote 5, PDF p.18"
    quote: "• GPIO17 and GPIO18: 10 mA • GPIO19 and GPIO20: 40 mA • All other pins: 20 mA"
    supports: "Default drive strengths per pin: GPIO17/GPIO18 10 mA, GPIO19/GPIO20 40 mA, all other pins 20 mA (drive-strength setting, not a maximum rating)"
  - id: "esp32-s3-ds-v2.2#spi2-master-80mhz"
    locator: "§4.2.1.5 Serial Peripheral Interface (SPI), SPI2 as a master, PDF p.53"
    quote: "Supports 2-line full-duplex communication with clock frequency up to 80 MHz"
    supports: "SPI2 (general-purpose SPI) master clock up to 80 MHz; the datasheet does not distinguish IO MUX from GPIO-matrix routing"
  - id: "esp32-s3-ds-v2.2#table-1-1-s3fh4r2"
    locator: "§1.2, Table 1-1 ESP32-S3 Series Comparison, PDF p.13"
    quote: "ESP32-S3FH4R2 4 MB (Quad SPI) 2 MB (Quad SPI)"
    supports: "ESP32-S3FH4R2 has 4 MB in-package Quad SPI flash and 2 MB in-package Quad SPI PSRAM (VDD_SPI voltage column 3.3 V)"
  - id: "esp32-s3-ds-v2.2#table-1-1-s3r2"
    locator: "§1.2, Table 1-1 ESP32-S3 Series Comparison, PDF p.13"
    quote: "ESP32-S3R2 (EOL)6 -- 2 MB (Quad SPI)"
    supports: "ESP32-S3R2 has no in-package flash and 2 MB in-package Quad SPI PSRAM (VDD_SPI voltage column 3.3 V)"
  - id: "esp32-s3-ds-v2.2#table-1-1-s3fh4r2-3v3"
    locator: "§1.2, Table 1-1 ESP32-S3 Series Comparison, PDF p.13"
    quote: "ESP32-S3FH4R2 4 MB (Quad SPI) 2 MB (Quad SPI) 40 85 C 3.3 V"
    supports: "ESP32-S3FH4R2 VDD_SPI voltage 3.3 V"
  - id: "esp32-s3-ds-v2.2#table-1-1-s3r2-3v3"
    locator: "§1.2, Table 1-1 ESP32-S3 Series Comparison, PDF p.13"
    quote: "ESP32-S3R2 (EOL)6 -- 2 MB (Quad SPI) 40 85 C 3.3 V"
    supports: "ESP32-S3R2 VDD_SPI voltage 3.3 V"
