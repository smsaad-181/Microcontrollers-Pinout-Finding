accessed: "2026-10-24"
claims:
  - id: "esp-wrover-kit-v4.1-sch#boot-io0"
    locator: "Switch block (SW3 -> Q10)"
    quote: "R172 0R(1%) IO0"
    supports: "BOOT switch SW3 drives Q10 which pulls GPIO0 low (guide calls the switch SW2)"
  - id: "esp-wrover-kit-v4.1-sch#boot-io2"
    locator: "Switch block (SW3 -> Q11)"
    quote: "R173 0R(1%) IO2"
    supports: "BOOT switch SW3 also drives Q11 which pulls GPIO2 low"
  - id: "esp-wrover-kit-v4.1-sch#sd-pullups"
    locator: "SD Card block"
    quote: "R157 10K(1%)(NC) R156 10K(1%) R155 10K(1%) R154 10K(1%) R153 10K(1%) R152 10K(1%)"
    supports: "10 k pull-ups to VDD33: R153 GPIO2, R152 GPIO4, R156 GPIO13, R154 GPIO14, R155 GPIO15; R157 (GPIO12) not fitted (NC)"
  - id: "esp-wrover-kit-v4.1-sch#sd-cd-r168"
    locator: "SD Card block"
    quote: "R168"
    supports: "R168 10 k pull-up on GPIO21 (card detect); value and net read from the rendered page"
  - id: "esp-wrover-kit-v4.1-sch#ldo-ncp1117"
    locator: "Power block"
    quote: "NCP1117 R124"
    supports: "3V3 regulator U4 is an NCP1117"
  - id: "esp-wrover-kit-v4.1-sch#sw-5v"
