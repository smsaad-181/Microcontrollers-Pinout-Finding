# Raspberry Pi Pico W Datasheet, Release 7 (build date 03/07/2026 = 3 July 2026, build version d4e0f1799616),
# read from sources/cache/pico-w-ds-rel7.pdf. Locators give the printed page number (PDF page = printed + 1).
# Claims marked "(transcribed)" are read from an image (Figure 2 pinout, Figure 12 schematic): the quote
# lists the labels printed in the figure, in reading order.
accessed: "2026-10-22"
claims:
  - id: pico-w-ds-rel7#flash-part
    locator: "§1 About Raspberry Pi Pico W, p. 4"
    quote: "flash memory (Winbond W25Q16JV), crystal (Abracon ABM8-272-T3), power supplies and decoupling, and USB connector"
    supports: "Pico W carries a Winbond W25Q16JV QSPI flash"
  - id: pico-w-ds-rel7#cyw43439
    locator: "§1 About Raspberry Pi Pico W, p. 4"
    quote: "Pico W has an on-board 2.4 GHz wireless interface using an Infineon CYW43439."
    supports: "On-board wireless chip Infineon CYW43439"
  - id: pico-w-ds-rel7#board-revision
    locator: "§1, Figure 2 caption, p. 4"
    quote: "The pinout of the Pico W Rev3 board"
    supports: "Board revision documented: Pico W Rev3"
  - id: pico-w-ds-rel7#pinout-figure
    locator: "§1 Figure 2 (pinout image, p. 4) and §2.1 Figure 4 note, p. 7 (transcribed)"
    quote: "The physical pin numbering is shown in Figure 4. For pin allocation see Figure 2, or the full Pico W schematics in Appendix B."
    supports: "Header map transcribed from Figure 2 (identical to Pico): 1 GP0, 2 GP1, 3 GND, 4 GP2, 5 GP3, 6 GP4, 7 GP5, 8 GND, 9 GP6, 10 GP7, 11 GP8, 12 GP9, 13 GND, 14 GP10, 15 GP11, 16 GP12, 17 GP13, 18 GND, 19 GP14, 20 GP15, 21 GP16, 22 GP17, 23 GND, 24 GP18, 25 GP19, 26 GP20, 27 GP21, 28 GND, 29 GP22, 30 RUN, 31 GP26/ADC0, 32 GP27/ADC1, 33 GND/AGND, 34 GP28/ADC2, 35 ADC_VREF, 36 3V3(OUT), 37 3V3_EN, 38 GND, 39 VSYS, 40 VBUS; GPn = RP2040 GPIOn"
  - id: pico-w-ds-rel7#internal-gpio29
    locator: "§2.1 Pico W pinout, p. 7"
    quote: "GPIO29 OP/IP wireless SPI CLK/ADC mode (ADC3) to measure VSYS/3"
    supports: "GPIO29 is the CYW43439 SPI clock and also the VSYS/3 ADC input (internal, not on the header)"
  - id: pico-w-ds-rel7#internal-gpio25
    locator: "§2.1 Pico W pinout, p. 7"
    quote: "GPIO25 OP wireless SPI CS - when high also enables GPIO29 ADC pin to read VSYS"
    supports: "GPIO25 is the CYW43439 SPI chip select and gates the VSYS divider onto GPIO29 (internal)"
  - id: pico-w-ds-rel7#internal-gpio24
    locator: "§2.1 Pico W pinout, p. 7"
    quote: "GPIO24 OP/IP wireless SPI data/IRQ"
    supports: "GPIO24 is the CYW43439 SPI data/IRQ line (internal)"
  - id: pico-w-ds-rel7#internal-gpio23
    locator: "§2.1 Pico W pinout, p. 7"
    quote: "GPIO23 OP wireless power on signal"
    supports: "GPIO23 is the CYW43439 power-on signal (internal)"
  - id: pico-w-ds-rel7#wl-gpio-functions
    locator: "§2.1 Pico W pinout, p. 7"
    quote: "WL_GPIO2 IP VBUS sense - high if VBUS is present, else low WL_GPIO1 OP controls the on-board SMPS power save pin"
    supports: "On Pico W, VBUS sense and SMPS power-save are on CYW43439 pins WL_GPIO2/WL_GPIO1, not on RP2040 pads"
  - id: pico-w-ds-rel7#wl-gpio0-led
    locator: "§2.1 Pico W pinout, p. 7"
    quote: "WL_GPIO0 OP connected to user LED"
    supports: "On Pico W the user LED is driven by CYW43439 WL_GPIO0, not by an RP2040 pad"
  - id: pico-w-ds-rel7#other-pins
    locator: "§2.1 Pico W pinout, p. 8"
    quote: "PIN40 VBUS PIN39 VSYS PIN37 3V3_EN PIN36 3V3 PIN35 ADC_VREF PIN33 AGND PIN30 RUN"
    supports: "Non-GPIO, non-ground header positions: 40 VBUS, 39 VSYS, 37 3V3_EN, 36 3V3, 35 ADC_VREF, 33 AGND, 30 RUN"
  - id: pico-w-ds-rel7#vbus-desc
    locator: "§2.1 Pico W pinout, p. 8"
    quote: "VBUS is the micro-USB input voltage, connected to micro-USB port pin 1. This is nominally 5 V"
    supports: "VBUS rail nominal 5 V from micro-USB"
  - id: pico-w-ds-rel7#vsys-desc
    locator: "§2.1 Pico W pinout, p. 8"
    quote: "VSYS is the main system input voltage, which can vary in the allowed range 1.8 V to 5.5 V"
    supports: "VSYS is an input range 1.8 V to 5.5 V, not a fixed voltage"
  - id: pico-w-ds-rel7#3v3-en
    locator: "§2.1 Pico W pinout, p. 8"
    quote: "3V3_EN connects to the on-board SMPS enable pin, and is pulled high (to VSYS) via a 100 kΩ resistor."
    supports: "Pin 37 3V3_EN is the SMPS enable (pulling it low disables 3V3 and de-powers RP2040)"
  - id: pico-w-ds-rel7#3v3-desc
    locator: "§2.1 Pico W pinout, p. 8"
    quote: "3V3 is the main 3.3 V supply to RP2040 and its I/O, generated by the on-board SMPS."
    supports: "3V3 rail is 3.3 V from the on-board SMPS"
  - id: pico-w-ds-rel7#3v3-max-load
    locator: "§2.1 Pico W pinout, p. 8"
    quote: "it is recommended to keep the load on this pin under 300 mA"
    supports: "3V3 output: recommended maximum external load 300 mA (depends on RP2040 load and VSYS)"
  - id: pico-w-ds-rel7#run-pin
    locator: "§2.1 Pico W pinout, p. 8"
    quote: "RUN is the RP2040 enable pin, and has an internal (on-chip) pull-up resistor to 3.3 V of about ~50 kΩ."
    supports: "Pin 30 RUN is the RP2040 reset/enable input"
  - id: pico-w-ds-rel7#tp6-bootsel
    locator: "§2.1 Pico W pinout, test points, p. 8"
    quote: "TP6 can be used to drive the system into mass-storage USB programming mode (by shorting it low at power-up)."
    supports: "BOOTSEL (TP6) selects USB boot when low at power-up"
  - id: pico-w-ds-rel7#operating-vbus
    locator: "§2.3 Recommended operating conditions, p. 12"
    quote: "VBUS 5 V ± 10%."
    supports: "VBUS operating range 5 V ± 10 %"
  - id: pico-w-ds-rel7#bootsel-button
    locator: "§3.1 Programming the flash, p. 13"
    quote: "hold the BOOTSEL button down during board power-up (e.g. hold BOOTSEL down while connecting the USB)"
    supports: "On-board BOOTSEL button selects USB mass-storage boot at power-up"
  - id: pico-w-ds-rel7#gpio-3v3
    locator: "§3.2 General purpose I/O, p. 13"
    quote: "The Pico W’s GPIO is powered from the on-board 3.3 V rail, and is fixed at 3.3 V."
    supports: "Pico W logic voltage 3.3 V (IOVDD = 3.3 V)"
  - id: pico-w-ds-rel7#gpio-exposed
    locator: "§3.2 General purpose I/O, p. 13"
    quote: "Pico W exposes 26 of the 30 possible RP2040 GPIO pins by routing them straight out to Pico W header pins."
    supports: "26 GPIO on the header (GPIO0-22, GPIO26-28); GPIO23, 24, 25, 29 are internal"
  - id: pico-w-ds-rel7#adc-diode
    locator: "§3.2 General purpose I/O, p. 13"
    quote: "have an internal reverse diode to the IOVDD (3.3 V) rail, so the input voltage must not exceed IOVDD plus about 300 mV"
    supports: "GPIO26-GPIO29 input voltage limit about IOVDD + 0.3 V (more restrictive than the RP2040 IOVDD + 0.5 V absolute maximum)"
  - id: pico-w-ds-rel7#smps-part
    locator: "§3.4 Powerchain, p. 14"
    quote: "VSYS is the main system ‘input voltage’ and feeds the RT6154 buck-boost SMPS, which generates a fixed 3.3 V output"
    supports: "3V3 rail source: RT6154 buck-boost SMPS fed from VSYS"
  - id: pico-w-ds-rel7#vsys-divider
    locator: "§3.4 Powerchain, p. 14"
    quote: "VSYS divided by 3 (by R5, R6 in the Pico W schematic) and can be monitored on ADC channel 3"
    supports: "GPIO29/ADC3 measures VSYS/3 through R5/R6 (only when no wireless transfer is in progress)"
  - id: pico-w-ds-rel7#clk-shared
    locator: "§3.8 Wireless interface, p. 17"
    quote: "The CLK is shared with VSYS monitor, so only when there isn’t an SPI transaction in progress can VSYS be read via the ADC."
    supports: "GPIO29 is shared between the CYW43439 SPI clock and the VSYS/3 ADC measurement"
  - id: pico-w-ds-rel7#schematic-wireless
    locator: "Appendix B, Figure 12 Pico W Rev3 schematic, p. 20, wireless interface section (transcribed)"
    quote: "GPIO 23 24 25 29 Are used for the wireless interface GPIO23 WL_ON GPIO24 WL_D GPIO25 WL_CS GPIO29_ADC3 WL_CLK"
    supports: "RP2040 GPIO23/24/25/29 are wired to the CYW43439 nets WL_ON, WL_D, WL_CS, WL_CLK"
  - id: pico-w-ds-rel7#schematic-led
    locator: "Appendix B, Figure 12 Pico W Rev3 schematic, p. 20, LED section (transcribed)"
    quote: "WL_GPIO0 R3 470R TP5 D2 Green LED"
    supports: "User LED D2 driven from CYW43439 WL_GPIO0 through R3 470 Ω; no RP2040 pad involved"
  - id: pico-w-ds-rel7#schematic-flash
    locator: "Appendix B, Figure 12 Pico W Rev3 schematic, p. 20, flash section (transcribed)"
    quote: "3V3 8 VCC U3 W25Q16JVUXIQ QSPI_SS QSPI_SCLK QSPI_SD0 QSPI_SD1 QSPI_SD2 QSPI_SD3"
    supports: "Flash W25Q16JVUXIQ supplied from 3V3 (flash voltage 3.3 V) and wired only to the QSPI pins"
