# Evidence record: ESP32-WROVER-E & ESP32-WROVER-IE Datasheet (read 2026-10-22).
accessed: "2026-10-22"
claims:
  - id: "esp32-wrover-e-ds-v2.4#pin-layout-4-14"
    locator: "§3.1, Figure 5 Pin Layout (Top View), PDF p.11"
    quote: "4 SENSOR_VP 5 SENSOR_VN 6 IO34 7 IO35 8 IO32 9 IO33 10 IO25 11 IO26 12 IO27 13 IO14 14 IO12"
    supports: "Module pins 4-14 bond out GPIO36, 39, 34, 35, 32, 33, 25, 26, 27, 14, 12"
  - id: "esp32-wrover-e-ds-v2.4#pin-layout-15-25"
    locator: "§3.1, Figure 5 Pin Layout (Top View), PDF p.11"
    quote: "15 GND 16 IO13 17 NC 18 NC 19 NC 20 NC 21 NC 22 NC 23 IO15 24 IO2 25 IO0"
    supports: "Module pins 15-25 bond out GPIO13, 15, 2, 0; pins 17-22 are NC"
  - id: "esp32-wrover-e-ds-v2.4#pin-layout-26-37"
    locator: "§3.1, Figure 5 Pin Layout (Top View), PDF p.11"
    quote: "26 IO4 27 NC 28 NC 29 IO5 30 IO18 31 IO19 32 NC 33 IO21 34 RXD0 35 TXD0 36 IO22 37 IO23"
    supports: "Module pins 26-37 (see quote for which GPIOs are bonded and which pins are NC)"
  - id: "esp32-wrover-e-ds-v2.4#pin-sensor-vp-vn"
    locator: "§3.2, Table 3 Pin Definitions, PDF p.12-13"
    quote: "SENSOR_VP 4 I GPIO36, ADC1_CH0, RTC_GPIO0 SENSOR_VN 5 I GPIO39, ADC1_CH3, RTC_GPIO3"
    supports: "Module pins SENSOR_VP/SENSOR_VN are GPIO36/GPIO39"
  - id: "esp32-wrover-e-ds-v2.4#pin-rxd0-txd0"
    locator: "§3.2, Table 3 Pin Definitions (cont'd), PDF p.12-13"
    quote: "RXD0 34 I/O GPIO3, U0RXD, CLK_OUT2 TXD0 35 I/O GPIO1, U0TXD, CLK_OUT3, EMAC_RXD2"
    supports: "Module pins RXD0/TXD0 are GPIO3/GPIO1 (UART0)"
  - id: "esp32-wrover-e-ds-v2.4#gpio6-11-flash"
    locator: "§3.2, Table 3 Pin Definitions, note 2, PDF p.12-13"
    quote: "Pins GPIO6 to GPIO11 on the ESP32-D0WD-V3/ESP32-D0WDR2-V3 chip are connected to the SPI flash integrated on the module and are not led out."
    supports: "GPIO6-GPIO11 consumed by in-module flash and not bonded out"
  - id: "esp32-wrover-e-ds-v2.4#vdd-sdio-mtdi0"
    locator: "§4.2 Internal LDO (VDD_SDIO) Voltage Control, PDF p.16"
    quote: "MTDI = 0 (by default), VDD_SDIO pin is powered directly from VDD3P3_RTC. Typically this voltage is 3.3 V."
    supports: "With IO12/MTDI low the in-module flash (powered from VDD_SDIO) runs at 3.3 V"
  - id: "esp32-wrover-e-ds-v2.4#up-to-24-gpios"
    locator: "§1.1 Features, Peripherals, PDF p.2"
    quote: "Up to 24 GPIOs"
    supports: "WROVER-E bonds out 24 GPIOs (GPIO16/17 not led out)"
  - id: "esp32-wrover-e-ds-v2.4#series-n8r8"
    locator: "§1.2, Table 1 ESP32-WROVER-E Series Comparison, PDF p.3"
    quote: "ESP32-WROVER-E-N8R8 8 MB (Quad SPI) 8 MB (Quad SPI) −40 ~ 85"
    supports: "WROVER-E-N8R8 (fitted on ESP32-DevKitC-VE) has 8 MB Quad SPI PSRAM"
  - id: "esp32-wrover-e-ds-v2.4#series-vdd-sdio"
    locator: "§1.2, Table 1 ESP32-WROVER-E Series Comparison, column VDD_SDIO Voltage, PDF p.3"
    quote: "VDD_SDIO Voltage 3.3 V"
    supports: "WROVER-E flash/PSRAM supply (VDD_SDIO) is 3.3 V for all part numbers"
  - id: "esp32-wrover-e-ds-v2.4#sch-gpio17-sram-clk"
    locator: "§8 Module Schematics, Figure 9 Schematics of ESP32-WROVER-E, PDF p.38"
    quote: "GPIO17 R13 0 SRAM_CLK"
    supports: "GPIO17 drives the PSRAM clock through R13 (0 ohm) inside the module"
  - id: "esp32-wrover-e-ds-v2.4#sch-gpio16-psram-cs"
    locator: "§8 Module Schematics, Figure 9, PSRAM U4, PDF p.38"
    quote: "GPIO16 1 CS#"
    supports: "GPIO16 is wired to PSRAM U4 pin 1 (CS#) with R10 10K pull-up to VDD_SDIO inside the module"
  - id: "esp32-wrover-e-ds-v2.4#sch-u4-nc-d0wdr2"
    locator: "§8 Module Schematics, Figure 9 note, PDF p.38"
    quote: "When ESP32-D0WDR2-V3 is used, U4 will be NC."
    supports: "EOL ...R2 variants use in-package PSRAM instead of U4"
  - id: "esp32-wrover-e-ds-v2.4#io12-kept-low"
    locator: "§9 Peripheral Schematics, Figure annotation, PDF p.40"
    quote: "IO12 should be kept low when the module is powered on."
    supports: "Module requires GPIO12/MTDI low at power-on (3.3 V flash)"
