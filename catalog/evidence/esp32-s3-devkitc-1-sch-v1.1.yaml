# Evidence record: ESP32-S3-DevKitC-1 Schematic (SCH_ESP32-S3-DevKitC-1_V1.1_20221130) (read 2026-10-22).
accessed: "2026-10-22"
claims:
  - id: "esp32-s3-devkitc-1-sch-v1.1#title-block"
    locator: "ESP32-S3-DevKitC-1 schematic, sheet 2 of 2, title block"
    quote: "02_ESP32-S3-DevKitC-1 V1.1"
    supports: "Schematic identity: ESP32-S3-DevKitC-1, Rev V1.1, sheet 2 of 2 dated Wednesday, November 30, 2022 (file SCH_ESP32-S3-DevKitC-1_V1.1_20221130)"
  - id: "esp32-s3-devkitc-1-sch-v1.1#ldo-part"
    locator: "Sheet 2, block 5 V to 3.3 V power"
    quote: "U2 SGM2212-3.3XKC3G/TR"
    supports: "3V3 regulator is U2 SGM2212-3.3XKC3G/TR, VIN = VCC_5V, VOUT = VCC_3V3; no current rating printed on the schematic"
  - id: "esp32-s3-devkitc-1-sch-v1.1#vcc-5v-diode"
    locator: "Sheet 2, blocks USB to UART and ESP USB"
    quote: "D1 1N5819HW-7-F"
    supports: "VBUS of each micro-USB connector (J2 USB to UART, J4 ESP USB) reaches VCC_5V through a 1N5819HW-7-F Schottky diode (D1 and D7); VCC_5V also feeds header J1 pin 21 (5V)"
  - id: "esp32-s3-devkitc-1-sch-v1.1#bridge-part"
    locator: "Sheet 2, block USB to UART"
    quote: "U3 CP2102N-A02-GQFN28"
    supports: "USB-to-UART bridge is U3 CP2102N-A02-GQFN28"
  - id: "esp32-s3-devkitc-1-sch-v1.1#uart0-links"
    locator: "Sheet 2, block USB to UART"
    quote: "U0RXD U0TXD"
    supports: "Bridge pins connect through 0 ohm resistors R7/R9 to the nets U0RXD and U0TXD (module TXD0/RXD0, GPIO43/GPIO44)"
  - id: "esp32-s3-devkitc-1-sch-v1.1#auto-program"
    locator: "Sheet 2, block Auto program"
    quote: "Auto program DTR RTS-->EN IO0"
    supports: "Bridge DTR/RTS drive CHIP_PU (EN) and GPIO0 through transistors Q1/Q2 (L8050QLT1G) and 0 ohm resistors R8/R13"
  - id: "esp32-s3-devkitc-1-sch-v1.1#esp-usb"
    locator: "Sheet 2, block ESP USB"
    quote: "USB_DN USB_DP GPIO19 GPIO20"
    supports: "ESP USB connector J4 D- and D+ are wired to GPIO19 and GPIO20 (read from the drawing; VBUS through D7)"
  - id: "esp32-s3-devkitc-1-sch-v1.1#rgb-led-gpio38"
    locator: "Sheet 2, RGB LED block"
    quote: "RGB_CTRL GPIO38"
    supports: "D6 SK68XXMINI-HS DIN is driven from GPIO38 through R17 0 ohm (net RGB_CTRL); VDD from VCC_3V3"
  - id: "esp32-s3-devkitc-1-sch-v1.1#rgb-led-part"
    locator: "Sheet 2, RGB LED block"
    quote: "D6 SK68XXMINI-HS"
    supports: "RGB LED part is D6 SK68XXMINI-HS (addressable, single data input DIN)"
  - id: "esp32-s3-devkitc-1-sch-v1.1#power-led"
    locator: "Sheet 2, 3.3 V power block"
    quote: "D5 RED LED"
    supports: "Red power LED D5 on VCC_3V3 with series resistor R11 5.1K"
  - id: "esp32-s3-devkitc-1-sch-v1.1#buttons"
    locator: "Sheet 2, buttons block"
    quote: "SW1 NTC013-AT1J-A160T"
    supports: "SW1 (Boot) connects GPIO0 to ground and SW2 (Reset) connects CHIP_PU (EN) to ground; C14 (EN) and C13 (GPIO0) capacitors are NC (not fitted)"
  - id: "esp32-s3-devkitc-1-sch-v1.1#en-rc"
    locator: "Sheet 2, CHIP_PU net"
    quote: "R5 10K(1%)"
    supports: "CHIP_PU (EN) has a 10 kohm pull-up R5 to 3V3 with C6 1uF to ground"
  - id: "esp32-s3-devkitc-1-sch-v1.1#j1-pin-order"
    locator: "Sheet 2, connector J1 CON22X1"
    quote: "GPIO4 GPIO5 GPIO6 GPIO7 GPIO15 GPIO16 GPIO17 GPIO18"
    supports: "J1 pins 4-11 are GPIO4, GPIO5, GPIO6, GPIO7, GPIO15, GPIO16, GPIO17, GPIO18; pins 1-2 ESP_3V3, pin 3 CHIP_PU, pins 12-20 GPIO8, GPIO3, GPIO46, GPIO9-GPIO14, pin 21 VCC_5V, pin 22 GND (read from the drawing)"
  - id: "esp32-s3-devkitc-1-sch-v1.1#j3-pin-order"
    locator: "Sheet 2, connector J3 CON22X1"
    quote: "GPIO42 GPIO41 GPIO40 GPIO39 GPIO38 GPIO37 GPIO36 GPIO35"
    supports: "J3 pins 6-13 are GPIO42, GPIO41, GPIO40, GPIO39, GPIO38, GPIO37, GPIO36, GPIO35; pin 1 GND, pin 2 U0TXD, pin 3 U0RXD, pins 4-5 GPIO1, GPIO2, pins 14-20 GPIO0, GPIO45, GPIO48, GPIO47, GPIO21, GPIO20, GPIO19, pins 21-22 GND (read from the drawing)"
  - id: "esp32-s3-devkitc-1-sch-v1.1#esp-3v3-r24-link"
    locator: "Sheet 2, power block (text layer entry R24 next to ESP_3V3 and VCC_3V3 nets)"
    quote: "R24 0(1%)"
    supports: "0 ohm R24 joins VCC_3V3 (U2 output) to the ESP_3V3 module supply net, so module GPIO levels are 3.3 V (net connection read from the drawing)"
