# Evidence record: ESP32-S3 Series SoC Errata (read 2026-10-22).
accessed: "2026-10-22"
claims:
  - id: "esp32-s3-errata-v1.3#chip-revisions"
    locator: "§1.2, Table 1.1 Chip Revision Identification by eFuse Bits, PDF p.1"
    quote: "Chip Revision v0.0 v0.1 v0.2"
    supports: "ESP32-S3 silicon revisions covered: v0.0, v0.1, v0.2"
  - id: "esp32-s3-errata-v1.3#adc-183"
    locator: "§3.8 [ADC-183], PDF p.10"
    quote: "[ADC-183] The Digital Controller (DMA) of SAR ADC2 Cannot Work"
    supports: "SAR ADC2 digital controller (DMA) does not work on v0.0, v0.1, v0.2; the workaround is the RTC controller. Affects the ADC2 pads GPIO11-GPIO20"
  - id: "esp32-s3-errata-v1.3#usbotg-4289"
    locator: "§3.5 [USBOTG-4289], PDF p.9"
    quote: "[USBOTG-4289] The USB-OTG Download Function Is Unavailable"
    supports: "USB-OTG download unavailable on affected batches (eFuse bit set by default); USB Serial/JTAG download is the workaround. Concerns the USB pads GPIO19/GPIO20"
  - id: "esp32-s3-errata-v1.3#touch-100"
    locator: "§3.7 [TOUCH-100], PDF p.10"
    quote: "[TOUCH-100] The TOUCH_SCAN_DONE_INT Interrupt Raw Data Value Is Undefined"
    supports: "Touch interrupt raw data undefined for the first two interrupts; concerns the touch function, names no pad"
  - id: "esp32-s3-errata-v1.3#errata-list-no-gpio-category"
    locator: "§2, Table 2.1 Errata summary, PDF p.5"
    quote: "Cache CACHE-126 [CACHE-126] Cache Hit Error During Cache Write-Backs"
    supports: "Errata categories are Cache, RTC, Analog Power, LCD, USB-OTG, RMT, Touch Sensor and SAR ADC (eight errata CACHE-126, RTC-126, ANALOG-160, LCD-239, USBOTG-4289, RMT-176, TOUCH-100, ADC-183): there is no GPIO or power-up-glitch erratum"
