# Evidence record: NXP MFRC522 Product data sheet Rev. 3.9 (27 April 2016), read 2026-10-23.
# PDF page numbers equal the printed "n of 95".
accessed: "2026-10-23"
claims:
  - id: "mfrc522-ds-v3.9#host-interfaces-speed"
    locator: "§3 Features and benefits, Supported host interfaces, p.2"
    quote: "SPI up to 10 Mbit/s I2C-bus interface up to 400 kBd in Fast mode, up to 3400 kBd in High-speed mode"
    supports: "SPI max 10 Mbit/s; I2C max 400 kBd in Fast mode (3400 kBd High-speed mode)"
  - id: "mfrc522-ds-v3.9#host-interface-uart"
    locator: "§3 Features and benefits, Supported host interfaces, p.2"
    quote: "RS232 Serial UART up to 1228.8 kBd, with voltage levels dependant on pin voltage supply"
    supports: "UART host interface exists, up to 1228.8 kBd"
  - id: "mfrc522-ds-v3.9#interface-detect"
    locator: "§8.1.1 Automatic microcontroller interface detection, p.9"
    quote: "The MFRC522 identifies the host interface by sensing the logic levels on the control pins after the reset phase."
    supports: "The host interface is selected by pin levels sensed after power-on or hard reset"
  - id: "mfrc522-ds-v3.9#interface-table"
    locator: "§8.1.1, Table 5 Connection protocol for detecting different interface types, p.9 (columns UART, SPI, I2C-bus)"
    quote: "I2C 0 0 1 EA 0 1 EA"
    supports: "Pin I2C = 0 and EA = 0 selects UART; I2C = 0 and EA = 1 selects SPI; I2C = 1 selects I2C-bus (EA then codes the I2C address)"
  - id: "mfrc522-ds-v3.9#spi-pins"
    locator: "§7 Pinning information, Table 3 Pin description, pins 24, 29-31, p.7"
    quote: "SDA I/O I2C-bus serial data line input/output NSS I SPI signal input RX I UART address input"
    supports: "Pin 24 is SDA (I2C) / NSS (SPI chip select, input) / RX (UART); pin 29 SCK, 30 MOSI, 31 MISO in SPI mode"
  - id: "mfrc522-ds-v3.9#spi-mode"
    locator: "§8.1.2 Serial Peripheral Interface, p.10"
    quote: "Data on both MOSI and MISO lines must be stable on the rising edge of the clock and can be changed on the falling edge."
    supports: "SPI data is sampled on the rising SCK edge and changes on the falling edge (MSB first); idle clock level is not stated"
  - id: "mfrc522-ds-v3.9#spi-timing"
    locator: "§14.1 Timing characteristics, Table 154 SPI timing characteristics, p.78-79"
    quote: "tWL pulse width LOW line SCK 50 ns; tWH pulse width HIGH line SCK 50 ns"
    supports: "SCK minimum low and high pulse width 50 ns each; tNHNL NSS high before communication min 50 ns"
  - id: "mfrc522-ds-v3.9#pin-irq"
    locator: "§7 Pinning information, Table 3 Pin description, pin 23, p.7"
    quote: "IRQ O interrupt request output: indicates an interrupt event"
    supports: "Pin 23 IRQ is an interrupt output"
  - id: "mfrc522-ds-v3.9#pin-nrstpd"
    locator: "§7 Pinning information, Table 3 Pin description, pin 6, p.6"
    quote: "NRSTPD I reset and power-down input: power-down: enabled when LOW"
    supports: "Pin 6 NRSTPD: LOW = power-down, a positive edge = reset"
  - id: "mfrc522-ds-v3.9#pin-i2c-ea"
    locator: "§7 Pinning information, Table 3 Pin description, pins 1 and 32, p.6-7"
    quote: "I2C I I2C-bus enable input; EA I external address input for coding I2C-bus address"
    supports: "Pin 1 (I2C) and pin 32 (EA) are the interface-select inputs"
  - id: "mfrc522-ds-v3.9#abs-max-supply"
    locator: "§11 Limiting values, Table 150, p.74"
    quote: "VDDA analog supply voltage −0.5 +4.0 V; VDD(PVDD) PVDD supply voltage −0.5 +4.0 V"
    supports: "Absolute maximum supply voltage -0.5..+4.0 V (VDDA, VDDD, PVDD, TVDD, SVDD all the same)"
  - id: "mfrc522-ds-v3.9#abs-max-input"
    locator: "§11 Limiting values, Table 150, p.74"
    quote: "VI input voltage all input pins except pins MFIN and RX VSS(PVSS) − 0.5 VDD(PVDD) + 0.5 V"
    supports: "Absolute maximum input voltage VSS - 0.5 V to VDD(PVDD) + 0.5 V on all inputs except MFIN and RX"
  - id: "mfrc522-ds-v3.9#op-supply-core"
    locator: "§12 Recommended operating conditions, Table 151 and notes [1][2], p.74"
    quote: "VDDA analog supply voltage 2.5 3.3 3.6 V; VDDA, VDDD and VDD(TVDD) must always be the same voltage."
    supports: "VDDA/VDDD/TVDD operating 2.5-3.6 V (typ 3.3 V) and must be the same voltage; below 3 V reduces operating distance"
  - id: "mfrc522-ds-v3.9#op-supply-pvdd"
    locator: "§12 Recommended operating conditions, Table 151 and note [3], p.74"
    quote: "VDD(PVDD) PVDD supply voltage 1.6 1.8 3.6 V; VDD(PVDD) must always be the same or lower voltage than VDDD."
    supports: "PVDD (pin I/O supply) operating 1.6-3.6 V, never above VDDD"
  - id: "mfrc522-ds-v3.9#logic-levels"
    locator: "§14 Characteristics, Table 153, Input characteristics (pins EA, I2C, NRSTPD, SDA) and input/output pins D1-D7, p.75-76"
    quote: "VIH HIGH-level input voltage 0.7VDD(PVDD); VIL LOW-level input voltage 0.3VDD(PVDD)"
    supports: "Digital pin thresholds VIH min 0.7 x VDD(PVDD), VIL max 0.3 x VDD(PVDD)"
  - id: "mfrc522-ds-v3.9#supply-current-digital-analog"
    locator: "§14 Characteristics, Table 153, Current consumption, p.77"
    quote: "IDDD digital supply current pin DVDD; VDDD = 3 V 6.5 9 mA; IDDA analog supply current pin AVDD 7 10 mA"
    supports: "IDDD typ 6.5 / max 9 mA; IDDA typ 7 / max 10 mA (receiver on)"
  - id: "mfrc522-ds-v3.9#supply-current-tvdd"
    locator: "§14 Characteristics, Table 153, Current consumption and notes [4][5][6], p.77-78"
    quote: "IDD(TVDD) TVDD supply current pin TVDD; continuous wave 60 100 mA"
    supports: "TVDD transmitter supply current typ 60 mA, max 100 mA (continuous wave; typical circuit overall below 100 mA)"
  - id: "mfrc522-ds-v3.9#i2c-fscl"
    locator: "§14.1 Timing characteristics, Table 155 I2C-bus timing in Fast mode, p.79"
    quote: "fSCL SCL clock frequency 0 400 0 3400 kHz"
    supports: "I2C SCL max 400 kHz in Fast mode, 3400 kHz in High-speed mode"
