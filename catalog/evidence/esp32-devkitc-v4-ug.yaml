  - id: "esp32-devkitc-v4-ug#note-flash-pins"
    locator: "Header Block, footnote [2]"
    quote: "The pins D0, D1, D2, D3, CMD and CLK are used internally for communication between ESP32 and SPI flash memory."
    supports: "Header pins D0-D3, CMD, CLK (GPIO6-11) are flash pins; avoid"
  - id: "esp32-devkitc-v4-ug#note-gpio16-17-wroom"
    locator: "Header Block, footnote [3]"
    quote: "The pins GPIO16 and GPIO17 are available for use only on the boards with the modules ESP32-WROOM and ESP32-SOLO-1."
    supports: "J3-11/J3-12 (GPIO17/GPIO16) usable on the WROOM-32E variant"
  - id: "esp32-devkitc-v4-ug#note-gpio16-17-wrover"
    locator: "Header Block, footnote [3]"
    quote: "The boards with ESP32-WROVER modules have the pins reserved for internal use."
    supports: "GPIO16/GPIO17 reserved on the WROVER-E variant"
  - id: "esp32-devkitc-v4-ug#usb-uart-bridge"
    locator: "Functional Description, key component 4 USB-to-UART Bridge"
    quote: "Single USB-to-UART bridge chip, providing transfer rates up to 3 Mbps."
    supports: "Onboard USB-to-UART bridge"
  - id: "esp32-devkitc-v4-ug#boot-button"
    locator: "Functional Description, key component 5 Boot Button"
    quote: "Download button. Holding down Boot and then pressing EN initiates Firmware Download mode for downloading firmware through the serial port."
    supports: "Boot button on GPIO0 (download mode)"
  - id: "esp32-devkitc-v4-ug#en-button"
    locator: "Functional Description, key component 7 EN Button"
    quote: "Reset button."
    supports: "EN button resets the chip (CHIP_PU, not a GPIO pad)"
  - id: "esp32-devkitc-v4-ug#c15-download-mode"
    locator: "Note on C15"
    quote: "The component C15 may cause the following issues on earlier ESP32-DevKitC V4 boards: The board may boot into Download mode"
    supports: "C15 on GPIO0 (earlier boards) can force download mode"
  - id: "esp32-devkitc-v4-ug#c15-gpio0-clock"
    locator: "Note on C15"
    quote: "If you output clock on GPIO0, C15 may impact the signal"
    supports: "C15 loads GPIO0"
  - id: "esp32-devkitc-v4-ug#ordering-32e"
    locator: "Ordering Information table"
