# Evidence record: ESP32 Series SoC Errata (read 2026-10-22).
accessed: "2026-10-22"
claims:
  - id: "esp32-errata-v3.1#chip-revisions"
    locator: "§1.2, Table 1.1 Chip Revision Identification by eFuse Bits, PDF p.4"
    quote: "Chip Revision v0.0 v1.0 v1.1 v3.0 v3.1"
    supports: "ESP32 silicon revisions covered by the errata"
  - id: "esp32-errata-v3.1#gpio-errata-summary"
    locator: "§2, Table 2.1 Errata summary, category GPIO, PDF p.9"
    quote: "GPIO [GPIO-3.6] For Pads With Both GPIO and RTC_GPIO Functionality, the GPIO Pull-up and Pull-down Configuration Register Fields Are Nonfunctional"
    supports: "GPIO category lists exactly GPIO-3.6, GPIO-3.14 and GPIO-3.11; none of the errata describes a power-up glitch (power_up_glitch none)"
  - id: "esp32-errata-v3.1#gpio-3-6"
    locator: "§3.10 [GPIO-3.6], PDF p.17"
    quote: "GPIO pull-up and pull-down resistors for pads with both GPIO and RTC_GPIO functionality can only be controlled via RTC_GPIO registers."
    supports: "Erratum GPIO-3.6 affects the 18 RTC-capable pads; revisions v0.0-v3.1"
  - id: "esp32-errata-v3.1#gpio-3-14"
    locator: "§3.11 [GPIO-3.14], PDF p.18"
    quote: "GPIO0 ~ GPIO31 share a set of interrupt configuration registers and belong to one group, GPIO32 ~ GPIO39 share another set"
    supports: "Erratum GPIO-3.14 (edge interrupts in a group) affects every pad; revisions v0.0-v3.1"
  - id: "esp32-errata-v3.1#gpio-3-11"
    locator: "§3.12 [GPIO-3.11], PDF p.19"
    quote: "When Certain RTC Peripherals Are Powered on, the Inputs of GPIO36 and GPIO39 Will Be Pulled Down for Approximately 80 ns"
    supports: "Erratum GPIO-3.11 affects GPIO36 and GPIO39 (about 80 ns low pulse when SAR ADC1/ADC2/AMP power on)"
  - id: "esp32-errata-v3.1#gpio-3-11-revisions"
    locator: "§3.12 [GPIO-3.11], PDF p.19"
    quote: "Affected revisions: v0.0 v1.0 v1.1 v3.0 v3.1"
    supports: "GPIO-3.11 affects all listed silicon revisions"
  - id: "esp32-errata-v3.1#gpio-3-11-workaround"
    locator: "§3.12 [GPIO-3.11] Workarounds, PDF p.19"
    quote: "When enabling power for any of these peripherals, ignore input from GPIO36 and GPIO39."
    supports: "Workaround for GPIO-3.11"
