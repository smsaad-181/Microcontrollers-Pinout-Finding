# Evidence record: ESP32 Technical Reference Manual (read 2026-10-22).
accessed: "2026-10-22"
claims:
  - id: "esp32-trm-v5.8#io-pins-output-pins"
    locator: "§6.1 Overview, PDF p.115"
    quote: "Note that the I/O GPIO pins are 0-19, 21-23, 25-27, 32-39, while the output GPIOs are 0-19, 21-23, 25-27, 32-33."
    supports: "The 34 ESP32 pads (GPIO0-19, 21-23, 25-27, 32-39) and which can drive outputs; input_only false for 0-19, 21-23, 25-27, 32-33"
  - id: "esp32-trm-v5.8#input-only-34-39"
    locator: "§6.1 Overview, PDF p.115"
    quote: "GPIO pins 34-39 are input-only."
    supports: "input_only true for GPIO34-GPIO39"
  - id: "esp32-trm-v5.8#matrix-any-pin"
    locator: "§6.1 Overview item 2, PDF p.116"
    quote: "For input to the chip: Each of the 162 internal peripheral inputs can select any GPIO pin as the input source."
    supports: "GPIO function on every pad is routed via the GPIO matrix (routing: matrix)"
  - id: "esp32-trm-v5.8#iomux-bypass"
    locator: "§6.4.1 Direct I/O via IO MUX, PDF p.120"
    quote: "Some high speed digital functions (Ethernet, SDIO, SPI, JTAG, UART) can bypass the GPIO Matrix for better high-frequency digital performance."
    supports: "Functions listed in Table 6.10-1 (other than GPIO) are direct IO_MUX functions (routing: iomux)"
  - id: "esp32-trm-v5.8#rtc-mux"
    locator: "§6.5.1 RTC IO MUX, PDF p.120"
    quote: "The IO MUX and GPIO Matrix are not used for these functions; rather, the RTC_MUX is used"
    supports: "Analog/RTC functions from Table 6.11-1 (ADC, DAC, touch, RTC_GPIO, 32 kHz crystal) are fixed to their pads (routing: fixed)"
  - id: "esp32-trm-v5.8#reset-column"
    locator: "§6.10, text under Table 6.10-1, PDF p.133"
    quote: "\"Reset\" column shows each pin's default configurations after reset:"
    supports: "Meaning of the Reset column used for reset_state"
  - id: "esp32-trm-v5.8#reset-legend-0-1"
    locator: "§6.10, Reset Configurations legend, PDF p.133"
    quote: "0 - IE=0 (input disabled). 1 - IE=1 (input enabled)."
    supports: "Reset code 0 -> reset_state disabled; code 1 -> reset_state input"
  - id: "esp32-trm-v5.8#reset-legend-2-3"
    locator: "§6.10, Reset Configurations legend, PDF p.133"
    quote: "2 - IE=1, WPD=1 (input enabled, pull-down resistor). 3 - IE=1, WPU=1 (input enabled, pull-up resistor)."
    supports: "Reset code 2 -> reset_state pulldown; code 3 -> reset_state pullup"
  - id: "esp32-trm-v5.8#note-input-only"
    locator: "§6.10, Notes under Table 6.10-1, PDF p.134"
    quote: "I - Pin can only be configured as input GPIO. These input-only pins do not feature an output driver or internal pull-up/pull-down circuitry."
    supports: "Pads marked I (GPIO34-39) are input-only without internal pulls"
