  - id: "esp32-trm-v5.8#gpio-strap-reg"
    locator: "§6.13 Registers, Register 6.13 GPIO_STRAP_REG (0x0038), PDF p.141"
    quote: "GPIO_STRAPPING GPIO strapping results: Bit5-bit0 of boot_sel_chip[5:0] correspond to MTDI, GPIO0, GPIO2, GPIO4, MTDO, GPIO5, respectively."
    supports: "TRM lists six strapping inputs including GPIO4 (boot_sel_chip[2]); conflicts with the datasheet's five strapping pins"
  - id: "esp32-trm-v5.8#vdd-sdio-mtdi"
    locator: "§6.8.1 VDD_SDIO Power Domain, PDF p.123"
    quote: "The VDD_SDIO voltage can be configured to be either 1.8V or the same as VDD3P3_RTC, depending on the state of the MTDI pin at reset"
    supports: "GPIO12/MTDI strap selects the VDD_SDIO voltage at reset"
  - id: "esp32-trm-v5.8#adc2-wifi"
    locator: "§31.3.1 Introduction, Note, PDF p.741"
    quote: "If Wi-Fi module is using the SAR ADC2, users can not measure the analog signal from the pins using SAR ADC2."
    supports: "ADC2 channels conflict with Wi-Fi (radio_conflict true for ADC2 pads); only ADC2 is named"
