# Evidence record: LilyGO TTGO T-Display schematic PDF, read 2026-10-24 via pdftotext and re-read visually (rendered) by the blind auditor, who confirmed connectivity; claims added at boards-1 resolution quote text-layer labels only. The header pin order matches the pinmap (audit).
accessed: "2026-10-24"
claims:
  - id: "lilygo-ttgo-t-display-sch#flash"
    locator: "page 1, flash symbol"
    quote: "W25Q32 CS DO WP GND VCC HOLD CLK DI/1O0"
    supports: "External 32 Mbit SPI flash W25Q32 on the module-less ESP32"
  - id: "lilygo-ttgo-t-display-sch#flash-nets"
    locator: "page 1, flash nets"
    quote: "SCS/CMD SDO/SD0 SWP/SD3 GND VDD_SDIO"
    supports: "Flash lines SCS/CMD, SDO/SD0, SWP/SD3, SHD/SD2, SCK/CLK, SDI/SD1 (GPIO6-11) go to the W25Q32"
  - id: "lilygo-ttgo-t-display-sch#lcd-nets"
    locator: "page 1, ST7789 connector nets"
    quote: "IO19 IO18 IO16 IO23 IO5 VDD3V3"
    supports: "Display connector nets IO19, IO18, IO16, IO23, IO5 (corroborates README)"
  - id: "lilygo-ttgo-t-display-sch#vdd3v3"
    locator: "page 1"
    quote: "VDD3V3"
    supports: "Logic supply net VDD3V3"
  - id: "lilygo-ttgo-t-display-sch#pwr-en"
    locator: "page 1, ESP32 GPIO net list"
    quote: "IO26 IO27 PWR_EN IO12 IO13 IO15 IO2 IO0 IO4"
    supports: "PWR_EN is on the GPIO14 pin (auditor: chip pin 17, MTMS/IO14); via Q3 it switches P-FETs Q4 (battery path) and Q6 (VDD3V3 to V3V); read from the rendered page"
  - id: "lilygo-ttgo-t-display-sch#q3-pmbt3904"
    locator: "page 1, power block"
    quote: "PMBT3904"
    supports: "Q3 (and auto-program Q1/Q2) are PMBT3904 transistors"
  - id: "lilygo-ttgo-t-display-sch#bat-divider"
    locator: "page 1, battery block"
    quote: "10nF C22 100K%1 R7 100K%1 R6"
    supports: "BAT_ADC divider R6/R7 100K/100K sits on BAT (not switched), reading BAT/2 on GPIO34"
  - id: "lilygo-ttgo-t-display-sch#cap-270pf"
    locator: "page 1, ESP32 sensor pins"
    quote: "NC C21 C49 270pF C32 270pF"
    supports: "C49 270 pF between IO36 and IO37, C32 270 pF between IO38 and IO39 (pins 5-8, SENSOR_CAPP/CAPN)"
  - id: "lilygo-ttgo-t-display-sch#ldo-ap2112k"
    locator: "page 1, regulator U7"
    quote: "AP2112K-3.3V(RT9013)"
    supports: "3V3 regulator U7 is AP2112K-3.3 (RT9013 alternate)"
  - id: "lilygo-ttgo-t-display-sch#uart0-nets"
    locator: "page 1, ESP32 UART pins"
    quote: "U0TXD/IO01 U0R XD/IO03"
    supports: "UART0 nets GPIO1/GPIO3; the auditor read them going to U4 CP2104 (part name is not in the text layer) with Q1/Q2 auto-program to CHIP_PU/IO0"
  - id: "lilygo-ttgo-t-display-sch#key1-r1"
    locator: "page 1, buttons"
    quote: "KEY1 R1 100K"
    supports: "KEY1 (GPIO35) has R1 100K pull-up to VDD3V3 (auditor read the rendered page); C3/C11 100 nF on the button lines"
