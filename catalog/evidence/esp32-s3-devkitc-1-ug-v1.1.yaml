# Evidence record: ESP32-S3-DevKitC-1 v1.1 User Guide (read 2026-10-22).
accessed: "2026-10-22"
claims:
  - id: "esp32-s3-devkitc-1-ug-v1.1#title-v1-1"
    locator: "User Guide title"
    quote: "ESP32-S3-DevKitC-1 v1.1"
    supports: "The guide documents board revision v1.1 (the latest; the older version is v1.0)"
  - id: "esp32-s3-devkitc-1-ug-v1.1#revision-note"
    locator: "Hardware Revision Details, Note"
    quote: "the initial version uses GPIO48, whereas v1.1 uses GPIO38."
    supports: "v1.0 (initial) drives the RGB LED from GPIO48, v1.1 from GPIO38; both revisions are on the market"
  - id: "esp32-s3-devkitc-1-ug-v1.1#rgb-led"
    locator: "Getting Started, Description of Components table, RGB LED"
    quote: "Addressable RGB LED, driven by GPIO38."
    supports: "v1.1 on-board addressable RGB LED is on GPIO38"
  - id: "esp32-s3-devkitc-1-ug-v1.1#ldo"
    locator: "Getting Started, Description of Components table, 5 V to 3.3 V LDO"
    quote: "Power regulator that converts a 5 V supply into a 3.3 V output."
    supports: "3V3 rail comes from a 5 V to 3.3 V LDO; no current rating is stated in the guide"
  - id: "esp32-s3-devkitc-1-ug-v1.1#usb-uart-port"
    locator: "Getting Started, Description of Components table, USB-to-UART Port"
    quote: "A Micro-USB port used for power supply to the board, for flashing applications to the chip"
    supports: "USB-to-UART micro-USB port with on-board bridge: power, flashing, communication"
  - id: "esp32-s3-devkitc-1-ug-v1.1#usb-port"
    locator: "Getting Started, Description of Components table, USB Port"
    quote: "ESP32-S3 full-speed USB OTG interface, compliant with the USB 1.1 specification."
    supports: "Second micro-USB port is the ESP32-S3 native full-speed USB OTG interface (power, flashing, USB 1.1 communication, JTAG debugging)"
  - id: "esp32-s3-devkitc-1-ug-v1.1#usb-bridge"
    locator: "Getting Started, Description of Components table, USB-to-UART Bridge"
    quote: "Single USB-to-UART bridge chip provides transfer rates up to 3 Mbps."
    supports: "Single USB-to-UART bridge chip, up to 3 Mbps"
  - id: "esp32-s3-devkitc-1-ug-v1.1#boot-button"
    locator: "Getting Started, Description of Components table, Boot Button"
    quote: "Download button. Holding down Boot and then pressing Reset initiates Firmware Download mode for downloading firmware through the serial port."
    supports: "Boot button: hold Boot then press Reset to enter download mode"
  - id: "esp32-s3-devkitc-1-ug-v1.1#reset-button"
    locator: "Getting Started, Description of Components table, Reset Button"
    quote: "Press this button to restart the system."
    supports: "Reset button restarts the system"
  - id: "esp32-s3-devkitc-1-ug-v1.1#power-led"
    locator: "Getting Started, Description of Components table, 3.3 V Power On LED"
    quote: "Turns on when the USB power is connected to the board."
    supports: "3.3 V power-on LED lights when USB power is connected"
  - id: "esp32-s3-devkitc-1-ug-v1.1#octal-note"
    locator: "Getting Started, Note below the component table"
    quote: "the pins GPIO35, GPIO36 and GPIO37 are used for the internal communication between ESP32-S3 and SPI flash/PSRAM memory, thus not available for external use."
    supports: "On boards with Octal SPI flash/PSRAM modules (N8R8) GPIO35, GPIO36, GPIO37 are not available for external use"
  - id: "esp32-s3-devkitc-1-ug-v1.1#headers-all-gpio"
    locator: "Getting Started, Description of Components table, Pin Headers"
    quote: "All available GPIO pins (except for the SPI bus for flash) are broken out to the pin headers"
    supports: "All available GPIOs except the flash SPI bus are on the headers J1/J3"
  - id: "esp32-s3-devkitc-1-ug-v1.1#ordering-n8r8"
    locator: "Contents and Packaging, Ordering Information table"
    quote: "ESP32-S3-DevKitC-1-N8R8 ESP32-S3-WROOM-1-N8R8 8 MB 8 MB PCB on-board antenna"
    supports: "DevKitC-1-N8R8 carries ESP32-S3-WROOM-1-N8R8: 8 MB flash, 8 MB PSRAM"
  - id: "esp32-s3-devkitc-1-ug-v1.1#ordering-n8"
    locator: "Contents and Packaging, Ordering Information table"
    quote: "ESP32-S3-DevKitC-1-N8 (EOL) ESP32-S3-WROOM-1-N8 8 MB — PCB on-board antenna"
    supports: "DevKitC-1-N8 (EOL) carries ESP32-S3-WROOM-1-N8: 8 MB flash, no PSRAM"
  - id: "esp32-s3-devkitc-1-ug-v1.1#power-options"
    locator: "Hardware Reference, Power Supply Options"
    quote: "There are three mutually exclusive ways to provide power to the board:"
    supports: "Power options: USB-to-UART port and/or ESP32-S3 USB port (default), 5V and G pins, 3V3 and G pins - mutually exclusive"
  - id: "esp32-s3-devkitc-1-ug-v1.1#numbering-same-as-schematic"
    locator: "Hardware Reference, Header Block"
    quote: "The numbering is the same as in the Board Schematic (PDF)."
    supports: "Header pin numbers in the J1/J3 tables are the schematic numbering"
  - id: "esp32-s3-devkitc-1-ug-v1.1#j1-power-rst"
    locator: "Hardware Reference, Header Block, table J1"
    quote: "1 3V3 P 3.3 V power supply 2 3V3 P 3.3 V power supply 3 RST I EN"
    supports: "J1 pins 1 and 2 are 3V3 power, J1 pin 3 is RST (EN)"
  - id: "esp32-s3-devkitc-1-ug-v1.1#j1-rows-4-7"
    locator: "Hardware Reference, Header Block, table J1"
    quote: "4 4 I/O/T RTC_GPIO4, GPIO4, TOUCH4, ADC1_CH3 5 5 I/O/T RTC_GPIO5, GPIO5, TOUCH5, ADC1_CH4"
    supports: "J1 pins 4 and 5 are labelled 4 and 5 (GPIO4, GPIO5); the table lists J1 pins 4-20 as GPIOs 4,5,6,7,15,16,17,18,8,3,46,9,10,11,12,13,14 with the label equal to the GPIO number"
  - id: "esp32-s3-devkitc-1-ug-v1.1#j1-gpio46"
    locator: "Hardware Reference, Header Block, table J1"
    quote: "14 46 I/O/T GPIO46"
    supports: "J1 pin 14 is labelled 46 (GPIO46, strapping pin)"
  - id: "esp32-s3-devkitc-1-ug-v1.1#j1-5v-gnd"
    locator: "Hardware Reference, Header Block, table J1"
    quote: "21 5V P 5 V power supply 22 G G Ground"
    supports: "J1 pin 21 is 5V (5 V power supply), J1 pin 22 is G (ground)"
  - id: "esp32-s3-devkitc-1-ug-v1.1#j3-gnd-tx-rx"
    locator: "Hardware Reference, Header Block, table J3"
    quote: "1 G G Ground 2 TX I/O/T U0TXD, GPIO43, CLK_OUT1 3 RX I/O/T U0RXD, GPIO44, CLK_OUT2"
    supports: "J3 pin 1 ground, J3 pin 2 labelled TX is GPIO43 (U0TXD), J3 pin 3 labelled RX is GPIO44 (U0RXD)"
  - id: "esp32-s3-devkitc-1-ug-v1.1#j3-rows-4-9"
    locator: "Hardware Reference, Header Block, table J3"
    quote: "6 42 I/O/T MTMS, GPIO42 7 41 I/O/T MTDI, GPIO41, CLK_OUT1 8 40 I/O/T MTDO, GPIO40, CLK_OUT2 9 39 I/O/T MTCK, GPIO39, CLK_OUT3, SUBSPICS1"
    supports: "J3 pins 6-9 are GPIO42, GPIO41, GPIO40, GPIO39 (JTAG pads)"
  - id: "esp32-s3-devkitc-1-ug-v1.1#j3-gpio38-rgb"
    locator: "Hardware Reference, Header Block, table J3"
    quote: "10 38 I/O/T GPIO38, FSPIWP, SUBSPIWP, RGB LED"
    supports: "J3 pin 10 is GPIO38 and is the RGB LED pad in v1.1"
  - id: "esp32-s3-devkitc-1-ug-v1.1#j3-gpio35-37"
    locator: "Hardware Reference, Header Block, table J3"
    quote: "12 36 I/O/T SPIIO7, GPIO36, FSPICLK, SUBSPICLK 13 35 I/O/T SPIIO6, GPIO35, FSPID, SUBSPID"
    supports: "J3 pins 12 and 13 are GPIO36 and GPIO35 (listed on the headers even though unusable on Octal PSRAM boards)"
  - id: "esp32-s3-devkitc-1-ug-v1.1#j3-gpio37"
    locator: "Hardware Reference, Header Block, table J3"
    quote: "11 37 I/O/T SPIDQS, GPIO37, FSPIQ, SUBSPIQ"
    supports: "J3 pin 11 is GPIO37"
  - id: "esp32-s3-devkitc-1-ug-v1.1#j3-gpio0-45-48-47"
    locator: "Hardware Reference, Header Block, table J3"
    quote: "14 0 I/O/T RTC_GPIO0, GPIO0 15 45 I/O/T GPIO45 16 48 I/O/T GPIO48, SPICLK_N, SUBSPICLK_N_DIFF 17 47 I/O/T GPIO47, SPICLK_P, SUBSPICLK_P_DIFF"
    supports: "J3 pins 14-17 are GPIO0, GPIO45, GPIO48, GPIO47"
  - id: "esp32-s3-devkitc-1-ug-v1.1#j3-usb-pins"
    locator: "Hardware Reference, Header Block, table J3"
    quote: "18 21 I/O/T RTC_GPIO21, GPIO21 19 20 I/O/T RTC_GPIO20, GPIO20, U1CTS, ADC2_CH9, CLK_OUT1, USB_D+ 20 19 I/O/T RTC_GPIO19, GPIO19, U1RTS, ADC2_CH8, CLK_OUT2, USB_D-"
    supports: "J3 pins 18-20 are GPIO21, GPIO20 (USB_D+), GPIO19 (USB_D-)"
  - id: "esp32-s3-devkitc-1-ug-v1.1#j3-gnd-21-22"
    locator: "Hardware Reference, Header Block, table J3"
    quote: "21 G G Ground 22 G G Ground"
    supports: "J3 pins 21 and 22 are ground"
