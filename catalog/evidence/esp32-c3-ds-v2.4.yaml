claims:
  - {"id": "esp32-c3-ds-v2.4#strap-pins-list", "locator": "§3 Boot Configurations, Chip boot mode", "quote": "Strapping pins: GPIO2, GPIO8, and GPIO9", "supports": "Strapping pins of ESP32-C3 are GPIO2, GPIO8 and GPIO9 (only these)"}
  - {"id": "esp32-c3-ds-v2.4#strap-default-gpio2", "locator": "§3, Table 3-1", "quote": "GPIO2 Floating", "supports": "GPIO2 strapping pin default configuration: floating (no internal pull)"}
  - {"id": "esp32-c3-ds-v2.4#strap-default-gpio8", "locator": "§3, Table 3-1", "quote": "GPIO8 Floating", "supports": "GPIO8 strapping pin default configuration: floating"}
