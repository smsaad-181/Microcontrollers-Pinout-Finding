  - {"id": "esp32-c3-ds-v2.4#boot-gpio2-note", "locator": "§3.1, Table 3-3 footnote 2", "quote": "it is recommended to pull this pin up due to glitches.", "supports": "GPIO2 does not select the boot mode; pulling it up is recommended because of glitches"}
