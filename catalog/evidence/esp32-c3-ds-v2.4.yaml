  - {"id": "esp32-c3-ds-v2.4#boot-spi", "locator": "§3.1, Table 3-3 Chip Boot Mode Control", "quote": "SPI boot mode 1 Any value 1", "supports": "SPI boot (normal run): GPIO2=1, GPIO8 any, GPIO9=1"}
