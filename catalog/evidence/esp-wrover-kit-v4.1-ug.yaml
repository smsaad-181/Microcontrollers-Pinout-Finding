    supports: "Camera PCLK/XCLK/D7/D6 on GPIO22/21/35/34"
  - id: "esp-wrover-kit-v4.1-ug#cam-3"
    locator: "Camera/JP4 table"
    quote: "11 GPIO39 D5/Pixel Data Bit 5 12 GPIO36 D4/Pixel Data Bit 4 13 GPIO19 D3/Pixel Data Bit 3 14 GPIO18 D2/Pixel Data Bit 2"
    supports: "Camera D5/D4/D3/D2 on GPIO39/36/19/18"
  - id: "esp-wrover-kit-v4.1-ug#cam-4"
    locator: "Camera/JP4 table"
    quote: "15 GPIO5 D1/Pixel Data Bit 1 16 GPIO4 D0/Pixel Data Bit 0 17 GPIO0 RESET/Camera Reset"
    supports: "Camera D1/D0/RESET on GPIO5/GPIO4/GPIO0"
  - id: "esp-wrover-kit-v4.1-ug#cam-unused-note"
    locator: "Allocation of ESP32 Pins"
    quote: "If that hardware is not used, e.g., nothing is plugged into the Camera (JP4) header, then these GPIOs can be used for other purposes."
    supports: "Camera/LCD/SD pads are free when that hardware is unused"
  - id: "esp-wrover-kit-v4.1-ug#jtag-pins"
    locator: "JTAG/JP2 table"
    quote: "2 MTMS/GPIO14 TMS 3 MTDO/GPIO15 TDO 4 MTDI/GPIO12 TDI 5 MTCK/GPIO13 TCK"
    supports: "JTAG on GPIO14/15/12/13"
  - id: "esp-wrover-kit-v4.1-ug#jtag-default"
    locator: "Functional Description, JTAG"
    quote: "By default, these pairs of pins are disconnected."
    supports: "JTAG jumpers (JP2) are open by default"
  - id: "esp-wrover-kit-v4.1-ug#boot-button"
    locator: "Functional Description, BOOT Button"
    quote: "Download button. Holding down Boot and then pressing EN initiates Firmware Download mode for downloading firmware through the serial port."
    supports: "BOOT button SW2 (GPIO0 per JP1 row 13 \"Boot\")"
  - id: "esp-wrover-kit-v4.1-ug#ldo"
    locator: "Functional Description, LDO"
    quote: "NCP1117(1A). 5V-to-3.3V LDO. NCP1117 can provide a maximum current of 1A."
    supports: "3V3 rail: NCP1117 LDO, 3.3 V, 1 A"
  - id: "esp-wrover-kit-v4.1-ug#5v-input"
    locator: "Functional Description, 5V Input"
    quote: "5V power supply interface for a standard coaxial power connector, 5.5 x 2.1 mm, center positive."
    supports: "5V rail from DC jack; no current rating stated"
  - id: "esp-wrover-kit-v4.1-ug#usb-port"
    locator: "Functional Description, USB Port"
    quote: "Power supply for the board as well as the communication interface between a computer and the board."
    supports: "USB powers the board"
  - id: "esp-wrover-kit-v4.1-ug#spi-3v3"
    locator: "Functional Description, SPI"
    quote: "Please note that the voltage of this interface is 3.3 V."
    supports: "Header logic is 3.3 V"
  - id: "esp-wrover-kit-v4.1-ug#diag-leds"
    locator: "Functional Description, Diagnostic LEDs"
    quote: "Four red LEDs connected to the GPIO pins of FT2232HL. Intended for future use."
    supports: "Diagnostic LEDs do not use ESP32 pads"
  - id: "esp-wrover-kit-v4.1-ug#uart-jp2"
    locator: "Functional Description, UART"
    quote: "The serial TX/RX signals of FT2232HL and ESP32 are broken out to the inward and outward sides of JP2 respectively."
    supports: "UART bridge reaches the ESP32 UART0 TX/RX via JP2 jumpers (pad numbers from the module datasheet)"
