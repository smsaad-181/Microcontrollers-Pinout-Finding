claims:
  - id: "esp-wrover-kit-v4.1-ug#overview"
    locator: "Overview"
    quote: "ESP-WROVER-KIT is an ESP32-based development board produced by Espressif."
    supports: "Board identity (v4.1)"
  - id: "esp-wrover-kit-v4.1-ug#components"
    locator: "Overview"
    quote: "ESP-WROVER-KIT features the following integrated components: ESP32-WROVER-E module LCD screen microSD card slot"
    supports: "Module is ESP32-WROVER-E; LCD and microSD slot onboard"
  - id: "esp-wrover-kit-v4.1-ug#psram-gpio16-17"
    locator: "Overview, Note"
    quote: "By default, the two GPIOs are not broken out to the board’s pin headers in order to ensure reliable performance."
    supports: "GPIO16/GPIO17 (PSRAM CS/clock) are not on the headers"
