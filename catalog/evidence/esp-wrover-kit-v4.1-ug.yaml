    locator: "Allocation of ESP32 Pins, Main I/O Connector/JP1"
    quote: "The JP1 connector consists of 14x2 male pins whose functions are shown in the middle two “I/O” columns of the table below."
    supports: "JP1 is 14x2; row order of the table gives the positions used here"
