    quote: "3 GPIO27 SIO_C/SCCB Clock 4 GPIO26 SIO_D/SCCB Data 5 GPIO25 VSYNC/Vertical Sync 6 GPIO23 HREF/Horizontal Reference"
    supports: "Camera SCCB/VSYNC/HREF on GPIO27/26/25/23"
