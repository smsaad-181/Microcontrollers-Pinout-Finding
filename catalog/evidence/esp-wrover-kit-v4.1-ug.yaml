  - id: "esp-wrover-kit-v4.1-ug#osc-note"
    locator: "Main I/O Connector/JP1, 32.768 kHz Oscillator note"
    quote: "Since GPIO32 and GPIO33 are connected to the oscillator by default, they are not connected to the JP1 I/O connector to maintain signal integrity."
    supports: "GPIO32/GPIO33 pins on JP1 are not connected by default (kind nc)"
  - id: "esp-wrover-kit-v4.1-ug#osc-pins"
    locator: "32.768 kHz Oscillator table"
    quote: "1 GPIO32 2 GPIO33"
    supports: "GPIO32/GPIO33 go to the 32.768 kHz crystal"
  - id: "esp-wrover-kit-v4.1-ug#rgb-led"
    locator: "RGB LED table"
    quote: "1 GPIO0 Red 2 GPIO2 Green 3 GPIO4 Blue"
    supports: "RGB LED on GPIO0 (R), GPIO2 (G), GPIO4 (B)"
  - id: "esp-wrover-kit-v4.1-ug#sd-1"
    locator: "microSD Card table"
    quote: "1 MTDI/GPIO12 DATA2 2 MTCK/GPIO13 CD/DATA3 3 MTDO/GPIO15 CMD 4 MTMS/GPIO14 CLK"
    supports: "microSD DATA2/CD-DATA3/CMD/CLK on GPIO12/13/15/14"
  - id: "esp-wrover-kit-v4.1-ug#sd-2"
    locator: "microSD Card table"
    quote: "5 GPIO2 DATA0 6 GPIO4 DATA1 7 GPIO21 Card Detect"
    supports: "microSD DATA0/DATA1/Card Detect on GPIO2/GPIO4/GPIO21"
  - id: "esp-wrover-kit-v4.1-ug#sd-cd-r167"
    locator: "Allocation of ESP32 Pins"
    quote: "If the card detect functionality is not essential, then it may be disabled by removing R167"
    supports: "GPIO21 shared LCD D/C and SD card detect; R167 isolates it"
  - id: "esp-wrover-kit-v4.1-ug#lcd"
    locator: "LCD/U5 table"
    quote: "1 GPIO18 RESET 2 GPIO19 SCL 3 GPIO21 D/C 4 GPIO22 CS 5 GPIO23 SDA 6 GPIO25 SDO 7 GPIO5 Backlight"
    supports: "LCD pads: RESET GPIO18, SCL GPIO19, D/C GPIO21, CS GPIO22, SDA GPIO23, SDO GPIO25, Backlight GPIO5"
