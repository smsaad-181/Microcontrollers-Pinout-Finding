# Evidence record: Solomon Systech SSD1306 datasheet Rev 1.1 (Apr 2008), read 2026-10-23.
# The file was fetched from an Adafruit CDN (third-party host); the document itself is the Solomon Systech
# datasheet (cover: "SOLOMON SYSTECH ... SSD1306 Rev 1.1 P 1/59 Apr 2008 ... Advance Information").
# The official solomon-systech.com product page is a script-driven page that exposes no PDF link to automated
# fetch, so a newer official revision was not located. PDF page numbers below equal the printed "P n/59".
accessed: "2026-10-23"
claims:
  - id: "ssd1306-ds-v1.1#bus-select-table"
    locator: "§7 Pin description, Table 7-1 MCU Bus Interface Pin Selection, p.14 (columns I2C, 6800, 8080, 4-wire serial, 3-wire serial)"
    quote: "BS0 0 0 0 0 1 BS1 1 0 1 0 0 BS2 0 1 1 0 0"
    supports: "BS[2:0] hardware straps select the interface: I2C = BS0 0/BS1 1/BS2 0; 4-wire SPI = 0/0/0; 3-wire SPI = 1/0/0; 6800 = 0/0/1; 8080 = 0/1/1 (0 = VSS, 1 = VDD)"
  - id: "ssd1306-ds-v1.1#i2c-address"
    locator: "§8.1.5 MCU I2C Interface a) Slave address bit (SA0), p.19"
    quote: "Either “0111100” or “0111101”, can be selected as the slave address of SSD1306."
    supports: "7-bit I2C addresses 0x3C (SA0 low) and 0x3D (SA0 high)"
  - id: "ssd1306-ds-v1.1#i2c-sa0-pin"
    locator: "§7 Pin description, D/C# row, p.14; §8.1.5, p.19"
    quote: "In I2C mode, this pin acts as SA0 for slave address selection."
    supports: "The D/C# pin is the SA0 address strap in I2C mode"
  - id: "ssd1306-ds-v1.1#i2c-sa0-level"
    locator: "§8.1.5.2 Write mode for I2C, step 2, p.20"
    quote: "the slave address is either “b0111100” or “b0111101” by changing the SA0 to LOW or HIGH"
    supports: "SA0 LOW selects 0x3C, SA0 HIGH selects 0x3D"
  - id: "ssd1306-ds-v1.1#i2c-pins"
    locator: "§7 Pin description, D[7:0] row, p.14"
    quote: "When I2C mode is selected, D2, D1 should be tied together and serve as SDAout, SDAin in application"
    supports: "In I2C mode D2 and D1 are tied together as SDA and D0 is SCL"
  - id: "ssd1306-ds-v1.1#i2c-pullups"
    locator: "§8.1.5 MCU I2C Interface, p.19; Figure 8-10 notes, p.21"
    quote: "Both the data line (SDA) and the clock line (SCL) should be pulled up by external resistors."
    supports: "The IC has no internal I2C pull-ups; external pull-ups are required"
  - id: "ssd1306-ds-v1.1#i2c-timing"
    locator: "§13 AC Characteristics, Table 13-6 I2C Interface Timing Characteristics, p.54"
    quote: "tcycle Clock Cycle Time 2.5 - - us"
    supports: "Minimum I2C clock cycle 2.5 us (the datasheet states no kHz rating; 400 kHz is 1/2.5 us); tR and tF max 300 ns"
  - id: "ssd1306-ds-v1.1#spi-4wire-timing"
    locator: "§13 AC Characteristics, Table 13-4 4-wire Serial Interface Timing Characteristics, p.52"
    quote: "tcycle Clock Cycle Time 100 - - ns"
    supports: "4-wire SPI minimum clock cycle 100 ns (VDD 1.65-3.3 V, TA 25 C)"
  - id: "ssd1306-ds-v1.1#spi-3wire-timing"
    locator: "§13 AC Characteristics, Table 13-5 3-wire Serial Interface Timing Characteristics, p.53"
    quote: "tcycle Clock Cycle Time 100 - - ns"
    supports: "3-wire SPI minimum clock cycle 100 ns (VDD 1.65-3.3 V, TA 25 C)"
  - id: "ssd1306-ds-v1.1#abs-max"
    locator: "§11 Maximum Ratings, Table 11-1 (voltage referenced to VSS), p.47"
    quote: "VDD -0.3 to +4 V; VCC Supply Voltage 0 to 16 V; Vin Input voltage VSS-0.3 to VDD+0.3 V"
    supports: "Absolute maximum: VDD -0.3..+4 V, VCC 0..16 V, input voltage VSS-0.3..VDD+0.3 V"
  - id: "ssd1306-ds-v1.1#dc-supply"
    locator: "§12 DC Characteristics, Table 12-1, p.48"
    quote: "VCC Operating Voltage 7 15 V; VDD Logic Supply Voltage 1.65 3.3 V"
    supports: "Operating VCC (panel) 7..15 V; VDD logic supply 1.65..3.3 V (VDD is the only logic supply pin)"
  - id: "ssd1306-ds-v1.1#dc-logic-levels"
    locator: "§12 DC Characteristics, Table 12-1, p.48"
    quote: "VIH High Logic Input Level 0.8 x VDD; VIL Low Logic Input Level 0.2 x VDD"
    supports: "VIH min 0.8 x VDD, VIL max 0.2 x VDD"
  - id: "ssd1306-ds-v1.1#dc-supply-current"
    locator: "§12 DC Characteristics, Table 12-1, p.48 (VDD = 2.8 V, VCC = 12 V, IREF = 12.5 uA, no loading, display ON, all ON)"
    quote: "ICC VCC Supply Current ... 430 780 uA; IDD VDD Supply Current ... 50 150 uA"
    supports: "Controller supply current without panel load: ICC typ 430 / max 780 uA; IDD typ 50 / max 150 uA (a panel adds load current)"
