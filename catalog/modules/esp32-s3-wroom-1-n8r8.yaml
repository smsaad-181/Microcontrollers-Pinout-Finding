# ESP32-S3-WROOM-1-N8R8 module (8 MB Quad SPI flash + 8 MB Octal SPI in-package PSRAM, chip ESP32-S3R8) - facts reconciled with the blind audit (task 2a.4: verified, two keys).
# Source: ESP32-S3-WROOM-1 & ESP32-S3-WROOM-1U Datasheet v1.8 (+ ESP32-S3 Series Datasheet v2.2 Tables 1-1 and 2-14, DevKitC-1 v1.1 user guide).
# bonded_pads = the same 36 GPIOs as the N8 (module Table 3-1): IO0-IO21, IO35-IO42, TXD0 (GPIO43), RXD0 (GPIO44), IO45-IO48; GPIO35/36/37 stay in the list because they have module pins (28-30),
#   but they are consumed by the Octal PSRAM and listed in `consumed` (module Table 3-1 footnote b: 'not available for other uses').
# GPIO33 and GPIO34 (octal data lines DQ4/DQ5 in chip Table 2-14) and GPIO26 (SPICS1, PSRAM CE#) have NO module pin: the module datasheet does not mention them and they are not listed here.
# consumed: GPIO27-GPIO32 are wired inside the module to the QSPI flash (block diagram Figure 2-1, schematic Figure 8-1); the PSRAM shares that bus (block diagram 'PSRAM (opt.)').
# flash_voltage is a verified inference (both keys, same value): the datasheet states VDD_SPI = 1.8 V only for the N16R16VA modules, it never prints '3.3 V' for the N8R8 (see the note).
