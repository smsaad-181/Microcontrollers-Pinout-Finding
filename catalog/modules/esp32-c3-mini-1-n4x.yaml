# ESP32-C3-MINI-1-N4X module (ESP32-C3FH4X chip rev v1.1, 4 MB Quad SPI flash in the chip package, no PSRAM; also covers MINI-1U and the H4X/N4 flash variants) - one key, single-source.
# Source: ESP32-C3-MINI-1 & ESP32-C3-MINI-1U Datasheet v2.2 (Table 3-1) + ESP32-C3 Series Datasheet v2.4 (Tables 1-1, 2-12). Read 2026-10-24.
# bonded_pads = the 15 GPIOs on module pins (Table 3-1): IO0-IO10, IO18, IO19, RXD0 (GPIO20), TXD0 (GPIO21). GPIO11-GPIO17 have no module pin (NC pins).
# consumed: GPIO12-GPIO17 are wired to the in-package flash inside the chip; GPIO11 (VDD_SPI) powers it.
