    note: "Interim: the Ai-Thinker datasheet names the pins SD2/SD3/CMD/CLK/SD0/SD1 but does not say they serve the flash; it refers the reader to the ESP-WROOM-32 datasheet (v3.8, which states GPIO6-GPIO11 are connected to the module flash). Assumes the same chip-to-flash wiring as ESP-WROOM-32."
