# ESP32-C3FH4 chip package as a "module" (4 MB Quad SPI flash in the package, chip revision v0.4; used bare on the Waveshare ESP32-C3-Zero). Two keys agree (researcher + blind auditor).
# Source: ESP32-C3 Series Datasheet v2.4 Table 1-1 and Table 2-12; Waveshare ESP32-C3-Zero wiki.
# bonded_pads = GPIO0-GPIO10 and GPIO18-GPIO21 (pads not wired to the flash and not VDD_SPI). GPIO12-GPIO17 are the flash pads, GPIO11 is VDD_SPI.
bonded_pads:
  - "GPIO0"
  - "GPIO1"
  - "GPIO2"
  - "GPIO3"
  - "GPIO4"
  - "GPIO5"
  - "GPIO6"
  - "GPIO7"
  - "GPIO8"
  - "GPIO9"
  - "GPIO10"
  - "GPIO18"
  - "GPIO19"
  - "GPIO20"
  - "GPIO21"
chip: "esp32-c3"
