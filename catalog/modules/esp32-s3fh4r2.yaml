# ESP32-S3FH4R2 chip package as a "module" (4 MB Quad SPI flash + 2 MB Quad SPI PSRAM in the package; used bare on the Waveshare ESP32-S3-Zero and ESP32-S3-Tiny). One key, single-source.
# Source: ESP32-S3 Series Datasheet v2.2 Table 1-1 and Table 2-14 (existing evidence record, two new claims appended).
