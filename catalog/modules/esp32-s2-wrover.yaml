chip: "esp32-s2"
consumed:
  GPIO26: {"evidence": ["esp32-s2-wrover-ds-v1.4#io26-psram-cs", "esp32-s2-ds-v1.9#pin-map-spics1", "esp32-s2-wrover-ds-v1.4#sch-spics0-spid"], "note": "GPIO26 = SPICS1 is the PSRAM chip select inside the WROVER (module Table 2 footnote 2: cannot be used for other functions). It also has a module pin (IO26), so it stays in bonded_pads.", "reviewers": ["hardware-researcher", "hardware-fact-auditor"], "status": "verified", "value": "psram"}
  GPIO27: {"evidence": ["esp32-s2-wrover-ds-v1.4#sch-spihd-spiwp", "esp32-s2-ds-v1.9#pin-map-spihd"], "note": "GPIO27 = SPIHD: wired inside the module to the external SPI flash (flash and PSRAM share this signal); chip datasheet Table 2-14; not led out on a module pin.", "reviewers": ["hardware-researcher", "hardware-fact-auditor"], "status": "verified", "value": "flash"}
  GPIO28: {"evidence": ["esp32-s2-wrover-ds-v1.4#sch-spihd-spiwp", "esp32-s2-ds-v1.9#pin-map-spiwp"], "note": "GPIO28 = SPIWP: wired inside the module to the external SPI flash (flash and PSRAM share this signal); chip datasheet Table 2-14; not led out on a module pin.", "reviewers": ["hardware-researcher", "hardware-fact-auditor"], "status": "verified", "value": "flash"}
  GPIO29: {"evidence": ["esp32-s2-wrover-ds-v1.4#sch-spics0-spid", "esp32-s2-ds-v1.9#pin-map-spics0"], "note": "GPIO29 = SPICS0: wired inside the module to the external SPI flash; chip datasheet Table 2-14; not led out on a module pin.", "reviewers": ["hardware-researcher", "hardware-fact-auditor"], "status": "verified", "value": "flash"}
  GPIO30: {"evidence": ["esp32-s2-wrover-ds-v1.4#sch-spiclk-spiq", "esp32-s2-ds-v1.9#pin-map-spiclk"], "note": "GPIO30 = SPICLK: wired inside the module to the external SPI flash (flash and PSRAM share this signal); chip datasheet Table 2-14; not led out on a module pin.", "reviewers": ["hardware-researcher", "hardware-fact-auditor"], "status": "verified", "value": "flash"}
  GPIO31: {"evidence": ["esp32-s2-wrover-ds-v1.4#sch-spiclk-spiq", "esp32-s2-ds-v1.9#pin-map-spiq"], "note": "GPIO31 = SPIQ: wired inside the module to the external SPI flash (flash and PSRAM share this signal); chip datasheet Table 2-14; not led out on a module pin.", "reviewers": ["hardware-researcher", "hardware-fact-auditor"], "status": "verified", "value": "flash"}
  GPIO32: {"evidence": ["esp32-s2-wrover-ds-v1.4#sch-spics0-spid", "esp32-s2-ds-v1.9#pin-map-spid"], "note": "GPIO32 = SPID: wired inside the module to the external SPI flash (flash and PSRAM share this signal); chip datasheet Table 2-14; not led out on a module pin.", "reviewers": ["hardware-researcher", "hardware-fact-auditor"], "status": "verified", "value": "flash"}
flash_voltage: {"evidence": ["esp32-s2-wrover-ds-v1.4#sch-flash-3v3", "esp32-s2-ds-v1.9#vdd-spi-3v3-default"], "note": "Module schematic names the flash supply net FLASH-3V3; the chip datasheet Table 3-4 default (GPIO45 = 0, no eFuse override) is VDD_SPI = 3.3 V. Not stated as a sentence; derived from the net name.", "reviewers": ["hardware-researcher", "hardware-fact-auditor"], "status": "verified", "unit": "V", "value": 3.3}
