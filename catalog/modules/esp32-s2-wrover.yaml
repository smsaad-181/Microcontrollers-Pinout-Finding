# ESP32-S2-WROVER module (ESP32-S2 chip, 4 MB external SPI flash + 2 MB SPI PSRAM; the datasheet also covers the WROVER-I antenna-connector variant) - two keys agree (researcher + blind auditor).
# Source: ESP32-S2-WROVER & WROVER-I Datasheet v1.4 (Table 2 Pin Definitions, module schematic) + ESP32-S2 Series Datasheet v1.9 (Table 2-14). Read 2026-10-24. Both modules are EOL in the datasheets.
# bonded_pads = the 37 GPIOs on module pins: IO0-IO21, IO26, IO33-IO38, IO39-IO42, TXD0 (GPIO43), RXD0 (GPIO44), IO45, IO46. GPIO27-GPIO32 have no module pin.
# consumed: GPIO26 (PSRAM CS) and GPIO27-GPIO32 (flash bus, shared with the PSRAM).
bonded_pads:
  - "GPIO0"
  - "GPIO1"
  - "GPIO2"
  - "GPIO3"
  - "GPIO4"
  - "GPIO5"
  - "GPIO6"
  - "GPIO7"
