# Thin "board core" module for the LOLIN D1 mini V4.0.0. The V4.0.0 schematic is chip-down: a bare ESP8266 chip (U1), a discrete
# SPI flash (U3, generic symbol 25Q-150MIL, 4 MB per the product page), a 26 MHz crystal (Y1) and a PCB antenna sit on the PCB; there
# is no pre-made ESP-12-class module and no module datasheet in the official documentation. The schema requires board -> variant ->
# module -> chip, so this record stands for the ESP8266EX + flash core of the D1 mini PCB and nothing else.
# - bonded_pads: every pad that is wired to a header pin or to board circuitry in the schematic (GPIO0-5, GPIO12-16 and the ADC pad TOUT);
#   GPIO6-GPIO11 are not bonded out (flash only), so they appear in `consumed` and not here.
# - psram: not applicable (omitted). Flash size 4 MB (esp8266 page spec; no schema field).
# Reconciled (task 2a.4, docs/validation/phase-2a/reconcile-esp8266-d1mini.md): the blind auditor lists GPIO6-GPIO11 as wired on the PCB (to the flash only) and so counts 18 bonded pads;
#   kept as above (researcher modelling, same as the ESP32 module records: flash-only pads are in `consumed`, not in `bonded_pads`). Plain field, no status.
bonded_pads: ["GPIO0", "GPIO1", "GPIO2", "GPIO3", "GPIO4", "GPIO5", "GPIO12", "GPIO13", "GPIO14", "GPIO15", "GPIO16", "TOUT"]
chip: "esp8266ex"
