  GPIO17: {"evidence": ["esp32-wrover-e-ds-v2.4#sch-gpio17-sram-clk", "esp32-ds-v5.3#psram-gpio17-sclk", "esp32-devkitc-v4-ug#note-gpio16-17-wrover", "esp32-wrover-e-ds-v2.4#pin-layout-26-37"], "note": "PSRAM SCLK via R13 (0 ohm); module pin 28 is NC (not led out).", "status": "single-source", "value": "psram"}
