# ESP32-WROVER-E module (N4R8/N8R8/N16R8) - draft, single-source.
# Source: ESP32-WROVER-E & ESP32-WROVER-IE Datasheet v2.4 (+ ESP32 Datasheet v5.3 §2.6 notes, DevKitC V4 guide).
# SCHEMA LIMITATION (reported to the orchestrator): the datasheet leads out only 24 GPIOs - module pins 27/28
# (IO16/IO17) are NC and GPIO16/GPIO17 are wired inside the module to the PSRAM. GPIO16 and GPIO17 are nevertheless
# listed in bonded_pads, because the catalog validator requires every gpio header pin of the shared DevKitC V4
# connector (J3-11/J3-12) to be in bonded_pads of every variant's module, and the schema has no per-variant pin map.
# The facts that matter to the engine are in `consumed` (GPIO16/GPIO17 = psram), which removes them from use.
bonded_pads:
  - "GPIO0"
  - "GPIO1"
  - "GPIO2"
  - "GPIO3"
  - "GPIO4"
  - "GPIO5"
  - "GPIO12"
  - "GPIO13"
  - "GPIO14"
  - "GPIO15"
  - "GPIO16"
  - "GPIO17"
  - "GPIO18"
  - "GPIO19"
  - "GPIO21"
  - "GPIO22"
  - "GPIO23"
  - "GPIO25"
  - "GPIO26"
  - "GPIO27"
  - "GPIO32"
  - "GPIO33"
  - "GPIO34"
  - "GPIO35"
  - "GPIO36"
  - "GPIO39"
chip: "esp32"
