  GPIO8: {"evidence": ["esp32-wrover-e-ds-v2.4#gpio6-11-flash"], "status": "single-source", "value": "flash"}
  GPIO9: {"evidence": ["esp32-wrover-e-ds-v2.4#gpio6-11-flash"], "status": "single-source", "value": "flash"}
