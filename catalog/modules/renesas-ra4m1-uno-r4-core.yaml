# Thin "board core" module for the Arduino UNO R4 Minima (ABX00080, schematic V1.2). Arduino sells no separate RA4M1 module: the R7FA4M1AB3CFM#AA0 sits directly on the board PCB
# (abx00080-um-rev6#mcu-part). The schema requires board -> variant -> module -> chip, so this record stands for the RA4M1 core of the UNO R4 Minima PCB and nothing else.
# - bonded_pads: all 52 pads of the 64-pin LQFP package (the chip record models only those). Several are not connected on the PCB (crossed-out pins in the schematic, e.g. P400-P402, P003, P004, P011, P015)
#   or go to board circuitry; which pads reach a header is recorded in boards/arduino-uno-r4-minima@V1.2.yaml.
# - consumed: P914/P915 are the USB D+/D- pads wired to the USB-C connector through ESD diodes (abx00080-pinout-20231127#usb-pads, abx00080-sch-v1.2#usb-dp-dm), verified by two reads. Nothing else is listed as consumed:
#   the second read also names pads that go to board circuitry but are not usable as a header pin: P010 (AREF / VREFH0), P201 (MD, R6 pull-up, JANALOG pin 1), P200 (NMI input, R5 pull-up), P500 (R10/R26 divider), P407 (USB VBUS divider), P012/P013 (TX/RX LEDs);
#   they are described in the board `onboard` list, not as module consumption (the schema has no consumed value for them).
# - there is no external flash (the 256 kB code flash is inside the RA4M1, so `flash_voltage` is missing: it has no value apart from the MCU supply) and the 16 MHz crystal Y1 is drawn crossed out in the schematic (sch#crystal-not-fitted),
#   so P212/P213 only reach the unfitted crystal pads; P214/P215 (sub-clock) are no-connect.
bonded_pads: ["P000", "P001", "P002", "P003", "P004", "P010", "P011", "P012", "P013", "P014", "P015", "P100", "P101", "P102", "P103", "P104", "P105", "P106", "P107", "P108", "P109", "P110", "P111", "P112", "P113", "P200", "P201", "P204", "P205", "P206", "P212", "P213", "P214", "P215", "P300", "P301", "P302", "P303", "P304", "P400", "P401", "P402", "P407", "P408", "P409", "P410", "P411", "P500", "P501", "P502", "P914", "P915"]
chip: renesas-ra4m1
consumed:
  P914: { evidence: ["abx00080-pinout-20231127#usb-pads", "abx00080-um-rev6#usb-connector", "abx00080-sch-v1.2#usb-dp-dm"], note: "USB D+ pad wired to the USB-C connector J3 through ESD protection D4 (U1 pin 19). Reconcile: the blind audit read the same pad from the schematic image (U1 pin 19, P914/USB_DP) and the pinout figure; both keys agree. Figure reads, hence transcribed.", reviewers: ["hardware-researcher", "hardware-fact-auditor"], status: "verified", transcribed: true, value: "usb" }
  P915: { evidence: ["abx00080-pinout-20231127#usb-pads", "abx00080-um-rev6#usb-connector", "abx00080-sch-v1.2#usb-dp-dm"], note: "USB D- pad wired to the USB-C connector J3 through ESD protection D4 (U1 pin 18). Reconcile: the blind audit read the same pad from the schematic image (U1 pin 18, P915/USB_DM) and the pinout figure; both keys agree. Figure reads, hence transcribed.", reviewers: ["hardware-researcher", "hardware-fact-auditor"], status: "verified", transcribed: true, value: "usb" }
flash_voltage: { evidence: [], note: "Not meaningful as a separate supply on this board: there is no external flash, the code/data flash is inside the RA4M1 and runs from the MCU VCC, which is fixed at 5 V from VIN (about 4.7 V on USB-only power, abx#usb-4v7; RA4M1 datasheet Table 2.2 allows VCC 1.6-5.5 V). The researcher wrote 5 V (board supply, manual s5); the blind audit only inferred \"same as VCC (5 V / about 4.7 V)\" with no quoted source. Different value conditions and no document states a flash voltage, so it is not marked verified; the supply is recorded as rail 5V in the board file.", status: "missing", unit: "V", value: null }
id: renesas-ra4m1-uno-r4-core
