flash_voltage: {"evidence": ["esp32-s3-wroom-1-ds-v1.8#vdd-spi-1v8-only-n16r16va", "esp32-s3-wroom-1-ds-v1.8#flash-vcc-3v3", "esp32-s3-ds-v2.2#table-1-1-s3-3v3-or-1v8", "esp32-s3-wroom-1-ds-v1.8#sch-other-modules-gpio45", "esp32-s3-wroom-1-ds-v1.8#vdd-spi-control-table", "esp32-s3-wroom-1-ds-v1.8#efuse-defaults-zero", "esp32-s3-wroom-1-ds-v1.8#strap-defaults-table"], "note": "Not stated for the N8 in so many words: module datasheet Table 1-1 footnote 7 says the VDD_SPI voltage is 1.8 V for the N16R16VA modules only, Table 6-8 lists flash supply options of 1.8 V and 3.3 V, and chip Table 1-1 gives the plain ESP32-S3 3.3 V/1.8 V selectable by the GPIO45 strap (default 3.3 V). Module schematic note (section 8): for modules WITHOUT PSRAM make sure GPIO45 is not pulled high when the module is powered up (a high GPIO45 selects the 1.8 V regulator). 3.3 V is therefore the inferred flash supply. INFERENCE, not a stated value: both keys independently reached 3.3 V from the module datasheet alone (researcher: footnote 7 by exclusion plus Table 6-8 and the section 8 GPIO45 warning; auditor: Table 4-4 default row, EFUSE_VDD_SPI_FORCE = 0 and GPIO45 = 0 selects VDD3P3_RTC at 3.3 V, plus the same warning). The default row is bold in the figure only (not distinguishable in the text layer), hence transcribed. CAVEAT: on the N8 (no PSRAM) VDD_SPI is strap-selected, so 3.3 V holds only while GPIO45 is low at power-up (weak pull-down default); GPIO45 pulled high would select 1.8 V.", "reviewers": ["hardware-researcher", "hardware-fact-auditor"], "status": "verified", "transcribed": true, "unit": "V", "value": 3.3}
