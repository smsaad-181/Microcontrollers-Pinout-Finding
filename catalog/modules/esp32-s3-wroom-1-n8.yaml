# ESP32-S3-WROOM-1-N8 module (8 MB Quad SPI flash, no PSRAM) - facts reconciled with the blind audit (task 2a.4: verified, two keys).
# Source: ESP32-S3-WROOM-1 & ESP32-S3-WROOM-1U Datasheet v1.8 (+ ESP32-S3 Series Datasheet v2.2 Table 2-14, DevKitC-1 v1.1 user guide).
# bonded_pads = the 36 GPIOs led out to module pins (module Table 3-1, 41 pins): IO0-IO21, IO35-IO42, TXD0 (GPIO43), RXD0 (GPIO44), IO45-IO48. GPIO22-GPIO34 have no module pin.
# consumed: GPIO27-GPIO32 (SPIHD, SPIWP, SPICS0, SPICLK, SPIQ, SPID) are wired inside the module to the QSPI flash (block diagram Figure 2-1, schematic Figure 8-1) and are not led out.
#   GPIO26 (SPICS1) is the PSRAM chip select; it has no module pin and the N8 has no PSRAM, so it is not listed. GPIO35-GPIO37 are plain GPIOs on this part (no Octal PSRAM).
# flash_voltage is a verified inference (both keys, same value): the datasheet states VDD_SPI = 1.8 V only for the N16R16VA modules, it never prints '3.3 V' for the N8 (see the note).
bonded_pads:
  - "GPIO0"
  - "GPIO1"
  - "GPIO2"
  - "GPIO3"
