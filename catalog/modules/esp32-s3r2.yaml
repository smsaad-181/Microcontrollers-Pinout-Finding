# ESP32-S3R2 chip package as a "module" (2 MB Quad SPI PSRAM in the package, no in-package flash; used bare on the Waveshare ESP32-S3-Pico with a 16 MB external flash on the board). One key, single-source.
# Source: ESP32-S3 Series Datasheet v2.2 Table 1-1 (S3R2 is EOL, upgraded to S3RH2) and Table 2-14.
# bonded_pads = all chip pads except GPIO26-GPIO32. GPIO29 (SPICS0, flash CS) is used by the board flash (see the board onboard list), not by the package, so it is not listed as consumed here; no board pin uses it.
