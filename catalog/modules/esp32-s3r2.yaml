chip: "esp32-s3"
consumed:
  GPIO26: {"evidence": ["esp32-s3-ds-v2.2#pin-map-spics1", "esp32-s3-ds-v2.2#table-1-1-s3r2"], "note": "GPIO26 = SPICS1 is CE# of the in-package 2 MB Quad SPI PSRAM. One key (hardware-researcher): a blind audit must re-read it.", "status": "single-source", "value": "psram"}
  GPIO27: {"evidence": ["esp32-s3-ds-v2.2#pin-map-spihd", "esp32-s3-ds-v2.2#table-1-1-s3r2", "esp32-s3-ds-v2.2#p4-gpio26-32"], "note": "GPIO27 (SPIHD) is part of the Quad SPI bus to the in-package PSRAM (shared with the board's external flash) - chip Table 2-14. One key (hardware-researcher): a blind audit must re-read it.", "status": "single-source", "value": "psram"}
  GPIO28: {"evidence": ["esp32-s3-ds-v2.2#pin-map-spiwp", "esp32-s3-ds-v2.2#table-1-1-s3r2", "esp32-s3-ds-v2.2#p4-gpio26-32"], "note": "GPIO28 (SPIWP) is part of the Quad SPI bus to the in-package PSRAM (shared with the board's external flash) - chip Table 2-14. One key (hardware-researcher): a blind audit must re-read it.", "status": "single-source", "value": "psram"}
  GPIO30: {"evidence": ["esp32-s3-ds-v2.2#pin-map-spiclk", "esp32-s3-ds-v2.2#table-1-1-s3r2", "esp32-s3-ds-v2.2#p4-gpio26-32"], "note": "GPIO30 (SPICLK) is part of the Quad SPI bus to the in-package PSRAM (shared with the board's external flash) - chip Table 2-14. One key (hardware-researcher): a blind audit must re-read it.", "status": "single-source", "value": "psram"}
  GPIO31: {"evidence": ["esp32-s3-ds-v2.2#pin-map-spiq", "esp32-s3-ds-v2.2#table-1-1-s3r2", "esp32-s3-ds-v2.2#p4-gpio26-32"], "note": "GPIO31 (SPIQ) is part of the Quad SPI bus to the in-package PSRAM (shared with the board's external flash) - chip Table 2-14. One key (hardware-researcher): a blind audit must re-read it.", "status": "single-source", "value": "psram"}
  GPIO32: {"evidence": ["esp32-s3-ds-v2.2#pin-map-spid", "esp32-s3-ds-v2.2#table-1-1-s3r2", "esp32-s3-ds-v2.2#p4-gpio26-32"], "note": "GPIO32 (SPID) is part of the Quad SPI bus to the in-package PSRAM (shared with the board's external flash) - chip Table 2-14. One key (hardware-researcher): a blind audit must re-read it.", "status": "single-source", "value": "psram"}
flash_voltage: {"evidence": ["esp32-s3-ds-v2.2#table-1-1-s3r2-3v3"], "note": "Chip Table 1-1 lists VDD_SPI voltage 3.3 V for ESP32-S3R2 (the board flash W25Q128 is supplied from VDD_SPI per the board schematic). One key (hardware-researcher): a blind audit must re-read it.", "status": "single-source", "unit": "V", "value": 3.3}
id: "esp32-s3r2"
psram: {"evidence": ["esp32-s3-ds-v2.2#table-1-1-s3r2"], "note": "Chip Table 1-1: 2 MB (Quad SPI) in-package PSRAM. One key (hardware-researcher): a blind audit must re-read it.", "status": "single-source", "value": "2 MB Quad SPI"}
