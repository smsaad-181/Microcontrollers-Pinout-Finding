# ESP32-C6 chip series (ESP32-C6 QFN40 with external flash, ESP32-C6FH4/FH8 QFN32 with in-package flash) - facts drafted by hardware-researcher (task boards-2), ONE KEY: every fact is single-source until a blind auditor re-reads it.
# Sources: ESP32-C6 Series Datasheet v1.5, ESP32-C6 Series SoC Errata v1.3. Read 2026-10-24.
# Pads: the union of the QFN40 and QFN32 GPIOs, GPIO0-GPIO30 (31 pads). GPIO10, GPIO11 and GPIO24-GPIO30 exist only on QFN40 (GPIO27 = VDD_SPI, GPIO24/25/26/28/29/30 = SPICS0/SPIQ/SPIWP/SPIHD/SPICLK/SPID); GPIO14 exists only on QFN32 (reset state read from the QFN32 table).
# Functions: GPIO = GPIO-matrix route; other IO MUX functions F0-F2 from Tables 2-4/2-5; LP_GPIOn/LP UART/LP I2C (Table 2-7), ADC1_CHn, XTAL_32K_P/N, USB_D-/D+ and VDD_SPI (Table 2-9) are fixed.
# reset_state = the datasheet Pin Overview 'At Reset' column (blank = no pull, input not enabled = 'disabled'); where 'After Reset' differs the note says so. GPIO13 At Reset is USB_PU (USB pull-up) and is mapped to 'pullup'.
# Strapping pins: GPIO4 (MTMS), GPIO5 (MTDI), GPIO8, GPIO9, GPIO15 (Table 3-1). GPIO12/GPIO13 are USB Serial/JTAG by default; GPIO4-GPIO7 are the JTAG pads, GPIO16/GPIO17 UART0.
# errata ids on pads: none. The ten errata of v1.3 (CPU-206, CPU-863, CLK-6996, CLK-8588, RES-7080, SPI-304, RMT-176, ADC-305, ADC-1477, WIFI-9686) name no pad; ADC-305/ADC-1477 concern the SAR ADC as a whole and are not applied per pad.
# power_up_glitch: the ESP32-C6 datasheet v1.5 has no power-up glitch table, so every pad is none (negative finding, weak basis).
# input_only: none of the 31 pads is input-only. adc.radio_conflict: ADC1 only (no ADC2 on ESP32-C6).
electrical:
  abs_max_vin: {"evidence": [], "note": "No absolute maximum input voltage for GPIO pads is documented in ESP32-C6 datasheet v1.5: Table 5-1 has only 'Input power pins - allowed input voltage' (-0.3 to 3.6 V), cumulative IO output current and storage temperature. VIH max = VDD + 0.3 V (Table 5-4) is an operating-condition limit, not a rating, and is deliberately not stored.", "status": "missing", "unit": "V", "value": null}
  cumulative_current_max: {"evidence": ["esp32-c6-ds-v1.5#abs-max-cumulative-current"], "note": "Table 5-1 Absolute Maximum Ratings: cumulative IO output current 1000 mA (footnote 2: fully functional after all IO pins pulled high while connected to ground for 24 h at 25 C; a functional test, not a stress rating).", "status": "single-source", "unit": "mA", "value": 1000}
  internal_pull_ohm: {"evidence": ["esp32-c6-ds-v1.5#dc-pull-up", "esp32-c6-ds-v1.5#dc-pull-down"], "note": "Table 5-4: internal weak pull-up RPU and pull-down RPD typical 45 kohm; no min/max given.", "status": "single-source", "unit": "ohm", "value": {"typ": 45000}}
  pin_current_max: {"evidence": [], "note": "ESP32-C6 datasheet v1.5 gives no per-pin maximum current. Table 5-4 gives only typical IOH 40 mA (VDD 3.3 V, VOH >= 2.64 V, PAD_DRIVER = 3) and IOL 28 mA; Table 2-2 footnote 3 gives default drive strengths (GPIO12/GPIO13 40 mA, others 20 mA). These are typical/default values, not ratings.", "status": "missing", "unit": "mA", "value": null}
  vih_min: {"conditions": {"temperature": "25 C", "vdd": "3.3 V"}, "evidence": ["esp32-c6-ds-v1.5#dc-vih"], "note": "Table 5-4 VIH min = 0.75 x VDD, VDD being the supply of the pad power domain (3.3 V, 25 C). The Max column is an operating limit, not stored.", "status": "single-source", "unit": "V", "value": "VDD*0.75"}
  vil_max: {"conditions": {"temperature": "25 C", "vdd": "3.3 V"}, "evidence": ["esp32-c6-ds-v1.5#dc-vil"], "note": "Table 5-4 VIL max = 0.25 x VDD (3.3 V, 25 C).", "status": "single-source", "unit": "V", "value": "VDD*0.25"}
  voh_min: {"conditions": {"temperature": "25 C", "vdd": "3.3 V"}, "evidence": ["esp32-c6-ds-v1.5#dc-voh"], "note": "Table 5-4 VOH min = 0.8 x VDD, measured with a high-impedance load.", "status": "single-source", "unit": "V", "value": "VDD*0.8"}
  vol_max: {"conditions": {"temperature": "25 C", "vdd": "3.3 V"}, "evidence": ["esp32-c6-ds-v1.5#dc-vol"], "note": "Table 5-4 VOL max = 0.1 x VDD, measured with a high-impedance load.", "status": "single-source", "unit": "V", "value": "VDD*0.1"}
