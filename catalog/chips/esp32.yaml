# ESP32 chip series (ESP32-D0WD-V3 etc.) - draft facts, all single-source (hardware-researcher).
# Sources: ESP32 Series Datasheet v5.3, ESP32 TRM v5.8 (Ch. 6 IO MUX, Ch. 31 ADC), ESP32 Series SoC Errata v3.1,
# ESP-IDF v6.1 SPI Master and ADC Oneshot docs. Functions: 'GPIO' = GPIO-matrix route; other IO_MUX functions from
# TRM Table 6.10-1 (HSPI* -> SPI2, VSPI* -> SPI3, U0/U1/U2* -> UART0/1/2, MT* -> JTAG per datasheet Appendix A note 6;
# other names kept as printed); analog/RTC functions from TRM Table 6.11-1 are 'fixed'. Matrix routing of I2C/UART/SPI
# is expressed by peripherals.*.matrix_routable, not repeated per pad. GPIO20/24/28-31 do not exist on this series.
electrical:
  abs_max_vin: {"conditions": {"temperature": "25 C", "vdd": "3.3 V"}, "evidence": ["esp32-ds-v5.3#dc-input-levels", "esp32-ds-v5.3#dc-vdd-definition"], "note": "Table 5-3 VIH max = VDD + 0.3 V, where VDD is the pad's I/O supply (written VDDIO+0.3 because the schema has no VDD+ form). Table 5-1 lists no separate absolute maximum for IO pins (supply pins: -0.3 to 3.6 V).", "status": "single-source", "unit": "V", "value": "VDDIO+0.3"}
  cumulative_current_max: {"evidence": ["esp32-ds-v5.3#abs-max-cumulative-current"], "status": "single-source", "unit": "mA", "value": 1200}
  internal_pull_ohm: {"evidence": ["esp32-ds-v5.3#dc-pull-resistance"], "note": "Datasheet value 45 kohm typical (pull-up and pull-down); no min/max given.", "status": "single-source", "unit": "ohm", "value": {"typ": 45000}}
  pin_current_max: {"evidence": [], "note": "ESP32 Datasheet v5.3 gives no per-pin maximum current. Table 5-3 gives only typical IOH 40 mA (VDD3P3_CPU/RTC domains, 20 mA VDD_SDIO) and IOL 28 mA at maximum drive strength; per-pin source current falls to about 29 mA as more pins source current (note 2). Not a rating.", "status": "missing", "unit": "mA", "value": null}
  vih_min: {"conditions": {"temperature": "25 C", "vdd": "3.3 V"}, "evidence": ["esp32-ds-v5.3#dc-input-levels", "esp32-ds-v5.3#dc-vdd-definition"], "status": "single-source", "unit": "V", "value": "VDD*0.75"}
  vil_max: {"conditions": {"temperature": "25 C", "vdd": "3.3 V"}, "evidence": ["esp32-ds-v5.3#dc-input-levels", "esp32-ds-v5.3#dc-vdd-definition"], "status": "single-source", "unit": "V", "value": "VDD*0.25"}
  voh_min: {"conditions": {"temperature": "25 C", "vdd": "3.3 V"}, "evidence": ["esp32-ds-v5.3#dc-output-levels", "esp32-ds-v5.3#dc-vdd-definition"], "status": "single-source", "unit": "V", "value": "VDD*0.8"}
  vol_max: {"conditions": {"temperature": "25 C", "vdd": "3.3 V"}, "evidence": ["esp32-ds-v5.3#dc-output-levels", "esp32-ds-v5.3#dc-vdd-definition"], "status": "single-source", "unit": "V", "value": "VDD*0.1"}
