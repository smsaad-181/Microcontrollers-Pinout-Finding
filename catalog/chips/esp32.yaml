# ESP32 chip series (ESP32-D0WD-V3 etc.) - draft facts, all single-source (hardware-researcher).
# Sources: ESP32 Series Datasheet v5.3, ESP32 TRM v5.8 (Ch. 6 IO MUX, Ch. 31 ADC), ESP32 Series SoC Errata v3.1,
# ESP-IDF v6.1 SPI Master and ADC Oneshot docs. Functions: 'GPIO' = GPIO-matrix route; other IO_MUX functions from
# TRM Table 6.10-1 (HSPI* -> SPI2, VSPI* -> SPI3, U0/U1/U2* -> UART0/1/2, MT* -> JTAG per datasheet Appendix A note 6;
# other names kept as printed); analog/RTC functions from TRM Table 6.11-1 are 'fixed'. Matrix routing of I2C/UART/SPI
# is expressed by peripherals.*.matrix_routable, not repeated per pad. GPIO20/24/28-31 do not exist on this series.
electrical:
  abs_max_vin: {"evidence": [], "note": "No absolute maximum input voltage for GPIO pads is documented. The researcher derived VDDIO+0.3 from VIH max (Table 5-3), which is an operating limit, not a rating; the blind auditor found no per-GPIO absolute maximum either (could-not-verify). Searched: datasheet v5.3 Table 5-1 Absolute Maximum Ratings (rows: supply pins VDDA/VDD3P3/VDD3P3_RTC/VDD3P3_CPU/VDD_SDIO allowed input voltage -0.3 to 3.6 V, cumulative IO output current 1200 mA, storage temperature) and Table 5-3, plus the TRM and the errata; reconciler re-read Table 5-1 and confirmed no per-IO row. The derived value VDDIO+0.3 (VIH max in Table 5-3, esp32-ds-v5.3#dc-input-levels) is kept here only as context, not as a rating. The 3.6 V supply-pin row is not a GPIO input rating.", "status": "missing", "unit": "V", "value": null}
  cumulative_current_max: {"evidence": ["esp32-ds-v5.3#abs-max-cumulative-current"], "reviewers": ["hardware-researcher", "hardware-fact-auditor"], "status": "verified", "unit": "mA", "value": 1200}
  internal_pull_ohm: {"evidence": ["esp32-ds-v5.3#dc-pull-resistance"], "note": "Datasheet value 45 kohm typical (pull-up and pull-down); no min/max given. Auditor independently read RPU and RPD typ 45 kohm (Table 5-3), no min/max.", "reviewers": ["hardware-researcher", "hardware-fact-auditor"], "status": "verified", "unit": "ohm", "value": {"typ": 45000}}
  pin_current_max: {"evidence": [], "note": "ESP32 Datasheet v5.3 gives no per-pin maximum current. Table 5-3 gives only typical IOH 40 mA (VDD3P3_CPU/RTC domains, 20 mA VDD_SDIO) and IOL 28 mA at maximum drive strength; per-pin source current falls to about 29 mA as more pins source current (note 2). Not a rating. Blind auditor independently found no per-pin absolute maximum (could-not-verify) and recorded the same typical/test values: IOH 40 mA (VDD3P3_CPU, VDD3P3_RTC) / 20 mA (VDD_SDIO) and IOL 28 mA at maximum drive strength; drive-strength steps 0..3 = about 5/10/20/40 mA (default 2 = 20 mA, Table 6-1 note 8). Revision history V1.4 says an older 'maximum driving capability 80 mA' row was changed; no per-pin rating row remains in v5.3.", "status": "missing", "unit": "mA", "value": null}
  vih_min: {"conditions": {"temperature": "25 C", "vdd": "3.3 V"}, "evidence": ["esp32-ds-v5.3#dc-input-levels", "esp32-ds-v5.3#dc-vdd-definition"], "note": "Table 5-3 VIH min = 0.75 x VDD, VDD being the pad's I/O domain supply (3.3 V, 25 C). Same reading by both keys.", "reviewers": ["hardware-researcher", "hardware-fact-auditor"], "status": "verified", "unit": "V", "value": "VDD*0.75"}
  vil_max: {"conditions": {"temperature": "25 C", "vdd": "3.3 V"}, "evidence": ["esp32-ds-v5.3#dc-input-levels", "esp32-ds-v5.3#dc-vdd-definition"], "reviewers": ["hardware-researcher", "hardware-fact-auditor"], "status": "verified", "unit": "V", "value": "VDD*0.25"}
  voh_min: {"conditions": {"temperature": "25 C", "vdd": "3.3 V"}, "evidence": ["esp32-ds-v5.3#dc-output-levels", "esp32-ds-v5.3#dc-vdd-definition"], "reviewers": ["hardware-researcher", "hardware-fact-auditor"], "status": "verified", "unit": "V", "value": "VDD*0.8"}
  vol_max: {"conditions": {"temperature": "25 C", "vdd": "3.3 V"}, "evidence": ["esp32-ds-v5.3#dc-output-levels", "esp32-ds-v5.3#dc-vdd-definition"], "reviewers": ["hardware-researcher", "hardware-fact-auditor"], "status": "verified", "unit": "V", "value": "VDD*0.1"}
