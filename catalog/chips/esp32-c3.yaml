# ESP32-C3 chip series (ESP32-C3, ESP32-C3FN4/FH4/FH4X/FH8X, QFN32) - facts drafted by hardware-researcher (task boards-2), then re-read blind by hardware-fact-auditor (docs/validation/boards-2-audit.md): promoted to verified.
# Sources: ESP32-C3 Series Datasheet v2.4, ESP32-C3 Series SoC Errata v1.3, ESP-IDF (stable) ADC oneshot page for ESP32-C3. Read 2026-10-24.
# Pads: the 22 GPIOs GPIO0-GPIO21 (datasheet Table 2-4). GPIO11 is the VDD_SPI pin; GPIO12-GPIO17 are SPIHD/SPIWP/SPICS0/SPICLK/SPID/SPIQ (SPI0/1, in-package flash on FN4/FH4/FH8X).
# Functions: GPIO = GPIO-matrix route; other IO MUX functions F0-F2 from Table 2-4 as printed; ADCx_CHy, XTAL_32K_P/N and USB_D-/D+ (Table 2-6) are fixed. Matrix routing of UART/I2C/SPI signals is expressed by peripherals.*.matrix_routable.
# reset_state = the datasheet Table 2-1 'At Reset' column (blank = no pull, input not enabled = 'disabled'); where 'After Reset' differs the note says so.
# Strapping pins: GPIO2, GPIO8, GPIO9 (Table 3-1/3-3). GPIO18/GPIO19 are USB Serial/JTAG by default (2.3.3). GPIO4-GPIO7 are the JTAG pads, GPIO20/GPIO21 UART0.
# errata ids on pads: ADC-183 on GPIO5 (the only ADC2 pad) only; CPU-863 and ADC-270 name no pad. input_only: none of the 22 pads is input-only.
# power_up_glitch: Table 2-2 (MTCK, MTDO, GPIO10, U0RXD low 5 ns; GPIO18 high 50 us); other pads none (negative finding).
electrical:
  abs_max_vin: {"evidence": [], "note": "No absolute maximum input voltage for GPIO pads is documented in ESP32-C3 datasheet v2.4: Table 5-1 has only 'Input power pins - allowed input voltage' (-0.3 to 3.6 V), cumulative IO output current and storage temperature. VIH max = VDD + 0.3 V (Table 5-4) is an operating-condition limit, not a rating, and is deliberately not stored.", "status": "missing", "unit": "V", "value": null}
  cumulative_current_max: {"evidence": ["esp32-c3-ds-v2.4#abs-max-cumulative-current"], "note": "Table 5-1 Absolute Maximum Ratings: cumulative IO output current 1000 mA (footnote 2: fully functional after all IO pins pulled high while connected to ground for 24 h at 25 C; a functional test, not a stress rating).", "reviewers": ["hardware-researcher", "hardware-fact-auditor"], "status": "verified", "unit": "mA", "value": 1000}
  internal_pull_ohm: {"evidence": ["esp32-c3-ds-v2.4#dc-pull-up", "esp32-c3-ds-v2.4#dc-pull-down"], "note": "Table 5-4: internal weak pull-up RPU and pull-down RPD typical 45 kohm; no min/max given.", "reviewers": ["hardware-researcher", "hardware-fact-auditor"], "status": "verified", "unit": "ohm", "value": {"typ": 45000}}
  pin_current_max: {"evidence": [], "note": "ESP32-C3 datasheet v2.4 gives no per-pin maximum current. Table 5-4 gives only typical IOH 40 mA (VDD 3.3 V, VOH >= 2.64 V, PAD_DRIVER = 3) and IOL 28 mA; Table 2-1 footnote 4 gives default drive strengths (GPIO2/GPIO3/MTMS/MTDI 10 mA, GPIO18/GPIO19 40 mA, others 20 mA). These are typical/default values, not ratings.", "status": "missing", "unit": "mA", "value": null}
  vih_min: {"conditions": {"temperature": "25 C", "vdd": "3.3 V"}, "evidence": ["esp32-c3-ds-v2.4#dc-vih"], "note": "Table 5-4 VIH min = 0.75 x VDD, VDD being the supply of the pad power domain (3.3 V, 25 C). The Max column (VDD + 0.3 V) is an operating limit, not stored.", "reviewers": ["hardware-researcher", "hardware-fact-auditor"], "status": "verified", "unit": "V", "value": "VDD*0.75"}
  vil_max: {"conditions": {"temperature": "25 C", "vdd": "3.3 V"}, "evidence": ["esp32-c3-ds-v2.4#dc-vil"], "note": "Table 5-4 VIL max = 0.25 x VDD (3.3 V, 25 C).", "reviewers": ["hardware-researcher", "hardware-fact-auditor"], "status": "verified", "unit": "V", "value": "VDD*0.25"}
  voh_min: {"conditions": {"temperature": "25 C", "vdd": "3.3 V"}, "evidence": ["esp32-c3-ds-v2.4#dc-voh"], "note": "Table 5-4 VOH min = 0.8 x VDD, measured with a high-impedance load.", "reviewers": ["hardware-researcher", "hardware-fact-auditor"], "status": "verified", "unit": "V", "value": "VDD*0.8"}
  vol_max: {"conditions": {"temperature": "25 C", "vdd": "3.3 V"}, "evidence": ["esp32-c3-ds-v2.4#dc-vol"], "note": "Table 5-4 VOL max = 0.1 x VDD, measured with a high-impedance load.", "reviewers": ["hardware-researcher", "hardware-fact-auditor"], "status": "verified", "unit": "V", "value": "VDD*0.1"}
