# RP2040 chip record (reconciled in task 2a.4 against the blind audit docs/validation/phase-2a/audit-rp2040.yaml). Source: RP2040 Datasheet build 3184e62 (evidence rp2040-ds-3184e62).
# Routing classes: RP2040 selects one function per pad from a fixed per-pad list (FUNCSEL, Table 2); there is no
# free peripheral-to-pin matrix. Every FUNCSEL-selected function (SPI/UART/I2C/PWM/SIO/PIO/CLOCK/USB) is therefore
# `iomux` (dedicated per-pad mux position) and the ADC inputs (GPIO26-29) are `fixed`. One peripheral role appears on
# several pads (e.g. SPI0.RX on GPIO0/4/16/20); see each pad's `functions`. `iomux_pins` is omitted because
# Record<role, PadId> cannot hold the alternative pads of one role. Function names follow the datasheet (SPI RX/TX/
# CSn/SCK, not MISO/MOSI). `GPIO` = SIO (F5); PIO0/PIO1 (F6/F7) are available on every pad.
# Routing decision (2a.4): PIO0/PIO1 stay `iomux`. They are selected per pad via FUNCSEL (F6/F7) from the fixed per-pad list, and the PIO chapter (3.1) says only that
# "at the minimum, an interface can be freely shifted up or down by some number of GPIOs" (freedom depends on the PIO program), so free routing is not promised. See docs/validation/phase-2a/reconcile-rp2040.md.
# Errata ids: RP2040-E5 (GPIO15, USB enumeration workaround, B0/B1), RP2040-E6 (ADC pads digital input enabled, B0/B1),
# RP2040-E11 (ADC DNL, all revisions); see evidence claims erratum-e5-gpio15, erratum-e6, erratum-e11.
electrical:
  abs_max_vin: { active: "VDDIO+0.3", evidence: [rp2040-ds-3184e62#abs-max-vpin, pico-ds-rel21#adc-diode, pico-w-ds-rel7#adc-diode], note: "RP2040 Table 622 gives VPIN max IOVDD + 0.5 V for digital IO; the Pico and Pico W datasheets limit the ADC-capable GPIO26-29 (internal reverse diode to IOVDD) to about IOVDD + 300 mV. The schema has one chip-wide value, so the restrictive reading (VDDIO+0.3) is active for all pads. The blind auditor independently read VDDIO+0.5 from Table 622 (GPIO0-25 are fault tolerant, GPIO26-29 are not; the datasheet gives no lower limit for the ADC pads), so the +0.5 reading is confirmed from the chip datasheet and the +0.3 reading comes from the Pico board datasheets only. RP2040 Table 625 also lists VIH max IOVDD + 0.3 V for all pads (operating limit, not an absolute rating).", readings: [{ evidence: [rp2040-ds-3184e62#abs-max-vpin], value: "VDDIO+0.5" }, { evidence: [pico-ds-rel21#adc-diode, pico-w-ds-rel7#adc-diode], value: "VDDIO+0.3" }], status: conflict, unit: V, value: "VDDIO+0.3" }
  cumulative_current_max: { evidence: [rp2040-ds-3184e62#iovdd-total-current, rp2040-ds-3184e62#iovss-total-current], note: "IIOVDD_MAX 50 mA = sum of current sourced by all GPIO and QSPI pins; IIOVSS_MAX 50 mA = sum of current sunk. Two separate 50 mA budgets.", reviewers: [hardware-researcher, hardware-fact-auditor], status: verified, unit: mA, value: 50 }
  internal_pull_ohm: { evidence: [rp2040-ds-3184e62#pull-resistance], note: "RPU and RPD both 50-80 kOhm (Table 625, no typical given).", reviewers: [hardware-researcher, hardware-fact-auditor], status: verified, unit: ohm, value: { max: 80000, min: 50000 } }
  pin_current_max: { evidence: [], note: "No documented absolute per-pin current maximum: the RP2040 datasheet (5.5.3.5, p. 617) says the 2/4/8/12 mA drive strengths are not hard limits and gives no per-pin absolute maximum; the 12 mA figure the researcher first recorded is only the highest drive-strength SETTING (VOH/VOL are specified at it; default drive is 4 mA, PADS_BANK0 DRIVE reset 0x1), so it is not stored as a rating. Blind auditor also found no hard limit. Searched: Tables 622 and 625, 2.19.4 Pads, 5.5.3.5. The chip-wide 50 mA source / 50 mA sink totals are in cumulative_current_max.", status: missing, unit: mA, value: null }
  vih_min: { conditions: { IOVDD: "3.3 V" }, evidence: [rp2040-ds-3184e62#vih-3v3, rp2040-ds-3184e62#input-thresholds-default], reviewers: [hardware-researcher, hardware-fact-auditor], status: verified, unit: V, value: 2 }
  vil_max: { conditions: { IOVDD: "3.3 V" }, evidence: [rp2040-ds-3184e62#vil-3v3, rp2040-ds-3184e62#input-thresholds-default], reviewers: [hardware-researcher, hardware-fact-auditor], status: verified, unit: V, value: 0.8 }
  voh_min: { conditions: { IOH: "equal to the selected drive strength (2/4/8/12 mA)", IOVDD: "3.3 V" }, evidence: [rp2040-ds-3184e62#voh-3v3], reviewers: [hardware-researcher, hardware-fact-auditor], status: verified, unit: V, value: 2.62 }
  vol_max: { conditions: { IOL: "equal to the selected drive strength (2/4/8/12 mA)", IOVDD: "3.3 V" }, evidence: [rp2040-ds-3184e62#vol-3v3], reviewers: [hardware-researcher, hardware-fact-auditor], status: verified, unit: V, value: 0.5 }
