# Renesas RA4M1 chip record (R7FA4M1AB3CFM, 64-pin LQFP, PLQP0064KB-C), task 2a.1/2a.2 draft for the Arduino UNO R4 Minima.
# Sources: RA4M1 Group Datasheet R01DS0355EJ0110 Rev.1.10 (ra4m1-ds-rev1.10), RA4M1 Group User's Manual: Hardware R01UH0887EJ0110 Rev.1.10 (ra4m1-um-rev1.10),
# plus the Arduino UNO R4 Minima documents for the 5 V supply and the board-level 8 mA statement.
# Pads: only the 52 pads bonded on the 64-pin package (49 I/O + P200, P214, P215 input ports, datasheet Table 1.14 "I/O pins 49, Input pins 3"). Pad key = port name; `gpio` = port*100 + pin (P000=0 ... P915=915),
# an invented unique number (the RA4M1 has no GPIO numbering); the datasheet only names the pads P<port><nn>.
# Routing: every digital function is selected per pad by PmnPFS.PSEL from a fixed per-pad list (pin list, datasheet 1.7), so there is no matrix: digital functions are `iomux`; analog/system/debug/USB
# pins are `fixed`. `GPIO` is the PMR = 0 general-purpose function. Function names follow the datasheet pin list (signal names as printed; a cell such as TXD2/MOSI2/SDA2 is split into its three names).
# Pin-list function lists are TRANSCRIBED from table images (rendered pages 23-26); the extracted PDF text has no row structure. IRQn/KRn, SEG/COM (LCD) and TS (CTSU) names are included as printed.
# Electrical values are the VCC = 4.0-5.5 V / 2.7-5.5 V columns that apply to the UNO R4 Minima, which runs the RA4M1 at 5 V (abx00080-um-rev6#mcu-5v-fixed). Expressions use VDDIO = VCC.
# pin_current_max is a CONFLICT (Arduino 8 mA vs RA4M1 low-drive 4 mA, reset default); see the fact note. Revision of silicon is not stated in the datasheet, so `revisions` names the document revision.
electrical:
  abs_max_vin: { evidence: ["ra4m1-ds-rev1.10#abs-max-others", "ra4m1-ds-rev1.10#abs-max-p0", "ra4m1-ds-rev1.10#abs-max-5v-tol"], note: "Table 2.1: Vin max VCC + 0.3 V for ordinary pins and AVCC0 + 0.3 V for P000-P008, P010-P015 (equal on the UNO R4 where AVCC0 = VCC = 5 V). 5 V-tolerant ports (P205, P206, P400-P404, P407, P408) allow up to 6.5 V, but none of them is on a UNO R4 header (ds#abs-max-5v-tol). Not a rating of the board headers.", status: "single-source", unit: "V", value: "VDDIO+0.3" }
  cumulative_current_max: { evidence: ["ra4m1-ds-rev1.10#ioh-total-all", "abx00080-pinout-20231127#max-overall-60ma"], note: "RA4M1 Table 2.6: total of all output pins 60 mA (source) and 60 mA (sink), separate budgets; the Arduino pinout states \"current overall 60mA\". Both documents agree.", status: "single-source", unit: "mA", value: 60 }
  internal_pull_ohm: { evidence: ["ra4m1-ds-rev1.10#pull-up-ru"], note: "Pull-up only (RU, Table 2.10, VIN = 0 V, VCC 1.6-5.5 V); there is no internal pull-down. Excludes P200, P214, P215, P914, P915.", status: "single-source", unit: "ohm", value: { max: 50000, min: 10000, typ: 20000 } }
  pin_current_max: { active: 4, conditions: { drive: "low drive (reset default, PmnPFS.DSCR = 0) vs middle drive" }, evidence: ["ra4m1-ds-rev1.10#ioh-iol-low", "ra4m1-ds-rev1.10#ioh-iol-mid", "ra4m1-ds-rev1.10#ioh-iol-caution", "ra4m1-um-rev1.10#pfs-dscr", "ra4m1-um-rev1.10#pfs-initial-rule", "abx00080-um-rev6#gpio-8ma", "abx00080-pinout-20231127#max-pin-8ma"], note: "CONFLICT, most restrictive active. Arduino (abx00080-um-rev6 s9.3 and the full pinout) states 8 mA per GPIO without naming a drive setting. RA4M1 Table 2.6 gives the permissible per-pin output current as 4.0 mA with low drive and 8.0 mA with middle drive (sink; source printed -4.0 mA in the middle-drive row), selected by PmnPFS.DSCR, whose reset value is 0 = low drive (UM s19.2.5). The 8 mA reading therefore holds only if the Arduino core sets middle drive on the pad, which no document read here states. The datasheet Caution says the Table 2.6 values should not be exceeded. Pads P408/P409 (not on UNO R4 headers) allow 20 mA at middle drive, VCC 3.0-5.5 V. Chip-wide figure: the most restrictive group.", readings: [{ evidence: ["abx00080-um-rev6#gpio-8ma", "abx00080-pinout-20231127#max-pin-8ma", "ra4m1-ds-rev1.10#ioh-iol-mid"], value: 8 }, { evidence: ["ra4m1-ds-rev1.10#ioh-iol-low", "ra4m1-um-rev1.10#pfs-dscr", "ra4m1-um-rev1.10#pfs-initial-rule", "ra4m1-ds-rev1.10#ioh-iol-caution"], value: 4 }], status: "conflict", unit: "mA", value: 4 }
  port_current_max: { evidence: ["ra4m1-ds-rev1.10#ioh-total-p0"], note: "RA4M1 Table 2.6: total of ports P000-P008, P010-P015 (the analog group A0-A3 and P012/P013) is limited to 30 mA source and 30 mA sink. Not a per-port figure for the other ports; the datasheet gives no other group totals except all pins (60 mA).", status: "single-source", unit: "mA", value: 30 }
  vih_min: { conditions: { VCC: "2.7 to 5.5 V" }, evidence: ["ra4m1-ds-rev1.10#vih-vil-5v", "ra4m1-ds-rev1.10#vih-vil-schmitt"], note: "Table 2.4, input pins other than P000-P015/P914/P915: 0.8 x VCC (P000-P015: 0.8 x AVCC0). IIC pins (P100, P101) use Schmitt thresholds 0.7 x VCC (VIH) and 0.3 x VCC (VIL), Table 2.4.", status: "single-source", unit: "V", value: "VDDIO*0.8" }
  vil_max: { conditions: { VCC: "2.7 to 5.5 V" }, evidence: ["ra4m1-ds-rev1.10#vih-vil-5v", "ra4m1-ds-rev1.10#vih-vil-schmitt"], note: "Table 2.4, 0.2 x VCC for ordinary pins; IIC pins 0.3 x VCC (less restrictive).", status: "single-source", unit: "V", value: "VDDIO*0.2" }
  voh_min: { conditions: { IOH: "-2.0 mA low drive / -4.0 mA middle drive", VCC: "4.0 to 5.5 V" }, evidence: ["ra4m1-ds-rev1.10#voh-vol-5v", "ra4m1-ds-rev1.10#voh-vol-5v-mid"], note: "Table 2.7: VOH min = VCC - 0.8 V (expression written VDDIO+-0.8). VOH is guaranteed only at the stated currents, so it says nothing at 8 mA.", status: "single-source", unit: "V", value: "VDDIO+-0.8" }
  vol_max: { conditions: { IOL: "2.0 mA low drive / 4.0 mA middle drive", VCC: "4.0 to 5.5 V" }, evidence: ["ra4m1-ds-rev1.10#voh-vol-5v", "ra4m1-ds-rev1.10#voh-vol-5v-mid"], note: "Table 2.7: VOL max 0.8 V at IOL = 2.0 mA (low drive) or 4.0 mA (middle drive); other pin groups differ (IIC 0.4 V at 3 mA).", status: "single-source", unit: "V", value: 0.8 }
