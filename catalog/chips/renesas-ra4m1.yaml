# Renesas RA4M1 chip record (R7FA4M1AB3CFM, 64-pin LQFP, PLQP0064KB-C), task 2a.1/2a.2 draft for the Arduino UNO R4 Minima.
# Sources: RA4M1 Group Datasheet R01DS0355EJ0110 Rev.1.10 (ra4m1-ds-rev1.10), RA4M1 Group User's Manual: Hardware R01UH0887EJ0110 Rev.1.10 (ra4m1-um-rev1.10),
# plus the Arduino UNO R4 Minima documents for the 5 V supply and the board-level 8 mA statement.
# Pads: only the 52 pads bonded on the 64-pin package (49 I/O + P200, P214, P215 input ports, datasheet Table 1.14 "I/O pins 49, Input pins 3"). Pad key = port name (the pad's stable name); the pads carry no `gpio` number
# (the RA4M1 has no GPIO numbering; the datasheet only names the pads P<port><nn>).
# Routing: every digital function is selected per pad by PmnPFS.PSEL from a fixed per-pad list (pin list, datasheet 1.7), so there is no matrix: digital functions are `iomux`; analog/system/debug/USB
# pins are `fixed`. `GPIO` is the PMR = 0 general-purpose function. Function names follow the datasheet pin list (signal names as printed; a cell such as TXD2/MOSI2/SDA2 is split into its three names).
# Pin-list function lists are TRANSCRIBED from table images (rendered pages 23-26); the extracted PDF text has no row structure. IRQn/KRn, SEG/COM (LCD) and TS (CTSU) names are included as printed.
# Electrical values: input levels from Table 2.4 (its only column is VCC 2.7-5.5 V), output levels from Table 2.7 (VCC 4.0-5.5 V); the UNO R4 Minima runs the RA4M1 at 5 V (abx00080-um-rev6#mcu-5v-fixed). Expressions use VDDIO = VCC.
# pin_current_max is a CONFLICT (Arduino 8 mA vs RA4M1 low-drive 4 mA, reset default); the fact note holds the full per-pad-group table. Revision of silicon is not stated in the datasheet, so `revisions` names the document revision.
# Reconciled (task 2a.4) against the blind audit docs/validation/phase-2a/audit-renesas-ra4m1.yaml; see docs/validation/phase-2a/reconcile-renesas-ra4m1.md. power_up_glitch and errata are unknown (Renesas technical updates not opened by either key).
electrical:
  abs_max_vin: { evidence: ["ra4m1-ds-rev1.10#abs-max-others", "ra4m1-ds-rev1.10#abs-max-p0", "ra4m1-ds-rev1.10#abs-max-5v-tol"], note: "Table 2.1 (p. 28), verified by two keys. VDDIO+0.3 is the common-pad value and the most restrictive chip-wide reading. Per pad group the datasheet gives: 5 V-tolerant ports (7 bonded on the 64-pin package: P205, P206, P400, P401, P402, P407, P408) -0.3 to +6.5 V; P000-P008 and P010-P015 -0.3 to AVCC0+0.3 V (equal to VCC+0.3 on the UNO R4 where AVCC0 = VCC); all other pads -0.3 to VCC+0.3 V; analog inputs AN000-AN014 up to AVCC0+0.3 V, AN016-AN025 up to VCC+0.3 V; supply pins VCC -0.5 to +6.5 V. The schema holds one chip-wide value, so per-pad variation cannot be stored. The datasheet cautions against signals on a pin while the device is unpowered.", reviewers: ["hardware-researcher", "hardware-fact-auditor"], status: "verified", unit: "V", value: "VDDIO+0.3" }
  cumulative_current_max: { evidence: ["ra4m1-ds-rev1.10#ioh-total-all", "abx00080-pinout-20231127#max-overall-60ma"], note: "RA4M1 Table 2.6: total of all output pins 60 mA (source) and 60 mA (sink), separate budgets; the Arduino pinout states \"current overall 60mA\". Both documents agree. Reconcile: audit found IOH -60 mA / IOL 60 mA for the total of all output pins (Table 2.6 p. 33; CTSU current: section 2.11). Port totals: P000-P008 + P010-P015 30 mA each way (see port_current_max), P914/P915 2 mA.", reviewers: ["hardware-researcher", "hardware-fact-auditor"], status: "verified", unit: "mA", value: 60 }
  internal_pull_ohm: { evidence: ["ra4m1-ds-rev1.10#pull-up-ru"], note: "Pull-up only (RU, Table 2.10, VIN = 0 V, VCC 1.6-5.5 V); there is no internal pull-down. Excludes P200, P214, P215, P914, P915. Reconcile: audit read the same row, RU 10/20/50 kOhm (Table 2.10, p. 35).", reviewers: ["hardware-researcher", "hardware-fact-auditor"], status: "verified", unit: "ohm", value: { max: 50000, min: 10000, typ: 20000 } }
  pin_current_max: { active: 4, conditions: { drive: "low drive (reset default, PmnPFS.DSCR = 0) vs middle drive" }, evidence: ["ra4m1-ds-rev1.10#ioh-iol-low", "ra4m1-ds-rev1.10#ioh-iol-mid", "ra4m1-ds-rev1.10#ioh-iol-caution", "ra4m1-um-rev1.10#pfs-dscr", "ra4m1-um-rev1.10#pfs-initial-rule", "abx00080-um-rev6#gpio-8ma", "abx00080-pinout-20231127#max-pin-8ma", "ra4m1-ds-rev1.10#ioh-iol-other-pins", "ra4m1-ds-rev1.10#ioh-iol-p212-p213", "ra4m1-ds-rev1.10#ioh-iol-p914-p915", "ra4m1-ds-rev1.10#ioh-iol-p408-p409", "ra4m1-ds-rev1.10#ioh-iol-max-per-pin"], note: "CONFLICT (reconciled with the blind audit), most restrictive reading active: 4 mA, which is also the reset default. Reading 8 mA: Arduino UNO R4 Minima manual s9.3 and the pinout state that the GPIOs \"can handle up to 8 mA\" without naming a drive setting. Reading 4 mA: RA4M1 datasheet Table 2.6 (pp. 32-33; average and max per pin are identical; the Caution says the values must not be exceeded) and PmnPFS.DSCR resets to 0 = low drive (UM p. 361-362). Datasheet per-pin limits, IOH / IOL in mA, by pad group: (a) P100-P115, P201-P204, P300-P307, P500-P503 (41-pin group): low drive -4 / 4, middle drive -4 / 8; (b) other output pads (P000-P008, P010-P015, P205, P206, P400-P402, P407, P410, P411): low -4 / 4, middle -8 / 8; (c) P212, P213: fixed -4 / 4; P914, P915: fixed -4 / 4; (d) P408: low -4 / 4, middle for IIC fast-mode (VCC 2.7-5.5 V) -8 / 8, middle (VCC 3.0-5.5 V) -20 / 20; P409: low -4 / 4, middle (2.7-3.0 V) -8 / 8, middle (3.0-5.5 V) -20 / 20; (e) totals: P000-P008 + P010-P015 -30 / 30, P914 + P915 -2 / 2, all output pins -60 / 60. So 8 mA is a datasheet value only after firmware selects middle drive, and then only as sink current for group (a) (source stays -4) or both ways for group (b); no document read states that the Arduino core selects middle drive. The schema has one chip-wide value and no per-pad override, so the group differences are recorded here only (schema gap).", readings: [{ evidence: ["abx00080-um-rev6#gpio-8ma", "abx00080-pinout-20231127#max-pin-8ma", "ra4m1-ds-rev1.10#ioh-iol-mid", "ra4m1-ds-rev1.10#ioh-iol-other-pins"], value: 8 }, { evidence: ["ra4m1-ds-rev1.10#ioh-iol-low", "ra4m1-ds-rev1.10#ioh-iol-other-pins", "ra4m1-ds-rev1.10#ioh-iol-p212-p213", "ra4m1-ds-rev1.10#ioh-iol-p914-p915", "ra4m1-um-rev1.10#pfs-dscr", "ra4m1-um-rev1.10#pfs-initial-rule", "ra4m1-ds-rev1.10#ioh-iol-caution", "ra4m1-ds-rev1.10#ioh-iol-max-per-pin"], value: 4 }], status: "conflict", unit: "mA", value: 4 }
  port_current_max: { evidence: ["ra4m1-ds-rev1.10#ioh-total-p0"], note: "RA4M1 Table 2.6: total of ports P000-P008, P010-P015 (the analog group A0-A3 and P012/P013) is limited to 30 mA source and 30 mA sink. Not a per-port figure for the other ports; the datasheet gives no other group totals except all pins (60 mA). Reconcile: audit read the same totals; it also found P914/P915 total 2 mA (Table 2.6 p. 33, row prints \"SIOL (min)\", apparently a typo for max). Stored value is the P000-P015 group.", reviewers: ["hardware-researcher", "hardware-fact-auditor"], status: "verified", unit: "mA", value: 30 }
  vih_min: { conditions: { VCC: "2.7 to 5.5 V" }, evidence: ["ra4m1-ds-rev1.10#vih-vil-5v", "ra4m1-ds-rev1.10#vih-vil-schmitt", "ra4m1-ds-rev1.10#table-2-4-conditions", "ra4m1-ds-rev1.10#iic-schmitt-pads", "ra4m1-ds-rev1.10#vih-vil-smbus"], note: "Table 2.4 (p. 30; its only column is VCC = 2.7 to 5.5 V, there is no separate 4.0-5.5 V column): input pins other than P000-P015/P914/P915 VIH min 0.8 x VCC (4.0 V at 5 V); P000-P008, P010-P015 0.8 x AVCC0; 5 V-tolerant ports 0.8 x VCC (max 5.8 V); IIC (except SMBus) Schmitt pads P205, P206, P400, P401, P407, P408 0.7 x VCC and VIL 0.3 x VCC; SMBus-mode IIC pads (P100, P101, P204-P206, P400, P401, P407, P408) VIH 2.2 V (2.0 V at 2.7-3.6 V), VIL 0.8 V. Reconcile correction: the draft named P100/P101 as the Schmitt IIC pads; the datasheet note lists the six pads above (P100/P101 are SMBus-mode pads).", reviewers: ["hardware-researcher", "hardware-fact-auditor"], status: "verified", unit: "V", value: "VDDIO*0.8" }
  vil_max: { conditions: { VCC: "2.7 to 5.5 V" }, evidence: ["ra4m1-ds-rev1.10#vih-vil-5v", "ra4m1-ds-rev1.10#vih-vil-schmitt", "ra4m1-ds-rev1.10#table-2-4-conditions", "ra4m1-ds-rev1.10#iic-schmitt-pads", "ra4m1-ds-rev1.10#vih-vil-smbus"], note: "Table 2.4 (p. 30, VCC 2.7-5.5 V): 0.2 x VCC for ordinary pins (1.0 V at 5 V), 0.2 x AVCC0 for P000-P015; IIC Schmitt pads (P205, P206, P400, P401, P407, P408) 0.3 x VCC (less restrictive). SMBus-mode IIC pads have a fixed VIL max 0.8 V, stricter than 0.2 x VCC above 4.0 V; that applies only to pads configured as SMBus and is not stored.", reviewers: ["hardware-researcher", "hardware-fact-auditor"], status: "verified", unit: "V", value: "VDDIO*0.2" }
  voh_min: { conditions: { IOH: "-2.0 mA low drive / -4.0 mA middle drive", VCC: "4.0 to 5.5 V" }, evidence: ["ra4m1-ds-rev1.10#voh-vol-5v", "ra4m1-ds-rev1.10#voh-vol-5v-mid"], note: "Table 2.7: VOH min = VCC - 0.8 V (expression written VDDIO+-0.8). VOH is guaranteed only at the stated currents, so it says nothing at 8 mA. Reconcile: audit read the same Table 2.7 rows (VCC 4.0-5.5 V, p. 34); at 2.7-4.0 V (Table 2.8) VOH min is VCC-0.5 V at -1.0 mA low / -2.0 mA middle drive; P408/P409 middle drive VCC-1.0 V at -20 mA; P000-P015 use AVCC0-0.8 V; P914/P915 VCC_USB-0.8 V at -2.0 mA.", reviewers: ["hardware-researcher", "hardware-fact-auditor"], status: "verified", unit: "V", value: "VDDIO+-0.8" }
  vol_max: { conditions: { IOL: "2.0 mA low drive / 4.0 mA middle drive", VCC: "4.0 to 5.5 V" }, evidence: ["ra4m1-ds-rev1.10#voh-vol-5v", "ra4m1-ds-rev1.10#voh-vol-5v-mid"], note: "Table 2.7: VOL max 0.8 V at IOL = 2.0 mA (low drive) or 4.0 mA (middle drive); other pin groups differ (IIC 0.4 V at 3 mA). Reconcile: audit read the same Table 2.7 rows (4.0-5.5 V, p. 34): 0.8 V at 2.0 mA low / 4.0 mA middle drive; P408/P409 middle 1.0 V at 20 mA; IIC pins 0.4 V at 3.0 mA and 0.6 V at 6.0 mA (middle drive on P408); at 2.7-4.0 V (Table 2.8) 0.5 V at 1.0/2.0 mA.", reviewers: ["hardware-researcher", "hardware-fact-auditor"], status: "verified", unit: "V", value: 0.8 }
