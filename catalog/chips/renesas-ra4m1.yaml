vdd_io: { evidence: ["abx00080-um-rev6#mcu-5v-fixed", "abx00080-um-rev6#operating-5v", "ra4m1-ds-rev1.10#vcc-range"], note: "5 V is the supply the Arduino UNO R4 Minima fixes for the RA4M1 (VCC = 5 V, about 4.7 V on USB power, abx00080-um-rev6#usb-4v7). The RA4M1 itself allows VCC 1.6-5.5 V (Table 2.2); the electrical facts below use the 4.0-5.5 V / 2.7-5.5 V columns. Reconcile: the blind audit found the datasheet operating range VCC 1.6-5.5 V (Table 2.2, p. 29; 4.0-5.5 V for 5 V operation). 5 V lies inside it; it is stored as the 5 V operating point of the UNO R4 Minima (a board-level choice, Arduino documents), not as the only permitted supply.", reviewers: ["hardware-researcher", "hardware-fact-auditor"], status: "verified", unit: "V", value: 5 }
