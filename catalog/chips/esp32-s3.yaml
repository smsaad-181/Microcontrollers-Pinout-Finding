# ESP32-S3 chip series (ESP32-S3, ESP32-S3R8, ... in QFN56) - facts drafted by hardware-researcher (tasks 2a.1/2a.2) and reconciled with the blind audit (task 2a.4, docs/validation/phase-2a/reconcile-esp32-s3.md).
# Sources: ESP32-S3 Series Datasheet v2.2 (2026-03-05), ESP32-S3 TRM v1.8 (2026-03-04), ESP32-S3 Series SoC Errata v1.3, ESP-IDF v6.1 (ESP32-S3 target) SPI Master and ADC Oneshot pages.
# Pads: the 45 GPIOs GPIO0-GPIO21 and GPIO26-GPIO48 (GPIO22-GPIO25 do not exist). GPIO26-GPIO32 are the SPI0/1 flash/PSRAM pads (SPICS1, SPIHD, SPIWP, SPICS0, SPICLK, SPIQ, SPID).
# Functions: 'GPIO' = GPIO-matrix route; other IO MUX functions F0-F4 from datasheet Table 2-4 as printed; RTC_GPIOn/RTC I2C (Table 2-6), TOUCHn, ADCx_CHy, XTAL_32K_P/N and USB_D-/D+ (Table 2-8) are 'fixed'.
#   Matrix routing of UART/I2C/SPI signals is expressed by peripherals.*.matrix_routable, not repeated per pad.
# reset_state = the datasheet Table 2-1 'At Reset' column (blank = no pull, input not enabled = 'disabled'). The 'After Reset' column differs on GPIO9-14, 17, 18, 33-42 (input enabled after reset): those 18 facts are conflicts
#   (At Reset 'disabled' active, After Reset / TRM RST value as the second reading). TRM Table 6.12-1 RST is the state AFTER reset. GPIO43 is a real datasheet/TRM disagreement (conflict).
# GPIO19/GPIO20 are connected to the USB Serial/JTAG controller by default (datasheet 2.3.4); GPIO39-GPIO42 are the pad JTAG pins; GPIO43/GPIO44 are UART0; GPIO0, GPIO3, GPIO45, GPIO46 are the strapping pins.
# input_only: none of the 45 pads is input-only (all typed I/O/T).
# power_up_glitch: datasheet Table 2-2 (pads GPIO1-GPIO14, GPIO15/16 as XTAL_32K_P/N, GPIO17-GPIO20); other pads none (negative finding). GPIO18-GPIO20 carry two glitches (schema holds one) and the GPIO19/20 3.2 ms footnote is ambiguous: conflicts, restrictive reading active, see the notes.
# errata ids on pads: ADC-183 (ADC2 pads GPIO11-GPIO20, SAR ADC2 digital controller/DMA) and USBOTG-4289 (USB pads GPIO19/GPIO20) only; TOUCH-100 names no pad and is not applied.
# GPIO33-GPIO37 are used by octal flash/PSRAM in 8-line SPI mode (datasheet Table 2-14); which of them a module consumes is recorded in the module records.
electrical:
  abs_max_vin: {"evidence": [], "note": "No absolute maximum input voltage for GPIO pads is documented in ESP32-S3 datasheet v2.2: Table 5-1 has only 'Input power pins - allowed input voltage -0.3 to 3.6 V', cumulative IO output current 1500 mA and storage temperature; neither the module datasheet (Table 6-1: VDD33 only) nor the TRM or errata gives a GPIO row. VIH max = VDD + 0.3 V in Table 5-4 is an operating-condition limit, not a rating, and is deliberately not stored here. Blind auditor independently found no per-GPIO absolute maximum either (could-not-verify) and warns not to derive one from the supply-pin row (-0.3 to 3.6 V, power pins only) or from VIH max.", "status": "missing", "unit": "V", "value": null}
  cumulative_current_max: {"evidence": ["esp32-s3-ds-v2.2#abs-max-cumulative-current"], "note": "Table 5-1 Absolute Maximum Ratings: cumulative IO output current 1500 mA (footnote: fully functional after all IO pins pulled high while connected to ground for 24 h at 25 C). Blind auditor read the same Table 5-1 row (1500 mA, footnote 2: tested functional, not a stress rating).", "reviewers": ["hardware-researcher", "hardware-fact-auditor"], "status": "verified", "unit": "mA", "value": 1500}
  internal_pull_ohm: {"evidence": ["esp32-s3-ds-v2.2#dc-pull-up", "esp32-s3-ds-v2.2#dc-pull-down"], "note": "Table 5-4: internal weak pull-up RPU and pull-down RPD typical 45 kohm; no min/max given. Blind auditor independently read RPU and RPD typ 45 kohm, no min/max.", "reviewers": ["hardware-researcher", "hardware-fact-auditor"], "status": "verified", "unit": "ohm", "value": {"typ": 45000}}
  pin_current_max: {"evidence": [], "note": "ESP32-S3 datasheet v2.2 gives no per-pin maximum current. Table 5-4 gives only typical IOH 40 mA (VDD 3.3 V, VOH >= 2.64 V, PAD_DRIVER = 3) and IOL 28 mA (VOL = 0.495 V, PAD_DRIVER = 3); Table 2-1 footnote 5 gives default drive strengths (GPIO17/GPIO18 10 mA, GPIO19/GPIO20 40 mA, all other pins 20 mA); TRM Table 6.12-1 lists drive-strength steps 0..3 = about 5/10/20/40 mA (about 5/20/10/40 mA for GPIO17/GPIO18). These are typical/default values, not ratings. Blind auditor independently found no per-pin absolute maximum (could-not-verify) and recorded the same typical/default values (IOH 40 mA, IOL 28 mA at PAD_DRIVER = 3; defaults 10/40/20 mA; drive steps about 5/10/20/40 mA).", "status": "missing", "unit": "mA", "value": null}
  vih_min: {"conditions": {"temperature": "25 C", "vdd": "3.3 V"}, "evidence": ["esp32-s3-ds-v2.2#dc-vih", "esp32-s3-ds-v2.2#dc-vdd-definition"], "note": "Table 5-4 VIH min = 0.75 x VDD, VDD being the supply of the pad's power domain (3.3 V, 25 C). The Max column (VDD + 0.3 V) is an operating limit, not stored. Blind auditor read the same Table 5-4 row (identical expression, VDD = supply of the pad's power domain).", "reviewers": ["hardware-researcher", "hardware-fact-auditor"], "status": "verified", "unit": "V", "value": "VDD*0.75"}
  vil_max: {"conditions": {"temperature": "25 C", "vdd": "3.3 V"}, "evidence": ["esp32-s3-ds-v2.2#dc-vil", "esp32-s3-ds-v2.2#dc-vdd-definition"], "note": "Blind auditor read the same Table 5-4 row (identical expression, VDD = supply of the pad's power domain).", "reviewers": ["hardware-researcher", "hardware-fact-auditor"], "status": "verified", "unit": "V", "value": "VDD*0.25"}
  voh_min: {"conditions": {"temperature": "25 C", "vdd": "3.3 V"}, "evidence": ["esp32-s3-ds-v2.2#dc-voh", "esp32-s3-ds-v2.2#dc-vdd-definition"], "note": "Measured with a high-impedance load. Blind auditor read the same Table 5-4 row (identical expression, VDD = supply of the pad's power domain).", "reviewers": ["hardware-researcher", "hardware-fact-auditor"], "status": "verified", "unit": "V", "value": "VDD*0.8"}
  vol_max: {"conditions": {"temperature": "25 C", "vdd": "3.3 V"}, "evidence": ["esp32-s3-ds-v2.2#dc-vol", "esp32-s3-ds-v2.2#dc-vdd-definition"], "note": "Measured with a high-impedance load. Blind auditor read the same Table 5-4 row (identical expression, VDD = supply of the pad's power domain).", "reviewers": ["hardware-researcher", "hardware-fact-auditor"], "status": "verified", "unit": "V", "value": "VDD*0.1"}
