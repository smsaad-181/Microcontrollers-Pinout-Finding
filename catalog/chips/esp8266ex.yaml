# ESP8266EX (Espressif) - reconciled (task 2a.4, see docs/validation/phase-2a/reconcile-esp8266-d1mini.md): facts found by both the researcher and the blind
# auditor are verified, facts neither key could find are missing (reset_state, power_up_glitch, GPIO0/GPIO1/GPIO2/GPIO15 strap, abs_max_vin, cumulative_current_max, internal pull).
# Sources: ESP8266EX Datasheet v7.1, ESP8266 Hardware Design Guidelines v2.8, ESP8266 Technical Reference v1.7.
# Pads: GPIO0-GPIO16 exist (datasheet §4.1: 17 GPIO pins). Pads GPIO6-GPIO11 are the SDIO/SPI flash bus pins (Table 2-1).
# Every function is a fixed per-pad function, hence routing 'iomux' (the documents give per-pad function tables, no matrix).
# CATALOG-INTERNAL PAD 'TOUT' with gpio: 17: the ADC input (pin 6) is not a GPIO, but the schema requires a pad with a number
#   to carry the ADC fact and to let a board header pin (A0) resolve. 17 is NOT a datasheet number (the chip has GPIO0-16 only;
#   17 is the next free index). Flagged as a schema gap in the hand-off.
# I2C, PWM and IR are software implementations in this chip (datasheet §4.4, §4.7, §4.8); the datasheet lists fixed example pins
#   (I2C SCL IO14 / SDA IO2, PWM0-3 IO12/15/14/4, IR TX IO14 / RX IO5). They are recorded as printed with matrix_routable false
#   (most restrictive reading of the pin tables); the documents do not say software I2C/PWM cannot use other GPIOs.
# I2S functions are recorded per pad but there is no I2S peripheral kind in the schema.
# GPIO15 strap: both keys found 'low at power-on' (HDG 1.4.7) but no document states the default internal pull that the schema's strap value requires,
#   so the whole fact is missing (no placeholder is stored; see its note and the reconcile report). The Espressif 'ESP8266 Pin List' xls (Strapping List)
#   could not be downloaded automatically and is requested as a manual download; it would settle reset_state, the strap levels and pad pulls.
# reset_state and power_up_glitch are missing for every pad (no document states them; no ESP8266 errata document exists, so 'none' is not recorded).
electrical:
  abs_max_vin: {"evidence": [], "note": "Datasheet v7.1 has no absolute-maximum-ratings table (Table 5-1 is 'Electrical Characteristics'); hardware design guidelines v2.8 and TRM v1.7 give no input-voltage rating either (both keys searched; auditor: could-not-verify; HDG only says the IO is a 3.3 V logic level). Table 5-1 VIH max 3.6 V and working voltage max 3.6 V are operating values, not recorded as an absolute maximum. The Espressif 'ESP8266 Pin List' xls (sheets Strapping List, Register List, Buffer Sheet; linked from datasheet Appendix A) could not be downloaded automatically (the server returns the documentation-portal HTML shell) and is requested as a manual download.", "status": "missing", "unit": "V", "value": null}
  cumulative_current_max: {"evidence": [], "note": "No total/cumulative I/O current limit is stated in datasheet v7.1 Table 5-1 (only IMAX 12 mA in the I/O group), hardware design guidelines v2.8 or TRM v1.7 (both keys searched; auditor: could-not-verify). The Espressif 'ESP8266 Pin List' xls (sheets Strapping List, Register List, Buffer Sheet; linked from datasheet Appendix A) could not be downloaded automatically (the server returns the documentation-portal HTML shell) and is requested as a manual download.", "status": "missing", "unit": "mA", "value": null}
  internal_pull_ohm: {"evidence": [], "note": "Datasheet §4.1 says pads can be configured with an internal pull-up (GPIO16: pull-down only) but no resistance value is given in datasheet v7.1, hardware design guidelines v2.8 or TRM v1.7 (both keys searched; auditor: could-not-verify). The Espressif 'ESP8266 Pin List' xls (sheets Strapping List, Register List, Buffer Sheet; linked from datasheet Appendix A) could not be downloaded automatically (the server returns the documentation-portal HTML shell) and is requested as a manual download.", "status": "missing", "unit": "ohm", "value": null}
  pin_current_max: {"evidence": ["esp8266ex-ds-v7.1#el-imax"], "note": "Verified as: the datasheet lists IMAX = 12 mA (Table 5-1, group 'I/O', conditions column '-'); both keys found the same row. The document does not say whether it is a per-pin or per-port figure, nor whether it is an operating or an absolute value, so the scope is unstated; it is the only I/O current figure in datasheet v7.1, hardware design guidelines v2.8 and TRM v1.7.", "reviewers": ["hardware-researcher", "hardware-fact-auditor"], "status": "verified", "transcribed": true, "unit": "mA", "value": 12}
  vih_min: {"evidence": ["esp8266ex-ds-v7.1#el-vih"], "note": "Table 5-1: VIH min 0.75 VIO (VIO = the digital I/O supply). Table 5-1 also lists VIH max 3.6 V (operating row; the schema has no field for it). Verified: the blind auditor read the same value from the rendered Table 5-1 (transcribed).", "reviewers": ["hardware-researcher", "hardware-fact-auditor"], "status": "verified", "transcribed": true, "unit": "V", "value": "VDDIO*0.75"}
  vil_max: {"evidence": ["esp8266ex-ds-v7.1#el-vil"], "note": "Table 5-1: VIL max 0.25 VIO (min -0.3 V). Verified: the blind auditor read the same value from the rendered Table 5-1 (transcribed).", "reviewers": ["hardware-researcher", "hardware-fact-auditor"], "status": "verified", "transcribed": true, "unit": "V", "value": "VDDIO*0.25"}
  voh_min: {"evidence": ["esp8266ex-ds-v7.1#el-voh"], "note": "Table 5-1: VOH min 0.8 VIO. Verified: the blind auditor read the same value from the rendered Table 5-1 (transcribed).", "reviewers": ["hardware-researcher", "hardware-fact-auditor"], "status": "verified", "transcribed": true, "unit": "V", "value": "VDDIO*0.8"}
  vol_max: {"evidence": ["esp8266ex-ds-v7.1#el-vol"], "note": "Table 5-1: VOL max 0.1 VIO. Verified: the blind auditor read the same value from the rendered Table 5-1 (transcribed).", "reviewers": ["hardware-researcher", "hardware-fact-auditor"], "status": "verified", "transcribed": true, "unit": "V", "value": "VDDIO*0.1"}
