# ESP8266EX (Espressif) - draft facts, all single-source or missing (hardware-researcher, task 2a.1/2a.2).
# Sources: ESP8266EX Datasheet v7.1, ESP8266 Hardware Design Guidelines v2.8, ESP8266 Technical Reference v1.7.
# Pads: GPIO0-GPIO16 exist (datasheet §4.1: 17 GPIO pins). Pads GPIO6-GPIO11 are the SDIO/SPI flash bus pins (Table 2-1).
# Every function is a fixed per-pad function, hence routing 'iomux' (the documents give per-pad function tables, no matrix).
# CATALOG-INTERNAL PAD 'TOUT' with gpio: 17: the ADC input (pin 6) is not a GPIO, but the schema requires a pad with a number
#   to carry the ADC fact and to let a board header pin (A0) resolve. 17 is NOT a datasheet number (the chip has GPIO0-16 only;
#   17 is the next free index). Flagged as a schema gap in the hand-off.
# I2C, PWM and IR are software implementations in this chip (datasheet §4.4, §4.7, §4.8); the datasheet lists fixed example pins
#   (I2C SCL IO14 / SDA IO2, PWM0-3 IO12/15/14/4, IR TX IO14 / RX IO5). They are recorded as printed with matrix_routable false
#   (most restrictive reading of the pin tables); the documents do not say software I2C/PWM cannot use other GPIOs.
# I2S functions are recorded per pad but there is no I2S peripheral kind in the schema.
# 'GPIO15' strap: see its note (default_pull is a placeholder). reset_state and power_up_glitch are missing for every pad (no document states them).
electrical:
  abs_max_vin: {"evidence": [], "note": "Datasheet v7.1 has no absolute-maximum-ratings table (Table 5-1 is 'Electrical Characteristics'). Table 5-1 lists VIH min 0.75 VIO and max 3.6 V (esp8266ex-ds-v7.1#el-vih), an operating-characteristics value, not an absolute maximum rating, so it is not recorded here. Hardware design guidelines v2.8 and TRM v1.7 searched: no input-voltage rating either.", "status": "missing", "unit": "V", "value": null}
  cumulative_current_max: {"evidence": [], "note": "No total/cumulative I/O current limit is stated in datasheet v7.1 Table 5-1 (only IMAX 12 mA in the I/O group).", "status": "missing", "unit": "mA", "value": null}
  pin_current_max: {"evidence": ["esp8266ex-ds-v7.1#el-imax"], "note": "Table 5-1 row IMAX, max 12 mA, group 'I/O', no condition stated. Whether it is a per-pin rating or an operating limit is not further defined in the document.", "status": "single-source", "unit": "mA", "value": 12}
  vih_min: {"evidence": ["esp8266ex-ds-v7.1#el-vih"], "note": "Table 5-1: VIH min 0.75 VIO (VIO = the digital I/O supply). Table 5-1 also lists VIH max 3.6 V (operating row; the schema has no field for it).", "status": "single-source", "unit": "V", "value": "VDDIO*0.75"}
  vil_max: {"evidence": ["esp8266ex-ds-v7.1#el-vil"], "note": "Table 5-1: VIL max 0.25 VIO (min -0.3 V).", "status": "single-source", "unit": "V", "value": "VDDIO*0.25"}
  voh_min: {"evidence": ["esp8266ex-ds-v7.1#el-voh"], "note": "Table 5-1: VOH min 0.8 VIO.", "status": "single-source", "unit": "V", "value": "VDDIO*0.8"}
  vol_max: {"evidence": ["esp8266ex-ds-v7.1#el-vol"], "note": "Table 5-1: VOL max 0.1 VIO.", "status": "single-source", "unit": "V", "value": "VDDIO*0.1"}
