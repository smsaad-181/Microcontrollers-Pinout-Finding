# ESP32-S2 chip series (ESP32-S2, ESP32-S2FH2/FH4/FN4R2/R2, QFN56) - facts drafted by hardware-researcher (task boards-2), ONE KEY: every fact is single-source until a blind auditor re-reads it.
# Sources: ESP32-S2 Series Datasheet v1.9, ESP32-S2 Series SoC Errata v1.2, ESP-IDF (stable) ADC oneshot page for ESP32-S2. Read 2026-10-24.
# Pads: the 43 GPIOs GPIO0-GPIO21 and GPIO26-GPIO46 (GPIO22-GPIO25 do not exist). GPIO26-GPIO32 are the SPI0/1 flash/PSRAM pads (SPICS1, SPIHD, SPIWP, SPICS0, SPICLK, SPIQ, SPID); GPIO33-GPIO37 are the upper octal lines.
# Functions: GPIO = GPIO-matrix route; other IO MUX functions F2-F4 from Table 2-3 as printed; RTC_GPIOn/sar_i2c (Table 2-6) and TOUCHn, ADCx_CHy, XTAL_32K_P/N, DAC_n, USB_D-/D+ (Table 2-8) are fixed.
# reset_state = the datasheet Table 2-1 'At Reset' column (blank = no pull, input not enabled = 'disabled'); where 'After Reset' differs the note says so.
# Strapping pins: GPIO0, GPIO45, GPIO46 (Table 3-1). GPIO19/GPIO20 are USB OTG by default; GPIO39-GPIO42 are the JTAG pads, GPIO43/GPIO44 UART0.
# input_only: GPIO46 only (Table 2-3 types I/I); the other 42 pads are I/O/T.
# errata ids on pads: SYSTEM-117 on GPIO18 (chip revision v0.0 only: GPIO18/DAC_2 is not pulled up by default; the errata name it as pin 24 DAC_2 (GPIO18)). The other eight errata name no pad.
# power_up_glitch: the ESP32-S2 datasheet v1.9 has no power-up glitch table, so every pad is none (negative finding, weak basis).
electrical:
  abs_max_vin: {"evidence": [], "note": "No absolute maximum input voltage for GPIO pads is documented in ESP32-S2 datasheet v1.9: Table 5-1 has only 'Input power pins - allowed input voltage' (-0.3 to 3.6 V), cumulative IO output current and storage temperature. VIH max = VDD + 0.3 V (Table 5-4) is an operating-condition limit, not a rating, and is deliberately not stored.", "status": "missing", "unit": "V", "value": null}
  cumulative_current_max: {"evidence": ["esp32-s2-ds-v1.9#abs-max-cumulative-current"], "note": "Table 5-1 Absolute Maximum Ratings: cumulative IO output current 1800 mA (footnote 2: fully functional after all IO pins pulled high while connected to ground for 24 h at 25 C; a functional test, not a stress rating).", "status": "single-source", "unit": "mA", "value": 1800}
  internal_pull_ohm: {"evidence": ["esp32-s2-ds-v1.9#dc-pull-up", "esp32-s2-ds-v1.9#dc-pull-down"], "note": "Table 5-4: internal weak pull-up RPU and pull-down RPD typical 45 kohm; no min/max given.", "status": "single-source", "unit": "ohm", "value": {"typ": 45000}}
  pin_current_max: {"evidence": [], "note": "ESP32-S2 datasheet v1.9 gives no per-pin maximum current. Table 5-4 gives only typical IOH 40 mA (VDD 3.3 V, VOH >= 2.64 V, PAD_DRIVER = 3) and IOL 28 mA; Table 2-1 footnote 4 gives a default drive strength of 20 mA. These are typical/default values, not ratings.", "status": "missing", "unit": "mA", "value": null}
  vih_min: {"conditions": {"temperature": "25 C", "vdd": "3.3 V"}, "evidence": ["esp32-s2-ds-v1.9#dc-vih"], "note": "Table 5-4 VIH min = 0.75 x VDD, VDD being the supply of the pad power domain (3.3 V, 25 C). The Max column is an operating limit, not stored.", "status": "single-source", "unit": "V", "value": "VDD*0.75"}
  vil_max: {"conditions": {"temperature": "25 C", "vdd": "3.3 V"}, "evidence": ["esp32-s2-ds-v1.9#dc-vil"], "note": "Table 5-4 VIL max = 0.25 x VDD (3.3 V, 25 C).", "status": "single-source", "unit": "V", "value": "VDD*0.25"}
  voh_min: {"conditions": {"temperature": "25 C", "vdd": "3.3 V"}, "evidence": ["esp32-s2-ds-v1.9#dc-voh"], "note": "Table 5-4 VOH min = 0.8 x VDD, measured with a high-impedance load.", "status": "single-source", "unit": "V", "value": "VDD*0.8"}
  vol_max: {"conditions": {"temperature": "25 C", "vdd": "3.3 V"}, "evidence": ["esp32-s2-ds-v1.9#dc-vol"], "note": "Table 5-4 VOL max = 0.1 x VDD, measured with a high-impedance load.", "status": "single-source", "unit": "V", "value": "VDD*0.1"}
