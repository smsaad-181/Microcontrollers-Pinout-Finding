# Golden fixture 09 - LOLIN D1 mini V4.0.0: 10 kohm potentiometer wiper on A0 with the pot wired to the 3V3 rail (R8 ADC fit).
# The 3.2 V full scale is a BOARD fact only because the catalog records the A0 divider R12 220 k / R13 100 k and the product-page statement.
id: d1-mini-a0-potentiometer-adc-fit
board: lolin-d1-mini@V4.0.0
variant: lolin-d1-mini-v4
project:
  board: lolin-d1-mini@V4.0.0
  variant: lolin-d1-mini-v4
  wifi: true
  modules:
    - { breakout: potentiometer-10k, instance: pot }
  locked: []
  reserved: []
expect:
  status: ok
  exact:
    pot.WIPER: TOUT        # the only ADC pad; header label A0 (J2-2)
  properties:
    - header_label_of_pad: { TOUT: A0 }
    - adc_ratio_board: 0.3125
    - adc_sensor_max_v_for_full_scale: 3.2
  warnings_include:
    - { code: ADC_OVER_RANGE, level: warning }     # 3.3 V * 0.3125 = 1.03125 V > 1.000 V; 3.3 V > 3.2 V stated A0 maximum
    - { code: ADC_RADIO_UNKNOWN, level: caution }  # esp8266ex ADC radio_conflict fact is missing
  required_parts_include:
    - { kind: attenuation, role: limit-pot-supply, max_wiper_v: 3.2, note: "pot ends must not exceed 3.2 V; exact parts not asserted" }
evidence:
  - lolin-d1-mini-v4-sch#adc-divider
  - lolin-d1-mini-v4-ug#features-adc
  - lolin-d1-mini-v4-ug#spec-adc
  - lolin-d1-mini-v4-ug#spec-voltage
  - lolin-d1-mini-v4-ug#pinmap-left
  - lolin-d1-mini-v4-sch#j2-pins
  - esp8266ex-ds-v7.1#adc-range
  - esp8266ex-ds-v7.1#adc-10bit
  - esp8266ex-ds-v7.1#adc-two-uses
  - esp8266ex-ds-v7.1#pin-tout
  - bourns-3386-ds-rev-12-24#terminals
derivations:
  - "Board divider: A0 -> R12 220 kohm -> TOUT node -> R13 100 kohm -> GND (lolin-d1-mini-v4-sch#adc-divider): ratio = 100/(220+100) = 0.3125."
  - "Chip range: TOUT accepts 0 to 1.0 V (esp8266ex-ds-v7.1#adc-range, 10-bit: #adc-10bit). Full scale at A0 = 1.0/0.3125 = 3.2 V, which matches the product page ('3.2 V maximum', lolin-d1-mini-v4-ug#features-adc, #spec-adc). node: 1/0.3125 = 3.2."
  - "Pot wired between GND and the 3V3 rail (potentiometer-10k notes: wiper swings between the end-terminal potentials): Vmax = 3.3 V -> TOUT sees 3.3*0.3125 = 1.03125 V > 1.000 V (3.125 % over range) and 3.3 V exceeds the 3.2 V maximum by 0.1 V -> ADC_OVER_RANGE warning (not critical: the ESP8266 has no absolute-maximum fact, status missing, so R1 cannot be computed). Fix: limit the pot supply to <= 3.2 V (the exact part list is the engine's choice)."
  - "Source impedance: the divider presents 320 kohm to the wiper; a 10 kohm pot wiper adds at most about 2.5 kohm in series (<= 1 % ) - not stored as a catalog fact and not asserted."
  - "No dead zone: effective range lower bound is 0 mV (esp8266ex adc_effective_range_mv default [0,1000])."
  - "Wi-Fi project: the ESP8266 ADC/radio conflict is missing in the catalog (no document says it conflicts and none says it does not) -> Caution, not a block."
changelog:
  - "2026-10-23: created (task 2a.7, fixture-author)."
