# Golden fixture 03 - the worked-example project of fixture 02 on the WROVER-E variant (ESP32-DevKitC-VE): GPIO16/GPIO17 are PSRAM lines.
id: devkitc-v4-wrover-e-variant-change
board: esp32-devkitc-v4@V4
variant: esp32-devkitc-ve
project:
  board: esp32-devkitc-v4@V4
  variant: esp32-devkitc-ve
  wifi: true
  modules:
    - { breakout: gy-bme280-6pin, instance: env }
    - { breakout: rfid-rc522-blue, instance: rfid }
    - { breakout: st7735s-1.8-spi-tft, instance: tft }
    - { breakout: relay-board-4ch-transistor, instance: relays }
    - { breakout: push-button, instance: sw1 }
    - { breakout: push-button, instance: sw2 }
    - { breakout: push-button, instance: sw3 }
    - { breakout: push-button, instance: sw4 }
  locked: []
  reserved: []
expect:
  status: ok
  properties:
    - no_pad_in: [GPIO16, GPIO17, GPIO6, GPIO7, GPIO8, GPIO9, GPIO10, GPIO11, GPIO1, GPIO3]
    - outputs_not_in: [GPIO34, GPIO35, GPIO36, GPIO39]
    # 2b ruling 3: MISO is an input; the four input-only pads plus GPIO0 hold the four switches and MISO (which of them holds MISO is a tie-break, not a catalog fact)
    - signal_pad_set_equals: { signals: [sw1.SW, sw2.SW, sw3.SW, sw4.SW, bus.MISO], pads: [GPIO0, GPIO34, GPIO35, GPIO36, GPIO39] }
    - all_used: [GPIO18, GPIO19, GPIO21, GPIO22, GPIO23, GPIO25, GPIO26, GPIO27, GPIO32, GPIO33, GPIO34, GPIO35, GPIO36, GPIO39]
    - risk_tier1_equals: 4
    - risk_pads_subset_of: [GPIO0, GPIO5, GPIO13, GPIO14]
    # GPIO2/GPIO4 (strap fact in status `conflict`) cost 2, GPIO12/GPIO15 (strap + JTAG) cost 2; GPIO0/5 (strap) and GPIO13/14 (JTAG) cost 1.
    - no_pad_in: [GPIO4, GPIO2, GPIO12, GPIO15]
  warnings_include:
    - { code: FLOATING_AT_RESET_LOAD, level: warning }
    - { code: ERRATUM_GPIO_3_11, level: caution }
    - { code: I2C_PULLUP_UNKNOWN, level: caution }
    - { code: RAIL_BUDGET_UNKNOWN, level: caution }
evidence:
  - esp32-devkitc-v4-ug#note-gpio16-17-wrover
  - esp32-devkitc-v4-ug#ordering-ve
  - esp32-devkitc-v4-ug#j3-11-14
  - esp32-wrover-e-ds-v2.4#series-n8r8
  - esp32-wrover-e-ds-v2.4#sch-gpio16-psram-cs
  - esp32-wrover-e-ds-v2.4#sch-gpio17-sram-clk
  - esp32-wrover-e-ds-v2.4#pin-table-27-28-nc
  - esp32-wrover-e-ds-v2.4#up-to-24-gpios
  - esp32-ds-v5.3#psram-gpio16-ce
  - esp32-ds-v5.3#psram-gpio17-sclk
  - esp32-ds-v5.3#strap-default-config
  - esp32-trm-v5.8#gpio-strap-reg
  - esp32-wroom-32e-ds-v2.1#psram-io16-r2
derivations:
  - "WROVER-E consumes GPIO16 (PSRAM CS#) and GPIO17 (PSRAM SCLK): esp32-wrover-e-ds-v2.4#sch-gpio16-psram-cs, #sch-gpio17-sram-clk; DevKitC guide: 'boards with ESP32-WROVER modules have the pins reserved' (esp32-devkitc-v4-ug#note-gpio16-17-wrover). The catalog records this in the module `consumed` map (bonded_pads still lists them - schema gap)."
  - "Original derivation (kept for the record, superseded by 2b ruling 3 below): clean pads 10, output-capable signals 14 -> 4 on risk pads, GPIO15 priced as strap 1 -> cheapest {5,13,14,15}, tier-1 risk 4 by that count."
  - "2b ruling 3, independent hand derivation from the catalog (esp32 chip pad facts, esp32-wrover-e module consumed map, DevKitC V4 connectors; skill pin-allocation-engine step 7: each strap pad 1, each JTAG pad 1, a pad that is both counts 2; strap or reset-state fact in status conflict 2). Pad cost, exposed and not consumed by WROVER-E (GPIO6-11 flash, GPIO16/17 PSRAM; GPIO1/3 are the USB UART and excluded): 0 = GPIO18,19,21,22,23,25,26,27,32,33 (output-capable) and GPIO34,35,36,39 (input-only; ESP32 errata GPIO-3.6/3.11/3.14 are reported, not scored: worked-example rule); 1 = GPIO0 (strap), GPIO5 (strap), GPIO13 (JTAG MTCK), GPIO14 (JTAG MTMS); 2 = GPIO15 (strap + JTAG MTDO), GPIO12 (strap + JTAG MTDI), GPIO2 and GPIO4 (strap fact in conflict)."
  - "Lower bound: 18 signals (14 output-capable-or-MISO in rfid/tft/env/relays, 4 switches) and 14 zero-cost pads, so at least 4 signals sit on pads of cost >= 1; only four pads cost exactly 1 (GPIO0, 5, 13, 14), every other risk pad costs >= 2. So the optimum is 4 iff all four of those are used and nothing else; otherwise it is >= 5. Feasibility: GPIO0 can only take an input with a known level (a switch), which leaves four input-capable-only signals (3 switches + MISO) for GPIO34/35/36/39; MISO on an input-only pad is a GPIO-matrix route (SPI performance tier +1, which the higher risk tier outweighs). So tier-1 risk = 4 and the risk pads are exactly {0,5,13,14}; with the SPI3 IO_MUX plan 18/23/19 the CS lines need GPIO15 (cost 2) and the total is 5 (this is the value the fixture used to assert)."
  - "What the catalog does NOT decide: SCK/MOSI on GPIO18/23 (SPI3) or on GPIO14/13 (SPI2 IO_MUX) both reach risk 4, performance 1 (MISO via matrix), convenience 1 (GPIO0 has the onboard BOOT button) and the same headroom, so the choice is the final (connector, position) tie-break; bus.SCK/bus.MOSI/bus.MISO are therefore not asserted. Which of GPIO34/35/36/39 holds MISO is the same kind of tie."
  - "ASSUMPTION unchanged: reset_state conflict on GPIO13/GPIO14 is not counted for non-load, non-strap signals (CS/DC/RST), per the engine interpretation documented in docs/validation/phase-2b/interpretations.md. The engine optimum (risk 4, pads {0,5,13,14}) agrees with this hand derivation."
  - "ASSUMPTION flagged: tier-1 equality 4 holds if reset_state `conflict` on GPIO13/GPIO14 is not counted as 'relied on' for non-load signals (CS/DC/RST are logic inputs, not loads). If the engine counts it, this fixture's number must be re-derived by the auditor, not weakened silently."
  - "SPI3 IO_MUX pins are 18/23/19 and SPI2 (HSPI) are 14/13/12 (esp-idf-spi-master-v6.1#iomux-pins-main); not asserted as the plan, see above."
changelog:
  - "2026-10-23: created (task 2a.7, fixture-author)."
  - "2026-10-23: 2b ruling 3 (owner): risk cost re-derived (GPIO15 strap + JTAG = 2). exact bus.SCK/MOSI/MISO removed (tie-break, not a catalog fact); switches_on replaced by signal_pad_set_equals {sw1..sw4, bus.MISO} = {GPIO0,34,35,36,39}; risk_pads_subset_of changed from [5,13,14,15,2] to [0,5,13,14]; all_used extended with the input-only pads; risk_tier1_equals 4 unchanged."
