# Golden fixture 01 - ESP32-DevKitC V4 (WROOM-32E) + generic GY-BME280 4-pin + generic SSD1306 4-pin OLED on one I2C bus.
# Hand-derived from the cited documents; no engine output was consulted.
id: devkitc-wroom32e-bme280-ssd1306-i2c
board: esp32-devkitc-v4@V4
variant: esp32-devkitc-32e
project:
  board: esp32-devkitc-v4@V4
  variant: esp32-devkitc-32e
  wifi: true
  modules:
    - { breakout: gy-bme280-4pin, instance: env }
    - { breakout: ssd1306-128x64-i2c-4pin, instance: oled }
  locked: []
  reserved: []
expect:
  status: ok
  properties:
    # Both parts are I2C-only breakouts: one shared bus, SDA/SCL are shared signals.
    - interface_of: { env: i2c, oled: i2c }
    - bus_shared: [[env.SDA, oled.SDA], [env.SCL, oled.SCL]]
    # I2C on ESP32 is matrix-routed (esp32-ds-v5.3#i2c-matrix): ANY output-capable pad works; the optimum has risk tier 1 = 0.
    # Clean pads of the WROOM-32E DevKitC V4: GPIO16,17,18,19,21,22,23,25,26,27,32,33 (12). Not strap, not flash, not UART0, not input-only.
    - signal_pad_in:
        signals: [env.SDA, env.SCL]
        pads: [GPIO16, GPIO17, GPIO18, GPIO19, GPIO21, GPIO22, GPIO23, GPIO25, GPIO26, GPIO27, GPIO32, GPIO33]
    - no_pad_in: [GPIO0, GPIO1, GPIO2, GPIO3, GPIO4, GPIO5, GPIO6, GPIO7, GPIO8, GPIO9, GPIO10, GPIO11, GPIO12, GPIO13, GPIO14, GPIO15, GPIO34, GPIO35, GPIO36, GPIO39]
    - risk_tier1_equals: 0
    # Address sets {0x76,0x77} (BME280) and {0x3C,0x3D} (SSD1306) are disjoint, so no collision is possible whatever the straps are.
    - i2c_collision: none
    - no_warning_at_level: [critical]
  warnings_include:
    - { code: I2C_PULLUP_UNKNOWN, level: caution }      # gy-bme280-4pin and ssd1306-128x64-i2c-4pin: pullups.*.value_ohm status missing
    - { code: I2C_ADDRESS_UNKNOWN, level: caution }     # which SDO / SA0 level the generic boards tie is not documented
    - { code: MODULE_REGULATOR_UNKNOWN, level: caution } # both breakouts: regulator missing
    - { code: RAIL_BUDGET_UNKNOWN, level: caution }     # DevKitC V4 3V3 max_current missing; both breakouts supply_current missing
evidence:
  - esp32-devkitc-v4-ug#j3-6-10
  - esp32-devkitc-v4-ug#j2-5-8
  - esp32-devkitc-v4-ug#note-flash-pins
  - esp32-devkitc-v4-ug#ordering-32e
  - esp32-devkitc-v4-sch-v4#uart0-links
  - esp32-ds-v5.3#i2c-matrix
  - esp32-ds-v5.3#i2c-two-interfaces
  - esp32-ds-v5.3#strap-default-config
  - esp32-ds-v5.3#input-only-note
  - esp32-trm-v5.8#io-pins-output-pins
  - esp32-trm-v5.8#input-only-34-39
  - esp32-wroom-32e-ds-v2.1#gpio6-11-flash
  - esp32-wroom-32e-ds-v2.1#series-n4
  - bme280-ds-1.24#i2c-address
  - bme280-ds-1.24#i2c-sdo-float
  - bme280-ds-1.24#supply-voltage
  - bme280-ds-1.24#i2c-connection-pullups
  - ssd1306-ds-v1.1#i2c-address
  - ssd1306-ds-v1.1#i2c-sa0-level
  - ssd1306-ds-v1.1#i2c-pullups
  - ssd1306-ds-v1.1#dc-supply
derivations:
  - "Pad pool for a bidirectional open-drain I2C line on this board: header gpio pads minus GPIO1/GPIO3 (UART0 to the CP2102N bridge, esp32-devkitc-v4-sch-v4#uart0-links), minus input-only GPIO34-39 (cannot drive SDA), minus GPIO6-11 (flash, not led out: esp32-wroom-32e-ds-v2.1#gpio6-11-flash), minus strap pads GPIO0/2/4/5/12/15 (esp32-ds-v5.3#strap-default-config; GPIO4 only in the TRM) and JTAG pads GPIO13/14 which cost risk. Left: 16,17,18,19,21,22,23,25,26,27,32,33."
  - "Address check: BME280 0x76 (SDO=GND) or 0x77 (SDO=VDDIO) [bme280-ds-1.24#i2c-address]; SSD1306 0x3C (SA0 low) or 0x3D (SA0 high) [ssd1306-ds-v1.1#i2c-address]. {0x76,0x77} intersect {0x3C,0x3D} = empty -> no collision for any strap. 0x76 = 118, 0x77 = 119, 0x3C = 60, 0x3D = 61."
  - "Why Caution: gy-bme280-4pin has every board fact missing (pull-ups, regulator, SDO tie); the SSD1306 module is the same. R3 (Rp,eff within [966.7 ohm, Rp,max]) cannot be evaluated. The BME280 datasheet only recommends 4.7 kohm as a normal pull-up (a recommendation, not a device fact), so no required resistor value is asserted."
  - "Voltage check: ESP32 VOL max 0.1*3.3 = 0.33 V vs BME280 VIL max 0.2*3.3 = 0.66 V and SSD1306 VIL max 0.2*VDD; VDD = 3.3 V sits on the SSD1306 VDD upper limit (1.65-3.3 V, inclusive). No R1/R2 finding."
  - "NOT asserted: SDA = GPIO21 / SCL = GPIO22. docs/research/worked-example-esp32-devkitc.md calls these the library defaults, but the catalog has no library-default pad fact, so the engine cannot derive them (see hand-off schema gaps)."
