# Golden fixture 22 - same potentiometer locked on GPIO25 (ADC2_CH8) with Wi-Fi off: ADC2 is usable.
id: esp32-pot-adc2-no-wifi-ok
board: esp32-devkitc-v4@V4
variant: esp32-devkitc-32e
project:
  board: esp32-devkitc-v4@V4
  variant: esp32-devkitc-32e
  wifi: false
  modules:
    - { breakout: potentiometer-10k, instance: pot }
  locked:
    - { instance: pot, role: WIPER, pad: GPIO25 }
  reserved: []
expect:
  status: ok
  exact:
    pot.WIPER: GPIO25
  properties:
    - no_warning_at_level: [critical]
    - no_warning_code: [ADC2_WIFI_CONFLICT]
evidence:
  - esp32-trm-v5.8#adc2-wifi
  - esp-idf-adc-oneshot-v6.1#adc2-wifi
  - esp32-trm-v5.8#iomux-gpio25
derivations:
  - "ADC2 only conflicts while the Wi-Fi driver is active (esp32-trm-v5.8#adc2-wifi); with wifi false the ADC2_CH8 lock on GPIO25 is valid. The wiper must stay within 0-3.3 V (potentiometer-10k wired to the 3V3 rail)."
changelog:
  - "2026-10-23: created (task 2a.7, fixture-author). Counterpart of esp32-pot-adc2-wifi-unsat. no_warning_code is a proposed properties key."
