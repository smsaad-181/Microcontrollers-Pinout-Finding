# Adafruit BME280 breakout, product 2652 (STEMMA QT version, schematic "BME280 rev C"). Researcher draft reconciled with the blind audit (task 2a.4); see docs/validation/phase-2a/reconcile-bme280-mpu6050.md.
hardwired:
- strap: SDO
  value: pulled up to 3.3 V by 10 kohm (R4); solder jumper SJ1 (ADDR) to GND gives address 0x76
- strap: CSB
  value: pulled up to 3.3 V by 10 kohm (R5) through diode D2; CS pin left open keeps I2C selected
ic: bme280
id: adafruit-bme280
interfaces_exposed:
- i2c
- spi
level_shifter:
  active: false
  evidence:
  - adafruit-bme280-learn-pinouts#level-shifting
  - adafruit-product-2652#regulator-level-shift
  - adafruit-bme280-qt-sch-revc#i2c-pullups-shift
  - adafruit-bme280-qt-sch-revc#csb-sdo
  note: 'Boolean cannot express a partly shifted board. Reading true: learn guide (''all pins going into the breakout have level shifting circuitry'') and product page (''level shifting''). Reading false: the schematic shows only SCL/SDA (and SCK/SDI, same nets) shifted by BSS138 and CS isolated by diode D2 + pull-up; SDO/ADR goes straight to the sensor and is pulled up to 3.3 V by R4 (claim csb-sdo, no shifter), and as the SPI MISO output it swings 0-3.3 V, so a 5 V host sees a 3.3 V high on MISO and must not drive SDO (I2C address strap) above VDDIO + 0.3 V. Restrictive reading (false) is active. The auditor read the same topology from the Eagle file and flagged exactly this guide-vs-schematic difference. Do not read active=false as ''no shifting'': SDA, SCL, SCK, SDI and CS are shifted. Source difference: the researcher transcribed the rev C schematic image (2020-07-20, low resolution); the blind auditor parsed the Eagle file ''Adafruit BMP280 STEMMA QT.sch'' (the Downloads page says the QT version is the same PCB as the BMP280) and cross-checked the same PNG; both found the same topology.'
  readings:
  - evidence:
    - adafruit-bme280-learn-pinouts#level-shifting
    - adafruit-product-2652#regulator-level-shift
    - adafruit-bme280-qt-sch-revc#i2c-pullups-shift
    value: true
  - evidence:
    - adafruit-bme280-qt-sch-revc#csb-sdo
    value: false
  status: conflict
  transcribed: true
  value: false
notes: 'Pin order on header JP1 per schematic: Vin, 3Vo, GND, SCK, SDO, SDI, CS. 3Vo is the regulator output (up to 100 mA per learn guide), recorded as NC because it is not a signal. SCK/SDI double as I2C SCL/SDA, SDO is MISO in SPI and the address strap in I2C (the strap is pulled up on the board, so I2C address is 0x77 unless the ADDR jumper is closed). The breakout also has a STEMMA QT connector (GND, VCC, SDA, SCL) in parallel with the header, and a 10 kohm + LED power indicator. Schematic is an image: values transcribed by hand. The original non-QT board has a different regulator in its Eagle file and was not recorded here. Reconcile: pin 3Vo is stored as NC (the schema has no regulator-output role; the auditor describes it as the 3.3 V regulator output). SDO as MISO: in SPI the SDO header pin is the MISO output and is not level-shifted.'
