regulator:
  evidence:
  - adafruit-bme280-learn-pinouts#vin-regulator
  - adafruit-bme280-qt-sch-revc#regulator-u2
  note: 'U2 AP2112K-3.3 (SOT23-5, IN and EN on Vin, OUT on the 3.3 V rail) from the schematic; input range 3-5 V is Adafruit''s statement in the learn guide (''will take 3-5VDC''), not a regulator datasheet rating (AP2112K datasheet not opened; neither key asserts its absolute maximum). Learn guide also says up to 100 mA can be drawn from 3Vo. The STEMMA QT V+ pin is on the Vin net, ahead of the regulator. Source difference: the researcher transcribed the rev C schematic image (2020-07-20, low resolution); the blind auditor parsed the Eagle file ''Adafruit BMP280 STEMMA QT.sch'' (the Downloads page says the QT version is the same PCB as the BMP280) and cross-checked the same PNG; both found the same topology.'
