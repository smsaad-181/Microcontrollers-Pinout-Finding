notes: 'Optocoupler-isolated 4-channel board with a VCC/JD-VCC jumper; IN1..IN4 all map to the relay-coil load signal COIL (acts_on_level). Sources: SunFounder TS0011 (sunfounder-ts0011-4ch-relay, schematic with values R1-R4 1K, R5-R8 1K, optocoupler ''817C'', transistor marked J3Y) and the SainSmart schematic (sainsmart-4ch-relay-sch, same topology, no values). The two vendors'' boards are treated as one design on the strength of identical topology; the schematic reads are image transcriptions. POLARITY: active-low. Evidence: schematics (opto LED between VCC via R1 and IN), sunfounder-ts0011-4ch-relay#pinout-in-low and #sketch-low-active, sainsmart-4ch-relay-page#spec-active-low. CONFLICT INSIDE THE VENDOR DOC: sunfounder-ts0011-4ch-relay#features-low-off says ''When input is at low level, the relay is off, and the indicator light is on'', which contradicts its own pinout text, example sketch and schematic; the active-low reading was kept (three sources agree). RESTING LEVEL: with the input left floating no LED current flows, so the IN node sits at the opto-LED supply VCC (inferred from the schematic, not a vendor statement): a floating/high-Z MCU pin sees VCC (5 V if VCC is 5 V) on IN, and driving IN high above ~VCC-LED drops keeps the relay off. Check R1 abs max before connecting a 3.3 V MCU input at 5 V VCC. INPUT CURRENT: not documented as a number. Vendors state ''15-20mA driver current'' per channel (sunfounder-ts0011-4ch-relay#intro-low-level, sainsmart-4ch-relay-page#spec-driver-current); the schematic shows a 1K series resistor R1-R4 in the opto LED path, which has not been reconciled with that figure. No value stored. JD-VCC: with the jumper fitted the coils/drivers are powered from VCC (sunfounder-ts0011-4ch-relay#pinout-jdvcc); removing it lets a separate 5 V supply feed JD-VCC (coils and transistor drivers) while VCC feeds only the input LEDs (#schematic-jdvcc). The JD-VCC pin is listed with maps_to VCC because the pin schema has no second supply role. Coil type (0.36 W or 0.45 W) is not stated by either vendor; the engine should assume the worse-case coil current. Pin order/labels: SunFounder header drawing GND, IN1, IN2, IN3, IN4, VCC. Coil flyback diode D1-D4 present (schematics). RECONCILE 2026-10-23 (blind audit agrees with the draft on topology, polarity, JD-VCC, no regulator): regulator absent and no level shifter are inferred from drawings by both keys, so status interim, not verified. Polarity active-low is agreed by both keys (TS0011 p2, p7, schematic, SainSmart page); TS0011 p1 ''relay is off when input is low'' is a contradiction inside the document, kept as an error in favour of active low. Floating input = relay off is INFERRED (no document states it): interim, not verified. Input current: vendor wording ''15-20mA driver current'' (TS0011 p1, SainSmart page) is recorded as a vendor claim but is inconsistent with the 1K series resistor drawn in the opto LED path (audit C3) and may mean coil drive current; it is not stored as a rating (supply_current stays missing; the schema has no input-current field). TS0011 p1 also lists ''Power Supply Voltage: 5VDC, 12VDC'' (audit C2, unresolved); no relay part number appears in TS0011, the SainSmart sheet or page (audit: could-not-verify), so the ic link srd-05vdc-sl-c is an assumption for this board. TS0011 and SainSmart document this opto/JD-VCC type. No component values on the SainSmart sheet.'
