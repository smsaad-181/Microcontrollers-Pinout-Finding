level_shifter:
  evidence:
  - adafruit-ads1115-guide#logic-level
  - adafruit-ads1115-sch#parts-no-regulator
  note: Guide says to power the board at the MCU logic level; schematic part list has no level-shifter IC. I2C lines pull up to VIN, so bus levels equal the VIN voltage.
  status: interim
  value: false
notes: Based on the Adafruit ADS1115 breakout (product 1085, original version; the vendor says the schematic of the STEMMA QT version is identical). ADDR is pulled to GND by a 10K resistor on the board (schematic R3, evidence adafruit-ads1115-sch#net-addr), default I2C address 0x48 (adafruit-ads1115-guide#default-address); ADDR is brought out on a pin, so it is not hardwired and the other addresses (0x49 VDD, 0x4A SDA, 0x4B SCL) remain selectable with an external connection. ALRT is the ALERT/RDY open-drain output (optional interrupt line); A0..A3 are the sensor-side analog inputs (not microcontroller pins), so only i2c is listed as exposed. Pins A+ and A- are filtered supply/ground OUTPUTS (guide) and are not listed. The public .sch has no separate VIN/GND header pad drawn on JP1, so VIN/GND labels rest on the guide only. Blind audit (2026-10-23) read the same facts and additionally parsed the current STEMMA QT schematic (VCC to AVDD through ferrite FB3, no regulator, no level shifter, 10K pull-ups on SCL/SDA/ALERT/ADDR-to-GND all in one resistor pack); the ALRT 10K pull-up is seen in the schematic only (the guide text never mentions it). Regulator absent and no level shifter are inferred from the absence of parts in the schematic, not stated by Adafruit, hence status interim. Schematic caveat - the STEMMA QT .sch labels U1 ADS1015IDGST and the legacy .sch labels it ADS1115IDGST on the same ADS1015 deviceset (shared PCB; the fitted IC is chosen by BOM, so the IC type must not be read from the schematic value). Generic ADS1115 modules from other sellers have no vendor schematic in this record; their pull-ups, regulator and ADDR default are unknown (missing).
