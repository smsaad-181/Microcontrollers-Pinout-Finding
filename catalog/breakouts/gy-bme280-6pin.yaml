# Generic GY-BME280 6-pin module. No vendor publishes a schematic or datasheet for this generic board, so every board fact is missing. Drafted by hardware-researcher.
hardwired: []
ic: bme280
id: gy-bme280-6pin
interfaces_exposed: [i2c, spi]
level_shifter:
  evidence: []
  note: "No official schematic for the generic GY-BME280; listings disagree and are not evidence."
  status: missing
  value: null
notes: "Pin labels VCC, GND, SCL, SDA, CSB, SDO come from the task brief, not from an opened vendor document, and the exposed interfaces follow from those labels. Which of CSB and SDO are pulled or tied on the board, the regulator, level shifting and pull-ups are unknown: show a Caution and do not assume. SCL/SDA double as SPI SCK/SDI, SDO as MISO."
pins:
  - { label: VCC, maps_to: VCC }
  - { label: GND, maps_to: GND }
  - { label: SCL, maps_to: "SCL/SCK" }
  - { label: SDA, maps_to: "SDA/MOSI" }
  - { label: CSB, maps_to: CS }
  - { label: SDO, maps_to: MISO }
pullups:
  - line: SDA
    value_ohm: { evidence: [], status: missing, unit: ohm, value: null }
  - line: SCL
    value_ohm: { evidence: [], status: missing, unit: ohm, value: null }
regulator:
  evidence: []
  note: "No official schematic for the generic GY-BME280."
  status: missing
  value: null
supply_current:
  evidence: []
  status: missing
  unit: mA
