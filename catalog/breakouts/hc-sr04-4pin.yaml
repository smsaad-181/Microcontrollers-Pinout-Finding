notes: "Plain 5 V module (DC 5 V only). The datasheet describes ECHO only as a TTL level signal and gives no voltage (echo_voh missing); no schematic read. The 3.3 V variants (HC-SR04-33, HC-SR04P, RCWL-1601) are different parts and are not covered. Datasheet table row 'Working Frequency 40Hz' is a unit typo: the text and timing diagram say an eight-cycle 40 kHz burst (40 kHz is the ultrasonic carrier, not a measurement rate; suggested measurement cycle over 60 ms). Datasheet is undated and the vendor-own host was unreachable, so currency is unconfirmed."
