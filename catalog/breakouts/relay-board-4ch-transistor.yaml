notes: 'Only a vendor wiki page was readable (keyestudio-ks0058-wiki): control signal TTL voltage, ACTIVE AT HIGH LEVEL, four control pins, VCC, GND (labelled Pin 1..Pin 4 in the vendor text). The page does NOT state the driver topology, transistor, flyback diode, base resistor, input current, relay model, coil type or whether any input pull-down exists; all of that is missing. It is therefore not confirmed that this board is a transistor-driver design with a flyback diode, nor that it fits an SRD-05VDC-SL-C (the ''ic'' link is the common assumption, unverified). Polarity is active-high per the vendor wiki; that contradicts the opto board (active-low), so the engine must not share polarity between the two records. RESTING LEVEL of the inputs is undocumented (no pull-down known): treat as floating at MCU reset. Manual download requested: KS0058 PDF/schematic bundle (see hand-off).'
