notes: 'Bare momentary switch (SPST-NO). Wiring convention, not a datasheet fact: one terminal to GND, the other to an MCU input with a pull-up (internal or external), so the input reads LOW when pressed; the contact is symmetric so terminal A/B naming is arbitrary. The pin resting level is floating when released (open contact). Contact bounce (5 ms max for the Omron B3F, omron-b3f-ds-a070-e1-08#bounce) needs debouncing in firmware or hardware. Electrical limits stored on the IC record come from the Omron B3F datasheet as a representative part only.'
