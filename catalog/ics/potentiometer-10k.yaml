  evidence:
  - bourns-3386-ds-rev-12-24#power-max-v
  note: The Bourns 3386 sheet states 'Power Rating (300 volts max.)', the maximum voltage across the element, with power 0.5 W at 85 C (bourns-3386-ds-rev-12-24#power-85c). Standard resistance 10 ohm to 2 Mohm (#res-range), 10 kohm is a standard value (#res-10k), tolerance +/-10 % (#res-tol). The sheet states no wiper-current rating. Resistance is a user choice; this record is named 10k only because the request asked for a 10 kohm part.
