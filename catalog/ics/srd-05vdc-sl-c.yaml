  note: 'Value from the older Songle-branded sheet on a third-party host (secondary), which prints nominal current 71.4 mA at 20 C (coil 70 ohm). The current Songle T73 catalogue sheet states NO current: it gives 0.36 W and 69.4 ohm +/-10 % at 23 C (songle-srd-t73-v1#coil-5v-l); V/R = 72 mA is a derived number, not a rating. The 0.45 W (D) type is documented at 89.3 mA / 55 ohm (songle-srd-ds-circuitbasics#coil-5v-d-current) and 55 ohm (songle-srd-t73-v1#coil-5v-d); board vendors do not state which type they fit, so a worst case of the D type should be used when unknown. No maximum is stated (coil resistance tolerance is +/-10 %).'
