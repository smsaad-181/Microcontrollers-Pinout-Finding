# ST7735S IC record. The ST7735S datasheet is blocked for automated download (sources/manual/README.md request 2).
# Researcher values come from the ST7735 (NOT ST7735S) datasheets V2.1 / V1.9; the blind auditor also read ST7735S V1.3 from a THIRD-PARTY MIRROR
# (catalog/evidence/st7735s-ds-v1.3-mirror.yaml, secondary). Agreeing values stay interim (no fact is verified: no official ST7735S PDF yet);
# differing values (vdd_range, vio_range, supply_current) are conflicts with the most restrictive reading active.
# See docs/validation/phase-2a/reconcile-ssd1306-st7735-mfrc522.md. The ST7735 also has parallel 8/9/16/18-bit buses (IM2/IM1/IM0); the schema has no parallel kind, so only SPI is modelled.
id: st7735s
input_abs_max:
  evidence:
  - st7735-ds-v2.1#abs-max
  - st7735-ds-v1.9#abs-max
  - st7735s-ds-v1.3-mirror#abs-max
  - st7735s-ds-v1.3-mirror#abs-max-supply
  note: 'From the ST7735 datasheet (not ST7735S): VIN -0.3 to VDDI + 0.3 V; V1.9 and V2.1 agree. VDDIO means VDDI. Second independent read agrees (ST7735S V1.3, third-party mirror, secondary); verify against the official PDF when it is downloaded. The ST7735S datasheet is on the manual-download list (sources/manual/README.md request 2). ST7735S V1.3 VIN is the same -0.3 to VDDI + 0.3 V. Supply-pin ratings are not stored in this field but differ: V1.3 VDD -0.3..+4.8 V (ST7735 V2.1/V1.9: +4.6 V), VDDI +4.6 V in both.'
  status: interim
  unit: V
  value: VDDIO+0.3
interfaces:
- kind: spi
  limits:
    miso_tristate_when_deselected:
      evidence: []
      note: 'Not stated in any document read (researcher: ST7735 V2.1/V1.9; blind auditor: ST7735S V1.3). V1.3 p46 only says that after a read command the SDA line must be set to tri-state no later than the falling edge of SCL of the last bit; p24 note 2 says that with CSX=1 there is no influence to the serial interface; p35-36 list TOH output disable time 15-50 ns. The auditor''s reading that SDA is tri-stated when deselected is an inference (not stored). The module is treated as write-only by the plan (SDA is the only data line wired on the 8-pin board).'
      status: missing
      value: null
    tscyc_min_s:
      conditions:
        Ta: 25 C
        VDD: 2.6-3.3 V
        VDDI: 1.65-3.3 V
        mode: 3-line and 4-line serial write
      evidence:
      - st7735-ds-v2.1#serial-write-cycle-4line
      - st7735-ds-v1.9#serial-write-cycle-4line
      - st7735s-ds-v1.3-mirror#serial-write-cycle-3line
      - st7735s-ds-v1.3-mirror#serial-write-cycle-4line
      note: 'ST7735 (not ST7735S) datasheet TSCYCW min 66 ns, identical in V1.9 and V2.1, for both 3-line and 4-line serial. Read cycle TSCYCR min 150 ns. To be replaced by the ST7735S datasheet value. Second independent read agrees (ST7735S V1.3, third-party mirror, secondary); verify against the official PDF when it is downloaded. The ST7735S datasheet is on the manual-download list (sources/manual/README.md request 2). ST7735S V1.3 TSCYCW min 66 ns for both 3-line and 4-line (Ta 25 C, VDDI 1.65-3.7 V, VDD 2.5-4.8 V). Not stored: SCL H/L write pulse width min 15 ns in V1.3 vs 30 ns in V2.1 (the 66 ns cycle is consistent with either).'
      status: interim
      unit: s
      value: 6.6e-08
  signals:
  - dir: in
    drive: push-pull
    role: SCLK
    shareable: true
  - dir: in
    drive: push-pull
    role: MOSI
    shareable: true
  - dir: in
    drive: push-pull
    role: CS
    shareable: false
  - dir: in
    drive: push-pull
    role: DC
    shareable: false
  - dir: in
    drive: push-pull
    role: RST
    shareable: false
logic_levels:
  vih_min:
    conditions:
      VDD: 2.6-3.3 V
      VDDI: 1.65-3.3 V
    evidence:
    - st7735-ds-v2.1#dc-logic-levels
    - st7735s-ds-v1.3-mirror#dc-logic-levels
    note: 'ST7735 (not ST7735S) datasheet V2.1: 0.7 x VDDI. Second independent read agrees (ST7735S V1.3, third-party mirror, secondary); verify against the official PDF when it is downloaded. The ST7735S datasheet is on the manual-download list (sources/manual/README.md request 2).'
    status: interim
    unit: V
    value: VDDIO*0.7
  vil_max:
    conditions:
      VDD: 2.6-3.3 V
      VDDI: 1.65-3.3 V
    evidence:
    - st7735-ds-v2.1#dc-logic-levels
    - st7735s-ds-v1.3-mirror#dc-logic-levels
    note: 'ST7735 (not ST7735S) datasheet V2.1: 0.3 x VDDI. Second independent read agrees (ST7735S V1.3, third-party mirror, secondary); verify against the official PDF when it is downloaded. The ST7735S datasheet is on the manual-download list (sources/manual/README.md request 2).'
    status: interim
    unit: V
    value: VDDIO*0.3
part: ST7735S
select_strap:
  evidence:
  - st7735-ds-v2.1#pin-im2-spi4w
  - st7735s-ds-v1.3-mirror#pin-im2-spi4w
  pins:
  - IM2
  - SPI4W
  table:
  - selects: spi
    value:
      IM2: 0
      SPI4W: 0
  - selects: spi
    value:
      IM2: 0
      SPI4W: 1
supply_current:
  active:
    max: 2
    typ: 0.9
  conditions:
    Ta: 25 C
    VDD: 2.8 V
    VDDI: 1.8 V
    mode: normal, 60 Hz, all pixels black
  evidence:
  - st7735-ds-v2.1#power-consumption
  - st7735s-ds-v1.3-mirror#power-consumption
  note: 'CONFLICT between documents. Reading 1 (ST7735 V2.1, related part): IDD typ 0.5 / max 0.7 mA (VDD 2.8 V, VDDI 1.8 V, Ta 25 C, 60 Hz, normal mode). Reading 2 (ST7735S V1.3, third-party mirror, the actual part): IDD typ 0.9 / max 2 mA (typ at VDD 2.75 V, VDDI 1.8 V; max at VDD 2.5-4.8 V, VDDI 1.65-3.7 V; V1.3 also lists 0.8 / 2 mA in Partial + Idle mode). IDDI typ 0.01 / max 0.02 mA in both. Active = the higher current (most restrictive for a power budget). Both readings are secondary / unofficial sources; verify against the official ST7735S PDF when it is downloaded. Excludes the LED backlight (module-level load).'
  readings:
  - evidence:
    - st7735-ds-v2.1#power-consumption
    value:
      max: 0.7
      typ: 0.5
  - evidence:
    - st7735s-ds-v1.3-mirror#power-consumption
    value:
      max: 2
      typ: 0.9
  status: conflict
  unit: mA
  value:
    max: 2
    typ: 0.9
vdd_range:
  active:
  - 2.6
  - 3.3
  evidence:
  - st7735-ds-v2.1#dc-supply
  - st7735s-ds-v1.3-mirror#dc-supply
  note: 'CONFLICT between documents. Reading 1 (ST7735 V2.1, related part): VDD (analog) 2.6-3.3 V. Reading 2 (ST7735S V1.3, third-party mirror, the actual part): 2.5 (min) / 2.75 (typ) / 4.8 (max) V; V1.3 abs max VDD +4.8 V (V2.1: +4.6 V). Active = the narrower range [2.6, 3.3], which lies inside both, so no engine rule can over-estimate headroom. Verify against the official ST7735S PDF when it is downloaded.'
  readings:
  - evidence:
    - st7735-ds-v2.1#dc-supply
    value:
    - 2.6
    - 3.3
  - evidence:
    - st7735s-ds-v1.3-mirror#dc-supply
    value:
    - 2.5
    - 4.8
  status: conflict
  unit: V
  value:
  - 2.6
  - 3.3
vendor: Sitronix
vio_range:
  active:
  - 1.65
  - 3.3
  evidence:
  - st7735-ds-v2.1#dc-supply
  - st7735s-ds-v1.3-mirror#dc-supply-vddi
  note: 'CONFLICT between documents. Reading 1 (ST7735 V2.1, related part): VDDI 1.65-3.3 V, VDDI must not exceed VDD. Reading 2 (ST7735S V1.3, third-party mirror, the actual part): 1.65 / 1.8 (typ) / 3.7 V; abs max VDDI +4.6 V in both. Active = max 3.3 V (most restrictive); 5 V logic is outside both readings. Verify against the official ST7735S PDF when it is downloaded.'
  readings:
  - evidence:
    - st7735-ds-v2.1#dc-supply
    value:
    - 1.65
    - 3.3
  - evidence:
    - st7735s-ds-v1.3-mirror#dc-supply-vddi
    value:
    - 1.65
    - 3.7
  status: conflict
  unit: V
  value:
  - 1.65
  - 3.3
