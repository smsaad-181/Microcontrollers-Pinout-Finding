# Evidence: Solomon Systech SSD1306 datasheet Rev 1.1 (Apr 2008) only; see catalog/evidence/ssd1306-ds-v1.1.yaml.
# Parallel 6800/8080 buses exist on the IC (Table 7-1) but are not modelled: the schema has no parallel interface kind.
id: ssd1306
input_abs_max: { evidence: ["ssd1306-ds-v1.1#abs-max"], status: single-source, unit: V, value: "VDDIO+0.3", note: "Datasheet: Vin = VSS-0.3 to VDD+0.3 V. The SSD1306 has one logic supply (VDD), so VDDIO means VDD here." }
interfaces:
  - kind: i2c
    limits:
      addresses:
        - { strap: "SA0=LOW (D/C# pin)", value: 60 } # 0x3C
        - { strap: "SA0=HIGH (D/C# pin)", value: 61 } # 0x3D
      max_hz: { evidence: [], status: missing, unit: Hz, value: null, note: "No kHz rating is printed. Table 13-6 gives tcycle min 2.5 us (claim ssd1306-ds-v1.1#i2c-timing) and tR/tF max 300 ns; a frequency would be derived, so it is not stored as a fact." }
    signals:
      - { dir: io, drive: open-drain, role: SDA, shareable: true }
      - { dir: in, drive: open-drain, role: SCL, shareable: true }
  - kind: spi
    limits:
      tscyc_min_s: { conditions: { mode: "4-wire serial", VDD: "1.65-3.3 V", TA: "25 C" }, evidence: ["ssd1306-ds-v1.1#spi-4wire-timing"], status: single-source, unit: s, value: 1.0e-7, note: "Datasheet value 100 ns (Table 13-4). 3-wire serial is also 100 ns (Table 13-5)." }
    signals:
      - { dir: in, drive: push-pull, role: SCLK, shareable: true }
      - { dir: in, drive: push-pull, role: MOSI, shareable: true }
      - { dir: in, drive: push-pull, role: CS, shareable: false }
      - { dir: in, drive: push-pull, role: DC, shareable: false }
      - { dir: in, drive: push-pull, role: RES, shareable: false }
logic_levels:
  vih_min: { conditions: { VDD: "1.65-3.3 V", TA: "25 C" }, evidence: ["ssd1306-ds-v1.1#dc-logic-levels"], status: single-source, unit: V, value: "VDDIO*0.8", note: "Datasheet: 0.8 x VDD." }
  vil_max: { conditions: { VDD: "1.65-3.3 V", TA: "25 C" }, evidence: ["ssd1306-ds-v1.1#dc-logic-levels"], status: single-source, unit: V, value: "VDDIO*0.2", note: "Datasheet: 0.2 x VDD." }
part: SSD1306
select_strap:
  evidence: ["ssd1306-ds-v1.1#bus-select-table"]
  pins: [BS0, BS1, BS2]
  table:
    - { selects: i2c, value: { BS0: 0, BS1: 1, BS2: 0 } }
    - { selects: spi, value: { BS0: 0, BS1: 0, BS2: 0 } } # 4-wire serial
    - { selects: spi, value: { BS0: 1, BS1: 0, BS2: 0 } } # 3-wire serial
supply_current: { conditions: { VDD: "2.8 V", VCC: "12 V", IREF: "12.5 uA", load: "no panel load, display ON, all pixels ON" }, evidence: ["ssd1306-ds-v1.1#dc-supply-current"], status: single-source, unit: mA, value: { max: 0.78, typ: 0.43 }, note: "This is ICC (the VCC panel supply) of the controller without a panel. IDD (VDD) is separate: typ 0.05 mA, max 0.15 mA. A real panel draws more." }
vdd_range: { conditions: { TA: "25 C" }, evidence: ["ssd1306-ds-v1.1#dc-supply"], status: single-source, unit: V, value: [1.65, 3.3], note: "VDD logic supply. Panel supply VCC operating 7-15 V (abs max 0-16 V) is not representable in this field." }
vendor: Solomon Systech
vio_range: { conditions: { TA: "25 C" }, evidence: ["ssd1306-ds-v1.1#dc-supply"], status: single-source, unit: V, value: [1.65, 3.3], note: "No separate VDDIO pin: the single VDD supply (1.65-3.3 V) is also the logic I/O supply." }
