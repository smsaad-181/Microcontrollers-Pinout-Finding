id: ads1115
input_abs_max:
  conditions:
    pins: SDA, SCL, ADDR, ALERT/RDY (digital inputs)
  evidence:
  - ads1115-ds-sbas444e#absmax-digital
  note: Digital pins only. Analog inputs AIN0..AIN3 are limited to VDD + 0.3 V absolute maximum (ads1115-ds-sbas444e#absmax-analog); that limit is not expressible in this single field.
  reviewers:
  - hardware-researcher
  - hardware-fact-auditor
  status: verified
  unit: V
  value: 5.5
interfaces:
- kind: i2c
  limits:
    addresses:
    - strap: ADDR=GND
      value: 72
    - strap: ADDR=VDD
      value: 73
    - strap: ADDR=SDA
      value: 74
    - strap: ADDR=SCL
      value: 75
    i2c_modes:
    - sm
    - fm
    - hs
    max_hz:
      conditions:
        VDD_V: 2.0 to 5.5
        mode: high-speed (Hs), must be activated by an Hs controller code
      evidence:
      - ads1115-ds-sbas444e#timing-fscl
      - ads1115-ds-sbas444e#i2c-hs-mode
      note: 'Standard mode 100 kHz and fast mode 400 kHz need no special action (evidence ads1115-ds-sbas444e#i2c-speed-modes). Addresses 0x48/0x49/0x4A/0x4B: ads1115-ds-sbas444e#i2c-address-table; ADDR=SDA needs SDA held low >= 100 ns after SCL falls (#i2c-address-sda-note).'
      reviewers:
      - hardware-researcher
      - hardware-fact-auditor
      status: verified
      unit: Hz
      value: 3400000
  signals:
  - dir: io
    drive: open-drain
    role: SDA
    shareable: true
  - dir: in
    drive: open-drain
    role: SCL
    shareable: true
- kind: digital
  limits: {}
  signals:
  - dir: out
    drive: open-drain
    role: ALERT
    shareable: false
- kind: analog
  limits:
    analog_range_v:
      conditions:
        VIN: V(AINP) - V(AINN)
        setting: widest PGA full-scale range
      evidence:
      - ads1115-ds-sbas444e#rec-fsr
      - ads1115-ds-sbas444e#pga-fsr-list
      note: 'This is the programmable full-scale differential range (+/-6.144 V ... +/-0.256 V), NOT an input-voltage limit. The datasheet restricts each AINx to GND .. VDD recommended and GND-0.3 .. VDD+0.3 V absolute (ads1115-ds-sbas444e#rec-ain-abs, #absmax-analog), so with VDD=3.3 V the usable input is 0..3.3 V single-ended whatever the PGA.'
      reviewers:
      - hardware-researcher
      - hardware-fact-auditor
      status: verified
      unit: V
      value:
      - -6.144
      - 6.144
  signals:
  - dir: in
    drive: push-pull
    role: AIN0
    shareable: false
  - dir: in
    drive: push-pull
    role: AIN1
    shareable: false
  - dir: in
    drive: push-pull
    role: AIN2
    shareable: false
  - dir: in
    drive: push-pull
    role: AIN3
    shareable: false
logic_levels:
  vih_min:
    evidence:
    - ads1115-ds-sbas444e#elec-vih
    note: 0.7 VDD, max 5.5 V
    reviewers:
    - hardware-researcher
    - hardware-fact-auditor
    status: verified
    value: VDD*0.7
  vil_max:
    evidence:
    - ads1115-ds-sbas444e#elec-vil
    note: 0.3 VDD
    reviewers:
    - hardware-researcher
    - hardware-fact-auditor
    status: verified
    value: VDD*0.3
  vol_max:
    conditions:
      IOL_mA: 3
    evidence:
    - ads1115-ds-sbas444e#elec-vol
    note: ALERT/RDY and SDA open-drain low level; typ 0.15 V; no VOH (open-drain, external pull-up)
    reviewers:
    - hardware-researcher
    - hardware-fact-auditor
    status: verified
    unit: V
    value: 0.4
part: ADS1115
supply_current:
  conditions:
    FSR_V: 2.048
    VDD_V: 3.3
    data_rate_SPS: 8
    mode: operating (continuous conversion)
  evidence:
  - ads1115-ds-sbas444e#elec-idd
  note: 'typ 150 uA at TA=25 C; max 200 uA at 25 C, 300 uA over -40..125 C (max recorded = 300 uA). Power-down: typ 0.5 uA, max 2 uA at 25 C, 5 uA over temperature.'
  reviewers:
  - hardware-researcher
  - hardware-fact-auditor
  status: verified
  unit: mA
  value:
    max: 0.3
    typ: 0.15
vdd_range:
  evidence:
  - ads1115-ds-sbas444e#rec-vdd
  note: 'Single-supply part: no separate I/O supply pin (Table 4-1 lists only VDD).'
  reviewers:
  - hardware-researcher
  - hardware-fact-auditor
  status: verified
  unit: V
  value:
  - 2.0
  - 5.5
vendor: Texas Instruments
vio_range:
  evidence:
  - ads1115-ds-sbas444e#rec-vdd
  note: No separate VIO pin; digital I/O is powered from VDD, so the I/O supply range is the VDD range. Digital inputs tolerate up to 5.5 V regardless of VDD (ads1115-ds-sbas444e#absmax-digital).
  status: single-source
  unit: V
  value:
  - 2.0
  - 5.5
