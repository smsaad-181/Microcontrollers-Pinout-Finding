vdd_range:
  evidence: []
  note: 'Missing by design: a push button is passive and has no supply pin, so vdd_range does not apply. The earlier placeholder [3, 24] V was the Omron B3F CONTACT RATING (1-50 mA at 3-24 VDC resistive load; B3F-G 100 uA-50 mA; claim omron-b3f-ds-a070-e1-08#rating), a switching-load limit, not a supply range, and 24 VDC is not a GPIO-safe level. Researcher placeholder and blind auditor (could-not-verify) agree the datasheet states no supply requirement. Other B3F facts kept in notes because the schema has no field: minimum applicable load 10 uA at 1 VDC (#min-load); SPST-NO (#contact-form); contact resistance 100 mohm max (#contact-res); bounce 5 ms max, make/break not stated (#bounce).'
  status: missing
  unit: V
  value: null
