onboard:
  - {"effect": "LED1 on GPIO2: +3V3 -> R5 2 kohm -> LED -> GPIO2, so the LED is lit when GPIO2 is low; the pin map tags header pin 2 as LED.", "evidence": ["lolin-d1-mini-v4-sch#led", "lolin-d1-mini-v4-ug#pinmap-right"], "part": "LED1 LED_0603_B with R5 2k", "uses_pad": ["GPIO2"]}
  - {"effect": "USB-serial bridge: its TXD drives the RX net (GPIO3) and its RXD is driven from the TX net (GPIO1, through R8 470 ohm); used for flashing and the console.", "evidence": ["lolin-d1-mini-v4-sch#usb-bridge", "lolin-d1-mini-v4-sch#uart-link"], "part": "U4 CH340C USB-serial bridge", "uses_pad": ["GPIO1", "GPIO3"]}
  - {"effect": "Bridge RTS/DTR are cross-coupled through the transistor pair to RST and IO0 (GPIO0): the topology of a standard esptool auto-reset / download-mode circuit (function name inferred from the schematic figure; the schematic does not label it; the auditor made the same inference).", "evidence": ["lolin-d1-mini-v4-sch#auto-program"], "part": "U5 UMH3N transistor pair", "uses_pad": ["GPIO0"]}
  - {"effect": "12 kohm pull-ups to +3V3 on GPIO0 (R9) and GPIO2 (R10).", "evidence": ["lolin-d1-mini-v4-sch#pull-resistors"], "part": "R9, R10 12k pull-up resistors", "uses_pad": ["GPIO0", "GPIO2"]}
  - {"effect": "12 kohm pull-down to GND on GPIO15 (R11).", "evidence": ["lolin-d1-mini-v4-sch#pull-resistors"], "part": "R11 12k pull-down resistor", "uses_pad": ["GPIO15"]}
  - {"effect": "A0 header pin -> R12 220 kohm -> TOUT/ADC node; R13 100 kohm from the node to GND (the product page states 3.2 V max input at A0).", "evidence": ["lolin-d1-mini-v4-sch#adc-divider", "lolin-d1-mini-v4-ug#features-adc", "lolin-d1-mini-v4-ug#spec-adc"], "part": "R12 220k / R13 100k A0 divider", "uses_pad": ["TOUT"]}
  - {"effect": "Solder jumper JP1 (symbol name JUMP_2_NO, i.e. normally open; inferred from the symbol name) in series with R14 470 ohm links RST to GPIO16 (deep-sleep wake) once bridged.", "evidence": ["lolin-d1-mini-v4-sch#rst-io16"], "part": "JP1 jumper and R14 470 ohm", "uses_pad": ["GPIO16"]}
  - {"effect": "4-pin I2C connector (GND, SDA, SCL, 3V3) wired in parallel to header pins GPIO4 (SDA) and GPIO5 (SCL); modelled here, not as a connector, because a pad cannot sit on two connector pins.", "evidence": ["lolin-d1-mini-v4-sch#i2c-port", "lolin-d1-mini-v4-ug#pinmap-i2c", "lolin-d1-mini-v4-ug#features-i2c"], "part": "P1 SH1.0 4-pin I2C connector", "uses_pad": ["GPIO4", "GPIO5"]}
  - {"effect": "Flash bus: GPIO6-GPIO11 are wired only to the SPI flash U3 and are not led out.", "evidence": ["lolin-d1-mini-v4-sch#flash-pads", "lolin-d1-mini-v4-sch#flash-part", "lolin-d1-mini-v4-ug#spec-flash"], "part": "U3 SPI flash (4 MB per product page)", "uses_pad": ["GPIO6", "GPIO7", "GPIO8", "GPIO9", "GPIO10", "GPIO11"]}
  - {"effect": "SW1 pulls the RST net to GND: RST is chip pin 32 EXT_RSTB (R7 12 kohm to +3V3, C14 100 nF to GND). CHIP_EN (pin 7) only has R4 12 kohm to +3V3 and is not routed to the button or to a header pin; no GPIO. (Corrected in reconcile: the draft said the RST net included CHIP_EN; re-read of the schematic figure confirms the auditor.)", "evidence": ["lolin-d1-mini-v4-sch#reset-circuit", "lolin-d1-mini-v4-ug#pinmap-rst-button"], "part": "SW1 reset button, C14 100 nF", "uses_pad": []}
