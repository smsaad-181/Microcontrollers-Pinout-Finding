# WEMOS/LOLIN D1 mini V4.0.0 - reconciled (task 2a.4, docs/validation/phase-2a/reconcile-esp8266-d1mini.md): logic_voltage and the 3V3 voltage are verified, rail currents and the VBUS voltage are missing.
# Sources: product page https://www.wemos.cc/en/latest/d1/d1_mini.html (pin map is an image only: transcribed by hand), schematic sch_d1_mini_v4.0.0.pdf.
# Connectors: J2 (left) / J3 (right) are the schematic reference designators; position 1 is the end next to the antenna (the
#   figure shows the USB-C port at the bottom). Labels are the labels printed in the official V4.0.0 pin-map figure: RST, A0, 16, 14, 12,
#   13, 15, 3.3V (left) and TX, RX, 5, 4, 0, 2, GND, VBUS (right). The V4.0.0 figure prints NO D0-D8 labels (page text only says
#   "except D0"), so no D-label is recorded. Secondary tags in the figure: SCK=14, MISO=12, MOSI=13, SCL=5, SDA=4, LED=2.
# Header pins A0 -> chip pad TOUT (catalog-internal pad number 17, see chips/esp8266ex.yaml header).
# The 4-pin I2C connector P1 and the reset button are board parts (onboard), not connector pins: GPIO4/GPIO5 are already on J3.
# Divider (transcribed): A0 -> R12 220k -> TOUT node -> R13 100k -> GND. The page states 3.2 V max at A0; the ratio is not stored as a fact.
# `status` is the value the catalog CLI computes.
connectors:
  - {"id": "J2", "pins": [{"kind": "reset", "label": "RST", "position": 1}, {"kind": "gpio", "label": "A0", "pad": "TOUT", "position": 2}, {"kind": "gpio", "label": "16", "pad": "GPIO16", "position": 3}, {"kind": "gpio", "label": "14", "pad": "GPIO14", "position": 4}, {"kind": "gpio", "label": "12", "pad": "GPIO12", "position": 5}, {"kind": "gpio", "label": "13", "pad": "GPIO13", "position": 6}, {"kind": "gpio", "label": "15", "pad": "GPIO15", "position": 7}, {"kind": "power", "label": "3.3V", "position": 8, "rail": "3V3"}], "side": "left"}
  - {"id": "J3", "pins": [{"kind": "gpio", "label": "TX", "pad": "GPIO1", "position": 1}, {"kind": "gpio", "label": "RX", "pad": "GPIO3", "position": 2}, {"kind": "gpio", "label": "5", "pad": "GPIO5", "position": 3}, {"kind": "gpio", "label": "4", "pad": "GPIO4", "position": 4}, {"kind": "gpio", "label": "0", "pad": "GPIO0", "position": 5}, {"kind": "gpio", "label": "2", "pad": "GPIO2", "position": 6}, {"kind": "ground", "label": "GND", "position": 7}, {"kind": "power", "label": "VBUS", "position": 8, "rail": "VBUS"}], "side": "right"}
