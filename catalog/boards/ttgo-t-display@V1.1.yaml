# TTGO T-Display V1.1 (task boards-1). Sources: LilyGO README and pinmap image (maker repository, commit 6f89cdd) plus the schematic PDF (label evidence only). The pinmap is an image: header rows are transcribed (USB at the bottom; rows numbered top to bottom).
# Header labels are the numbers/names printed in the pinmap; 37/38 are GPIO37/GPIO38. The blind audit read the schematic visually: header order matches the pinmap, U4 CP2104 bridge and U7 AP2112K-3.3 regulator are evidenced.
# Module: bare ESP32 plus external 4 MB flash, modelled as ttgo-t-display-core (no RF module datasheet applies).
# Two keys (hardware-researcher, hardware-fact-auditor); audit corrections applied. Facts not both-key agreed (logic voltage inferred, rail currents) stay single-source/missing.
