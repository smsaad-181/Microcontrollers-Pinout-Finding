id: "ttgo-t-display"
logic_voltage:
  evidence:
    - "lilygo-ttgo-t-display-pinmap#left-b"
  note: "Inferred from the 3V3 rail pin label and the VDD3V3 supply net of the ESP32; no document states a logic voltage in words."
  status: "single-source"
  unit: "V"
  value: 3.3
name: "TTGO T-Display"
numbering:
  primary: "gpio"
onboard:
  - effect: "Display MOSI 19, SCLK 18, CS 5, DC 16, RST 23, backlight 4 (no MISO); pads are not free for other use."
    evidence:
      - "lilygo-ttgo-t-display-readme#driver"
      - "lilygo-ttgo-t-display-readme#tft-pins"
      - "lilygo-ttgo-t-display-readme#miso"
      - "lilygo-ttgo-t-display-pinmap#lcd"
      - "lilygo-ttgo-t-display-sch#lcd-nets"
    part: "ST7789V 1.14 in IPS display (135x240, SPI)"
    uses_pad:
      - "GPIO4"
      - "GPIO5"
      - "GPIO16"
      - "GPIO18"
      - "GPIO19"
      - "GPIO23"
  - effect: "GPIO0 is the boot-mode strapping pad (button also used for download mode); GPIO35 is input-only with no internal pull."
    evidence:
      - "lilygo-ttgo-t-display-readme#buttons"
      - "lilygo-ttgo-t-display-pinmap#btns"
    part: "Button 1 (GPIO35) and Button 2 (GPIO0)"
    uses_pad:
      - "GPIO0"
      - "GPIO35"
  - effect: "GPIO34 reads the battery divider; input-only, not on the header."
    evidence:
      - "lilygo-ttgo-t-display-readme#adc-in"
    part: "Battery voltage divider (ADC_IN)"
    uses_pad:
      - "GPIO34"
  - effect: "README names GPIO14 \"ADC Power\" (enables the battery-measurement path); circuit not read."
    evidence:
      - "lilygo-ttgo-t-display-readme#adc-power"
    part: "ADC power control"
    uses_pad:
      - "GPIO14"
