id: "ttgo-t-display"
logic_voltage:
  evidence:
    - "lilygo-ttgo-t-display-pinmap#left-b"
  note: "Inferred from the 3V3 rail pin label and the VDD3V3 supply net of the ESP32; no document states a logic voltage in words."
  status: "single-source"
  unit: "V"
  value: 3.3
name: "TTGO T-Display"
numbering:
  primary: "gpio"
onboard:
  - effect: "Display MOSI 19, SCLK 18, CS 5, DC 16, RST 23, backlight 4 (no MISO); pads are not free for other use."
    evidence:
      - "lilygo-ttgo-t-display-readme#driver"
      - "lilygo-ttgo-t-display-readme#tft-pins"
      - "lilygo-ttgo-t-display-readme#miso"
      - "lilygo-ttgo-t-display-pinmap#lcd"
      - "lilygo-ttgo-t-display-sch#lcd-nets"
    part: "ST7789V 1.14 in IPS display (135x240, SPI)"
    uses_pad:
      - "GPIO4"
      - "GPIO5"
      - "GPIO16"
      - "GPIO18"
      - "GPIO19"
      - "GPIO23"
  - effect: "GPIO0 is the boot-mode strapping pad (button also used for download mode); GPIO35 is input-only with no internal pull but has an external R1 100 K pull-up to VDD3V3. Both buttons have 100 nF to GND (C3 on GPIO0, C11 on GPIO35)."
    evidence:
      - "lilygo-ttgo-t-display-readme#buttons"
      - "lilygo-ttgo-t-display-pinmap#btns"
      - "lilygo-ttgo-t-display-sch#key1-r1"
    part: "Button 1 (GPIO35) and Button 2 (GPIO0)"
    uses_pad:
      - "GPIO0"
      - "GPIO35"
  - effect: "GPIO34 reads the battery divider (R6/R7 100 K/100 K from BAT, reads BAT/2; not switched); input-only, not on the header."
    evidence:
      - "lilygo-ttgo-t-display-readme#adc-in"
      - "lilygo-ttgo-t-display-sch#bat-divider"
    part: "Battery voltage divider (ADC_IN)"
    uses_pad:
      - "GPIO34"
  - effect: "PWR_EN: via Q3 switches P-FET Q6 (VDD3V3 to V3V rail feeding the LCD-line pull-ups) and Q4 (battery path); the BAT/2 divider on GPIO34 is not switched. README calls it \"ADC Power\" (quote only)."
    evidence:
      - "lilygo-ttgo-t-display-readme#adc-power"
      - "lilygo-ttgo-t-display-sch#pwr-en"
      - "lilygo-ttgo-t-display-sch#q3-pmbt3904"
    part: "PWR_EN power switch (Q3, Q4, Q6)"
    uses_pad:
      - "GPIO14"
  - effect: "Input-only SENSOR_CAPP/CAPN pads: 270 pF couples 36 to 37 (C49) and 38 to 39 (C32), so signals cross-couple and fast edges are loaded."
    evidence:
      - "lilygo-ttgo-t-display-sch#cap-270pf"
    part: "Sensor coupling capacitors C49, C32"
    uses_pad:
      - "GPIO36"
      - "GPIO37"
      - "GPIO38"
      - "GPIO39"
  - effect: "UART0 TX/RX wired to the USB bridge (used for flashing and console); Q1/Q2 auto-program drive CHIP_PU and GPIO0."
    evidence:
      - "lilygo-ttgo-t-display-sch#uart0-nets"
      - "lilygo-ttgo-t-display-sch#q3-pmbt3904"
    part: "U4 CP2104 USB-to-UART bridge, Q1/Q2 auto-program"
    uses_pad:
      - "GPIO0"
      - "GPIO1"
      - "GPIO3"
