# Waveshare ESP32-S3-Zero (and -M with pin headers; same board). Chip ESP32-S3FH4R2 used bare. No revision is printed on the wiki or the schematic, so the revision is "unversioned". One key; every fact is single-source.
# Sources: Waveshare wiki page (text + the Pinout picture, transcribed) and the schematic PDF (header P15 read from the rendered drawing).
# Connector P15 = the 18 castellated pads in schematic numbering (1 TX ... 18 VBUS/5V). Connector PADS = the 11 extra pads shown in the wiki pinout picture (front bottom GP16/15/14, back GP45/42/41/40/39/38/18/17); their positions are my row order in that picture (no printed numbering) and are transcribed.
# GPIO0 (BOOT), GPIO19/GPIO20 (USB), GPIO21 (RGB LED) have no pad. GPIO33-GPIO37 are not led out. GPIO26-GPIO32 are in-package flash/PSRAM (module record).
# Gap: the wiki says GPIO33-GPIO37 are "reserved for Octal PSRAM" although the FH4R2 has Quad PSRAM; recorded as a note, no catalog fact depends on it.
connectors:
  - id: "P15"
    pins:
      - {"kind": "gpio", "label": "TX", "pad": "GPIO43", "position": 1}
      - {"kind": "gpio", "label": "RX", "pad": "GPIO44", "position": 2}
      - {"kind": "gpio", "label": "13", "pad": "GPIO13", "position": 3}
      - {"kind": "gpio", "label": "12", "pad": "GPIO12", "position": 4}
      - {"kind": "gpio", "label": "11", "pad": "GPIO11", "position": 5}
