      - {"kind": "gpio", "label": "5", "pad": "GPIO5", "position": 11}
      - {"kind": "gpio", "label": "4", "pad": "GPIO4", "position": 12}
      - {"kind": "gpio", "label": "3", "pad": "GPIO3", "position": 13}
      - {"kind": "gpio", "label": "2", "pad": "GPIO2", "position": 14}
      - {"kind": "gpio", "label": "1", "pad": "GPIO1", "position": 15}
      - {"kind": "power", "label": "3V3", "position": 16, "rail": "3V3"}
      - {"kind": "ground", "label": "GND", "position": 17}
      - {"kind": "power", "label": "5V", "position": 18, "rail": "5V"}
  - id: "PADS"
    pins:
      - {"kind": "gpio", "label": "16", "pad": "GPIO16", "position": 1}
      - {"kind": "gpio", "label": "15", "pad": "GPIO15", "position": 2}
      - {"kind": "gpio", "label": "14", "pad": "GPIO14", "position": 3}
      - {"kind": "gpio", "label": "45", "pad": "GPIO45", "position": 4}
      - {"kind": "gpio", "label": "42", "pad": "GPIO42", "position": 5}
      - {"kind": "gpio", "label": "41", "pad": "GPIO41", "position": 6}
      - {"kind": "gpio", "label": "40", "pad": "GPIO40", "position": 7}
      - {"kind": "gpio", "label": "39", "pad": "GPIO39", "position": 8}
      - {"kind": "gpio", "label": "38", "pad": "GPIO38", "position": 9}
      - {"kind": "gpio", "label": "18", "pad": "GPIO18", "position": 10}
      - {"kind": "gpio", "label": "17", "pad": "GPIO17", "position": 11}
