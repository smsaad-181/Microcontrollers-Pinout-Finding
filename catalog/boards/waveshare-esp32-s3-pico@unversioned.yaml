# Waveshare ESP32-S3-Pico (Raspberry-Pi-Pico form factor, 40 castellated pins). Chip ESP32-S3R2 (2 MB Quad PSRAM in the package) used bare with a 16 MB W25Q128 flash on the board. No revision printed; revision "unversioned". One key; every fact is single-source.
# Sources: Waveshare wiki page (text + the pinout picture, transcribed) and the schematic PDF (PIN OUT block of sheet 1 read from the rendered drawing; both agree).
# Connector J: positions 1-40 are the printed Pico pin numbers (1-20 on one side, 21-40 on the other). GP label = chip GPIO number. Pin 30 is CHIP_PU (printed RUN), pin 37 3V3_EN (kind enable). VSYS and VBUS are separate rails; their voltages are not stated -> VSYS missing.
# Connector TP: five test pads (D_N = GPIO19, D_P = GPIO20, GP3, GP21, GP0) in the wiki picture order (left to right); positions are my order and are transcribed. GPIO43/GPIO44 (CH343 UART) have no pad.
# GPIO3 sits on the VBUS divider (USB_ADC) and is a strapping pin; GPIO21 drives the RGB LED.
# Gap: the "27 multi-function GPIO pins" count and the extra TP pads are not cross-checked beyond the picture.
