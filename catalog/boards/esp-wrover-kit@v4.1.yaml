id: "esp-wrover-kit"
logic_voltage:
  evidence:
    - "esp-wrover-kit-v4.1-ug#ldo"
    - "esp-wrover-kit-v4.1-ug#spi-3v3"
  status: "single-source"
  unit: "V"
  value: 3.3
name: "ESP-WROVER-KIT"
numbering:
  primary: "gpio"
onboard:
  - effect: "LED loads on GPIO0 and GPIO2 (boot-mode strapping pads) and GPIO4."
    evidence:
      - "esp-wrover-kit-v4.1-ug#rgb-led"
    part: "RGB LED (red GPIO0, green GPIO2, blue GPIO4)"
    uses_pad:
      - "GPIO0"
      - "GPIO2"
      - "GPIO4"
  - effect: "Pulls GPIO0 low; with EN selects firmware download mode."
    evidence:
      - "esp-wrover-kit-v4.1-ug#boot-button"
      - "esp-wrover-kit-v4.1-ug#jp1-row-13"
    part: "SW2 BOOT button"
    uses_pad:
      - "GPIO0"
  - effect: "Pads are wired to the camera header; free for other use only when nothing is plugged into JP4."
    evidence:
      - "esp-wrover-kit-v4.1-ug#cam-1"
      - "esp-wrover-kit-v4.1-ug#cam-2"
      - "esp-wrover-kit-v4.1-ug#cam-3"
      - "esp-wrover-kit-v4.1-ug#cam-4"
      - "esp-wrover-kit-v4.1-ug#cam-unused-note"
    part: "Camera connector JP4 (OV7670)"
    uses_pad:
      - "GPIO0"
      - "GPIO4"
      - "GPIO5"
      - "GPIO18"
      - "GPIO19"
      - "GPIO21"
      - "GPIO22"
      - "GPIO23"
      - "GPIO25"
      - "GPIO26"
      - "GPIO27"
      - "GPIO34"
      - "GPIO35"
      - "GPIO36"
      - "GPIO39"
  - effect: "LCD RESET/SCL/D-C/CS/SDA/SDO/Backlight; GPIO21 is shared with the SD card detect (R167)."
    evidence:
      - "esp-wrover-kit-v4.1-ug#lcd"
      - "esp-wrover-kit-v4.1-ug#sd-cd-r167"
    part: "3.2 in SPI LCD (U5)"
    uses_pad:
      - "GPIO5"
      - "GPIO18"
      - "GPIO19"
      - "GPIO21"
      - "GPIO22"
      - "GPIO23"
      - "GPIO25"
  - effect: "SD DATA0-3/CMD/CLK on strapping pads GPIO2/GPIO12/GPIO15; GPIO21 is card detect."
    evidence:
      - "esp-wrover-kit-v4.1-ug#sd-1"
      - "esp-wrover-kit-v4.1-ug#sd-2"
      - "esp-wrover-kit-v4.1-ug#sd-cd-r167"
    part: "microSD card slot J4"
    uses_pad:
      - "GPIO2"
      - "GPIO4"
      - "GPIO12"
      - "GPIO13"
      - "GPIO14"
      - "GPIO15"
      - "GPIO21"
  - effect: "Pads reach the FT2232HL JTAG channel only when the JP2 jumpers are fitted; open by default."
    evidence:
      - "esp-wrover-kit-v4.1-ug#jtag-pins"
      - "esp-wrover-kit-v4.1-ug#jtag-default"
    part: "JTAG header JP2 (jumper-selected)"
    uses_pad:
      - "GPIO12"
      - "GPIO13"
      - "GPIO14"
      - "GPIO15"
  - effect: "ESP32 UART0 TX/RX (module TXD0/RXD0) go to the bridge when the JP2 UART jumpers are fitted (default); GPIO1/GPIO3 are not on JP1."
    evidence:
      - "esp-wrover-kit-v4.1-ug#uart-jp2"
      - "esp32-wrover-e-ds-v2.4#pin-rxd0-txd0"
    part: "FT2232HL channel B UART (JP2 jumper-selected)"
    uses_pad:
      - "GPIO1"
      - "GPIO3"
  - effect: "Pads connect to the crystal by default and are not wired to JP1."
    evidence:
      - "esp-wrover-kit-v4.1-ug#osc-pins"
      - "esp-wrover-kit-v4.1-ug#osc-note"
    part: "32.768 kHz crystal (default; R11/R23 selectable)"
    uses_pad:
      - "GPIO32"
      - "GPIO33"
rails:
  - max_current:
      evidence:
        - "esp-wrover-kit-v4.1-ug#ldo"
      note: "Guide: \"NCP1117 can provide a maximum current of 1A\" (regulator capability; not a budget after the module and onboard peripherals)."
      status: "single-source"
      unit: "mA"
      value: 1000
    name: "3V3"
    source: "NCP1117 5V-to-3.3V LDO (guide, LDO row)"
    voltage:
      evidence:
        - "esp-wrover-kit-v4.1-ug#ldo"
      status: "single-source"
      unit: "V"
      value: 3.3
  - max_current:
      evidence: []
      note: "The guide states no current rating for the USB or DC-jack 5V input; the schematic PDF was not used as evidence."
      status: "missing"
      unit: "mA"
      value: null
    name: "5V"
    source: "USB VBUS or the 5.5 x 2.1 mm DC jack (JP7 jumper selects)"
    voltage:
      evidence:
        - "esp-wrover-kit-v4.1-ug#5v-input"
      status: "single-source"
      unit: "V"
      value: 5
