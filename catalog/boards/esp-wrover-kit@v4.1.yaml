# ESP-WROVER-KIT v4.1 (task boards-1). Source: ESP-WROVER-KIT v4.1 Getting Started Guide (esp-dev-kits, latest, read 2026-10-24). Single key (researcher + author); blind audit pending.
# Positions: the guide does not number the JP1 pins; positions are the table row numbers (1..14). Connector JP1-left = left "I/O" column, JP1-right = right "I/O" column. PCB orientation of the rows is not stated.
# IO32/IO33 and IO16/IO17 are kind nc: not connected to JP1 by default (guide note) although the JP1 table prints their names. GPIO16/17 are PSRAM pads (module consumed).
# 3V3 max_current 1000 mA is the LDO capability. 5V max_current missing.
