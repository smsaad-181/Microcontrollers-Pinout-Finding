# ESP-WROVER-KIT v4.1 (task boards-1). Source: ESP-WROVER-KIT v4.1 Getting Started Guide (esp-dev-kits, latest, read 2026-10-24). Blind audit done (hardware-fact-auditor), corrections applied: BOOT pulls GPIO0 and GPIO2, SD strap pull-ups added, RGB wording.
# Positions: the guide does not number the JP1 pins; positions are the table row numbers (1..14). Connector JP1-left = left "I/O" column, JP1-right = right "I/O" column. PCB orientation of the rows is not stated.
# IO32/IO33 are kind nc: not connected to JP1 by default (guide note). IO16/IO17 stay kind nc (conservative) with status conflict: the guide says not broken out by default, but the v4.1 schematic (esp-wrover-kit-v4.1-sch#gpio16-17-wired, R146/R147 -> R106/R108, 0R, no NC mark) wires them to JP1-23/22. They are PSRAM CS/CLK either way (module consumed).
# 3V3 max_current 1000 mA is the LDO capability. 5V max_current missing.
