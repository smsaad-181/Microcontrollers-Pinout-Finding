id: "esp32-c6-devkitc-1"
logic_voltage: {"evidence": ["esp32-c6-devkitc-1-ug-v1.2#ldo", "esp32-c6-devkitc-1-sch-v1.4#ldo-part"], "note": "Guide: 5 V to 3.3 V LDO; schematic: U2 SGM2212-3.3XKC3G/TR. No document states a logic voltage in words; derived from the 3.3 V LDO feeding the module.", "reviewers": ["hardware-researcher", "hardware-fact-auditor"], "status": "verified", "unit": "V", "value": 3.3}
