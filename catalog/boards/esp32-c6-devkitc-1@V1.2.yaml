numbering: {"primary": "gpio"}
onboard:
  - {"effect": "GPIO8 drives DIN through diode D11 (1N4148W, cathode at GPIO8) and R17 0 ohm (net RGB_CTRL); R29 10 kohm pulls DIN up to VCC_5V; the LED VDD is VCC_5V in schematic v1.4. GPIO8 itself has a 3.3 kohm pull-up R6 to VCC_3V3, so any external load on J1-9 works against 3.3 kohm. GPIO8 is also a strapping pin, so a load there disturbs the LED and boot.", "evidence": ["esp32-c6-devkitc-1-ug-v1.2#rgb-led", "esp32-c6-devkitc-1-ug-v1.2#j1-gpio8-rgb", "esp32-c6-devkitc-1-sch-v1.4#rgb-part", "esp32-c6-devkitc-1-sch-v1.4#rgb-ctrl-net"], "part": "D6 WS2812B addressable RGB LED", "uses_pad": ["GPIO8"]}
  - {"effect": "Pulls GPIO9 (strapping pin, normally high) to ground; hold Boot and press Reset for download mode. GPIO9 is also header J3-11.", "evidence": ["esp32-c6-devkitc-1-ug-v1.2#boot-button", "esp32-c6-devkitc-1-sch-v1.4#buttons", "esp32-c6-devkitc-1-sch-v1.4#auto-program"], "part": "SW1 Boot button", "uses_pad": ["GPIO9"]}
  - {"effect": "Pulls CHIP_PU (EN) to ground and restarts the system; CHIP_PU is not a GPIO pad.", "evidence": ["esp32-c6-devkitc-1-ug-v1.2#reset-button", "esp32-c6-devkitc-1-sch-v1.4#buttons"], "part": "SW2 Reset button on CHIP_PU", "uses_pad": []}
  - {"effect": "Bridge TXD/RXD connect to the module TXD0 (GPIO16) / RXD0 (GPIO17) through R9 0 ohm and R7 (470 ohm in schematic v1.4; the guide does not state a revision date for the 470 ohm value); same pads on header J3-2 (TX) and J3-3 (RX).", "evidence": ["esp32-c6-devkitc-1-ug-v1.2#usb-bridge", "esp32-c6-devkitc-1-ug-v1.2#usb-c-uart", "esp32-c6-devkitc-1-ug-v1.2#j3-table", "esp32-c6-devkitc-1-sch-v1.4#bridge-part"], "part": "U3 CP2102N-A02-GQFN28 USB-to-UART bridge (USB Type-C J2)", "uses_pad": ["GPIO16", "GPIO17"]}
  - {"effect": "DTR/RTS can pull CHIP_PU (EN) and GPIO9 low to enter download mode automatically.", "evidence": ["esp32-c6-devkitc-1-sch-v1.4#auto-program"], "part": "Auto-download circuit (BC847BDW1T1G dual NPN, bridge DTR/RTS)", "uses_pad": ["GPIO9"]}
  - {"effect": "D- is wired to GPIO12 and D+ to GPIO13 (USB Serial/JTAG, JTAG debugging); VBUS reaches VCC_5V through D7. The pads are also on header J3-14/J3-13.", "evidence": ["esp32-c6-devkitc-1-ug-v1.2#usb-c-native", "esp32-c6-devkitc-1-ug-v1.2#j3-usb", "esp32-c6-devkitc-1-sch-v1.4#usb-type-c", "esp32-c6-devkitc-1-sch-v1.4#usb-gpio12-13", "esp32-c6-ds-v1.5#usb-default"], "part": "J4 USB Type-C (ESP32-C6 native USB, full speed)", "uses_pad": ["GPIO12", "GPIO13"]}
  - {"effect": "Jumper in the module 3V3 supply path; removing it cuts power to the module.", "evidence": ["esp32-c6-devkitc-1-ug-v1.2#j5-current", "esp32-c6-devkitc-1-sch-v1.4#j5-jumper"], "part": "J5 jumper (current measurement)", "uses_pad": []}
  - {"effect": "Lights when USB power is connected; no GPIO pad.", "evidence": ["esp32-c6-devkitc-1-sch-v1.4#power-led"], "part": "D5 red 3.3 V power LED with R11 5.1 kohm", "uses_pad": []}
