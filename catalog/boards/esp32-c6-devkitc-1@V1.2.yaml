# Espressif ESP32-C6-DevKitC-1 v1.2 (guide v1.2; schematic v1.4 of 2024-05-09 used for the drawing facts; v1.2-v1.4 differ in resistor values and J5 shape only). Variant N8 = ESP32-C6-WROOM-1-N8. Two keys (researcher + blind auditor) agree on every fact.
# Sources: user guide (esp-dev-kits, latest) Header Block tables J1/J3 and schematic v1.4.
# Labels = the guide Name column (a bare GPIO number); positions follow the schematic numbering. J1-2 RST is CHIP_PU (kind reset, no pad). J1-16 and J3-16 are NC (guide: No connection).
# GPIO24-GPIO30 (flash) and GPIO14 (not on QFN40) have no header pin. GPIO4, GPIO5, GPIO8, GPIO9, GPIO15 are strapping pins (guide footnote [3]); GPIO8 drives the RGB LED, GPIO9 is the BOOT button.
# Gap: no current rating for the 3V3/5V rails (missing); the v1.2/v1.3 schematic differences (WS2812 resistor values, ADC calibration) are not modelled.
