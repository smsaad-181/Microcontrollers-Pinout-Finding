# Arduino UNO R4 Minima (SKU ABX00080), board revision V1.2 = the schematic version (sch#title-block, 23/08/2023). Arduino prints no board revision letter in the user manual (rev 6) or the pinout; the
# schematic "Version V1.2" is the only revision identifier, so it is used as `revision`. Chip pad per header pin is TRANSCRIBED from the full-pinout figure (pinout#pad-map-*) and cross-read against the
# schematic net labels (sch#net-*); the blind second read agrees on label, kind and pad of all 31 header pins it read (reconcile-arduino-uno-r4-minima.md). Neither the manual nor the schematic gives a header side.
# Connectors: JANALOG 1-14 and JDIGITAL 1-18 follow the numbering of the user manual tables (s10.1, s10.2); JICSP 1-6 is schematic J1 (manual s10.3); JSWD 1-10 is schematic J2 (manual s10.4).
# NUMBERING DISAGREEMENT: the schematic numbers JDIGITAL the other way round (D0 = 1 ... D13 = 14, GND 15, AREF 16, SDA 17, SCL 18; sch#jdigital-numbering). The manual order (SCL = 1 ... D0 = 18) is used here: manual position = 19 - schematic pin.
#   JANALOG, ICSP and SWD numbers are the same in both documents.
# ALIASES (`alias_of`, validator decision 24): the UNO repeats pads on two header positions. Each repeat is its own pin (own label and position, same `pad`) pointing at the primary pin; only one use of a shared pad at a time:
#   JDIGITAL:1 SCL -> JANALOG:14 A5 (P100), JDIGITAL:2 SDA -> JANALOG:13 A4 (P101); JICSP:1 ICSP-CIPO -> JDIGITAL:6 D12 (P110), JICSP:3 ICSP-SCK -> JDIGITAL:5 D13 (P111), JICSP:4 ICSP-COPI -> JDIGITAL:7 D11 (P109)
#   (pinout#a4a5-same-pins, pinout#spi-shared, sch#icsp-conn). The RESET net reaches JANALOG 3, JICSP 5 and JSWD 10 as plain reset pins (no pad).
# Pin kinds: JANALOG pin 1 "BOOT" is the MD (P201) mode pin, wired to net MD (the schematic symbol text reads "NC", sch#janalog-pin1-nc); the kind enum has no boot/strap kind, so it is `reset` (never assignable). IOREF is a 5 V output (`power`, rail 5V).
# ERRORS INSIDE THE ARDUINO DOCUMENTS (the schematic and the pinout are followed, the manual is wrong; not modelled): the manual prints D0 and D1 both as TX0 and describes D0 as the receiver (abx#digital-d0-tx0); D5/CANRX0 is described as CAN transmitter and
#   D4/CANTX0 as CAN receiver (abx#digital-d5-can, #digital-d4-can; schematic D5 = CAN0_RX, D4 = CAN0_TX); the manual SWD pin 10 is "NC" but schematic and pinout put it on RESET (abx#swd-pin10-nc, sch#swd-reset); s12.1 names DL1 as the power LED, but DL1 is the TX LED and DL3 the power LED
#   (abx#power-led-dl1); s9 says the VUSB pin feeds the buck converter, the netlist (second read) has the USB Schottky D3 on the +5V net and only the VIN/jack Schottky D2 into the buck (abx#vusb-buck).
# NOT CONNECTED (second read of the schematic, X marks and netlist; not every pin re-checked on the image): P003, P004, P011, P015, P113, P204, P205, P206, P400-P402, P408-P411. P212/P213 reach only the unfitted crystal Y1, P214/P215 (XCIN/XCOUT) are no-connect.
#   No level shifter (header pads connect straight to the MCU, VCC = 5 V), no USB-UART bridge and no auto-reset circuit exist (native USB on P914/P915).
connectors:
  - id: JANALOG
    pins:
      - { kind: "reset", label: "BOOT", position: 1 }
      - { kind: "power", label: "IOREF", position: 2, rail: "5V" }
      - { kind: "reset", label: "RESET", position: 3 }
      - { kind: "power", label: "3V3", position: 4, rail: "3V3" }
      - { kind: "power", label: "5V", position: 5, rail: "5V" }
      - { kind: "ground", label: "GND", position: 6 }
      - { kind: "ground", label: "GND", position: 7 }
      - { kind: "power", label: "VIN", position: 8, rail: "VIN" }
      - { kind: "gpio", label: "A0", pad: "P014", position: 9 }
      - { kind: "gpio", label: "A1", pad: "P000", position: 10 }
      - { kind: "gpio", label: "A2", pad: "P001", position: 11 }
      - { kind: "gpio", label: "A3", pad: "P002", position: 12 }
      - { kind: "gpio", label: "A4", pad: "P101", position: 13 }
      - { kind: "gpio", label: "A5", pad: "P100", position: 14 }
  - id: JDIGITAL
    pins:
      - { alias_of: "JANALOG:14", kind: "gpio", label: "SCL", pad: "P100", position: 1 }
      - { alias_of: "JANALOG:13", kind: "gpio", label: "SDA", pad: "P101", position: 2 }
      - { kind: "analog-ref", label: "AREF", position: 3 }
      - { kind: "ground", label: "GND", position: 4 }
      - { kind: "gpio", label: "D13", pad: "P111", position: 5 }
      - { kind: "gpio", label: "D12", pad: "P110", position: 6 }
      - { kind: "gpio", label: "D11", pad: "P109", position: 7 }
      - { kind: "gpio", label: "D10", pad: "P112", position: 8 }
      - { kind: "gpio", label: "D9", pad: "P303", position: 9 }
      - { kind: "gpio", label: "D8", pad: "P304", position: 10 }
      - { kind: "gpio", label: "D7", pad: "P107", position: 11 }
      - { kind: "gpio", label: "D6", pad: "P106", position: 12 }
      - { kind: "gpio", label: "D5", pad: "P102", position: 13 }
      - { kind: "gpio", label: "D4", pad: "P103", position: 14 }
      - { kind: "gpio", label: "D3", pad: "P104", position: 15 }
      - { kind: "gpio", label: "D2", pad: "P105", position: 16 }
      - { kind: "gpio", label: "D1", pad: "P302", position: 17 }
      - { kind: "gpio", label: "D0", pad: "P301", position: 18 }
  - id: JICSP
    pins:
      - { alias_of: "JDIGITAL:6", kind: "gpio", label: "ICSP-CIPO", pad: "P110", position: 1 }
      - { kind: "power", label: "5V", position: 2, rail: "5V" }
      - { alias_of: "JDIGITAL:5", kind: "gpio", label: "ICSP-SCK", pad: "P111", position: 3 }
      - { alias_of: "JDIGITAL:7", kind: "gpio", label: "ICSP-COPI", pad: "P109", position: 4 }
      - { kind: "reset", label: "RESET", position: 5 }
      - { kind: "ground", label: "GND", position: 6 }
  - id: JSWD
    pins:
      - { kind: "power", label: "5V", position: 1, rail: "5V" }
      - { kind: "gpio", label: "SWDIO", pad: "P108", position: 2 }
      - { kind: "ground", label: "GND", position: 3 }
      - { kind: "gpio", label: "SWCLK", pad: "P300", position: 4 }
      - { kind: "ground", label: "GND", position: 5 }
      - { kind: "nc", label: "NC", position: 6 }
      - { kind: "gpio", label: "SWD_RX", pad: "P502", position: 7 }
      - { kind: "gpio", label: "SWD_TX", pad: "P501", position: 8 }
      - { kind: "ground", label: "GND", position: 9 }
      - { kind: "reset", label: "RESET", position: 10 }
id: arduino-uno-r4-minima
logic_voltage: { evidence: ["abx00080-um-rev6#operating-5v", "abx00080-um-rev6#pin-voltage", "abx00080-um-rev6#ioref"], note: "All header pins are 5 V logic except the 3V3 pin; with USB-only power the RA4M1 runs from about 4.7 V (abx#usb-4v7). Reconcile: the blind audit read the same sentence (manual s9.2, also s5 \"fixed at 5 V\") and the schematic (U1 VCC pins 11 and 39 on +5V); no level shifter exists.", reviewers: ["hardware-researcher", "hardware-fact-auditor"], status: "verified", unit: "V", value: 5 }
name: Arduino UNO R4 Minima
numbering: { primary: label }
onboard:
  - { effect: "Yellow LED DL4 (anode on the P111 net) and a 330 ohm series resistor R17 to ground hang directly on the P111 net, the same net as the D13/SCK header pin and the ICSP-SCK pin, so D13 is loaded by an LED (no buffer). Polarity read from the schematic image in the reconcile and by the blind audit.", evidence: ["abx00080-pinout-20231127#led-pads", "abx00080-sch-v1.2#led-sck", "abx00080-um-rev6#led-dl4-sck"], part: "User LED DL4 \"SCK LED\" (LED_BUILTIN) with R17 330 ohm", uses_pad: ["P111"] }
  - { effect: "DL1 (TX) is on P012 and DL2 (RX) on P013 with 330 ohm series resistors. Not on a header. P012/P013 are also the VREFH/VREFL analog-reference pad functions.", evidence: ["abx00080-pinout-20231127#led-pads", "abx00080-sch-v1.2#led-txrx", "abx00080-um-rev6#led-dl1-tx", "abx00080-um-rev6#led-dl2-rx"], part: "TX LED DL1 and RX LED DL2 with R14/R15 330 ohm", uses_pad: ["P012", "P013"] }
  - { effect: "Power LED on the +5V net; uses no chip pad.", evidence: ["abx00080-um-rev6#led-dl3-power", "abx00080-pinout-20231127#led-pads"], part: "Power LED DL3 with R16 330 ohm", uses_pad: [] }
  - { effect: "Pulls the RA4M1 RES pin (the RESET net, also on JANALOG pin 3, JICSP pin 5 and JSWD pin 10) low; R3 5.1 kohm pulls it to +5V, C2 is not populated. Uses no GPIO pad. Double-tap right after power-up enters the bootloader (software, not a strap).", evidence: ["abx00080-um-rev6#reset-button", "abx00080-sch-v1.2#reset-pushbutton", "abx00080-sch-v1.2#reset-pullup", "abx00080-um-rev6#bootloader-doubletap"], part: "RESET button PB1 with R3 5.1 kohm pull-up", uses_pad: [] }
  - { effect: "USB D+ (P914) and D- (P915) go to the connector through ESD diodes; the pads are not on a header and are marked consumed (usb) in the module.", evidence: ["abx00080-pinout-20231127#usb-pads", "abx00080-um-rev6#usb-connector", "abx00080-sch-v1.2#usb-dp-dm", "abx00080-sch-v1.2#usb-connector-parts"], part: "USB-C connector J3 CX90B-16P with ESD protection D4 (PRTR5V0U2X)", uses_pad: ["P914", "P915"] }
  - { effect: "The MD (P201) net goes to the BOOT header pin and is tied to +5V through R6 5.1 kohm (transcribed from the schematic image; the researcher first read R5 and R6, the image shows R5 on the P200 NMI input): high = normal single-chip start; pulling it low at reset release starts SCI/USB boot mode (RA4M1 UM Table 3.1). The manual only says \"Mode selection\".", evidence: ["abx00080-um-rev6#boot-pin", "abx00080-sch-v1.2#md-net", "abx00080-sch-v1.2#janalog-pin1-nc", "ra4m1-um-rev1.10#md-table"], part: "MD / BOOT pin (JANALOG pin 1) with R6 5.1 kohm", uses_pad: ["P201"] }
  - { effect: "The AREF header net is the RA4M1 VREFH0 (P010) analog reference input, reached through ferrite L1, with R4 5.1 kohm to +5V (transcribed from the schematic image). P010 is therefore not a free pin; the manual only says \"Analog Reference Voltage\".", evidence: ["abx00080-sch-v1.2#aref-net", "abx00080-um-rev6#digital-aref"], part: "AREF header pin (JDIGITAL pin 3) wired to VREFH0", uses_pad: ["P010"] }
  - { effect: "The I2C pull-ups R1/R2 5.1 kohm on SCL (P100) and SDA (P101) are not mounted (crossed out in the schematic); add external pull-ups. The SCL/SDA header positions are aliases of A5/A4 (connector JDIGITAL 1 and 2).", evidence: ["abx00080-sch-v1.2#i2c-pullups-nm", "abx00080-pinout-20231127#a4a5-same-pins", "abx00080-pinout-20231127#pad-map-i2c"], part: "I2C pull-ups R1 and R2 (not mounted) on SCL/SDA", uses_pad: ["P100", "P101"] }
  - { effect: "SWDIO P108, SWCLK P300 and the SCI1 RX/TX pair P502/P501 are wired only to this header (modelled as connector JSWD; pin 10 is the RESET net, the manual prints it as NC, sch#swd-reset). P108/P300 start as debug pins after reset.", evidence: ["abx00080-pinout-20231127#swd-pads", "abx00080-sch-v1.2#swd-conn", "abx00080-sch-v1.2#swd-reset"], part: "SWD/JTAG header J2 (10 pins)", uses_pad: ["P108", "P300", "P501", "P502"] }
  - { effect: "P500 (AN016) is wired to the junction of a 100 kohm / 13.7 kohm divider from +5V (transcribed from the schematic image): the pad reads the 5 V rail and should not be used as an input. The schematic does not name the purpose.", evidence: ["abx00080-sch-v1.2#p500-divider"], part: "Voltage divider R10 100 kohm / R26 13.7 kohm (0.1 %) on P500", uses_pad: ["P500"] }
  - { effect: "P407 (USB_VBUS / ADTRG0) is wired to the junction of R7 (5.1 kohm to +5V) and R8 + R9 (5.1 kohm each in series to ground), about one third of +5V per the divider ratio (transcribed from the schematic image); the pad is not on a header.", evidence: ["abx00080-sch-v1.2#p407-network"], part: "USB VBUS sense divider R7 / R8 + R9 (5.1 kohm) on P407", uses_pad: ["P407"] }
  - { effect: "Y1 and C1/C3 are drawn crossed out in the schematic (transcribed from the image): P212/P213 reach only the unfitted crystal pads, so they have no external connection; P214/P215 (XCIN/XCOUT) are no-connect. No document states the clock source; the RA4M1 then runs from an on-chip oscillator (inference, not stated).", evidence: ["abx00080-sch-v1.2#crystal-not-fitted"], part: "Crystal Y1 (16 MHz, not fitted) with C1/C3 15 pF", uses_pad: ["P212", "P213"] }
  - { effect: "The RA4M1 12-bit DAC (DA0) output is routed to the A0 header pin (net P014_AN09_DAC).", evidence: ["abx00080-um-rev6#dac-a0", "abx00080-sch-v1.2#net-dac"], part: "DAC output on A0", uses_pad: ["P014"] }
  - { effect: "Produces the 5V rail from VIN/barrel jack (and USB through Schottky diodes); uses no chip pad.", evidence: ["abx00080-um-rev6#buck-5v", "abx00080-sch-v1.2#buck-converter"], part: "Buck converter U2 ISL854102FRZ-T", uses_pad: [] }
  - { effect: "P200 (NMI, input only) is pulled to +5V by R5 5.1 kohm (transcribed from the schematic image) and is not on a header: do not use it.", evidence: ["abx00080-sch-v1.2#nmi-pullup"], part: "NMI pull-up R5 5.1 kohm on P200", uses_pad: ["P200"] }
rails:
  - { max_current: { evidence: [], note: "No 3V3 output current rating in the Arduino documents (manual, pinout and schematic searched by both keys; the audit did not look up the Renesas LDO limit). RA4M1 Table 2.41 gives \"VCC_USB supply current\" 50 mA (LDO input >= 3.8 V) / 100 mA (>= 4.5 V) but does not state it as an external-load rating and the USB transceiver shares it (ds#usb-regulator), so it is not used.", status: "missing", unit: "mA", value: null }, name: "3V3", source: "RA4M1 internal USB LDO output (VCC_USB pin), not the buck converter", voltage: { evidence: ["abx00080-sch-v1.2#vcc-usb-ldo", "abx00080-um-rev6#3v3-source", "abx00080-um-rev6#analog-3v3-rail", "ra4m1-ds-rev1.10#usb-ldo-3v3"], note: "Nominal 3.3 V from the RA4M1 USB LDO (RA4M1 Table 2.41: VCC_USB supply voltage 3.0-3.6 V). Reconcile: the blind audit read the same manual sentence (s9.2) and the schematic note (\"VCC_USB is the output of the internal USB LDO providing 3V3\"): +3V3 net = U1 pin 20 VCC_USB, no discrete regulator.", reviewers: ["hardware-researcher", "hardware-fact-auditor"], status: "verified", unit: "V", value: 3.3 } }
  - { max_current: { evidence: [], note: "No 5V output current rating in any Arduino document (manual, pinout and schematic searched by both keys; the only current figure is the blink-sketch consumption, abx#rail-current-none, which is not a rail limit; the schematic prints \"2.3A\" beside inductor L3, an inductor rating, not a board limit). The ISL854102 regulator datasheet and the USB source limit were not opened.", status: "missing", unit: "mA", value: null }, name: "5V", source: "ISL854102FRZ-T buck converter U2 from VIN / barrel jack; USB 5 V through Schottky diodes", voltage: { evidence: ["abx00080-um-rev6#pin-voltage", "abx00080-um-rev6#buck-5v", "abx00080-um-rev6#ioref", "abx00080-um-rev6#analog-5v-rail"], note: "Nominal 5 V; with USB-only power the supply is about 4.7 V (abx#usb-4v7). Reconcile: the blind audit read JANALOG pin 5 \"+5V Power Rail\" (s10.1) and s5 \"fixed at 5 V\"; regulator U2 ISL854102FRZ-T agrees. The path of USB power differs between manual and netlist (abx#vusb-buck) but the rail voltage does not depend on it.", reviewers: ["hardware-researcher", "hardware-fact-auditor"], status: "verified", unit: "V", value: 5 } }
  - { max_current: { evidence: [], note: "No VIN or barrel-jack current rating in any Arduino document (searched by both keys); it depends on the supply and the buck converter.", status: "missing", unit: "mA", value: null }, name: "VIN", source: "Barrel jack J4 / VIN header pin through Schottky D2", voltage: { evidence: [], note: "VIN is an input range, not one fixed voltage: recommended 6-24 V, typ 7.0 V (abx#vin-range, abx#vin-table). Both keys read the same range (manual p2 and s2 table); Fact<number> cannot hold a range, so the fact stays missing (precedent: Pico VSYS).", status: "missing", unit: "V", value: null } }
