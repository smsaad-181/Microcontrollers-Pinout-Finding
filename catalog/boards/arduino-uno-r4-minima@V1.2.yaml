# Arduino UNO R4 Minima (SKU ABX00080), board revision V1.2 = the schematic version (sch#title-block, 23/08/2023). Arduino prints no board revision letter in the user manual (rev 6) or the pinout; the
# schematic "Version V1.2" is the only revision identifier, so it is used as `revision`. Chip pad per header pin is TRANSCRIBED from the full-pinout figure (pinout#pad-map-*) and cross-read against the
# schematic net labels (sch#net-*). Positions: JANALOG 1-14 and JDIGITAL 1-18 follow the numbering of the user manual tables (s10.1, s10.2); ICSP and SWD positions are those of the manual (s10.3, s10.4).
# KNOWN MODELLING GAP (validator decision 19, E_PIN_NUMBERING: one pad on two connector pins is an error). The UNO repeats pads on two header positions and the schema/validator cannot hold that, so these are NOT in `connectors`:
#   - JDIGITAL positions 1 (SCL) and 2 (SDA): the same pads as A5 (P100) and A4 (P101) (pinout#a4a5-same-pins, sch#net-sda/net-scl). JDIGITAL numbering therefore starts at 3.
#   - ICSP header J1 (6 pins): CIPO = P110 (= D12), SCK = P111 (= D13), COPI = P109 (= D11), plus +5V, RESET, GND (pinout#icsp-pads, #spi-shared). The whole header is omitted, not just its three pad pins.
#   Both are recorded in `onboard` instead. A later validator change (downgrade to a warning W_DUPLICATE_PAD, or an `alias_of` field on a connector pin) would let them be added without inventing a second pad.
# Pin kinds: JANALOG pin 1 "BOOT" is the MD (P201) mode pin; the kind enum has no boot/strap kind, so it is `reset` (never assignable). IOREF is a 5 V output (`power`, rail 5V).
# Documentation errors of the manual recorded in the evidence, not modelled: D0/D1 both labelled TX0 (abx#digital-d0-tx0), D4/D5 CAN TX/RX swapped in the description (abx#digital-d5-can, #digital-d4-can).
connectors:
  - id: JANALOG
    pins:
      - { kind: "reset", label: "BOOT", position: 1 }
      - { kind: "power", label: "IOREF", position: 2, rail: "5V" }
      - { kind: "reset", label: "RESET", position: 3 }
      - { kind: "power", label: "3V3", position: 4, rail: "3V3" }
      - { kind: "power", label: "5V", position: 5, rail: "5V" }
      - { kind: "ground", label: "GND", position: 6 }
      - { kind: "ground", label: "GND", position: 7 }
      - { kind: "power", label: "VIN", position: 8, rail: "VIN" }
      - { kind: "gpio", label: "A0", pad: "P014", position: 9 }
      - { kind: "gpio", label: "A1", pad: "P000", position: 10 }
      - { kind: "gpio", label: "A2", pad: "P001", position: 11 }
      - { kind: "gpio", label: "A3", pad: "P002", position: 12 }
      - { kind: "gpio", label: "A4", pad: "P101", position: 13 }
      - { kind: "gpio", label: "A5", pad: "P100", position: 14 }
  - id: JDIGITAL
    pins:
      - { kind: "analog-ref", label: "AREF", position: 3 }
      - { kind: "ground", label: "GND", position: 4 }
      - { kind: "gpio", label: "D13", pad: "P111", position: 5 }
      - { kind: "gpio", label: "D12", pad: "P110", position: 6 }
      - { kind: "gpio", label: "D11", pad: "P109", position: 7 }
      - { kind: "gpio", label: "D10", pad: "P112", position: 8 }
      - { kind: "gpio", label: "D9", pad: "P303", position: 9 }
      - { kind: "gpio", label: "D8", pad: "P304", position: 10 }
      - { kind: "gpio", label: "D7", pad: "P107", position: 11 }
      - { kind: "gpio", label: "D6", pad: "P106", position: 12 }
      - { kind: "gpio", label: "D5", pad: "P102", position: 13 }
      - { kind: "gpio", label: "D4", pad: "P103", position: 14 }
      - { kind: "gpio", label: "D3", pad: "P104", position: 15 }
      - { kind: "gpio", label: "D2", pad: "P105", position: 16 }
      - { kind: "gpio", label: "D1", pad: "P302", position: 17 }
      - { kind: "gpio", label: "D0", pad: "P301", position: 18 }
  - id: SWD
    pins:
      - { kind: "power", label: "5V", position: 1, rail: "5V" }
      - { kind: "gpio", label: "SWDIO", pad: "P108", position: 2 }
      - { kind: "ground", label: "GND", position: 3 }
      - { kind: "gpio", label: "SWCLK", pad: "P300", position: 4 }
      - { kind: "ground", label: "GND", position: 5 }
      - { kind: "nc", label: "NC", position: 6 }
      - { kind: "gpio", label: "SWD_RX", pad: "P502", position: 7 }
      - { kind: "gpio", label: "SWD_TX", pad: "P501", position: 8 }
      - { kind: "ground", label: "GND", position: 9 }
      - { kind: "reset", label: "RESET", position: 10 }
id: arduino-uno-r4-minima
logic_voltage: { evidence: ["abx00080-um-rev6#operating-5v", "abx00080-um-rev6#pin-voltage", "abx00080-um-rev6#ioref"], note: "All header pins are 5 V logic except the 3V3 pin; with USB-only power the RA4M1 runs from about 4.7 V (abx#usb-4v7).", status: "single-source", unit: "V", value: 5 }
name: Arduino UNO R4 Minima
numbering: { primary: label }
onboard:
  - { effect: "Yellow LED DL4 and a 330 ohm series resistor hang on the P111 net, the same net as the D13/SCK header pin and the ICSP SCK pin, so D13 is loaded by an LED. Schematic polarity (which side the LED returns to) is not stated in the text and was not read from the image.", evidence: ["abx00080-pinout-20231127#led-pads", "abx00080-sch-v1.2#led-sck", "abx00080-um-rev6#led-dl4-sck"], part: "User LED DL4 \"SCK LED\" (LED_BUILTIN) with R17 330 ohm", uses_pad: ["P111"] }
  - { effect: "DL1 (TX) is on P012 and DL2 (RX) on P013 with 330 ohm series resistors. Not on a header. P012/P013 are also the VREFH/VREFL analog-reference pad functions.", evidence: ["abx00080-pinout-20231127#led-pads", "abx00080-sch-v1.2#led-txrx", "abx00080-um-rev6#led-dl1-tx", "abx00080-um-rev6#led-dl2-rx"], part: "TX LED DL1 and RX LED DL2 with R14/R15 330 ohm", uses_pad: ["P012", "P013"] }
  - { effect: "Power LED on the +5V net; uses no chip pad.", evidence: ["abx00080-um-rev6#led-dl3-power", "abx00080-pinout-20231127#led-pads"], part: "Power LED DL3 with R16 330 ohm", uses_pad: [] }
  - { effect: "Pulls the RA4M1 RES pin (the RESET net, also on JANALOG pin 3, ICSP pin 5 and SWD pin 10) low; uses no GPIO pad. Double-tap right after power-up enters the bootloader (software, not a strap).", evidence: ["abx00080-um-rev6#reset-button", "abx00080-sch-v1.2#reset-pushbutton", "abx00080-um-rev6#bootloader-doubletap"], part: "RESET button PB1", uses_pad: [] }
  - { effect: "USB D+ (P914) and D- (P915) go to the connector through ESD diodes; the pads are not on a header and are marked consumed (usb) in the module.", evidence: ["abx00080-pinout-20231127#usb-pads", "abx00080-um-rev6#usb-connector"], part: "USB-C connector J3 with ESD protection D4 (PRTR5V0U2X)", uses_pad: ["P914", "P915"] }
  - { effect: "The MD (P201) net goes to the BOOT header pin and is tied to +5V through R5 and R6 (transcribed from the schematic image): high = normal single-chip start; pulling it low at reset release starts SCI/USB boot mode (RA4M1 UM Table 3.1). The manual only says \"Mode selection\".", evidence: ["abx00080-um-rev6#boot-pin", "abx00080-sch-v1.2#md-net", "ra4m1-um-rev1.10#md-table"], part: "MD / BOOT pin (JANALOG pin 1) with R5 and R6 5.1 kohm", uses_pad: ["P201"] }
  - { effect: "The AREF header net is the RA4M1 VREFH0 (P010) analog reference input, reached through ferrite L1, with R4 5.1 kohm to +5V (transcribed from the schematic image). P010 is therefore not a free pin; the manual only says \"Analog Reference Voltage\".", evidence: ["abx00080-sch-v1.2#aref-net", "abx00080-um-rev6#digital-aref"], part: "AREF header pin (JDIGITAL pin 3) wired to VREFH0", uses_pad: ["P010"] }
  - { effect: "The separate SCL/SDA header positions are the same pads as A5 (P100, IIC_SCL1) and A4 (P101, IIC_SDA1): one pad on two header positions, only one use at a time. The I2C pull-ups R1/R2 5.1 kohm on SCL/SDA are not mounted. Not modelled as connector pins (validator decision 19); see the header comment.", evidence: ["abx00080-pinout-20231127#a4a5-same-pins", "abx00080-pinout-20231127#pad-map-i2c", "abx00080-sch-v1.2#net-sda", "abx00080-sch-v1.2#net-scl", "abx00080-sch-v1.2#i2c-pullups-nm", "abx00080-um-rev6#digital-scl", "abx00080-um-rev6#digital-sda"], part: "Header positions SCL and SDA (JDIGITAL 1 and 2, same pads as A5 and A4)", uses_pad: ["P100", "P101"] }
  - { effect: "ICSP CIPO = P110 (D12), SCK = P111 (D13), COPI = P109 (D11); also +5V (pin 2), RESET (5), GND (6). These are the same pads as D12/D13/D11, not extra pins. Not modelled as connector pins (validator decision 19).", evidence: ["abx00080-pinout-20231127#icsp-pads", "abx00080-pinout-20231127#spi-shared", "abx00080-um-rev6#comm-spi"], part: "ICSP header J1 (6 pins, shared with the digital header)", uses_pad: ["P110", "P111", "P109"] }
  - { effect: "SWDIO P108, SWCLK P300 and the SCI1 RX/TX pair P502/P501 are wired only to this header (modelled as connector SWD). P108/P300 start as debug pins after reset.", evidence: ["abx00080-pinout-20231127#swd-pads", "abx00080-sch-v1.2#swd-conn"], part: "SWD/JTAG header J2 (10 pins)", uses_pad: ["P108", "P300", "P501", "P502"] }
  - { effect: "P500 (AN016) is wired to the junction of a 100 kohm / 13.7 kohm divider from +5V (transcribed from the schematic image): the pad reads the 5 V rail and should not be used as an input. The schematic does not name the purpose.", evidence: ["abx00080-sch-v1.2#p500-divider"], part: "Voltage divider R10 100 kohm / R26 13.7 kohm (0.1 %) on P500", uses_pad: ["P500"] }
  - { effect: "P407 (USB_VBUS / ADTRG0) is wired to a 5.1 kohm resistor network (transcribed from the schematic image); the purpose is not labelled and the pad is not on a header.", evidence: ["abx00080-sch-v1.2#p407-network"], part: "Resistor network R7, R8, R9 (5.1 kohm) on P407", uses_pad: ["P407"] }
  - { effect: "Y1 and C1/C3 are drawn crossed out in the schematic (transcribed from the image): the main-clock pads P212/P213 have no external connection on this board.", evidence: ["abx00080-sch-v1.2#crystal-not-fitted"], part: "Crystal Y1 (16 MHz, not fitted) with C1/C3 15 pF", uses_pad: ["P212", "P213"] }
  - { effect: "The RA4M1 12-bit DAC (DA0) output is routed to the A0 header pin (net P014_AN09_DAC).", evidence: ["abx00080-um-rev6#dac-a0", "abx00080-sch-v1.2#net-dac"], part: "DAC output on A0", uses_pad: ["P014"] }
  - { effect: "Produces the 5V rail from VIN/barrel jack (and USB through Schottky diodes); uses no chip pad.", evidence: ["abx00080-um-rev6#buck-5v", "abx00080-sch-v1.2#buck-converter"], part: "Buck converter U2 ISL854102FRZ-T", uses_pad: [] }
rails:
  - { max_current: { evidence: [], note: "No 3V3 output current rating in the Arduino documents. RA4M1 Table 2.41 gives \"VCC_USB supply current\" 50 mA (LDO input >= 3.8 V) / 100 mA (>= 4.5 V) but does not state it as an external-load rating and the USB transceiver shares it (ds#usb-regulator), so it is not used.", status: "missing", unit: "mA", value: null }, name: "3V3", source: "RA4M1 internal USB LDO output (VCC_USB pin), not the buck converter", voltage: { evidence: ["abx00080-sch-v1.2#vcc-usb-ldo", "abx00080-um-rev6#3v3-source", "ra4m1-ds-rev1.10#usb-ldo-3v3"], note: "Nominal 3.3 V from the RA4M1 USB LDO (RA4M1 Table 2.41: VCC_USB supply voltage 3.0-3.6 V).", status: "single-source", unit: "V", value: 3.3 } }
  - { max_current: { evidence: [], note: "No 5V output current rating in the Arduino documents (only the board consumption of the blink sketch, abx#rail-current-none). The ISL854102 regulator datasheet and the USB source limit were not opened.", status: "missing", unit: "mA", value: null }, name: "5V", source: "ISL854102FRZ-T buck converter U2 from VIN / barrel jack; USB 5 V through Schottky diodes", voltage: { evidence: ["abx00080-um-rev6#pin-voltage", "abx00080-um-rev6#buck-5v", "abx00080-um-rev6#ioref"], note: "Nominal 5 V; with USB-only power the supply is about 4.7 V (abx#usb-4v7).", status: "single-source", unit: "V", value: 5 } }
  - { max_current: { evidence: [], note: "No VIN current rating in the Arduino documents; it depends on the supply and the buck converter.", status: "missing", unit: "mA", value: null }, name: "VIN", source: "Barrel jack J4 / VIN header pin through Schottky D2", voltage: { evidence: [], note: "VIN is an input range, not one fixed voltage: recommended 6-24 V, typ 7.0 V (abx#vin-range, abx#vin-table); Fact<number> cannot hold a range.", status: "missing", unit: "V", value: null } }
