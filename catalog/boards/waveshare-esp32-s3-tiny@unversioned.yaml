# Waveshare ESP32-S3-Tiny (split design: the USB-C and BOOT/RESET buttons are on a separate adapter board connected by an 8-pin 0.5 mm FPC). Chip ESP32-S3FH4R2 used bare. No revision printed; revision "unversioned". Two keys (researcher + blind auditor) agree on every fact.
# Sources: Waveshare wiki page (text + onboard/pinout pictures, transcribed) and the schematic PDF (23-pin header P1 and FPC L1 read from the rendered drawing; positions are schematic numbering, NOT the physical sequence: TX/RX (10/11) sit at the top-right corner and IO7-IO11 (19-23) along the bottom edge, so the UI must not draw P1 positions as a physical run).
# Connector P1 = the 23 castellated pads in schematic numbering (1 VCC_5V ... 23 IO11). Connector PADS = the 14 back pads shown in the wiki picture (left GP48/47/45/42/41/40/39, right GP21/33/34/35/36/37/38); positions are my picture order, transcribed.
# GPIO0 (BOOT), GPIO19/GPIO20 (USB) and CHIP_PU (RESET) are only on the FPC L1 (no pad). GPIO38 drives the RGB LED and is also back pad IO38. GPIO26-GPIO32 are in-package flash/PSRAM.
# Gap: the wiki note about GPIO33-GPIO37 refers to an ESP32-S3-Tiny-N8R8 variant (Octal PSRAM) that has no record here; the catalogued FH4R2 board has Quad PSRAM, so GPIO33-GPIO37 are plain pads. The adapter board schematic (Tiny-Adapter.pdf) was not read.
