onboard:
  - {"effect": "DIN is driven from GPIO18 through 0 ohm R40 (net RGB_GPIO18); header J3-21 connects through 0 ohm R41 (EXT_GPIO18), so a load there disturbs the LED. GPIO18 has a 10 kohm pull-up R42 to VDD33, which is the board-level workaround for errata SYSTEM-117 (chip revision v0.0 needs GPIO18 pulled up for UART download).", "evidence": ["esp32-s2-saola-1-ug-v1.2#rgb-led", "esp32-s2-saola-1-ug-v1.2#j3-gpio18-rgb", "esp32-s2-saola-1-sch-v1.2#rgb-gpio18", "esp32-s2-saola-1-sch-v1.2#rgb-part"], "part": "u6 WS2812 addressable RGB LED", "uses_pad": ["GPIO18"]}
  - {"effect": "Pulls GPIO0 (strapping pin, normally high) to ground; hold Boot and press Reset for download mode. GPIO0 is also header J2-2.", "evidence": ["esp32-s2-saola-1-ug-v1.2#boot-button", "esp32-s2-saola-1-ug-v1.2#j2-gpio0-boot", "esp32-s2-saola-1-sch-v1.2#buttons", "esp32-s2-saola-1-sch-v1.2#auto-program"], "part": "SW1 Boot button", "uses_pad": ["GPIO0"]}
  - {"effect": "Pulls CHIP_PU (EN) to ground and restarts the system; CHIP_PU is not a GPIO pad.", "evidence": ["esp32-s2-saola-1-ug-v1.2#reset-button", "esp32-s2-saola-1-sch-v1.2#buttons"], "part": "SW2 Reset button on CHIP_PU", "uses_pad": []}
  - {"effect": "Bridge TXD -> R34 -> U0RXD (GPIO44); bridge RXD -> R35 -> U0TXD (GPIO43), for flashing and console; the same pads are on header J3-6/J3-5.", "evidence": ["esp32-s2-saola-1-ug-v1.2#usb-bridge", "esp32-s2-saola-1-ug-v1.2#usb-port", "esp32-s2-saola-1-ug-v1.2#j3-table", "esp32-s2-saola-1-sch-v1.2#bridge-part"], "part": "U4 CP2102N-A02-GQFN28 USB-to-UART bridge (micro-USB J1)", "uses_pad": ["GPIO43", "GPIO44"]}
  - {"effect": "DTR/RTS can pull EN and GPIO0 low to enter download mode automatically (drawing also names IO2 in the table).", "evidence": ["esp32-s2-saola-1-sch-v1.2#auto-program"], "part": "Q1/Q2 L8050QLT1G auto-program circuit (bridge DTR/RTS)", "uses_pad": ["GPIO0"]}
  - {"effect": "On the header only (J3-20 IO19 = USB_D-, J3-19 IO20 = USB_D+); the drawing marks the links from the connector as \"USB Debug ... Reserved\" with not-fitted resistors, so the micro-USB goes to the bridge. Not independently confirmed.", "evidence": ["esp32-s2-saola-1-ug-v1.2#j3-usb", "esp32-s2-saola-1-sch-v1.2#usb-debug-reserved", "esp32-s2-ds-v1.9#usb-default"], "part": "USB D-/D+ pads (native USB OTG)", "uses_pad": ["GPIO19", "GPIO20"]}
  - {"effect": "Lights when USB power is connected; no GPIO pad.", "evidence": ["esp32-s2-saola-1-ug-v1.2#power-led"], "part": "Red 3.3 V power LED D5", "uses_pad": []}
