# Espressif ESP32-S2-Saola-1 revision V1.2 (user guide v1.2 = the first revision; schematic file name says V1.1, title block V1.2, 2020-03-06). Board is EOL. Variants: WROVER (4 MB flash + 2 MB PSRAM) and WROOM (4 MB flash); WROVER-I/WROOM-I share the records. Two keys (researcher + blind auditor) agree on every fact.
# Sources: user guide v1.2 Header Block tables J2/J3 and the schematic PDF.
# Labels = the guide Name column (IO0..); positions J2-1..21 and J3-1..21. RESOLVED: the guide prints J3 positions 14, 16, 17, 17 for IO35, IO34, IO33, IO26 (typo in the guide: 15 missing, 17 twice); the schematic J3 drawing (read by the second key) gives J3-14 IO35, 15 IO34, 16 IO33, 17 IO26, which is what is recorded.
# GPIO26 is on the header J3-17 but is the PSRAM chip select on the WROVER variant (module record: consumed psram). GPIO27-GPIO32 have no header pin (flash/PSRAM bus). GPIO0, GPIO45, GPIO46 are strapping pins; GPIO46 is input-only.
# Gap: no current rating for the 3V3/5V rails (missing).
