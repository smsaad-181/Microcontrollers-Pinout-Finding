logic_voltage: {"evidence": ["esp32-s2-saola-1-sch-v1.2#ldo-part", "esp32-s2-saola-1-ug-v1.2#power-options"], "note": "Schematic: U5 SGM2212-3.3XKC3G/TR makes VDD33 for the module; the guide has a 3.3V pin and \"3.3 V Power On LED\". No document states a logic voltage in words; derived from the 3.3 V LDO.", "reviewers": ["hardware-researcher", "hardware-fact-auditor"], "status": "verified", "unit": "V", "value": 3.3}
