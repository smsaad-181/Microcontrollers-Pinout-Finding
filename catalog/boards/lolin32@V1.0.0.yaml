onboard:
  - effect: "LED load on GPIO5 (VSPI CS0), lit when the pad is driven low."
    evidence:
      - "lolin32-sch-v1.0.0#led2"
    part: "LED2 with R9 2k (3V3 to IO5)"
    uses_pad:
      - "GPIO5"
  - effect: "UART0 TXD0/RXD0 wired to the bridge (also on P3)."
    evidence:
      - "lolin32-sch-v1.0.0#usb-uart"
      - "lolin32-sch-v1.0.0#p3-a"
    part: "U6 CP2104 USB-to-UART bridge"
    uses_pad:
      - "GPIO1"
      - "GPIO3"
  - effect: "Bridge RTS/DTR can pull EN and IO0 low to enter download mode."
    evidence:
      - "lolin32-sch-v1.0.0#autoprog"
    part: "U4 UMH3N auto-program transistors (RTS/DTR)"
    uses_pad:
      - "GPIO0"
