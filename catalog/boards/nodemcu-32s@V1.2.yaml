logic_voltage:
  evidence:
    - "nodemcu-32s-ds-v1#supply"
  note: "Module typical supply 3.3 V; the 3V3 rail (U4 AMS1117-3.3) feeds it."
  status: "single-source"
  unit: "V"
  value: 3.3
name: "NodeMCU-32S"
numbering:
  primary: "label"
onboard:
  - effect: "Module UART0 (U0TX/U0RX) wired to the bridge for flashing and console."
    evidence:
      - "nodemcu-32s-ds-v1#sch-usb-uart"
      - "nodemcu-32s-ds-v1#sch-j2-a"
    part: "U2 CP2102 USB-to-UART bridge"
    uses_pad:
      - "GPIO1"
      - "GPIO3"
  - effect: "Bridge DTR/RTS can pull EN and GPIO0 low to enter download mode."
    evidence:
      - "nodemcu-32s-ds-v1#sch-autoprog"
    part: "VT1/VT2 S8050 auto-program circuit (DTR/RTS)"
    uses_pad:
      - "GPIO0"
  - effect: "Pulls GPIO0 low through 470 ohm; GPIO0 has a 12K pull-up to 3V3."
    evidence:
      - "nodemcu-32s-ds-v1#sch-key-io0"
    part: "S2 boot button with R12 470 / R14 12K pull-up"
    uses_pad:
      - "GPIO0"
  - effect: "LED load on GPIO2 (strapping pad), sinks to GND through 470 ohm."
    evidence:
      - "nodemcu-32s-ds-v1#sch-led-io2"
    part: "LED1 blue with R9 470"
    uses_pad:
      - "GPIO2"
rails:
  - max_current:
      evidence: []
      note: "The Ai-Thinker datasheet and schematic print no current rating; the AMS1117 manufacturer datasheet was not used."
      status: "missing"
      unit: "mA"
      value: null
    name: "3V3"
    source: "U4 AMS1117-3.3 from VDD5V (schematic)"
    voltage:
      evidence:
        - "nodemcu-32s-ds-v1#sch-reg"
      status: "single-source"
      transcribed: true
      unit: "V"
      value: 3.3
  - max_current:
      evidence: []
      note: "No current rating for the USB / 5V path is printed."
      status: "missing"
      unit: "mA"
      value: null
    name: "5V"
    source: "micro-USB VDDUSB through D1 1N5819/SS14 diode (VDD5V), or the 5V pin"
    voltage:
      evidence:
        - "nodemcu-32s-ds-v1#sch-usb-diode"
        - "nodemcu-32s-ds-v1#sch-j1-b"
      note: "Rail name VDD5V / pin label 5V; value 5 is the USB nominal, not printed as a number in the datasheet."
      status: "single-source"
      transcribed: true
      unit: "V"
      value: 5
revision: "V1.2"
