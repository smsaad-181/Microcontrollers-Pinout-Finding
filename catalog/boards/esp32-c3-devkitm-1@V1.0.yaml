# Espressif ESP32-C3-DevKitM-1 revision V1.0 (schematic V1.0, 2020-09-15; sheet 2 dated 2021-05-20). Variant: ESP32-C3-DevKitM-1-N4X with ESP32-C3-MINI-1 (the plain ESP32-C3-DevKitM-1 is EOL). Two keys (researcher + blind auditor) agree on every fact.
# Sources: ESP32-C3-DevKitM-1 user guide (esp-dev-kits, latest; no revision printed on the page) Header Block tables J1/J3, and the schematic PDF (connectivity read from the rendered drawing).
# Labels = the guide Name column (IO0.. and TX/RX); positions J1-1..15 and J3-1..15 follow the schematic numbering (guide: "The numbering is the same as in the ... Schematic"). RST (J1-7) is CHIP_PU, modelled as kind reset without a pad.
# GPIO11-GPIO17 have no header pin (flash / VDD_SPI). GPIO8 (RGB LED) and GPIO9 (BOOT) are strapping pins that are also on the header.
# Gap: the schematic drawing shows the micro-USB D+/D- going to the CP2102N bridge only; no current rating for the 3V3/5V rails (missing).
