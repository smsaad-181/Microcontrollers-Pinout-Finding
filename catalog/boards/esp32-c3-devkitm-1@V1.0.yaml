onboard:
  - {"effect": "DIN is driven from GPIO8 through 0 ohm R17 (net RGB_CTRL), supply VCC_3V3. GPIO8 is also header J3-6 and a strapping pin (ROM print / download mode), so a load there disturbs the LED and boot.", "evidence": ["esp32-c3-devkitm-1-ug#rgb-led", "esp32-c3-devkitm-1-ug#j3-gpio8-rgb", "esp32-c3-devkitm-1-sch-v1.0#rgb-part", "esp32-c3-devkitm-1-sch-v1.0#rgb-ctrl-net"], "part": "D6 SK68XXMINI-HS addressable RGB LED", "uses_pad": ["GPIO8"]}
  - {"effect": "Pulls GPIO9 (strapping pin, normally high) to ground; hold Boot and press Reset for download mode. GPIO9 is also header J3-5.", "evidence": ["esp32-c3-devkitm-1-ug#boot-button", "esp32-c3-devkitm-1-sch-v1.0#buttons", "esp32-c3-devkitm-1-sch-v1.0#auto-program"], "part": "SW1 Boot button", "uses_pad": ["GPIO9"]}
  - {"effect": "Pulls CHIP_PU (EN) to ground and restarts the system; CHIP_PU is not a GPIO pad (10 kohm pull-up R5, 1 uF C6).", "evidence": ["esp32-c3-devkitm-1-ug#reset-button", "esp32-c3-devkitm-1-sch-v1.0#buttons"], "part": "SW2 Reset button on CHIP_PU", "uses_pad": []}
  - {"effect": "Bridge TXD/RXD connect through 0 ohm R22/R21 to U0TXD (GPIO21) and U0RXD (GPIO20) for flashing and console; the same pads are on header J3-2 (TX) and J3-3 (RX).", "evidence": ["esp32-c3-devkitm-1-ug#usb-bridge", "esp32-c3-devkitm-1-ug#usb-port", "esp32-c3-devkitm-1-ug#j3-table", "esp32-c3-devkitm-1-sch-v1.0#bridge-part"], "part": "U3 CP2102N-A02-GQFN28 USB-to-UART bridge (micro-USB J2)", "uses_pad": ["GPIO20", "GPIO21"]}
  - {"effect": "DTR/RTS can pull CHIP_PU (EN) and GPIO9 low to enter download mode automatically.", "evidence": ["esp32-c3-devkitm-1-sch-v1.0#auto-program"], "part": "Q1/Q2 L8050QLT1G auto-program circuit (bridge DTR/RTS)", "uses_pad": ["GPIO9"]}
  - {"effect": "On the header only (J3-13 IO18 = USB_D-, J3-14 IO19 = USB_D+): the micro-USB connector goes to the bridge, and the 0 ohm links R2/R3 from the connector to GPIO18/GPIO19 are not fitted.", "evidence": ["esp32-c3-devkitm-1-ug#j3-usb", "esp32-c3-devkitm-1-sch-v1.0#usb-native-nc", "esp32-c3-ds-v2.4#usb-default"], "part": "USB D-/D+ pads (native USB Serial/JTAG)", "uses_pad": ["GPIO18", "GPIO19"]}
  - {"effect": "Lights when USB 5 V is present; no GPIO pad.", "evidence": ["esp32-c3-devkitm-1-sch-v1.0#power-led"], "part": "D5 red power LED with R11 5.1 kohm", "uses_pad": []}
