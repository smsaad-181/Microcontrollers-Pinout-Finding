# Waveshare ESP32-S3-DEV-KIT-N8R8 (ESP32-S3-WROOM-1-N8R8; the wiki family also lists N16R8/N32R16V, only N8R8 is catalogued). Header-compatible with Espressif ESP32-S3-DevKitC-1. No revision printed; revision "unversioned". Two keys (researcher + blind auditor) agree on every fact.
# Sources: Waveshare wiki page (text + pinout picture) and the schematic PDF (headers P1/P2 read from the rendered drawing; they match the wiki picture and the DevKitC-1 J1/J3 pin for pin).
# Connectors P1 (22) and P2 (22) use the schematic numbering. Labels: bare GPIO numbers as in the DevKitC-1 record; TX/RX = GPIO43/GPIO44 (U0TXD/U0RXD). P1-3 is CHIP_PU/EN (kind reset). P1-21 is the VCC_5V net.
# GPIO35/GPIO36/GPIO37 are used by the Octal PSRAM (module record consumed) but stay on the header map. GPIO26-GPIO32 (flash) have no pin.
# Gap: the 3V3 regulator is printed "SGM2212-3.3/AMS1117" (two alternative parts) with no current rating -> max_current missing; the hub/UART power-switch MOSFET control source was not traced.
