id: "esp32-s3-devkitc-1"
logic_voltage: {"evidence": ["esp32-s3-devkitc-1-ug-v1.1#ldo", "esp32-s3-devkitc-1-sch-v1.1#ldo-part", "esp32-s3-devkitc-1-sch-v1.1#esp-3v3-r24-link"], "note": "Guide: 5 V to 3.3 V LDO; schematic: U2 SGM2212-3.3XKC3G/TR makes VCC_3V3, which feeds the module through the 0 ohm resistor R24 (ESP_3V3). The chip's I/O domains therefore run at 3.3 V. No document states a logic voltage in words; both keys derived 3.3 V from the 3.3 V LDO U2 feeding the module supply ESP_3V3 through R24 (schematic drawing, hence transcribed; claim added for the R24 link).", "reviewers": ["hardware-researcher", "hardware-fact-auditor"], "status": "verified", "transcribed": true, "unit": "V", "value": 3.3}
name: "ESP32-S3-DevKitC-1"
numbering: {"primary": "gpio"}
onboard:
  - effect: "Single-wire data input DIN is driven from GPIO38 through 0 ohm R17 (net RGB_CTRL), supply VCC_3V3. v1.1 only: the v1.0 board uses GPIO48. GPIO38 is also on header J3-10, so a load or signal there disturbs the LED."
    evidence: ["esp32-s3-devkitc-1-ug-v1.1#rgb-led", "esp32-s3-devkitc-1-ug-v1.1#revision-note", "esp32-s3-devkitc-1-ug-v1.1#j3-gpio38-rgb", "esp32-s3-devkitc-1-sch-v1.1#rgb-led-gpio38", "esp32-s3-devkitc-1-sch-v1.1#rgb-led-part"]
    part: "D6 SK68XXMINI-HS addressable RGB LED"
    uses_pad: ["GPIO38"]
  - effect: "UART0: bridge RXD/TXD connect through 0 ohm R7/R9 to U0TXD (GPIO43) and U0RXD (GPIO44), used for flashing and the console; the same pads are on header J3-2 (TX) and J3-3 (RX)."
    evidence: ["esp32-s3-devkitc-1-ug-v1.1#usb-uart-port", "esp32-s3-devkitc-1-ug-v1.1#usb-bridge", "esp32-s3-devkitc-1-ug-v1.1#j3-gnd-tx-rx", "esp32-s3-devkitc-1-sch-v1.1#bridge-part", "esp32-s3-devkitc-1-sch-v1.1#uart0-links"]
    part: "U3 CP2102N-A02-GQFN28 USB-to-UART bridge (micro-USB J2 'USB to UART')"
    uses_pad: ["GPIO43", "GPIO44"]
  - effect: "Bridge DTR/RTS can pull CHIP_PU (EN) and GPIO0 low through Q1/Q2 and 0 ohm R8/R13 to enter download mode automatically (DTR RTS -> EN IO0 table on the schematic)."
    evidence: ["esp32-s3-devkitc-1-sch-v1.1#auto-program"]
    part: "Q1/Q2 L8050QLT1G auto-program circuit (bridge DTR/RTS)"
    uses_pad: ["GPIO0"]
  - effect: "Pressing connects GPIO0 to ground; hold Boot and press Reset to start Firmware Download mode (GPIO0 = 0 with GPIO46 default 0). C13 on GPIO0 is NC (not fitted)."
    evidence: ["esp32-s3-devkitc-1-ug-v1.1#boot-button", "esp32-s3-devkitc-1-sch-v1.1#buttons", "esp32-s3-devkitc-1-ug-v1.1#j3-gpio0-45-48-47"]
    part: "SW1 Boot button"
    uses_pad: ["GPIO0"]
  - effect: "Pressing pulls CHIP_PU (EN) to ground and restarts the system; EN is not a GPIO pad. The 10 kohm pull-up R5 to 3V3 and 1 uF C6 sit on the EN net."
    evidence: ["esp32-s3-devkitc-1-ug-v1.1#reset-button", "esp32-s3-devkitc-1-sch-v1.1#buttons", "esp32-s3-devkitc-1-sch-v1.1#en-rc"]
    part: "SW2 Reset button with R5 10 kohm pull-up and C6 1 uF on CHIP_PU (EN)"
    uses_pad: []
  - effect: "D- is wired to GPIO19 and D+ to GPIO20 (USB OTG / USB Serial/JTAG, JTAG debugging); VBUS reaches VCC_5V through D7 1N5819HW. The pads are connected to the USB Serial/JTAG controller by default and are also on header J3-20/J3-19."
    evidence: ["esp32-s3-devkitc-1-ug-v1.1#usb-port", "esp32-s3-devkitc-1-ug-v1.1#j3-usb-pins", "esp32-s3-devkitc-1-sch-v1.1#esp-usb", "esp32-s3-ds-v2.2#usb-default-serial-jtag"]
    part: "J4 micro-USB 'ESP USB' (native ESP32-S3 full-speed USB)"
    uses_pad: ["GPIO19", "GPIO20"]
  - effect: "Lights when 3V3 is present (guide: turns on when USB power is connected); no GPIO pad."
    evidence: ["esp32-s3-devkitc-1-ug-v1.1#power-led", "esp32-s3-devkitc-1-sch-v1.1#power-led"]
    part: "D5 red 3.3 V power-on LED with R11 5.1 kohm"
    uses_pad: []
