# Espressif ESP32-S3-DevKitC-1 revision V1.1 (variants N8 = ESP32-S3-WROOM-1-N8, N8R8 = ESP32-S3-WROOM-1-N8R8) - facts reconciled with the blind audit (task 2a.4).
# Sources: ESP32-S3-DevKitC-1 v1.1 User Guide (esp-dev-kits docs, Header Block tables J1/J3) and schematic SCH_ESP32-S3-DevKitC-1_V1.1_20221130 (Rev V1.1, sheet 2 dated 2022-11-30).
# REVISION: the v1.1 guide (the latest) is catalogued. v1.0 (initial release) is also on the market and differs in the RGB LED pad: GPIO48 on v1.0, GPIO38 on v1.1 (v1.1 guide 'Hardware
#   Revision Details'; v1.0 guide); the header pin tables are otherwise identical. A v1.0 board needs its own record (not created here).
# Labels = the guide 'Name' column (the silkscreen image was not transcribed). Positions J1-1..22 / J3-1..22 are the schematic numbering (guide: 'The numbering is the same as in the Board Schematic').
#   The schematic drawing agrees with the guide tables pin by pin (read from the rendered sheet).
# J1-3 'RST' is EN/CHIP_PU and is modelled as kind reset without a pad (CHIP_PU is not a GPIO pad). J1-21 '5V' is the VCC_5V rail; J1-1/J1-2 '3V3' the 3V3 rail.
# N8R8: GPIO35/GPIO36/GPIO37 (J3-13/J3-12/J3-11) are consumed by the Octal PSRAM (module record `consumed`; user guide note: 'not available for external use'). The pins stay on the header map
#   because the schema has one connector map for all variants. The N8 variant (no PSRAM) has them as ordinary GPIOs. GPIO26-GPIO32 (flash) have no header pin.
# GPIO19/GPIO20 (J3-20/J3-19) are the USB D-/D+ pads: wired to the native micro-USB connector J4 and also on the header.
# rails max_current (3V3 and 5V) is missing: neither the guide nor the schematic states a current rating; the regulator part is U2 SGM2212-3.3XKC3G/TR (datasheet not opened).
# `status` is the value the catalog CLI computes. Connectors/onboard/labels were compared mechanically with the blind audit (J1/J3 identical; see docs/validation/phase-2a/reconcile-esp32-s3-modules-board.md).
