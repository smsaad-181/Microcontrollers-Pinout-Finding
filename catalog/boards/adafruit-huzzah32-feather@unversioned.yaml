logic_voltage:
  evidence:
    - "adafruit-huzzah32-learn-pinouts#logic-3v3"
  status: "single-source"
  unit: "V"
  value: 3.3
name: "Adafruit HUZZAH32 - ESP32 Feather"
numbering:
  primary: "label"
onboard:
  - effect: "LED load on GPIO13 (next to the USB port)."
    evidence:
      - "adafruit-huzzah32-learn-pinouts#d13-led"
      - "adafruit-huzzah32-sch#net-jp3-4"
      - "adafruit-huzzah32-sch#d3-led"
      - "adafruit-huzzah32-sch#r10-1k"
      - "adafruit-huzzah32-sch#net-n5"
    part: "D3 red LED with R10 1K"
    uses_pad:
      - "GPIO13"
  - effect: "UART0 TXD0/RXD0 wired to the bridge; used for flashing and console; not on the header."
    evidence:
      - "adafruit-huzzah32-sch#ic1-cp2104"
      - "adafruit-huzzah32-sch#net-rxd0"
      - "adafruit-huzzah32-sch#net-txd0"
    part: "IC1 CP2104 USB-to-UART bridge"
    uses_pad:
      - "GPIO1"
      - "GPIO3"
  - effect: "Q2 can pull GPIO0 low (and Q1 pulls EN) for download mode; GPIO0 is not on the header."
    evidence:
      - "adafruit-huzzah32-sch#net-gpio0"
      - "adafruit-huzzah32-sch#net-reset"
      - "adafruit-huzzah32-sch#net-dtr"
      - "adafruit-huzzah32-sch#net-rts"
    part: "Q1/Q2 mmbt2222 auto-reset (bridge DTR/RTS)"
    uses_pad:
      - "GPIO0"
  - effect: "GPIO35 (A13) reads VBAT/2; input-only pad, not on the header."
    evidence:
      - "adafruit-huzzah32-learn-pinouts#a13"
      - "adafruit-huzzah32-learn-power#vbat-divider"
      - "adafruit-huzzah32-sch#net-vbat-adc"
      - "adafruit-huzzah32-sch#r1-100k"
      - "adafruit-huzzah32-sch#r3-100k"
    part: "R1/R3 100K VBAT divider"
    uses_pad:
      - "GPIO35"
rails:
  - max_current:
      evidence:
        - "adafruit-huzzah32-learn-power#reg-500ma"
      note: "Peak rating; guide: not continuous from 5V, and about half is drawn by the ESP32 (budget 250 mA for the module)."
      status: "single-source"
      unit: "mA"
      value: 500
    name: "3V3"
    source: "U2 AP2112-3.3 regulator from USB (via changeover MOSFET/diode) or LiPo BAT"
    voltage:
      evidence:
        - "adafruit-huzzah32-learn-pinouts#3v-pin"
      status: "single-source"
      value: 3.3
  - max_current:
      evidence: []
      note: "Guide gives no current rating for the USB pin (USB host / cable limited)."
      status: "missing"
      unit: "mA"
      value: null
    name: "USB"
    source: "micro-USB VBUS"
    voltage:
      evidence:
        - "adafruit-huzzah32-learn-power#usb-5v"
      status: "single-source"
      unit: "V"
      value: 5
  - max_current:
      evidence: []
      note: "No current rating stated for the BAT pin."
      status: "missing"
      unit: "mA"
      value: null
    name: "BAT"
    source: "JST-PH LiPo connector (optional single-cell LiPo)"
    voltage:
      evidence: []
      note: "Battery dependent; the guide gives only LiPo 4.2/3.7 V text and \"3.2V or so\" cutoff, not a pin rating."
      status: "missing"
      unit: "V"
      value: null
revision: "unversioned"
status: "partially-verified"
