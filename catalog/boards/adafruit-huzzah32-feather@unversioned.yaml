# Adafruit HUZZAH32 ESP32 Feather (task boards-1). Sources: Adafruit Learning System pages (Pinouts, Power Management; read 2026-10-24) and the adafruit/Adafruit-HUZZAH32-ESP32-Feather-PCB EAGLE schematic (commit e23514c).
# Pad mapping comes from the schematic nets (JP1/JP3 header pin numbers); labels are the guide silkscreen labels where the guide names the pin (A0-A5, 21, 13, 12, 27, 33, 15, 32, 14) and the schematic net names otherwise (MISO/MOSI/SCK/SDA/SCL, IO16/IO17).
# IO16/IO17 are the guide "RX/TX" Serial1 pins by inference of the pad numbers only; the guide does not state RX = GPIO16. Labelled by net name on purpose.
# JP1 pin 14 has no net in the schematic (the guide does not label it): omitted, not guessed. JP1-1..16 are listed bottom row, JP3 top row (guide "Bottom row"/"Top row").
# GPIO2, GPIO0 (except via Q2) and GPIO35 are not on the headers. Revision: the repository and guide carry no revision string ("unversioned").
# Single key (researcher + author); blind audit pending.
