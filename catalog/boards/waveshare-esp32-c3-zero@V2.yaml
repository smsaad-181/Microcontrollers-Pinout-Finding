# Waveshare ESP32-C3-Zero (and -M with headers). Chip ESP32-C3FH4 used bare. Revision "V2" is taken from the schematic file name ESP32-C3-Zero-Sch-V2.pdf (the wiki prints no revision). Two keys (researcher + blind auditor) agree on every fact.
# Sources: Waveshare wiki page and the schematic PDF (18-pin header read from the rendered drawing).
# Connector P1 = the 18 castellated pads in schematic numbering. IO18/IO19 are USB D-/D+; GPIO9 (BOOT) and GPIO10 (RGB LED) are also on the header. GPIO11-GPIO17 have no pad.
# Gap: the wiki shows no pinout picture in the page text; the physical left/right position of each pad is not transcribed (only the schematic numbering). No current rating for the 3V3 LDO is given for this board (the 800 mA figure appears only for the sibling Zero/Tiny boards).
