    voltage: {"evidence": ["waveshare-esp32-c3-zero-sch-v2#ldo-part"], "note": "LDO output 3.3 V (part code C33).", "reviewers": ["hardware-researcher", "hardware-fact-auditor"], "status": "verified", "unit": "V", "value": 3.3}
  - max_current: {"evidence": [], "note": "No current rating for the 5 V pad is stated.", "status": "missing", "unit": "mA", "value": null}
