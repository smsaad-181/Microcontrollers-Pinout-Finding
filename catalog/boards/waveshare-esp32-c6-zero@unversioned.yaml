# Waveshare ESP32-C6-Zero (and -M with headers). Chip ESP32-C6FH4 (QFN32, 4 MB in-package flash) used bare. No revision printed; revision "unversioned". One key; every fact is single-source.
# Sources: Waveshare wiki page (text + pinout/onboard pictures, transcribed) and the schematic PDF (18-pin header P8 read from the rendered drawing; it agrees with the wiki picture).
# Connector P8 = the 18 castellated pads in schematic numbering; connector PADS = the 7 back pads of the wiki picture (GP13, GP12, GP23, GP9, GP8, GP7, GP6; positions are my picture order, transcribed). GPIO8 (RGB LED, strapping) and GPIO9 (BOOT, strapping) are on back pads. GPIO12/GPIO13 are USB D-/D+ (back pads).
# GPIO4/GPIO5 (strapping pins) are on header pins 8/9 (IO4/IO5). GPIO10/GPIO11 and GPIO24-GPIO30 do not exist on QFN32.
# Gap: the 800 mA LDO rating is read from the onboard-interfaces picture text only.
connectors:
  - id: "P8"
    pins:
      - {"kind": "power", "label": "5V", "position": 1, "rail": "5V"}
      - {"kind": "ground", "label": "GND", "position": 2}
      - {"kind": "power", "label": "3V3", "position": 3, "rail": "3V3"}
      - {"kind": "gpio", "label": "IO0", "pad": "GPIO0", "position": 4}
      - {"kind": "gpio", "label": "IO1", "pad": "GPIO1", "position": 5}
      - {"kind": "gpio", "label": "IO2", "pad": "GPIO2", "position": 6}
      - {"kind": "gpio", "label": "IO3", "pad": "GPIO3", "position": 7}
      - {"kind": "gpio", "label": "IO4", "pad": "GPIO4", "position": 8}
      - {"kind": "gpio", "label": "IO5", "pad": "GPIO5", "position": 9}
      - {"kind": "gpio", "label": "IO22", "pad": "GPIO22", "position": 10}
      - {"kind": "gpio", "label": "IO21", "pad": "GPIO21", "position": 11}
      - {"kind": "gpio", "label": "IO20", "pad": "GPIO20", "position": 12}
      - {"kind": "gpio", "label": "IO19", "pad": "GPIO19", "position": 13}
      - {"kind": "gpio", "label": "IO18", "pad": "GPIO18", "position": 14}
      - {"kind": "gpio", "label": "IO15", "pad": "GPIO15", "position": 15}
      - {"kind": "gpio", "label": "IO14", "pad": "GPIO14", "position": 16}
      - {"kind": "gpio", "label": "RX", "pad": "GPIO17", "position": 17}
      - {"kind": "gpio", "label": "TX", "pad": "GPIO16", "position": 18}
  - id: "PADS"
    pins:
      - {"kind": "gpio", "label": "IO13", "pad": "GPIO13", "position": 1}
      - {"kind": "gpio", "label": "IO12", "pad": "GPIO12", "position": 2}
      - {"kind": "gpio", "label": "IO23", "pad": "GPIO23", "position": 3}
      - {"kind": "gpio", "label": "IO9", "pad": "GPIO9", "position": 4}
      - {"kind": "gpio", "label": "IO8", "pad": "GPIO8", "position": 5}
      - {"kind": "gpio", "label": "IO7", "pad": "GPIO7", "position": 6}
      - {"kind": "gpio", "label": "IO6", "pad": "GPIO6", "position": 7}
id: "waveshare-esp32-c6-zero"
logic_voltage: {"evidence": ["waveshare-esp32-c6-zero-sch#ldo-part", "waveshare-esp32-c6-zero-wiki#pinout-image"], "note": "LDO ME6217C33M5G (33 = 3.3 V) makes 3V3 for the chip; the picture labels the pad 3V3(OUT). Derived. One key (hardware-researcher): a blind audit must re-read it.", "status": "single-source", "unit": "V", "value": 3.3}
name: "ESP32-C6-Zero"
numbering: {"primary": "gpio"}
onboard:
  - {"effect": "DI is on GPIO8 (10K pull-up R1). GPIO8 is a strapping pin (boot mode/ROM print) and is also back pad GP8, so a load there disturbs the LED and boot.", "evidence": ["waveshare-esp32-c6-zero-wiki#pinout-image", "waveshare-esp32-c6-zero-sch#rgb-part"], "part": "LED1 WS2812B-0807 addressable RGB LED", "uses_pad": ["GPIO8"]}
  - {"effect": "Pulls GPIO9 (strapping pin, normally high) low (10K pull-up R5) for download mode. GPIO9 is also back pad GP9.", "evidence": ["waveshare-esp32-c6-zero-wiki#onboard-image", "waveshare-esp32-c6-zero-sch#keys"], "part": "Key1 BOOT button", "uses_pad": ["GPIO9"]}
  - {"effect": "Pulls CHIP_PU low (10K pull-up R6, 1 uF C16); not a GPIO pad.", "evidence": ["waveshare-esp32-c6-zero-wiki#onboard-image", "waveshare-esp32-c6-zero-sch#keys"], "part": "Key2 RESET button on CHIP_PU", "uses_pad": []}
  - {"effect": "D-/D+ are wired to GPIO12/GPIO13 (USB_N/USB_P), which are also back pads GP12/GP13.", "evidence": ["waveshare-esp32-c6-zero-sch#usb-diode", "esp32-c6-ds-v1.5#usb-default"], "part": "USB Type-C connector (native USB Serial/JTAG, no bridge chip)", "uses_pad": ["GPIO12", "GPIO13"]}
  - {"effect": "TX (GPIO16, through R7 499 ohm) and RX (GPIO17) are header pins 18/17; no bridge is attached.", "evidence": ["waveshare-esp32-c6-zero-sch#header"], "part": "UART0 pads TX/RX", "uses_pad": ["GPIO16", "GPIO17"]}
