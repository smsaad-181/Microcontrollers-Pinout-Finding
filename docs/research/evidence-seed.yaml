documents:
  - id: esp32-ds-v5.3
    title: ESP32 Series Datasheet
    revision: "5.3"
    url: https://documentation.espressif.com/esp32_datasheet_en.pdf
    leads:
      - { locator: "§3, Tables 3-1..3-5", claim: "Straps GPIO0 (PU), GPIO2 (PD), MTDI/GPIO12 (PD), MTDO/GPIO15 (PU), GPIO5 (PU); hold time 1 ms" }
      - { locator: "§3.2", claim: "MTDI=1 at reset selects internal 1.8 V LDO for VDD_SDIO; eFuse can override" }
      - { locator: "§4.9.1", claim: "ADC effective range by attenuation: 100–950, 100–1250, 150–1750, 150–2450 mV" }
      - { locator: "Table 5-1", claim: "Supply abs max −0.3..3.6 V; cumulative IO output current 1200 mA" }
      - { locator: "§2.3.1", claim: "GPIO34–39 input-only (no pulls)" }
    note: "Table 5-3 (DC characteristics) did not extract via automated reading; use the module datasheet Table 15 or read the PDF page directly."

