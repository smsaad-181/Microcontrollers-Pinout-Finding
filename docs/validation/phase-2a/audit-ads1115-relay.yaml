contradictions:
  - id: C1
    entity: relay-board-4ch-opto-jdvcc
    topic: TS0011 trigger polarity text
    a: "TS0011 pdf p1 Features: 'When input is at low level, the relay is off, and the indicator light is on.'"
    b: "TS0011 pdf p2 Pinout: 'When a low-level signal is input, the Normally Open (NO) contact of the relay connects with the Common (COM) terminal.' and pdf p7 code: LOW activates, HIGH = off; p1 intro 'LOW Level 5V'. The schematic (pdf p3) is also consistent with active LOW."
    resolution: "Active LOW is supported by 3 locations plus the schematic; the p1 feature line is an internal error (or an inverted description of the indicator)."
  - id: C2
    entity: relay-board-4ch-opto-jdvcc
    topic: TS0011 supply voltage and current text
    a: "TS0011 pdf p1: 'Power Supply Voltage: 5VDC, 12VDC' and 'Current: Greater than 100mA'"
    b: "Title '4 Channel 5V Relay Module', and the relay fitted is not identified (a 5 V SRD coil is 70-90 mA each). No 12 V variant is described elsewhere in the document."
    resolution: unresolved - supply range of the board cannot be taken from this document without ambiguity
  - id: C3
    entity: relay-board-4ch-opto-jdvcc
    topic: Input (driver) current vs schematic resistors
    a: "TS0011 pdf p1 and SainSmart product page: 'each channel needs/requires 15-20mA driver current'"
    b: "TS0011 pdf p3 schematic labels the series resistor in the input path (VCC to opto-LED anode) as 1K; with a 5 V supply a 1 k series resistor cannot carry 15-20 mA (it would be a few mA). Not computed further because the 817C datasheet was not opened."
    resolution: "unresolved - record the stated 15-20 mA as the vendor claim, flagged as not consistent with the drawn circuit"
  - id: C4
    entity: srd-05vdc-sl-c
    topic: Coil resistance / current / overdrive between the two SRD datasheets
    a: "Songle SRD(T73) V1 (pdf p2, printed 31, at 23 C): 5 V, 0.36 W(L) coil 69.4 ohm; 0.45 W(D) 55 ohm; max overdrive 130% for both; no coil current column"
    b: "Older sheet (pdf p2, at 20 C): 5 V high sensitivity 71.4 mA, 70 ohm, abt 0.36 W, max allowable 120%; standard 89.3 mA, 55 ohm, abt 0.45 W, max allowable 110%"
    resolution: "Both versions agree on 75% pick-up max / 10% drop-out min. 69.4 vs 70 ohm is a revision/temperature difference. Which coil sensitivity is fitted to a given board is not stated by either sheet (SL = L = 0.36 W per the ordering code)."
  - id: C5
    entity: srd-05vdc-sl-c
    topic: Ambient temperature and contact limits
    a: "Songle V1: ambient -40 to +85 C (p2) with features line '-40 C to +85 C/+105 C' (p1); max switching voltage 277VAC/30VDC; max switching power 2770VA/300W; contact rating 7A/10A/15A 250VAC/28VDC, 10A 125VAC"
    b: "Older sheet: ambient -25 to +70 C; max allowable voltage 250VAC/110VDC; FORM C 7A 28VDC, 10A 125VAC, 7A 240VAC; max power 800VAC/240W (FORM C); contact material AgCdO"
    resolution: unresolved - report both; the V1 sheet does not split ratings per form (A/B/C) in the image text
  - id: C6
    entity: ads1115-breakout
    topic: Adafruit repository schematic file contents
    a: "'Adafruit ADS1115 ADC STEMMA QT.sch' part U1 has value ADS1015IDGST (deviceset ADC_ADS1015)"
    b: "legacy file 'Adafruit_ADS1115_16Bit_I2C_ADC.sch' has value ADS1115IDGST on the same ADS1015 deviceset; README says the PCB serves both ADS1015 and ADS1115"
    resolution: "the PCB is shared; the fitted IC is chosen by BOM, not by the schematic value; do not read the IC type from the schematic part value"
  - id: C7
    entity: ads1115-breakout
    topic: Legacy schematic has no supply input
    a: "Legacy sch JP1 (1x10) pins: 1-4 AIN3..AIN0, 5 ALERT, 6 ADDR, 7 SDA, 8 SCL, 9/10 ferrite-filtered outputs"
    b: "No connector pin is connected to the VDD net (and no supply pin for GND input) in the legacy netlist; the guide describes VIN and GND"
    resolution: "legacy schematic looks incomplete for power input; the current STEMMA QT schematic (JP2 pin 1 VCC, pin 2 GND) and guide are used"
  - id: C8
    entity: relay-board-4ch-transistor
    topic: KS0058 wiki text vs images
    a: "Wiki text lists only: control pins 1-4, power supply (VCC), ground (GND); control signal TTL, active at HIGH level"
    b: "Photo Ks0058-1.png shows a 6-pin header plus a separate 2-pin block with a jumper cap; connection diagram Ks0058-2.png shows DIP-4 footprints beside each relay and a 2-pin block labelled COM/GND, and draws the relay as SRD-06VDC-SL-C while the photo shows SRD-05VDC-SL-C on the cases"
    resolution: "unresolved - cannot tell whether KS0058 is transistor-only or has opto stages and a jumper without the unreachable schematic"
  - id: C9
    entity: relay-board-4ch-opto-jdvcc
    topic: Polarity of the two vendor families
    a: "TS0011 and SainSmart (schematic + page 'TTL logic active low'): active LOW"
    b: "KS0058 wiki: 'Active at HIGH level'"
    resolution: "not a contradiction within one board; confirms polarity is board specific and must be stored per board"

