  notes: >
    Blind re-derivation. No catalog/, docs/research/, PLAN/STATE/NOW, phase-1 or other phase-2a files were opened.
    Board-type assignment decided from the documents: SunFounder TS0011 and the SainSmart schematic both show an
    optocoupler (817C) + JD-VCC jumper + NPN transistor + flyback diode per channel and are ACTIVE LOW, so both
    document the opto/JD-VCC type (relay-board-4ch-opto-jdvcc). The only document offered for the transistor type is the
    Keyestudio KS0058 wiki page, whose text says "Active at HIGH level" but which contains NO schematic; the
    schematic PDF is on a host scripts cannot use (could-not-verify, not worked around). Its photos show hints
    (a jumper cap, DIP-4 footprints) that it may not be a plain transistor-only board; see facts and contradictions.
