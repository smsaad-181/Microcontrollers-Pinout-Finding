# ---------------------------------------------------------------- CHIP: straps
  - entity: esp8266ex
    level: chip
    path: pads.{GPIO0,GPIO2,GPIO15}.strap.role
    value: "boot-mode and SDIO-mode selection (3-bit strapping register: GPIO0, GPIO2, MTDO=GPIO15)"
    unit: null
    conditions: ""
    doc: ds
    locator: "PDF p11 / printed p6, note under Table 2-1"
    quote: "GPIO2, GPIO0, and MTDO are used to select booting mode and the SDIO mode"
    transcribed: false
    confidence: found
    notes: "HDG PDF p10 / printed p5 note: 'configurable on PCB as the 3-bit strapping register that determines the booting mode and the SDIO timing mode'. TRM register list (PDF p107, Appendix GPIO_IN register) has GPIO_STRAPPING [31:16] 'The values of the strapping pins.' No level-to-mode table anywhere in DS/HDG/TRM; the Strapping List is in the unopened Pin List. All other pads: strap none (inferred from the note naming only these three)."
  - entity: esp8266ex
    level: chip
    path: pads.GPIO15.strap.required_at_reset
    value: low
    unit: null
    conditions: "at power-on, for normal flash-boot operation (HDG: a high level makes the system 'mistakenly entering boot mode')"
    doc: hdg
    locator: "PDF p16 / printed p11, sec 1.4.7 (UART SWAP)"
    quote: "GPIO15, the strapping pin of ESP8266EX, needs to be at low-voltage level when the chip is powered on."
    transcribed: false
    confidence: found
    notes: "Corroborated by ESP-LAUNCHER board text (PDF p31 / printed p26): pull-down R29 on MTDO/IO15 exists. The target mode of 'low' is implied as normal flash boot; the HDG states the SDIO boot mode is entered with J1 open (PDF p19 / printed p14)."
  - entity: esp8266ex
    level: chip
    path: pads.GPIO0.strap.required_at_reset
