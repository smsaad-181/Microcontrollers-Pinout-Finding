newer_or_more_authoritative_sources:
  - name: ESP8266 Pin List (xls; sheets Digital Die Pin List, Buffer Sheet, Register List, Strapping List)
    status: "LISTED but NOT OPENED. DS Appendix A (PDF p28) links it; espressif.com technical-documents listing shows 'ESP8266 Pin List' dated 2018.12.13 at https://www.espressif.com/sites/default/files/documentation/ESP8266_Pin_List_0.xls . Every download attempt (that URL, documentation.espressif.com variants) returned the 15 KB documentation-portal HTML shell, not the xls. Manual download needed (sources/manual/README.md request). It is the document that would state reset states / strapping levels / pad drive; those facts are therefore could-not-verify here."
  - name: ESP8266 errata
    status: "None found: the espressif.com technical-documents search for 'ESP8266 errata' lists only ESP8266 Pin List, no errata document. DS/HDG/TRM contain no errata section."
  - name: ESP8266 Hardware Matching Guide
    status: "Linked from DS Appendix B (PDF p29); not opened, not needed for these facts."
  - name: ME6211 regulator datasheet / CH340C datasheet / flash datasheet
    status: "Third-party component datasheets are not among the supplied sources; regulator max current and flash part number are could-not-verify from the supplied documents."
disagreements:
  - id: D-VDDPST
    what: "VDDPST (digital/IO supply) upper bound"
    a: {doc: ds, locator: "PDF p10 / printed p5, Table 2-1 pins 11 and 17", value: "1.8 V ~ 3.6 V"}
    b: {doc: hdg, locator: "PDF p9 / printed p4, Table 1-2 pins 11 and 17; also PDF p11 / printed p6 sec 1.4.1.1", value: "1.8 V ~ 3.3 V"}
    note: "DS release note v5.6 (PDF p2) says VDDPST was updated from 1.8-3.3 to 1.8-3.6; HDG v2.8 not updated. Use DS (newer, chip document). D1 mini runs it at 3.3 V so no impact."
  - id: D-SDIO-D2-SERIES-R
    what: "Series resistor value for SD_D2 / GPIO9 pin"
    a: {doc: ds, locator: "PDF p10 / printed p5, Table 2-1 pin 18", value: "20 ohm"}
    b: {doc: hdg, locator: "PDF p9 / printed p4, Table 1-2 pin 18", value: "200 ohm (same as all other SDIO pins)"}
    note: "Probably a DS typo; irrelevant to pin choice."
  - id: D-WORKING-V
    what: "Working supply voltage lower bound inside the datasheet"
    a: {doc: ds, locator: "PDF p24 / printed p19, Table 5-1 and Table 1-1", value: "2.5 V min"}
    b: {doc: ds, locator: "PDF p22 / printed p17, sec 4.9 table (vdd33_const)", value: "working power voltage range between 1.8 V and 3.6 V"}
    note: "Internal to DS. Use 2.5-3.6 V from Table 5-1 (conservative)."
  - id: D-GPIO-COUNT
    what: "Number of GPIOs"
    a: {doc: ds, locator: "PDF p18 / printed p13 sec 4.1", value: "17 GPIO pins (GPIO0-GPIO16)"}
    b: {doc: trm, locator: "PDF p13 / printed p5 sec 2.1 and Table 2-1", value: "16 general IOs (GPIO0-GPIO15); GPIO16 documented separately as RTC pad, PDF p15 sec 2.2.5"}
    note: "Not a real conflict: GPIO16 is on the RTC block."
  - id: D-SPI-COUNT
    what: "Number of SPI controllers"
    a: {doc: ds, locator: "PDF p18 / printed p13 sec 4.3", value: "two SPIs (SPI, HSPI)"}
    b: {doc: trm, locator: "PDF p9 / printed p1 sec 1.3", value: "3 SPIs (SPI, SDIO/SPI slave, HSPI)"}
    note: "Counting difference (SDIO slave)."
  - id: D-PWM
    what: "PWM channel count / resolution"
    a: {doc: ds, locator: "PDF p21 / printed p16 sec 4.7", value: "four PWM outputs; duty ratio 1/22727 at 1 kHz"}
    b: {doc: hdg, locator: "PDF p27 / printed p22 sec 1.7.3", value: "three PWM interfaces (R,G,B); minimal PWM duty ratio 1/214"}
    note: "HDG is an application example; use DS."
  - id: D-STRAP-WORDING
    what: "What the strapping pins select"
    a: {doc: ds, locator: "PDF p11 / printed p6 note under Table 2-1", value: "booting mode and the SDIO mode"}
    b: {doc: hdg, locator: "PDF p10 / printed p5 note under Table 1-2", value: "3-bit strapping register that determines the booting mode and the SDIO timing mode"}
    note: "Wording differs; neither gives a level-to-mode table."
  - id: D-BOARD-VS-CHIP-A0
    what: "A0 input range vs TOUT range"
    a: {doc: wemos-page, locator: "Features / Technical specs", value: "1 analog input (3.2V max input)"}
    b: {doc: ds, locator: "PDF p22 / printed p17 sec 4.9", value: "0 to 1.0 V at TOUT"}
    note: "Consistent, not a conflict: schematic divider R12 220k / R13 100k gives 3.2 V * 100/320 = 1.0 V at TOUT."
  - id: D-D-LABELS
    what: "Dn labels"
    a: {doc: wemos-page, locator: "Features bullet", value: "mentions 'D0' only in '(except D0)'; no table or image maps D0..D8 to GPIOs"}
    b: {doc: sch, locator: "J2/J3 net labels", value: "uses IOn net names and RST/A0/TX/RX only; no Dn"}
    note: "No supplied document states any Dn-to-GPIO mapping."
summary_could_not_verify:
  - "reset_state of every pad (no document states it)"
  - "strap level for GPIO2; chip-level strap table (only the unopened Pin List has it)"
  - "power_up_glitch for every pad (no document mentions a glitch)"
  - "abs_max_vin: DS has NO absolute-maximum table"
  - "cumulative_current_max, internal pull-up/pull-down resistance"
  - "3V3 regulator maximum current; VBUS numeric voltage/current"
  - "any Dn label mapping"
