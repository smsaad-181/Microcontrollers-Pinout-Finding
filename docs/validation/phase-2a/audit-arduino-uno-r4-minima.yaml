disagreements:
  - id: D1
    what: "D5/D4 CAN descriptions swapped inside the manual"
    a: "abx00080-ds p13 s10.2: 'D5/CANRX0 ... CAN Transmitter (TX)' and 'D4/CANTX0 ... CAN Receiver (RX)'"
    b: "abx00080-sch p1: P102_..._CAN0_RX on D5, P103_..._CAN0_TX on D4; abx00080-pinout p4: D5 CRX0, D4 CTX0. Label is right, description column wrong."
  - id: D2
    what: "D0 labelled TX0 in manual"
    a: "abx00080-ds p13 s10.2 row 18: 'D0/TX0' with description 'Serial 0 Receiver (RX)'"
    b: "abx00080-sch p1 / pinout p4: D0/RX = P301 (SCI2 RXD)"
  - id: D3
    what: "Header pin 1 of JANALOG: BOOT vs NC"
    a: "abx00080-ds p13 s10.1 pin 1 'BOOT' and pinout p4 'BOOT' (figure)"
    b: "abx00080-sch p1: JANALOG pin-1 symbol text is 'NC' while its net is MD (U1 pin 26, P201/MD, R6 5.1k to +5V). Same signal, different name."
  - id: D4
    what: "Power LED reference"
    a: "abx00080-ds p16 s12.1: 'as indicated by the LED (DL1)'"
    b: "abx00080-ds p8 s4.1 and abx00080-sch p1: DL1 = TX LED, DL3 = Power LED"
  - id: D5
    what: "USB power path"
    a: "abx00080-ds p10 s9: 'The VUSB, barrel jack connector and VIN pins are connected to the ISL854102FRZ buck converter'"
    b: "abx00080-sch p1 netlist: D3 (VUSB Schottky) cathode is on the +5V net directly; only D2 (VIN/DC jack) cathode feeds U2 buck input. Inferred from netlist; USB does not pass through the buck."
  - id: D6
    what: "USB voltage statements"
    a: "abx00080-ds p2 'Power via USB-C at 5 V' vs p10 'Power via USB supplies about ~4.7 V (due to Schottky drop) to the RA4M1'"
    b: "Not contradictory (5 V in, ~4.7 V at MCU) but MCU VCC is not a fixed 5.0 V when USB-powered."
  - id: D7
    what: "Pin-current statements differ in coverage"
    a: "abx00080-ds p11 s9.3 gives per-pin 8 mA only, no total"
    b: "abx00080-pinout p1/p2/p4 gives per-pin 8 mA AND 'overall 60mA'. Values agree for per-pin; total only in pinout."
  - id: D8
    what: "Manual s10.1 table titled 'Analog' but also holds power/BOOT/IOREF/Reset pins; s10.2 'Digital' includes SCL, SDA, AREF, GND. Section 9.2 says 3.3V pin 'not connected to the buck converter' - consistent with schematic (+3V3 = VCC_USB)."
