newer_or_more_authoritative_sources:
  - The assigned V1.1 20221130 schematic is the newest schematic listed in guide v1.1. Text diff against the 20220413 V1.1 issue shows only the sheet date and the removal of an IO2 column in the auto-program truth table; all nets identical.
  - V1.0 schematic (20210312) found and compared: only difference vs V1.1 is RGB_CTRL net GPIO48 (V1.0) vs GPIO38 (V1.1).
  - The unversioned user_guide.html is gone (404); the v1.1/v1.0 pages replace it.
  - The module datasheet v1.8 (2026-03-02) is the newest module document; no newer found.
disagreements:
  - id: D1
    topic: RGB LED GPIO depends on board revision (not a document error)
    readings: [guide-v1.0 and sch V1.0 = GPIO48; guide-v1.1 and sch V1.1 = GPIO38]
    notes: Guides and schematics agree with each other per revision. Guide v1.1 states both revisions are sold.
  - id: D2
    topic: Header pin naming between schematic and guide
    readings: ["J1-3: schematic net CHIP_PU, guide name RST, module pin EN", "J3-2/J3-3: schematic U0TXD/U0RXD, guide TX/RX, module TXD0(GPIO43)/RXD0(GPIO44)"]
    notes: Same physical nets, different names. All 44 pin-to-GPIO assignments agree between guide v1.1 tables and schematic V1.1 (checked pin by pin).
  - id: D3
    topic: Flash/PSRAM variants on the board
    readings: ["guide v1.0 ordering table lists only N8R8, N32R16V, 1U-N8R8 (each with SPI voltage 3.3 V for N8R8)", "guide v1.1 ordering table also lists N8, N8R2 (EOL) and drops the SPI Voltage column"]
    notes: N8 board is marked EOL in guide v1.1 but is in the module datasheet series table.
  - id: D4
    topic: Guide says all GPIOs except flash SPI are broken out
    readings: ["guide: All available GPIO pins (except for the SPI bus for flash) are broken out", "datasheet/schematic: GPIO35-37 are broken out to J3 on every board, but are consumed by octal PSRAM on N8R8 (guide note covers it)"]
    notes: Consistent once the guide note is applied; flagged so the catalog marks J3-11/12/13 consumed for N8R8.
  - id: D5
    topic: Module datasheet does not name the in-module flash VDD_SPI voltage for N8 explicitly
    notes: Voltage is only inferred (see facts). Chip datasheet gives 3.3 V for ESP32-S3R8; guide v1.0 says SPI Voltage 3.3 V for N8R8.
  - id: D6
    topic: Revision/date labelling
    readings: ["schematic file dated 20221130 contains sheet 1 dated 2022-04-13 and sheet 2 dated 2022-11-30"]
    notes: Cosmetic.

