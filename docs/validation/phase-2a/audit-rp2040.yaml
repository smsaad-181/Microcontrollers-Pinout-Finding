- path: pads.GPIO0.strap
  value: none
  doc: rp2040-ds-3184e62
  locator: PDF p.131 (printed p.130), section 2.8.1.1 Bootrom boot sequence
  quote: Check if SPI CS pin is tied low ("bootrom button"), and skip flash boot if so.
  quote_check: pymupdf
  confidence: inferred
  notes: 'No user-bank GPIO0-29 is sampled at reset or for boot-mode selection anywhere in the boot sequence (2.8.1). Boot mode is sampled on QSPI_SS (flash chip-select, QSPI bank, NOT GPIO0-29): tied low
    -> skip flash boot / USB boot. The absence of a strap on this pad is INFERRED from the full list of boot-time checks, not stated in one sentence. Default pull = down (reset_state).'
