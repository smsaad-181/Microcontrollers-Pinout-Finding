- path: pads.GPIO0.strap
  value:
    role: boot mode select (with GPIO46)
    required_at_reset: high
    default_pull: up
  doc: esp32-s3-datasheet-v2.2
  locator:
    pdf_page: 32
    printed_page: 32
    section: Table 3-1 Default Configuration of Strapping Pins; Table 3-3 Chip Boot Mode Control
  quote: GPIO0 Weak pull-up 1
  figure_read: true
  confidence: found
  notes: 'SPI boot mode needs GPIO0=1 (default via weak pull-up, bold in Table 3-3); Joint download boot needs GPIO0=0 AND GPIO46=0. TRM Table 8.1-1 (pdf 534) agrees: GPIO0 Pull-up. TRM Table 8.2-1 additionally
    lists SPI Download Boot mode (GPIO0=0, GPIO46=1, GPIO1=1, GPIO2=0) which datasheet Table 3-3 omits (only a sentence on p33 says SPI Download Boot is supported). Latched at chip reset; setup time 0 ms,
    hold time 3 ms (Table 3-2).'
