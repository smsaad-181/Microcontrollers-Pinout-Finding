- path: chip.gpio_pad_set
  value:
    gpio_numbers: 0-21, 26-48
    count: 45
    nonexistent:
    - 22
    - 23
    - 24
    - 25
  doc: esp32-s3-trm-v1.8
  locator:
    pdf_page: 472
    printed_page: 472
    section: 6.1 Overview
  quote: the 45 GPIO pins are numbered from 0 ~ 21 and 26 ~ 48
  confidence: found
  notes: 'TRM 6.5.3 corroborates: GPIO_OUT_REG[25:22] are invalid (TRM pdf 478). Datasheet Features lists ''45 programmable GPIOs'' (DS pdf 4/5) and Table 2-4 has IO MUX rows only for those 45 pads (GPIO22-25
    absent). Note GPIO26-32 (SPICS1, SPIHD, SPIWP, SPICS0, SPICLK, SPIQ, SPID) are the flash/PSRAM pads and GPIO15/16 are XTAL_32K_P/N, so ''GPIO'' pin names in Table 2-1 skip these numbers; the GPIO number
    comes from Table 2-4.'
- path: chip.gpio_pad_set.ds_count
  value: 45
  doc: esp32-s3-datasheet-v2.2
  locator:
    pdf_page: 4
    printed_page: 4
    section: 'Features list: Peripherals'
  quote: 45 programmable GPIOs
  confidence: found
  notes: Printed in the datasheet feature list (text-extracted from the front pages; also line shown as '45 GPIOs' in the cover summary).
- path: chip.gpio_pad_set.pin_mapping_note
  value: 'Table 2-1 package pin names for GPIO26-32 and 39-44, 47-48 are not GPIOn: SPICS1=26 SPIHD=27 SPIWP=28 SPICS0=29 SPICLK=30 SPIQ=31 SPID=32; MTCK=39 MTDO=40 MTDI=41 MTMS=42 U0TXD=43 U0RXD=44; SPICLK_P=47
    SPICLK_N=48 (note: pin 36 SPICLK_N is GPIO48 and pin 37 SPICLK_P is GPIO47)'
  doc: esp32-s3-datasheet-v2.2
  locator:
    pdf_page: 22
    printed_page: 22
    section: Table 2-4 IO MUX Functions
  quote: GPIO48
  figure_read: true
  confidence: found
  notes: Figure read on rendered page 22. Table 2-1 lists pin 36 as SPICLK_N and pin 37 as SPICLK_P; Table 2-4 maps pin 36 to GPIO48 and pin 37 to GPIO47. Datasheet footnote 4 of Table 2-1 confirms 'SPICLK_N
    and SPICLK_P (GPIO47 and GPIO48)'. Pad order is therefore swapped relative to pin numbers; TRM Table 6.12-1 agrees (GPIO47=SPICLK_P, GPIO48=SPICLK_N).
