disagreements:
- id: DIS-1
  topic: GPIO6-GPIO11 (J2 pins 16-18, J3 pins 17-19)
  readings:
  - doc: esp32-devkitc-user-guide
    locator: Header Block J2 rows 16-18 / J3 rows 17-19 and note [2]
    reading: pins named D2, D3, CMD, D1, D0, CLK = GPIO9, 10, 11, 8, 7, 6; 'used internally for communication between ESP32 and SPI flash'; avoid using
  - doc: esp32-devkitc-v4-sch
    locator: PDF p1, D2 ESP-WROOM-32 pins 17-22 labelled SD2 SD3 CMD CLK SD0 SD1 wired to J2 16-18 and J3 19-17
    reading: six header pins are wired to module pins 17-22 (figure)
  - doc: esp32-wroom-32e-ds / esp32-wrover-e-ds
    locator: Table 3 pins 17-22 'See note 2' and note 2 (WROOM PDF p11-12; WROVER PDF p12-13)
    reading: module pins 17-22 are NC; GPIO6-GPIO11 are connected to the on-module SPI flash 'and are not led out'
  resolution: 'The six header pins are wired to module pins that the module datasheets declare NC. The user guide''s ''avoid using'' is therefore weaker than the truth: with the module datasheets as authority
    the header pins carry no flash signal at all (not connected). The ESP32 flash pads are not reachable from the header. Treat the six pins as non-usable (nc / reserved), never as GPIO.'
- id: DIS-2
  topic: GPIO16 / GPIO17 (J3 pins 12 / 11)
  readings:
  - doc: esp32-devkitc-user-guide
    locator: Header Block J3 rows 11-12 and note [3]
    reading: available only on boards with ESP32-WROOM and ESP32-SOLO-1; reserved for internal use on WROVER boards
  - doc: esp32-devkitc-v4-sch
    locator: PDF p1, D2 ESP-WROOM-32 pins 27/28 = IO16/IO17; U3 ESP32_WROVER(NC) pins 27/28 = NC1/NC2
    reading: header J3 11/12 follow the WROOM symbol; WROVER footprint pins 27/28 are NC (figure)
  - doc: esp32-wroom-32e-ds
    locator: Table 3 pin 27 IO16 note 3, PDF p12
    reading: IO16 is not usable for other functions on R2 (PSRAM) variants; the user guide says WROOM boards can use GPIO16
  - doc: esp32-wrover-e-ds
    locator: Table 3 pins 27, 28 'NC - -', PDF p13; Figure 9 PDF p38
    reading: pins 27/28 NC; GPIO16 = PSRAM CS#, GPIO17 = PSRAM SCLK internally
  resolution: 'Consistent for the sold variants (user guide ordering table lists PSRAM-less WROOM-32E/UE only, so GPIO16/17 are free on those). Residual disagreement: the user guide does not mention that
    WROOM-32E N*R2 modules would consume GPIO16 (not sold on this board per the ordering table). On WROVER boards the two header pins are wired to NC module pins - effectively unconnected.'
- id: DIS-3
  topic: Naming only
  readings:
  - doc: esp32-devkitc-user-guide
    locator: Header Block Name column
    reading: VP, VN, TX, RX, D0-D3, 5V
  - doc: esp32-devkitc-v4-sch
    locator: PDF p1 connector J2/J3 net labels
    reading: SENSOR_VP, SENSOR_VN, TXD0, RXD0, SD0-SD3, EXT_5V
  resolution: Same physical pins; no electrical disagreement.
- id: DIS-4
  topic: Module identity on the schematic
  readings:
  - doc: esp32-devkitc-v4-sch
    locator: PDF p1 D2 symbol
    reading: '''ESP-WROOM-32'' (populated), U3 ''ESP32_WROVER(NC)'''
  - doc: esp32-devkitc-user-guide
    locator: Functional Description item 3
    reading: ESP32-WROOM-32E
  resolution: Pin-compatible; the schematic symbol predates the -E suffix. No electrical disagreement.
- id: DIS-5
  topic: Flash voltage statement
  readings:
  - doc: esp32-wrover-e-ds
    locator: Table 1, PDF p3
    reading: VDD_SDIO voltage 3.3 V (explicit)
  - doc: esp32-wroom-32e-ds
    locator: 4.2, PDF p15; Table 17 PDF p30
    reading: no explicit module value; default VDD_SDIO ~3.3 V (MTDI=0), flash supply ranges for 1.8 V and 3.3 V listed
  resolution: 'Not contradictory: WROOM value is inferred 3.3 V by default; only WROVER-E states it.'
