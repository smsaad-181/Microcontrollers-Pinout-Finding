newer_or_more_authoritative_sources:
- 'Live refetch of the three PDFs on 2026-10-22 returned byte-identical files: the cached versions are current (WROOM-32E v2.1, WROVER-E v2.4, DevKitC V4 schematic 2020-02-25).'
- ESP32 chip datasheet v5.3 (cached) says ESP32-D0WDR2-V3 is EOL, upgraded to ESP32-D0WDRH2-V3 (PCN20251001); WROVER-E v2.4 already marks N4R2/N8R2/N16R2 EOL; WROOM-32E v2.1 still sells N*R2 parts and its
  footnotes name D0WDR2-V3. Chip DS Table 2-5 note 2 and Table 2-6 note 3 are more specific than the module pin table about GPIO16/GPIO17 PSRAM use.
- The WROVER-E datasheet (Table 1 VDD_SDIO Voltage column) is the only module-level source that states the flash voltage explicitly; the WROOM-32E datasheet has no such column.
- No DevKitC schematic revision newer than V4 2020-02-25 was found in the provided sources; the user guide also links PCB layout and dimensions PDFs (not opened). The board silkscreen was read from the
  user-guide pin-layout image, not from a photo of the board.
