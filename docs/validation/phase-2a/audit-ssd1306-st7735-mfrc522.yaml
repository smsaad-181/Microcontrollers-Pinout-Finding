header:
  entities: [ssd1306, st7735s, mfrc522, ssd1306-128x64-i2c-4pin, st7735s-1.8-spi-tft, rfid-rc522-blue]
  auditor: hardware-fact-auditor
  role: second key (blind)
  date: 2026-10-23
  contaminated: []
  documents:
    - id: ssd1306-rev1.1
      title: SSD1306 128 x 64 Dot Matrix OLED/PLED Segment/Common Driver with Controller, Rev 1.1, Apr 2008, Advance Information (Solomon Systech)
      url: https://cdn-shop.adafruit.com/datasheets/SSD1306.pdf
      sha256: d55f875357de96d8c0e92153a389acc57e8bab4db7a0687f2e0bd3362f0036f6
      hash_verified: true
      pdf_pages: 65
      note: printed page number (P n/59) equals PDF page number in this file. Document says "Advance Information" (pre-release). Search results report a Rev 1.5 (Aug 2010, 64 pages) mirrored on radiolocman.com; it could NOT be downloaded/opened here (HTML viewer only), so facts below are Rev 1.1 only and may differ in Rev 1.5.
    - id: mfrc522-rev3.9
      title: MFRC522 Standard performance MIFARE and NTAG frontend, Rev. 3.9, 27 April 2016 (NXP)
      url: https://www.nxp.com/docs/en/data-sheet/MFRC522.pdf
      sha256: 5e2fdff12348a21b0203fed3fc49a252d589c39511324ad29396e1975fe01451
      hash_verified: true
      pdf_pages: 95
      note: printed page (n of 95) equals PDF page.
    - id: st7735-v2.1
      title: ST7735 262K Color Single-Chip TFT Controller/Driver V2.1 2010-02-01 (Sitronix, hosted by displayfuture.com). Title page names ST7735 (NOT ST7735S).
      url: https://www.displayfuture.com/Display/datasheet/controller/ST7735.pdf
      sha256: ff5c5b5189dbcd413f7b2d6313fc0426e8225bb503a96af4a528e5ca2027db79
      hash_verified: true
      pdf_pages: 167
      related_source: true
    - id: st7735-v1.9-file-named-st7735s
      title: File named ST7735S.pdf but title page reads "ST7735 ... V1.9 2010-01-20" (Sitronix). Content is the ST7735, NOT the ST7735S.
      url: https://www.displayfuture.com/Display/datasheet/controller/ST7735S.pdf
      sha256: f20019f6e04606f2285906625bdb88d988a06137d04adccf2378514841cfefa6
      hash_verified: true
      pdf_pages: 167
      related_source: true
      note: Only spot-checked (abs max, DC operating ranges, serial write cycle); identical to V2.1 for those items.
    - id: st7735s-v1.3-third-party-mirror
      title: ST7735S 132RGB x 162dot 262K Color with Frame Memory Single-Chip TFT Controller/Driver Datasheet, Version 1.3, 2012/06 (Sitronix)
      url: https://www.makerguides.com/wp-content/uploads/2025/01/ST7735S-Datasheet.pdf
      sha256: 332320d26c30d3711f56ed92d488878889c2357ac9d51e49cc9d6d95ff8c46ac
      hash_verified: n/a (no reference hash was supplied; hash is of the downloaded copy)
      pdf_pages: 201
      note: Genuine ST7735S datasheet text (title page names ST7735S). It is a THIRD-PARTY MIRROR (makerguides.com), openly downloadable with plain HTTP GET, found by web search - no block was circumvented. The orchestrator must decide whether it counts as the official/manual-download document (it is not the Sitronix-hosted file and its provenance/authenticity is not verified). Treated here as the ST7735S document but flagged secondary=true; related_source=false for its values. Printed page (Page n of 201) equals PDF page.
  unreachable_sources:
    - Sitronix-hosted ST7735S datasheet (sitronix.com.tw): not reached by search results and not attempted via workaround; replaced by the third-party mirror above. Latest ST7735S version seen in search results is V1.3 (also V1.1 on 21ic.com); Crystalfontz lists v1.1 and v1.3.
    - SSD1306 Rev 1.5 (radiolocman.com di=168297): page served as HTML viewer, PDF not downloadable here.
    - Vendor documentation naming the generic boards ssd1306-128x64-i2c-4pin, st7735s-1.8-spi-tft, rfid-rc522-blue: none found (retailer listings, blog posts only). Waveshare 1.8inch LCD Module page exists but is a different named product, not the generic board; not opened.
  newer_or_more_authoritative: ST7735S V1.3 (2012) is newer and ST7735S-specific compared with the ST7735 V2.1/V1.9 (2010). SSD1306 Rev 1.5 reportedly exists (not opened).
  document_disagreements:
    - id: D1
      what: VDD (analog supply) absolute maximum and operating range, ST7735S V1.3 vs ST7735 V2.1/V1.9
      a: "ST7735S V1.3 p28 abs max VDD -0.3 ~ +4.8 V; p29 operating VDD 2.5/2.75/4.8 V (min/typ/max)"
      b: "ST7735 V2.1 p19 abs max VDD -0.3 ~ +4.6 V; p19 operating VDD 2.6/2.75/3.3 V; VDDI max 3.3 V vs ST7735S 3.7 V"
    - id: D2
      what: Serial interface selection inside ST7735S V1.3
      a: "p25/p24 pin description: SPI4W pin selects 3-line (0) / 4-line (1); IM2 selects serial (0)"
      b: "p44 Table 12 names the 4-line select '4WSPI'; p37 Table 8 selects 3-line serial by IM2=0 alone; p199-200 headings write 'IM2,IM1,IM0=000, SPI4W=0/1'"
      note: naming inconsistency (SPI4W vs 4WSPI), same function.
    - id: D3
      what: SSD1306 internal - VDD limits
      a: "p47 Table 11-1 abs max VDD -0.3 to +4 V"
      b: "p48 Table 12-1 DC characteristics VDD 1.65 to 3.3 V (operating); not a conflict, but Vin abs max is VDD+0.3 so inputs are NOT 5 V tolerant"
    - id: D4
      what: ST7735S V1.3 vs ST7735 V2.1 write SCL H/L pulse width (15 ns vs 30 ns) and normal-mode IDD (typ 0.9/max 2 mA vs 0.5/0.7 mA)
      a: "ST7735S V1.3 p36 TSHW/TSLW 15 ns; p30 IDD 0.9 typ / 2 max mA"
      b: "ST7735 V2.1 p25 TSHW/TSLW 30 ns; p21 IDD 0.5 typ / 0.7 max mA"
  checks: quotes verified against extracted PDF text with a py script (see end of run); YAML parse checked.

