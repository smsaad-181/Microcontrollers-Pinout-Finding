contradictions:
  - id: C1
    summary: "HC-SR04 'Working Frequency 40Hz' (table) vs 'eight 40 kHz' burst (text)"
    a: {doc: hcsr04-elecfreaks, locator: "PDF p1 / Electric Parameter table", quote: "Working Frequency 40Hz"}
    b: {doc: hcsr04-elecfreaks, locator: "PDF p1 / principle of work step (2) and p2 Timing diagram text", quote: "sends eight 40 kHz"}
    resolution: "Table row is a unit typo (kHz intended); text and timing diagram say 40 kHz. 40 kHz is the ultrasonic carrier, not a measurement rate (measurement cycle is >60 ms)."
  - id: C2
    summary: "Echo Output Signal row is labelled 'Input TTL lever signal' for an output pin, with no voltage"
    a: {doc: hcsr04-elecfreaks, locator: "PDF p1 / Electric Parameter table", quote: "Input TTL lever signal and the range in proportion"}
    b: {doc: hcsr04-elecfreaks, locator: "PDF p2 / Timing diagram figure", quote: figure}
    resolution: "Same garbled wording appears in the timing figure label. 'Input' and 'lever' are wording errors; it is not a voltage specification."
  - id: C3
    summary: "Trigger row says '10uS TTL pulse' (fixed) vs text 'at least 10us'"
    a: {doc: hcsr04-elecfreaks, locator: "PDF p1 / Electric Parameter table", quote: "10uS TTL pulse"}
    b: {doc: hcsr04-elecfreaks, locator: "PDF p1 / principle of work step (1)", quote: "at least 10us high level signal"}
    resolution: "Not a conflict in practice: 10 us is the minimum."
  - id: C4
    summary: "Supply 'DC 5 V' (plain HC-SR04) vs 'DC 3.3V~5 V' (HC-SR04-33 variant document)"
    a: {doc: hcsr04-elecfreaks, locator: "PDF p1 / Electric Parameter table", quote: "Working Voltage DC 5 V"}
    b: {doc: hcsr04-33-sparkfun, locator: "PDF p1 / Electric Parameter table", quote: "DC 3.3V~5 V"}
    resolution: "Different products (title says HC-SR04-33). Not a contradiction for the plain module, but a trap: the variant is not the plain HC-SR04. Recommend the catalog never merge them."
