revision_as_printed:
  raspberry-pi-pico: Rev3 (Raspberry Pi Pico Rev3 board; schematic Rev 3)
  raspberry-pi-pico-w: Rev3 (Raspberry Pi Pico W Rev3 board; schematic Rev 3)
disagreements:
- topic: operating temp max
  pico: 85 degC (pico-ds-rel21 pdf p.11)
  pico_w: 70 degC (pico-w-ds-rel7 pdf p.12)
- topic: unpowered-RP2040 voltage on GPIO0-25
  pico: safe, no numeric limit (pdf p.20)
  pico_w: safe up to 3.3 V (pdf p.14)
- topic: SMPS part
  pico: RT6150
  pico_w: RT6154
- topic: VBUS sense / SMPS PS / LED routing
  pico: RP2040 GPIO24 / GPIO23 / GPIO25
  pico_w: CYW43439 WL_GPIO2 / WL_GPIO1 / WL_GPIO0, no RP2040 pad
- topic: pin 33 and 36 labels
  note: 'Both docs: figure labels pin 36 3V3(OUT) and pin 33 GND(AGND row); text and schematic say 3V3 and AGND.'
- topic: board doc vs chip doc
  note: 'Board doc: ADC pads max IOVDD+~0.3 V. Chip doc (pdf p.615 Table 622) abs max for digital IO IOVDD+0.5 V; ADC input range 0..ADC_AVDD (Table 627). Chip pin table (pdf p.613-614) lists GPIO0-25 as
    Digital IO (FT). Different numbers, not contradictory.'
- topic: Pico W internal-function count
  note: Pico W Section 1 says four RP2040 I/O used internally (carried from Pico) but lists GPIO23/24/25/29 as wireless and WL_GPIO0-2 as CYW43439 pins.
