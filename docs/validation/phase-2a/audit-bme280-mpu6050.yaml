disagreements:
- topic: Bosch datasheet revision
  a: 'PDF p1: revision 1.24 / DS001-24, Feb 2024'
  b: 'PDF p2-60 footers: BST-BME280-DS001-23 Revision_1.23_012022'
  note: footer stale; document history p59 confirms 1.24; no technical value differs that I could detect
- topic: Humidity/pressure/temperature measurement current IDDH/IDDP/IDDT
  a: Table 1 puts 340/714/350 uA in the Typ column
  b: Condition column reads "Max value at 85 C / -40 C"
  note: 'internal ambiguity: typ or worst-case; both locators PDF p8 Table 1'
- topic: Vil_si condition text
  a: PDF p35 Table 32 "VDDIO=1.2 V to 3. 6V"
  b: same row else
  note: typo only
- topic: Adafruit level-shifting claim
  a: 'Guide Pinouts: "All pins going into the breakout have level shifting circuitry"'
  b: 'Schematic: SDO/ADR is an output and is not shifted (3.3 V); CS uses diode+pull-up, SCK/SDI use BSS138'
  note: 'compatible in the sense of "inputs"; flagged for engine: SDO output swings 0-3.3 V'
- topic: Guide text typo
  a: Guide Pinouts SDO text says data "sent from the BMP183 to your processor"
  b: board is BME280
  note: copy-paste typo in guide
